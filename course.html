, the email is ready to send. Good prompting saves you time every day.</p><h2>3. Skills and concepts you will learn</h2><ul><li><strong>Being specific</strong> — In simple words: giving exact details.</li><li><strong>Giving context</strong> — In simple words: pasting the text or facts Claude needs.</li><li><strong>Setting the format</strong> — In simple words: telling Claude the shape of the answer.</li><li><strong>Iterating</strong> — In simple words: improving the prompt and trying again.</li></ul><h2>4. Prerequisites</h2><ul><li>A way to chat with Claude (the Claude app or website; no API key needed yet).</li><li>Read this first: <code>study/anthropic/beginner/01-good-prompts.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Pick a real task. Example: \"Write a short thank-you email to a customer named Sara.\"</li><li>Write a <strong>weak</strong> prompt for it (one short vague line). Send it. Save the answer.</li><li>Write a <strong>strong</strong> prompt for the same task. Include: the task, the context, and 2–3 rules (length, tone, simple English). Send it. Save the answer.</li><li>Compare the two answers. Write what got better.</li><li>Improve once more (iterate): change one rule and try again.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Write 1 weak prompt and save Claude's answer.</li><li>☐ Write 1 strong prompt (task + context + rules) and save Claude's answer.</li><li>☐ Write 2–3 sentences: what got better and why.</li><li>☐ Do 1 iteration: change one rule, and save the new answer.</li></ul><h2>7. Expected outcome</h2><p>You have two answers from Claude for the same task: one from a weak prompt, one from a strong prompt. The strong one is clearly better. You understand why.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>The work passes only if ALL of these are true:</p><ol><li>You show your <strong>weak prompt</strong> and Claude's answer to it.</li><li>You show your <strong>strong prompt</strong> and Claude's answer to it.</li><li>Your strong prompt clearly has: a <strong>task</strong>, some <strong>context</strong>, and at least <strong>2 rules</strong> (like length, tone, or \"simple English\").</li><li>You write 2–3 simple sentences comparing the two answers (what got better).</li><li>You show <strong>one iteration</strong>: a changed prompt and its new answer.</li></ol><h2>9. Verification checklist (check before you submit)</h2><ul><li>☐ My strong prompt has task + context + rules.</li><li>☐ I saved both prompts and both answers.</li><li>☐ I wrote my short comparison.</li><li>☐ I saved my evidence in <code>submissions/anthropic/beginner/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Strong prompt is still vague — add exact details and a clear format.</li><li>No context — always give the facts (customer name, reason, etc.).</li><li>Asking many things at once — keep it to one clear task.</li></ul><h2>11. Hints (ask for these — do not read unless you are stuck)</h2><details><summary>Hint 1 (small nudge)</summary>Use the prompt recipe: Task, Context, Rules. Start each line with that word.</details>\n<details><summary>Hint 2 (bigger help)</summary>Weak: \"Write a thank-you email.\" Strong: \"Task: Write a short thank-you email to a customer named Sara. Context: She bought our online course. Rules: 4 sentences, warm and polite, simple English.\"</details>\n<details><summary>Hint 3 (almost the answer)</summary>For the iteration, change one rule only — for example, change \"4 sentences\" to \"2 short sentences\" or change the tone from \"polite\" to \"friendly\". Then compare.</details>\n<h2>12. Final challenge (a little harder)</h2><p>Add an <strong>example</strong> to your strong prompt. Show Claude one short example of the style you want (this is called a \"one-shot example\"). See if the answer follows your style better.</p><h2>13. What to submit (evidence)</h2><p>Save a text file in <code>submissions/anthropic/beginner/project-01/</code> (for example <code>prompts.md</code>) with:</p><ul><li>Weak prompt + its answer.</li><li>Strong prompt + its answer.</li><li>Your short comparison (2–3 sentences).</li><li>The iteration (changed prompt + new answer).</li></ul><p>Then tell me: <strong>\"I submit Anthropic Beginner Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Task + Context + Rules = a strong prompt. Try first. Submit when YOU are ready.</p></section>","anthropic/beginner/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Claude Models — Which One to Pick</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Model</strong> — one version of Claude. Bigger models are smarter; smaller models are faster and cheaper.</li><li><strong>Token</strong> — a small piece of text (about 3–4 letters). You pay per token.</li><li><strong>Input tokens</strong> — the text you send. <strong>Output tokens</strong> — the text Claude writes back.</li><li><strong>Context window</strong> — how much text the model can read at once.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Anthropic makes a family of Claude models. They trade <strong>smartness</strong> vs <strong>speed and cost</strong>:</p><ul><li><strong>Opus</strong> — the most capable. Best for hard thinking. Costs more.</li><li><strong>Sonnet</strong> — a strong balance of smart and cheap.</li><li><strong>Haiku</strong> — the fastest and cheapest. Good for simple, high-volume jobs.</li></ul><p>You pick the smallest model that still does the job well. That saves money.</p><h2>2. Key concepts and terms (current models)</h2><table><thead><tr><th>Model</th><th>Model ID</th><th>Good for</th><th>Price (per 1M tokens, in / out)</th></tr></thead><tbody><tr><td>Claude Opus 5</td><td><code>claude-opus-5</code></td><td>hard reasoning, agents</td><td>$5 / $25</td></tr><tr><td>Claude Sonnet 5</td><td><code>claude-sonnet-5</code></td><td>balanced everyday use</td><td>$2 / $10</td></tr><tr><td>Claude Haiku 4.5</td><td><code>claude-haiku-4-5</code></td><td>fast, cheap, simple tasks</td><td>$1 / $5</td></tr></tbody></table><blockquote><p>Prices can change. Always check the official pricing page before you rely on a number.</p><p><strong>In simple words:</strong> 1 million tokens is a LOT of text (roughly 750,000 words). For learning, your bills will be tiny.</p></blockquote><h2>3. Practical examples</h2><ul><li>Writing a hard plan or debugging code → <strong>Opus</strong>.</li><li>Summarizing an email, answering a normal question → <strong>Sonnet</strong>.</li><li>Sorting 10,000 short messages into \"spam / not spam\" → <strong>Haiku</strong> (cheap and fast).</li></ul><h2>4. Commands and config examples</h2><p>You choose the model by its <strong>ID</strong> in your code:</p><pre><code>model=\"claude-opus-5\"     # smartest\nmodel=\"claude-sonnet-5\"   # balanced\nmodel=\"claude-haiku-4-5\"  # fast + cheap</code></pre><h2>5. Hands-on exercises</h2><ol><li>For each task, pick a model and say why:</li></ol><ul><li>\"Translate one short sentence.\"</li><li>\"Design a database for a big app.\"</li><li>\"Label 5,000 reviews as happy or sad.\"</li></ul><ol><li>Look up the current Anthropic pricing page. Write today's price for each model.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> the model is slow or costly for a simple job.</li></ul><p>  <strong>Fix:</strong> use a smaller model (Haiku or Sonnet).</p><ul><li><strong>Problem:</strong> the answer is not smart enough.</li></ul><p>  <strong>Fix:</strong> use a bigger model (Sonnet → Opus).</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Always using the biggest model — wastes money on easy tasks.</li><li>Always using the smallest model — quality drops on hard tasks.</li><li>Guessing prices — check the official page.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CCAO-F / CCDV-F:</strong> know that Claude has different models, and how to choose (smart vs fast vs cheap).</li><li>Know the words token, context window, input/output.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Which model is smartest? Which is cheapest?</li><li>What is a token?</li><li>When should you pick a smaller model?</li></ol><h2>10. References</h2><ul><li>Models overview: <a href=\"https://docs.anthropic.com/en/docs/about-claude/models\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/about-claude/models</a> (checked: 2026-09-18)</li><li>Pricing: <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/pricing</a> (checked: 2026-09-18)</li><li>Anthropic Academy: <a href=\"https://www.anthropic.com/learn\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/learn</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Opus = smartest, Sonnet = balanced, Haiku = fast + cheap. Pick the smallest model that does the job well.</p><details><summary>Answers</summary>\n<ol><li>Opus is smartest; Haiku is cheapest.</li><li>A small piece of text (about 3–4 letters); you pay per token.</li><li>When the task is simple or very high-volume, to save time and money.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Choose the Right Claude Model</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Learn to pick the best Claude model for a task, balancing smartness, speed, and cost.</p><h2>2. Real-world scenario</h2><p>Your company will send millions of requests to Claude. Picking the right model for each job can save a lot of money — or waste it. You must choose wisely.</p><h2>3. Skills and concepts you will learn</h2><ul><li>The Claude model family (Opus, Sonnet, Haiku).</li><li>Tokens and pricing.</li><li>Matching a model to a task.</li></ul><h2>4. Prerequisites</h2><ul><li>Anthropic Beginner Project 1 completed.</li><li>Read: <code>study/anthropic/beginner/02-claude-models.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write down 5 different tasks (mix of easy and hard).</li><li>For each task, choose Opus, Sonnet, or Haiku, and write <strong>why</strong>.</li><li>Look up the <strong>current</strong> official prices for the 3 models. Write them down (with the date).</li><li>Estimate: if a task sends 1,000 tokens in and gets 1,000 tokens out, roughly what does one call cost on each model? (Use the price table.)</li><li>Write 2 sentences: your rule for choosing a model.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ 5 tasks listed with a chosen model + reason.</li><li>☐ Current prices written (with date).</li><li>☐ A simple cost estimate for one call on each model.</li><li>☐ Your model-choice rule written.</li></ul><h2>7. Expected outcome</h2><p>You can choose a model for any task and explain the cost trade-off.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You list 5 tasks, each with a model choice AND a clear reason.</li><li>At least one task uses each of Opus, Sonnet, and Haiku (you show you understand all three).</li><li>You wrote the current prices (from the official page) with today's date.</li><li>Your cost estimate uses the prices correctly (input + output).</li><li>Your model-choice rule is sensible (smallest model that does the job well).</li></ol><h2>9. Verification checklist</h2><ul><li>☐ 5 tasks + reasons.</li><li>☐ Prices with date.</li><li>☐ Cost estimate.</li><li>☐ Rule written.</li><li>☐ Evidence saved in <code>submissions/anthropic/beginner/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Picking Opus for everything (costly).</li><li>Picking Haiku for hard tasks (low quality).</li><li>Using old prices — always check the live page.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Hard thinking → Opus. Everyday → Sonnet. Simple + high volume → Haiku.</details>\n<details><summary>Hint 2</summary>Cost of one call ≈ (input tokens ÷ 1,000,000 × input price) + (output tokens ÷ 1,000,000 × output price).</details>\n<details><summary>Hint 3</summary>Get live prices from https://www.anthropic.com/pricing.</details>\n<h2>12. Final challenge</h2><p>Design a 2-model plan for a real app: use a cheap model (Haiku) to do a first pass on many items, and a smart model (Opus/Sonnet) only for the hard ones. Explain how this saves money.</p><h2>13. What to submit (evidence)</h2><p>Save your task list, prices, cost estimate, and rule in <code>submissions/anthropic/beginner/project-02/</code>. Then say: <strong>\"I submit Anthropic Beginner Project 2.\"</strong></p><hr><p><strong>Remember:</strong> Pick the smallest model that does the job well. That is smart engineering AND smart spending.</p></section>","anthropic/beginner/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Give Claude a Role (System Prompts)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>System prompt</strong> — special instructions that set Claude's role and rules for the whole chat.</li><li><strong>Role</strong> — who Claude should act as (e.g. \"a kind teacher\").</li><li><strong>User message</strong> — the normal message you send.</li><li><strong>Assistant message</strong> — Claude's reply.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A <strong>system prompt</strong> is like giving Claude a job description before the work starts. It sets the <strong>role</strong>, the <strong>rules</strong>, and the <strong>style</strong>.</p><p>Example: \"You are a kind English teacher. Use simple words. Always give one example.\" Now every reply follows that rule.</p><p>The system prompt is separate from your normal (user) message. It shapes the whole conversation.</p><h2>2. Key concepts and terms</h2><ul><li>Put the <strong>role</strong> and <strong>rules</strong> in the system prompt.</li><li>Put the <strong>task</strong> in the user message.</li><li>Good system prompts are clear and short. They say the role, the rules, and the format.</li><li>The system prompt is strong — Claude follows it closely.</li></ul><h2>3. Practical examples</h2><p>System prompt:</p><blockquote><p>You are a helpful DevOps tutor. Explain in very simple English. Keep answers under 5 sentences. Always end with one tip.</p></blockquote><p>User message:</p><blockquote><p>What is a container?</p></blockquote><p>Now the answer will be simple, short, and end with a tip.</p><h2>4. Commands and config examples</h2><p>In the API (Python), the system prompt is a separate field:</p><pre><code>import anthropic\nclient = anthropic.Anthropic()\n\nmsg = client.messages.create(\n    model=\"claude-opus-5\",\n    max_tokens=1000,\n    system=\"You are a kind teacher. Use very simple English. Give one example.\",\n    messages=[\n        {\"role\": \"user\", \"content\": \"What is a container?\"}\n    ],\n)\nprint(msg.content[0].text)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write a system prompt that makes Claude a \"polite customer support agent\".</li><li>Ask the same question with and without the system prompt. Compare.</li><li>Add a rule: \"Always answer in 3 bullet points.\" See it change the shape.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Claude ignores your style.</li></ul><p>  <strong>Fix:</strong> put the style rule in the <strong>system prompt</strong>, and make it clear and specific.</p><ul><li><strong>Problem:</strong> answers are too long.</li></ul><p>  <strong>Fix:</strong> add a length rule in the system prompt (\"under 5 sentences\").</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Mixing the role and the task in one messy message — keep role/rules in the system prompt, task in the user message.</li><li>Vague roles (\"be helpful\") — be specific (\"a patient math tutor for beginners\").</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CCAO-F / CCDV-F:</strong> know what a system prompt is and how it sets role, rules, and format.</li><li>Know the difference between system, user, and assistant messages.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does a system prompt set?</li><li>Where do you put the task — system or user message?</li><li>Why is \"be helpful\" a weak role?</li></ol><h2>10. References</h2><ul><li>System prompts: <a href=\"https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/system-prompts\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/system-prompts</a> (checked: 2026-09-18)</li><li>Messages API: <a href=\"https://docs.anthropic.com/en/api/messages\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/api/messages</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> System prompt = role + rules + style (for the whole chat). User message = the task. Be specific.</p><details><summary>Answers</summary>\n<ol><li>The role, rules, and style Claude should follow.</li><li>The task goes in the user message.</li><li>It is vague — Claude does better with a specific role and clear rules.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Give Claude a Role with a System Prompt</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Use a system prompt to set Claude's role, rules, and answer style — and see how it changes the output.</p><h2>2. Real-world scenario</h2><p>Your company wants Claude to act as a polite support agent, always short and clear. You set this once in a system prompt so every answer follows the rule.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Write a good system prompt (role + rules + format).</li><li>Separate the role from the task.</li><li>Control the answer style.</li></ul><h2>4. Prerequisites</h2><ul><li>Anthropic Beginner Project 2 completed.</li><li>Read: <code>study/anthropic/beginner/03-system-prompts.md</code>.</li><li>You can do this in the Claude app/website (no API key needed yet), or with the API if you have a key.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Pick a role, e.g. \"a friendly DevOps tutor for beginners\".</li><li>Write a system prompt with: the role, 2 rules (like \"use simple English\", \"under 5 sentences\"), and one format rule (\"end with one tip\").</li><li>Ask a question WITHOUT the system prompt. Save the answer.</li><li>Ask the SAME question WITH the system prompt. Save the answer.</li><li>Write 2–3 sentences comparing them.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ A clear system prompt (role + 2 rules + format).</li><li>☐ Answer without the system prompt saved.</li><li>☐ Answer with the system prompt saved.</li><li>☐ Comparison written.</li></ul><h2>7. Expected outcome</h2><p>The system-prompt answer clearly follows your role, rules, and format. You can see the difference.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>Your system prompt has a specific <strong>role</strong>, at least <strong>2 rules</strong>, and a <strong>format</strong> rule.</li><li>You show the answer WITHOUT the system prompt.</li><li>You show the answer WITH the system prompt.</li><li>The \"with\" answer clearly follows the rules (style/length/format changed).</li><li>Your comparison correctly names what changed.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Role + 2 rules + format.</li><li>☐ Both answers saved.</li><li>☐ Comparison written.</li><li>☐ Evidence saved in <code>submissions/anthropic/beginner/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Vague role (\"be nice\").</li><li>Putting the task inside the system prompt (keep the task in the user message).</li><li>No format rule, so the shape does not change.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Template: \"You are [role]. Rules: [rule 1]; [rule 2]. Always [format].\"</details>\n<details><summary>Hint 2</summary>Example role: \"a patient tutor who explains cloud words to total beginners\".</details>\n<details><summary>Hint 3</summary>Keep the task (the question) in the user message, not the system prompt.</details>\n<h2>12. Final challenge</h2><p>Make two different system prompts for the SAME question — for example one \"expert engineer\" and one \"explain-to-a-child\". Compare how differently Claude answers. This shows the power of roles.</p><h2>13. What to submit (evidence)</h2><p>Save the system prompt, both answers, and your comparison in <code>submissions/anthropic/beginner/project-03/</code>. Then say: <strong>\"I submit Anthropic Beginner Project 3.\"</strong></p><hr><p><strong>Remember:</strong> System prompt = role + rules + format. It shapes every answer. Be specific.</p></section>","anthropic/beginner/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Your First Claude API Call</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>API</strong> — a way for your code to talk to Claude. In simple words: your program sends a message and gets an answer.</li><li><strong>API key</strong> — your secret password for the API. Keep it safe.</li><li><strong>SDK</strong> — a ready-made library that makes API calls easy (<code>anthropic</code> for Python).</li><li><strong>Messages API</strong> — the main Claude endpoint you send messages to.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>So far you talked to Claude in the app. Now you talk to Claude from <strong>code</strong>. This lets you build real apps.</p><p>Steps:</p><ol><li>Get an <strong>API key</strong> from the Anthropic Console.</li><li>Install the <strong>SDK</strong> (<code>pip install anthropic</code>).</li><li>Write a short script that sends a message and prints the answer.</li></ol><p>⚠️ <strong>Keep your API key secret.</strong> Never put it in code you share or commit to git. Use an environment variable.</p><h2>2. Key concepts and terms</h2><ul><li>Set the key as an environment variable: <code>ANTHROPIC_API_KEY</code>.</li><li>The SDK reads it automatically.</li><li>You send a list of <code>messages</code>; each has a <code>role</code> (<code>user</code>) and <code>content</code> (your text).</li><li>You get back a message; the text is in <code>content[0].text</code>.</li><li><code>max_tokens</code> limits how long the answer can be.</li></ul><h2>3. Practical examples</h2><pre><code># hello_claude.py\nimport anthropic\n\nclient = anthropic.Anthropic()   # reads ANTHROPIC_API_KEY from the environment\n\nmessage = client.messages.create(\n    model=\"claude-opus-5\",       # smartest; for cheap practice you can use claude-haiku-4-5\n    max_tokens=300,\n    messages=[\n        {\"role\": \"user\", \"content\": \"Say hello and tell me one fun fact about Linux.\"}\n    ],\n)\n\nprint(message.content[0].text)</code></pre><p>Run it:</p><pre><code>pip install anthropic\nexport ANTHROPIC_API_KEY=\"sk-ant-...your key...\"\npython hello_claude.py</code></pre><h2>4. Commands and config examples</h2><pre><code># keep your key out of code — put it in a .env or export it\nexport ANTHROPIC_API_KEY=\"sk-ant-...\"   # do NOT commit this</code></pre><pre><code># add a system prompt too\nclient.messages.create(\n    model=\"claude-haiku-4-5\", max_tokens=200,\n    system=\"You are a friendly helper. Use simple English.\",\n    messages=[{\"role\": \"user\", \"content\": \"What is Docker?\"}],\n)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Get an API key from the Anthropic Console.</li><li>Install the SDK and set the key as an environment variable.</li><li>Run the <code>hello_claude.py</code> script. Read the answer.</li><li>Change the message and run again.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>authentication_error</code>.</li></ul><p>  <strong>Fix:</strong> the API key is missing or wrong. Check <code>echo $ANTHROPIC_API_KEY</code>.</p><ul><li><strong>Problem:</strong> <code>ModuleNotFoundError: anthropic</code>.</li></ul><p>  <strong>Fix:</strong> run <code>pip install anthropic</code>.</p><ul><li><strong>Problem:</strong> the answer is cut off.</li></ul><p>  <strong>Fix:</strong> raise <code>max_tokens</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Putting the API key directly in the code — use an environment variable.</li><li>Committing the key to git — add it to <code>.gitignore</code> (this repo already ignores <code>.env</code>).</li><li>Forgetting <code>max_tokens</code>.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CCDV-F (Developer):</strong> making an API call, using the SDK, and handling the key safely are core.</li><li>Know the Messages API shape: model, max_tokens, messages, system.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Where should the API key live?</li><li>Which command installs the Python SDK?</li><li>What does <code>max_tokens</code> do?</li></ol><h2>10. References</h2><ul><li>Get started (API): <a href=\"https://docs.anthropic.com/en/docs/get-started\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/get-started</a> (checked: 2026-09-18)</li><li>Messages API: <a href=\"https://docs.anthropic.com/en/api/messages\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/api/messages</a> (checked: 2026-09-18)</li><li>Python SDK: <a href=\"https://github.com/anthropics/anthropic-sdk-python\" target=\"_blank\" rel=\"noopener\">https://github.com/anthropics/anthropic-sdk-python</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Install the SDK, keep the key in an env var, send <code>messages</code>, read <code>content[0].text</code>. Never commit your key.</p><details><summary>Answers</summary>\n<ol><li>In an environment variable (like <code>ANTHROPIC_API_KEY</code>), never in shared code.</li><li><code>pip install anthropic</code>.</li><li>It limits how long Claude's answer can be.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Make Your First Claude API Call</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Write and run a small Python script that sends a message to Claude and prints the answer.</p><h2>2. Real-world scenario</h2><p>Every Claude app starts here: one API call. Once you can do this, you can build anything.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Get and safely store an API key.</li><li>Install the <code>anthropic</code> SDK.</li><li>Send a message and read the reply.</li></ul><h2>4. Prerequisites</h2><ul><li>Anthropic Beginner Project 3 completed.</li><li>Read: <code>study/anthropic/beginner/04-first-api-call.md</code>.</li><li>You need an Anthropic API key (free to create in the Console; small usage costs apply — practice with <code>claude-haiku-4-5</code> to keep it cheap).</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create an API key in the Anthropic Console.</li><li>Store it safely: <code>export ANTHROPIC_API_KEY=\"...\"</code> (or a <code>.env</code> file — this repo ignores <code>.env</code>).</li><li><code>pip install anthropic</code>.</li><li>Write <code>hello_claude.py</code> that sends a message and prints <code>message.content[0].text</code>.</li><li>Run it. Show the answer.</li><li>Change the message and run again. Show the new answer.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Key stored safely (env var, not in code).</li><li>☐ SDK installed.</li><li>☐ Script sends a message and prints the reply.</li><li>☐ Ran with two different messages.</li></ul><h2>7. Expected outcome</h2><p>Your script talks to Claude and prints its answer. You did your first API call.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste <code>hello_claude.py</code>. The API key is <strong>NOT</strong> in the code (it comes from the environment).</li><li>The script uses the <code>anthropic</code> SDK and the Messages API (<code>client.messages.create</code>).</li><li>You show the printed answer for two different messages.</li><li>You state which model you used (and why — e.g. Haiku to keep practice cheap).</li><li>You confirm your key is not committed to git.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Key safe (env var).</li><li>☐ SDK call works.</li><li>☐ Two answers shown.</li><li>☐ Evidence saved in <code>submissions/anthropic/beginner/project-04/</code> (do NOT save your key!).</li></ul><h2>10. Common mistakes</h2><ul><li>Hard-coding the API key.</li><li>Committing the key to git.</li><li>Forgetting <code>pip install anthropic</code>.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the exact `hello_claude.py` in `study/anthropic/beginner/04-first-api-call.md`, section 3.</details>\n<details><summary>Hint 2</summary>Cheap practice model: `model=\"claude-haiku-4-5\"`.</details>\n<details><summary>Hint 3</summary>Auth error? Check `echo $ANTHROPIC_API_KEY` shows your key.</details>\n<h2>12. Final challenge</h2><p>Add a <strong>system prompt</strong> to your script (from Project 3) so Claude always answers in simple English with one example. Show the difference.</p><h2>13. What to submit (evidence)</h2><p>Save the script (with NO key inside), the two answers, and your model note in <code>submissions/anthropic/beginner/project-04/</code>. Then say: <strong>\"I submit Anthropic Beginner Project 4.\"</strong></p><hr><p><strong>Remember:</strong> Install the SDK, keep the key in an env var, call the Messages API, read the reply. Never commit your key.</p></section>","anthropic/beginner/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Use Claude's Reply in a Program</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Parse</strong> — read a value out of the reply.</li><li><strong>Loop</strong> — repeat something (like asking many questions).</li><li><strong>Input</strong> — data you give the program.</li><li><strong>Prompt template</strong> — a prompt with a blank you fill in.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A real app does not just print Claude's answer. It <strong>uses</strong> it: saves it, shows it, or acts on it.</p><p>You will build a tiny tool: it takes some input, builds a prompt, sends it to Claude, and uses the reply. This is the shape of almost every Claude app.</p><h2>2. Key concepts and terms</h2><ul><li>Build the prompt with an f-string (a template with a blank).</li><li>Get the text: <code>message.content[0].text</code>.</li><li>Loop over a list to handle many inputs.</li><li>Keep prompts clear (from Project 1).</li></ul><h2>3. Practical examples</h2><p>A tiny \"summarize each note\" tool:</p><pre><code>import anthropic\nclient = anthropic.Anthropic()\n\nnotes = [\n    \"The server was slow at 2pm. We restarted nginx and it got better.\",\n    \"A user could not log in. The password reset email was in spam.\",\n]\n\ndef summarize(text):\n    msg = client.messages.create(\n        model=\"claude-haiku-4-5\",\n        max_tokens=100,\n        system=\"You summarize notes in ONE short sentence, simple English.\",\n        messages=[{\"role\": \"user\", \"content\": f\"Summarize this note:\\n{text}\"}],\n    )\n    return msg.content[0].text.strip()\n\nfor n in notes:\n    print(\"-\", summarize(n))</code></pre><h2>4. Commands and config examples</h2><pre><code># read Claude's text safely\ntext = message.content[0].text\n# use it: save to a file, show it, or make a decision\nwith open(\"out.txt\", \"a\") as f:\n    f.write(text + \"\\n\")</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make a list of 3 short notes. Summarize each with Claude.</li><li>Save all summaries to a file.</li><li>Add a simple menu: ask the user for a note, then print the summary.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>IndexError</code> on <code>content[0]</code>.</li></ul><p>  <strong>Fix:</strong> the reply may be empty or an error. Print the whole <code>message</code> to see what came back.</p><ul><li><strong>Problem:</strong> the loop is slow/costly.</li></ul><p>  <strong>Fix:</strong> use a small model (Haiku) and short <code>max_tokens</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Not stripping extra spaces/newlines from the reply (<code>.strip()</code>).</li><li>Sending one huge prompt instead of looping over items.</li><li>Forgetting to handle an empty or error reply.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CCDV-F:</strong> building a small app that sends a prompt and uses the reply is the core developer skill.</li><li>Know the request/response shape and how to loop.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Where is the reply text in the response?</li><li>Why use a loop for many inputs?</li><li>Which model is good for a cheap batch job?</li></ol><h2>10. References</h2><ul><li>Messages API: <a href=\"https://docs.anthropic.com/en/api/messages\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/api/messages</a> (checked: 2026-09-18)</li><li>Anthropic Academy: <a href=\"https://www.anthropic.com/learn\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/learn</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Build a prompt → send it → read <code>content[0].text</code> → use it (save/show/act). Loop for many inputs.</p><details><summary>Answers</summary>\n<ol><li>In <code>message.content[0].text</code>.</li><li>To handle each item separately and cleanly (better than one giant prompt).</li><li><code>claude-haiku-4-5</code> (fast and cheap).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build a Tiny Claude Tool (Anthropic Beginner Boss 🏆)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>last project</strong> of Anthropic Beginner. Finish it to complete the level and unlock Anthropic Intermediate.</p><h2>1. Objective</h2><p>Build a small Python tool that takes several inputs, sends each to Claude, and uses the replies.</p><h2>2. Real-world scenario</h2><p>Your team has a list of short notes (or reviews, or logs). They want a one-line summary of each. You build a small tool that does it automatically with Claude.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Build prompts from a template.</li><li>Loop over many inputs.</li><li>Use each reply (save/show).</li><li>Combine everything from the Beginner level.</li></ul><h2>4. Prerequisites</h2><ul><li>Anthropic Beginner Projects 1–4 completed.</li><li>Read: <code>study/anthropic/beginner/05-use-the-reply.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Make a list of at least 4 short notes (or reviews).</li><li>Write a Python tool that:</li></ol><ul><li>has a <strong>system prompt</strong> setting the role (\"summarize in one simple sentence\"),</li><li>loops over the notes,</li><li>sends each to Claude,</li><li>prints each summary AND saves them to a file <code>summaries.txt</code>.</li></ul><ol><li>Use a cheap model (Haiku) and short <code>max_tokens</code>.</li><li>Run it. Show the output and the saved file.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ 4+ notes.</li><li>☐ System prompt used.</li><li>☐ Loop sends each note.</li><li>☐ Summaries printed AND saved to a file.</li></ul><h2>7. Expected outcome</h2><p>One command turns your list of notes into a clean list of one-line summaries, saved to a file.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the tool's code (API key NOT in the code).</li><li>It uses a <strong>system prompt</strong> and a <strong>loop</strong> over the inputs.</li><li>It sends each note to Claude and prints a one-line summary for each.</li><li>It saves all summaries to <code>summaries.txt</code> (show the file).</li><li>You state the model you used and why.</li><li>Your key is not committed to git.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ System prompt + loop.</li><li>☐ Summaries printed + saved.</li><li>☐ Key safe.</li><li>☐ Evidence saved in <code>submissions/anthropic/beginner/project-05/</code> (no key!).</li></ul><h2>10. Common mistakes</h2><ul><li>Hard-coding the key.</li><li>One giant prompt instead of a loop.</li><li>Not saving the output.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Start from the \"summarize each note\" example in `study/anthropic/beginner/05-use-the-reply.md`, section 3.</details>\n<details><summary>Hint 2</summary>Save with `open(\"summaries.txt\",\"a\")` and write each summary line.</details>\n<details><summary>Hint 3</summary>Use `model=\"claude-haiku-4-5\"` and `max_tokens=100` to keep it cheap and short.</details>\n<h2>12. Final challenge</h2><p>Add a small menu: let the user type a new note, and the tool prints its summary right away. Now it is an interactive tool.</p><h2>13. What to submit (evidence)</h2><p>Save the code (no key), the printed output, and <code>summaries.txt</code> in <code>submissions/anthropic/beginner/project-05/</code>. Then say: <strong>\"I submit Anthropic Beginner Project 5.\"</strong> When it passes, Anthropic Intermediate unlocks! 🎉</p><hr><p><strong>Remember:</strong> Template → send → use the reply → loop. You just built a real (tiny) Claude app.</p></section>","anthropic/intermediate/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Deeper Prompt Engineering</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Few-shot</strong> — giving Claude a few examples in the prompt.</li><li><strong>Zero-shot</strong> — no examples, just the instruction.</li><li><strong>Structure</strong> — using clear sections or tags so Claude reads the prompt easily.</li><li><strong>Step-by-step</strong> — asking Claude to think through steps before answering.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>You know clear prompts. Now you make them <strong>stronger</strong>:</p><ol><li><strong>Give examples</strong> (few-shot): show 2–3 examples of input → output. Claude copies the pattern.</li><li><strong>Add structure</strong>: use clear sections or XML-like tags (<code>&lt;task&gt;</code>, <code>&lt;rules&gt;</code>, <code>&lt;example&gt;</code>) so Claude does not get confused.</li><li><strong>Ask for steps</strong>: for hard tasks, ask Claude to work step by step. This raises accuracy.</li></ol><h2>2. Key concepts and terms</h2><ul><li><strong>Few-shot</strong> is the strongest simple trick for consistent output.</li><li><strong>Tags</strong> like <code>&lt;document&gt;...&lt;/document&gt;</code> clearly mark where your data starts and ends.</li><li><strong>Order matters</strong>: put instructions first, then the data, then the question.</li><li>For long data, put the big text early and the question at the end.</li></ul><h2>3. Practical examples</h2><p>Few-shot prompt (classify feelings):</p><pre><code>Classify the feeling as happy or sad.\n\nExample 1: \"I love this!\" -&gt; happy\nExample 2: \"This broke again.\" -&gt; sad\n\nNow classify: \"The update fixed everything.\" -&gt;</code></pre><p>Structured prompt with tags:</p><pre><code>&lt;task&gt;Summarize the log in one sentence.&lt;/task&gt;\n&lt;rules&gt;Simple English. Under 20 words.&lt;/rules&gt;\n&lt;log&gt;\n{paste the log here}\n&lt;/log&gt;</code></pre><h2>4. Commands and config examples</h2><pre><code>prompt = \"\"\"Classify the feeling as happy or sad.\n\nExample 1: \"I love this!\" -&gt; happy\nExample 2: \"This broke again.\" -&gt; sad\n\nNow classify: \"The update fixed everything.\" -&gt;\"\"\"\n\nmsg = client.messages.create(\n    model=\"claude-haiku-4-5\", max_tokens=10,\n    messages=[{\"role\": \"user\", \"content\": prompt}],\n)\nprint(msg.content[0].text.strip())</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write a zero-shot prompt for a task. Then add 2 examples (few-shot). Compare.</li><li>Use tags (<code>&lt;task&gt;</code>, <code>&lt;rules&gt;</code>, <code>&lt;data&gt;</code>) to structure a prompt.</li><li>Add \"Think step by step, then give the final answer\" to a hard prompt.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> answers are inconsistent.</li></ul><p>  <strong>Fix:</strong> add 2–3 examples (few-shot) to show the exact pattern.</p><ul><li><strong>Problem:</strong> Claude mixes up instructions and data.</li></ul><p>  <strong>Fix:</strong> wrap the data in clear tags.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>No examples for a tricky format — add few-shot.</li><li>Data and instructions blended together — separate them with tags.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CCDV-F:</strong> few-shot, structure, and step-by-step are core prompt-engineering skills.</li><li>Know when to add examples and how to structure prompts.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is few-shot prompting?</li><li>Why use tags in a prompt?</li><li>When does \"think step by step\" help?</li></ol><h2>10. References</h2><ul><li>Prompt engineering: <a href=\"https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview</a> (checked: 2026-09-18)</li><li>Use examples (multishot): <a href=\"https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/multishot-prompting</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Examples (few-shot) + structure (tags) + step-by-step = stronger, more consistent answers.</p><details><summary>Answers</summary>\n<ol><li>Giving Claude a few examples of input → output so it copies the pattern.</li><li>To clearly separate instructions from your data, so Claude does not get confused.</li><li>On hard, multi-step problems — it raises accuracy.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build a Reliable Classifier with Few-Shot Prompting</h1><p><strong>Status:</strong> 🔒 Locked (unlocks when Anthropic Intermediate opens)</p><h2>1. Objective</h2><p>Use few-shot examples and structure to make Claude classify text reliably (same format every time).</p><h2>2. Real-world scenario</h2><p>Your team needs to sort support messages into \"bug\", \"question\", or \"praise\". The output must be exactly one of those words, every time. Few-shot prompting makes it reliable.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Few-shot prompting.</li><li>Structured prompts with tags.</li><li>Making output consistent.</li></ul><h2>4. Prerequisites</h2><ul><li>Anthropic Beginner completed.</li><li>Read: <code>study/anthropic/intermediate/01-prompt-engineering-deeper.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Pick a classify task with 3 labels (e.g. bug / question / praise).</li><li>Write a <strong>zero-shot</strong> prompt. Test it on 5 messages. Note any wrong or messy outputs.</li><li>Rewrite as a <strong>few-shot</strong> prompt (2–3 examples per pattern) with clear tags.</li><li>Test on the same 5 messages. The output should be exactly one label each time.</li><li>Compare: how did few-shot improve consistency?</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Zero-shot version tested.</li><li>☐ Few-shot version with examples + tags.</li><li>☐ Tested on the same 5 messages.</li><li>☐ Output is exactly one label each time.</li></ul><h2>7. Expected outcome</h2><p>Your few-shot classifier returns exactly one clean label for every message.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show the zero-shot prompt and its outputs on 5 messages.</li><li>You show the few-shot prompt (with 2–3 examples and clear structure/tags).</li><li>The few-shot version returns <strong>exactly one</strong> of the allowed labels for all 5 messages.</li><li>You explain how few-shot improved consistency.</li><li>Code shown (key not included).</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Both versions tested.</li><li>☐ Few-shot output is clean/consistent.</li><li>☐ Comparison written.</li><li>☐ Evidence saved in <code>submissions/anthropic/intermediate/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>No examples → messy or varying output.</li><li>Blending data and instructions → use tags.</li><li>Allowing extra words → tell Claude to answer with ONLY the label.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Add: \"Answer with ONLY one word: bug, question, or praise.\"</details>\n<details><summary>Hint 2</summary>Use the few-shot format from `study/anthropic/intermediate/01-prompt-engineering-deeper.md`, section 3.</details>\n<details><summary>Hint 3</summary>Wrap each message in `<message>...</message>` so Claude knows where it starts and ends.</details>\n<h2>12. Final challenge</h2><p>Add a \"confidence\" idea: ask Claude to also give a short reason, but keep the label on its own line so your code can still read just the label. Balance reliability with useful detail.</p><h2>13. What to submit (evidence)</h2><p>Save both prompts, the outputs, and your comparison in <code>submissions/anthropic/intermediate/project-01/</code>. Then say: <strong>\"I submit Anthropic Intermediate Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Few-shot + tags + a strict output rule = reliable, consistent results.</p></section>","anthropic/intermediate/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Tool Use (Let Claude Call Your Code)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Tool</strong> — a function you let Claude use (like \"get the weather\").</li><li><strong>Tool use / function calling</strong> — Claude asks to run a tool; your code runs it and gives the result back.</li><li><strong>input_schema</strong> — a description of what inputs the tool needs (JSON shape).</li><li><strong>tool_result</strong> — the answer you send back to Claude after running the tool.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Claude cannot check live data or run your code by itself. <strong>Tool use</strong> fixes this:</p><ol><li>You describe some <strong>tools</strong> (functions) to Claude.</li><li>Claude decides it needs a tool and asks to use it (with inputs).</li><li><strong>Your code runs the tool</strong> and sends the result back.</li><li>Claude uses the result to write the final answer.</li></ol><p>This is how Claude checks weather, reads a database, or does math with your code.</p><h2>2. Key concepts and terms</h2><ul><li>Each tool has: a <code>name</code>, a <code>description</code>, and an <code>input_schema</code> (what inputs it needs).</li><li>When Claude wants a tool, the response <code>stop_reason</code> is <code>\"tool_use\"</code> and there is a <code>tool_use</code> block with the inputs.</li><li>You run the function, then send a <code>tool_result</code> back (with the same <code>tool_use_id</code>).</li><li>Claude then writes the final answer.</li><li>The SDK has a <strong>Tool Runner</strong> helper that does this loop for you.</li></ul><h2>3. Practical examples</h2><pre><code>import anthropic\nclient = anthropic.Anthropic()\n\ntools = [{\n    \"name\": \"add_numbers\",\n    \"description\": \"Add two numbers and return the sum.\",\n    \"input_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\"a\": {\"type\": \"number\"}, \"b\": {\"type\": \"number\"}},\n        \"required\": [\"a\", \"b\"],\n    },\n}]\n\ndef add_numbers(a, b):\n    return a + b\n\nmsg = client.messages.create(\n    model=\"claude-opus-5\", max_tokens=1000, tools=tools,\n    messages=[{\"role\": \"user\", \"content\": \"What is 21 plus 21?\"}],\n)\n\n# if Claude asked for a tool:\nif msg.stop_reason == \"tool_use\":\n    for block in msg.content:\n        if block.type == \"tool_use\":\n            result = add_numbers(**block.input)     # run YOUR code\n            follow = client.messages.create(\n                model=\"claude-opus-5\", max_tokens=1000, tools=tools,\n                messages=[\n                    {\"role\": \"user\", \"content\": \"What is 21 plus 21?\"},\n                    {\"role\": \"assistant\", \"content\": msg.content},\n                    {\"role\": \"user\", \"content\": [\n                        {\"type\": \"tool_result\", \"tool_use_id\": block.id,\n                         \"content\": str(result)}\n                    ]},\n                ],\n            )\n            print(follow.content[0].text)</code></pre><h2>4. Commands and config examples</h2><pre><code># the SDK Tool Runner does the loop for you (beta helper):\n#   from anthropic import beta_tool ; @beta_tool ... ; client.beta.messages.tool_runner(...)\n# for learning, the manual loop above shows what really happens.</code></pre><h2>5. Hands-on exercises</h2><ol><li>Define an <code>add_numbers</code> tool. Ask Claude a math question. Run the tool and send the result back.</li><li>Add a second tool (like <code>get_length</code> of a word). See Claude pick the right one.</li><li>Print the <code>tool_use</code> block to see the inputs Claude sent.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Claude answers without using the tool.</li></ul><p>  <strong>Fix:</strong> make the tool description clear, and ask a question that truly needs it.</p><ul><li><strong>Problem:</strong> error sending the result.</li></ul><p>  <strong>Fix:</strong> the <code>tool_result</code> must use the same <code>tool_use_id</code>, and you must include the assistant's tool_use message in the history.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Forgetting to send the assistant's <code>tool_use</code> message back in the history.</li><li>Wrong <code>tool_use_id</code> on the result.</li><li>A vague <code>input_schema</code> — describe each field.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CCDV-F:</strong> tool use / function calling is a core developer skill.</li><li>Know the flow: define tools → Claude asks → you run → send <code>tool_result</code> → final answer.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why does Claude need tools?</li><li>What is <code>stop_reason</code> when Claude wants a tool?</li><li>What must match between the tool_use and the tool_result?</li></ol><h2>10. References</h2><ul><li>Tool use: <a href=\"https://docs.anthropic.com/en/docs/build-with-claude/tool-use\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/build-with-claude/tool-use</a> (checked: 2026-09-18)</li><li>Tool use examples: <a href=\"https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/build-with-claude/tool-use/overview</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Define tools → Claude asks to use one → your code runs it → send <code>tool_result</code> → Claude answers. The SDK Tool Runner can automate the loop.</p><details><summary>Answers</summary>\n<ol><li>So it can use live data or run your code (it cannot do that alone).</li><li><code>\"tool_use\"</code>.</li><li>The <code>tool_use_id</code> (the result must reference the same id).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Let Claude Use Your Tool</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Build a tool that Claude can call, run it in your code, and send the result back so Claude finishes the answer.</p><h2>2. Real-world scenario</h2><p>Claude cannot know today's exchange rate or run your database query. You give it a tool so it can ask your code for real data.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Define a tool with an input schema.</li><li>Handle the <code>tool_use</code> response.</li><li>Run the function and return a <code>tool_result</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Anthropic Intermediate Project 1 completed.</li><li>Read: <code>study/anthropic/intermediate/02-tool-use.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Define a tool (start with <code>add_numbers</code>, or a <code>get_weather</code> that returns fake data).</li><li>Ask Claude a question that needs the tool.</li><li>Detect the <code>tool_use</code> block; print the inputs Claude sent.</li><li>Run your function with those inputs.</li><li>Send the <code>tool_result</code> back and print Claude's final answer.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Tool defined with an input schema.</li><li>☐ Claude asks to use the tool (<code>stop_reason == \"tool_use\"</code>).</li><li>☐ Your function runs with Claude's inputs.</li><li>☐ Final answer uses the tool's result.</li></ul><h2>7. Expected outcome</h2><p>Claude asks for your tool, your code runs it, and Claude gives a correct final answer using the result.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the code (key not included) showing the tool definition with an <code>input_schema</code>.</li><li>You show that Claude returned a <code>tool_use</code> block, and you print the inputs it sent.</li><li>Your code runs the function with those inputs.</li><li>You send a <code>tool_result</code> (matching <code>tool_use_id</code>) and print Claude's final answer, which uses the result.</li><li>You explain the tool-use flow in one or two simple sentences.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Tool defined + used.</li><li>☐ Function ran with Claude's inputs.</li><li>☐ Final answer uses the result.</li><li>☐ Evidence saved in <code>submissions/anthropic/intermediate/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Not sending the assistant's tool_use message back in history.</li><li>Wrong <code>tool_use_id</code>.</li><li>Vague <code>input_schema</code>.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the full manual-loop example in `study/anthropic/intermediate/02-tool-use.md`, section 3.</details>\n<details><summary>Hint 2</summary>Print `msg.content` to see the tool_use block and its `input`.</details>\n<details><summary>Hint 3</summary>The `tool_result` goes in a new user message and must include the same `tool_use_id`.</details>\n<h2>12. Final challenge</h2><p>Add a <strong>second</strong> tool and ask a question that needs both (or makes Claude choose). Show Claude picking the right tool. Then try the SDK <strong>Tool Runner</strong> helper to see the loop done for you.</p><h2>13. What to submit (evidence)</h2><p>Save the code (no key), the printed tool inputs, and the final answer in <code>submissions/anthropic/intermediate/project-02/</code>. Then say: <strong>\"I submit Anthropic Intermediate Project 2.\"</strong></p><hr><p><strong>Remember:</strong> Define tools → Claude asks → your code runs → send <code>tool_result</code> → Claude answers. This is function calling.</p></section>","anthropic/intermediate/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Structured Output (Clean JSON)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>JSON</strong> — a simple data format your code can read, like <code>{\"name\": \"Sara\", \"age\": 5}</code>.</li><li><strong>Schema</strong> — a description of the exact JSON shape you want.</li><li><strong>Structured output</strong> — making Claude return data in an exact shape.</li><li><strong>Parse</strong> — turn the text into real data your code can use.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Sometimes you do not want a paragraph — you want <strong>data</strong>. For example: pull the name, date, and total from an invoice.</p><p><strong>Structured output</strong> makes Claude return exact JSON that fits your <strong>schema</strong>. Then your code can read it safely, with no messy text to clean up.</p><h2>2. Key concepts and terms</h2><ul><li>Define the JSON <strong>schema</strong> you want (fields and types).</li><li>Use the <code>output_config</code> <code>format</code> option to ask for that shape.</li><li>The SDK helper <code>client.messages.parse(...)</code> can validate the reply against your schema for you.</li><li>Always handle the case where the data is missing.</li></ul><h2>3. Practical examples</h2><pre><code>import anthropic\nclient = anthropic.Anthropic()\n\nschema = {\n    \"type\": \"object\",\n    \"properties\": {\n        \"name\": {\"type\": \"string\"},\n        \"total\": {\"type\": \"number\"},\n    },\n    \"required\": [\"name\", \"total\"],\n}\n\nmsg = client.messages.create(\n    model=\"claude-opus-5\", max_tokens=300,\n    output_config={\"format\": {\"type\": \"json_schema\", \"schema\": schema}},\n    messages=[{\"role\": \"user\", \"content\":\n        \"Invoice: Customer Sara, amount due 42 dollars. Extract name and total.\"}],\n)\nprint(msg.content[0].text)   # clean JSON that fits the schema</code></pre><h2>4. Commands and config examples</h2><pre><code>import json\ndata = json.loads(msg.content[0].text)   # turn the JSON text into real data\nprint(data[\"name\"], data[\"total\"])</code></pre><h2>5. Hands-on exercises</h2><ol><li>Ask Claude to extract 2 fields from a sentence, as JSON.</li><li>Parse the JSON in Python and print the fields.</li><li>Add a third field. Update the schema and test again.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> the reply is not valid JSON.</li></ul><p>  <strong>Fix:</strong> use <code>output_config</code> <code>format</code> with a schema, or the <code>parse()</code> helper. Do not just \"ask nicely\" for JSON.</p><ul><li><strong>Problem:</strong> a field is missing.</li></ul><p>  <strong>Fix:</strong> mark it <code>required</code> in the schema, and handle missing data in your code.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Trusting free text to be valid JSON — use structured output.</li><li>Not parsing the JSON before using it.</li><li>No plan for missing/optional fields.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CCDV-F:</strong> getting structured, machine-readable output is a core developer skill.</li><li>Know that <code>output_config.format</code> is the current way (the old <code>output_format</code> is deprecated).</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why use structured output instead of a paragraph?</li><li>What is a schema?</li><li>How do you turn JSON text into real data in Python?</li></ol><h2>10. References</h2><ul><li>Structured outputs: <a href=\"https://docs.anthropic.com/en/docs/build-with-claude/structured-outputs\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/build-with-claude/structured-outputs</a> (checked: 2026-09-18)</li><li>Messages API: <a href=\"https://docs.anthropic.com/en/api/messages\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/api/messages</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Want data, not prose? Give a schema and use structured output. Then parse the JSON before using it.</p><details><summary>Answers</summary>\n<ol><li>So your code can read exact fields safely, with no messy text to clean.</li><li>A description of the exact JSON shape (fields and types) you want.</li><li><code>json.loads(text)</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Extract Clean Data with Structured Output</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Make Claude return exact JSON that fits a schema, then read the fields safely in your code.</p><h2>2. Real-world scenario</h2><p>Your app reads messy invoices (or reviews) and must save the name and total to a database. You need clean JSON, not a paragraph.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Define a JSON schema.</li><li>Ask for structured output.</li><li>Parse and use the data.</li></ul><h2>4. Prerequisites</h2><ul><li>Anthropic Intermediate Project 2 completed.</li><li>Read: <code>study/anthropic/intermediate/03-structured-output.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Pick a task: extract 3 fields from a sentence (e.g. from a fake invoice: name, total, date).</li><li>Define a JSON <strong>schema</strong> for those fields.</li><li>Call Claude with <code>output_config</code> <code>format</code> using your schema.</li><li>Parse the JSON in Python and print the fields.</li><li>Test on 3 different inputs; show clean JSON each time.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Schema with 3 fields.</li><li>☐ Structured output call.</li><li>☐ JSON parsed in Python.</li><li>☐ Works on 3 inputs.</li></ul><h2>7. Expected outcome</h2><p>Claude returns valid JSON that fits your schema, and your code reads the fields with no cleanup.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the code (key not included) with a JSON schema and <code>output_config</code> <code>format</code>.</li><li>The output is valid JSON with your 3 fields (show it for 3 inputs).</li><li>Your code parses the JSON (<code>json.loads</code>) and prints the fields.</li><li>You handle a missing/edge case (say what happens if a field is not found).</li><li>You explain why structured output is safer than free text.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Schema + structured output.</li><li>☐ Valid JSON on 3 inputs.</li><li>☐ Parsed and used.</li><li>☐ Evidence saved in <code>submissions/anthropic/intermediate/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Just asking for JSON in text (not reliable) — use the schema/format.</li><li>Not parsing before use.</li><li>No plan for missing fields.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the schema + call in `study/anthropic/intermediate/03-structured-output.md`, section 3.</details>\n<details><summary>Hint 2</summary>Parse: `data = json.loads(msg.content[0].text)`.</details>\n<details><summary>Hint 3</summary>Add the third field to the schema's `properties` and `required`.</details>\n<h2>12. Final challenge</h2><p>Extract a <strong>list</strong> of items (e.g. all products in an order) as a JSON array of objects. Handle 0, 1, and many items. Lists are common in real extraction tasks.</p><h2>13. What to submit (evidence)</h2><p>Save the code (no key), the JSON outputs, and your parsing in <code>submissions/anthropic/intermediate/project-03/</code>. Then say: <strong>\"I submit Anthropic Intermediate Project 3.\"</strong></p><hr><p><strong>Remember:</strong> Give a schema, use structured output, parse the JSON. Clean data beats messy text.</p></section>","anthropic/intermediate/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Streaming (Show the Answer as It Types)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Streaming</strong> — getting the answer piece by piece as Claude writes it (like live typing).</li><li><strong>Chunk</strong> — a small piece of the streamed answer.</li><li><strong>Timeout</strong> — when a request waits too long and fails.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Without streaming, you wait for the whole answer, then it appears at once. For long answers, that feels slow.</p><p>With <strong>streaming</strong>, the answer appears <strong>as Claude writes it</strong>, like live typing. This feels fast and is nicer for chat apps. It also avoids <strong>timeouts</strong> on long answers.</p><h2>2. Key concepts and terms</h2><ul><li>Use <code>client.messages.stream(...)</code> instead of <code>create(...)</code>.</li><li>Loop over <code>stream.text_stream</code> to print each chunk.</li><li>Use <code>stream.get_final_message()</code> to get the whole answer at the end.</li><li>Streaming is recommended for long answers or high <code>max_tokens</code>.</li></ul><h2>3. Practical examples</h2><pre><code>import anthropic\nclient = anthropic.Anthropic()\n\nwith client.messages.stream(\n    model=\"claude-opus-5\", max_tokens=1000,\n    messages=[{\"role\": \"user\", \"content\": \"Write a short story about a brave cat.\"}],\n) as stream:\n    for text in stream.text_stream:\n        print(text, end=\"\", flush=True)   # prints live, piece by piece\n    print()\n    final = stream.get_final_message()     # the whole message if you need it</code></pre><h2>4. Commands and config examples</h2><pre><code># get the full text at the end without handling each chunk:\nwith client.messages.stream(model=\"claude-haiku-4-5\", max_tokens=500,\n        messages=[{\"role\":\"user\",\"content\":\"List 5 Linux tips.\"}]) as stream:\n    final = stream.get_final_message()\nprint(final.content[0].text)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Ask for a long answer with streaming; watch it type live.</li><li>Use <code>get_final_message()</code> to also save the whole answer.</li><li>Compare how streaming feels vs a normal <code>create()</code> call.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> long answers fail with a timeout.</li></ul><p>  <strong>Fix:</strong> use streaming; it avoids the timeout.</p><ul><li><strong>Problem:</strong> nothing prints until the end.</li></ul><p>  <strong>Fix:</strong> add <code>flush=True</code> to <code>print</code>, and loop over <code>text_stream</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using <code>create()</code> for very long answers (may time out) — use streaming.</li><li>Forgetting <code>flush=True</code>, so text does not show live.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CCDV-F:</strong> streaming for chat UIs and long outputs is a core skill.</li><li>Know <code>client.messages.stream(...)</code> and <code>get_final_message()</code>.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why use streaming?</li><li>Which method gives the whole answer at the end?</li><li>When is streaming especially important?</li></ol><h2>10. References</h2><ul><li>Streaming: <a href=\"https://docs.anthropic.com/en/docs/build-with-claude/streaming\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/build-with-claude/streaming</a> (checked: 2026-09-18)</li><li>Python SDK: <a href=\"https://github.com/anthropics/anthropic-sdk-python\" target=\"_blank\" rel=\"noopener\">https://github.com/anthropics/anthropic-sdk-python</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Streaming shows the answer live and avoids timeouts on long outputs. Use <code>stream(...)</code> + <code>get_final_message()</code>.</p><details><summary>Answers</summary>\n<ol><li>To show the answer live (feels fast) and avoid timeouts on long answers.</li><li><code>stream.get_final_message()</code>.</li><li>For long answers or high <code>max_tokens</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Stream a Live Answer</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Use streaming so a long answer appears live, piece by piece, like typing.</p><h2>2. Real-world scenario</h2><p>You are building a chat app. Users hate waiting for a big block of text. Streaming makes it feel fast and alive.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Use <code>client.messages.stream(...)</code>.</li><li>Print chunks live.</li><li>Get the full answer at the end.</li></ul><h2>4. Prerequisites</h2><ul><li>Anthropic Intermediate Project 3 completed.</li><li>Read: <code>study/anthropic/intermediate/04-streaming.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write a script that asks for a longish answer (e.g. \"explain containers in 2 paragraphs\").</li><li>Use streaming to print the answer live (piece by piece).</li><li>Also use <code>get_final_message()</code> to save the full answer to a file.</li><li>Compare the feel to a normal <code>create()</code> call.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Streaming prints live.</li><li>☐ Full answer saved with <code>get_final_message()</code>.</li><li>☐ Compared to non-streaming.</li></ul><h2>7. Expected outcome</h2><p>Your answer types out live, and you also keep the full text. You understand when to use streaming.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the streaming code (key not included) using <code>client.messages.stream(...)</code>.</li><li>You show that the answer printed live (describe or record it), looping over <code>text_stream</code>.</li><li>You use <code>get_final_message()</code> and save the full text to a file.</li><li>You explain in one line why streaming is better for long answers.</li><li>Code shown, key not included.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Live streaming works.</li><li>☐ Full answer saved.</li><li>☐ Explanation written.</li><li>☐ Evidence saved in <code>submissions/anthropic/intermediate/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Using <code>create()</code> for very long output (timeout risk).</li><li>Forgetting <code>flush=True</code>.</li><li>Not saving the final message.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the streaming example in `study/anthropic/intermediate/04-streaming.md`, section 3.</details>\n<details><summary>Hint 2</summary>`print(text, end=\"\", flush=True)` inside the `for text in stream.text_stream` loop.</details>\n<details><summary>Hint 3</summary>`final = stream.get_final_message()` then save `final.content[0].text`.</details>\n<h2>12. Final challenge</h2><p>Build a tiny <strong>chat loop</strong>: keep asking the user for input and stream Claude's reply each time, remembering the conversation (append messages). This is the core of a chat app.</p><h2>13. What to submit (evidence)</h2><p>Save the code (no key), a note that it streamed live, and the saved answer in <code>submissions/anthropic/intermediate/project-04/</code>. Then say: <strong>\"I submit Anthropic Intermediate Project 4.\"</strong></p><hr><p><strong>Remember:</strong> Streaming = live answer + no timeouts. Use <code>stream(...)</code> and <code>get_final_message()</code>.</p></section>","anthropic/intermediate/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Prompt Caching (Save Money and Time)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Prompt caching</strong> — reusing a big, unchanging part of your prompt so you do not pay full price each time.</li><li><strong>Prefix</strong> — the start of your prompt (system + early messages).</li><li><strong>Cache hit</strong> — when Claude reuses the cached part (cheaper + faster).</li><li><strong>Invalidate</strong> — break the cache by changing the cached part.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Many apps send the <strong>same big context</strong> every time (like a long set of rules or a document). Paying full price for that each time is wasteful.</p><p><strong>Prompt caching</strong> lets Claude remember that stable part. The next calls reuse it — <strong>cheaper and faster</strong>. This is a \"cache hit\".</p><p>The rule: the cached part must be <strong>exactly the same</strong> each time. Any change breaks (invalidates) the cache.</p><h2>2. Key concepts and terms</h2><ul><li>Mark stable content with <code>cache_control: {type: \"ephemeral\"}</code>.</li><li>Put <strong>stable</strong> content first (system prompt, fixed rules, documents). Put <strong>changing</strong> content (the user's new question) last.</li><li>Check <code>usage.cache_read_input_tokens</code> — if it is greater than 0, the cache worked.</li><li>If it is always 0, something in the prefix keeps changing (like a timestamp).</li></ul><h2>3. Practical examples</h2><pre><code>import anthropic\nclient = anthropic.Anthropic()\n\nbig_rules = \"You are a support bot. (imagine a very long set of rules here) ...\"\n\nmsg = client.messages.create(\n    model=\"claude-opus-5\", max_tokens=300,\n    system=[\n        {\"type\": \"text\", \"text\": big_rules,\n         \"cache_control\": {\"type\": \"ephemeral\"}},   # cache this stable part\n    ],\n    messages=[{\"role\": \"user\", \"content\": \"How do I reset my password?\"}],\n)\nprint(msg.usage)   # look for cache_read_input_tokens on later calls</code></pre><h2>4. Commands and config examples</h2><pre><code># run the same call twice; the second should show cache_read_input_tokens &gt; 0\nprint(msg.usage.cache_creation_input_tokens)  # first call: creates the cache\nprint(msg.usage.cache_read_input_tokens)      # later calls: reads the cache (cheaper)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Put a big stable system prompt with <code>cache_control</code>. Call it twice.</li><li>Print <code>usage</code> both times. See the cache read on the second call.</li><li>Change one word in the cached part; see the cache break (0 read).</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>cache_read_input_tokens</code> is always 0.</li></ul><p>  <strong>Fix:</strong> something in the prefix changes each time (a date, a random id, unsorted JSON). Keep the cached part identical.</p><ul><li><strong>Problem:</strong> the prompt is too short to cache.</li></ul><p>  <strong>Fix:</strong> caching needs a minimum size; it helps most with big stable context.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Putting changing text (timestamps, ids) inside the cached part — keep it stable.</li><li>Expecting caching to help tiny prompts — it helps big, repeated context.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CCDV-F / CCAR-F:</strong> caching is a key way to cut cost and latency.</li><li>Know: stable content first, mark it with <code>cache_control</code>, verify with <code>usage</code>.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does prompt caching save?</li><li>Where do you put stable vs changing content?</li><li>How do you check if the cache worked?</li></ol><h2>10. References</h2><ul><li>Prompt caching: <a href=\"https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching</a> (checked: 2026-09-18)</li><li>Pricing: <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/pricing</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Cache the big stable part (rules/documents) first; keep it identical; verify with <code>cache_read_input_tokens</code>. Cheaper + faster.</p><details><summary>Answers</summary>\n<ol><li>Money and time (you reuse the stable part instead of paying full price each call).</li><li>Stable content first (cached), changing content last.</li><li>Check <code>usage.cache_read_input_tokens</code> &gt; 0.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Cut Cost with Prompt Caching</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Use prompt caching on a big stable system prompt, and prove the cache worked by reading <code>usage</code>.</p><h2>2. Real-world scenario</h2><p>Your support bot sends the same long rulebook on every message. That is expensive. Caching the rulebook makes each call cheaper and faster.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Mark stable content with <code>cache_control</code>.</li><li>Keep the cached prefix identical.</li><li>Verify the cache with <code>usage</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Anthropic Intermediate Project 4 completed.</li><li>Read: <code>study/anthropic/intermediate/05-prompt-caching.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write a <strong>big</strong> stable system prompt (a long set of rules — make it long enough to cache).</li><li>Mark it with <code>cache_control: {type: \"ephemeral\"}</code>.</li><li>Call Claude twice with different user questions (but the same cached system).</li><li>Print <code>usage</code> both times. Show <code>cache_read_input_tokens &gt; 0</code> on the second call.</li><li>Then change one word in the cached part and show the cache breaks (read goes back to 0).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Big stable system prompt cached.</li><li>☐ Two calls, same cached prefix.</li><li>☐ Cache read shown on the second call.</li><li>☐ Cache break shown after a change.</li></ul><h2>7. Expected outcome</h2><p>You proved caching works (cheaper second call) and that changing the prefix breaks it.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the code (key not included) with a cached system prompt (<code>cache_control</code>).</li><li>You show <code>usage</code> for two calls; the second shows <code>cache_read_input_tokens &gt; 0</code>.</li><li>You show that changing the cached text makes the read drop to 0 (cache invalidated).</li><li>You explain in one line why stable content must go first and stay identical.</li><li>Code shown, key not included.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Cache hit shown.</li><li>☐ Cache break shown.</li><li>☐ Explanation written.</li><li>☐ Evidence saved in <code>submissions/anthropic/intermediate/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Changing text (dates/ids) inside the cached part.</li><li>Prompt too small to cache.</li><li>Not checking <code>usage</code>.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the cached system example in `study/anthropic/intermediate/05-prompt-caching.md`, section 3.</details>\n<details><summary>Hint 2</summary>Make the rules long (repeat a paragraph) so it passes the minimum cache size.</details>\n<details><summary>Hint 3</summary>Compare `usage.cache_read_input_tokens` across calls.</details>\n<h2>12. Final challenge</h2><p>Estimate the savings: if the cached part is 5,000 tokens and you send 1,000 messages a day, roughly how much do you save vs no cache? (Use the pricing page and the cache read discount.)</p><h2>13. What to submit (evidence)</h2><p>Save the code (no key), the <code>usage</code> output for both calls, and the cache-break proof in <code>submissions/anthropic/intermediate/project-05/</code>. Then say: <strong>\"I submit Anthropic Intermediate Project 5.\"</strong></p><hr><p><strong>Remember:</strong> Cache the big stable part, keep it identical, verify with <code>usage</code>. Big savings on repeated context.</p></section>","anthropic/intermediate/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Simple Evals (Is My App Good?)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Eval</strong> — a test that measures how good Claude's output is.</li><li><strong>Test case</strong> — one input plus the answer you expect.</li><li><strong>Score</strong> — how many test cases passed (like 8 out of 10).</li><li><strong>Regression</strong> — when a change makes things worse.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>How do you know your prompt is good? You <strong>test</strong> it. An <strong>eval</strong> is a set of <strong>test cases</strong>: each has an input and the answer you expect. You run your app on all of them and count how many pass.</p><p>Now you can improve your prompt and <strong>measure</strong> if it got better or worse. No more guessing.</p><h2>2. Key concepts and terms</h2><ul><li>Build a small set of test cases
