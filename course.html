t `LIMIT=1` to force the alert during testing.</details>\n<h2>12. Final challenge</h2><p>Add a \"recovery\" idea: keep a small state file. Only alert when a metric <strong>first</strong> goes over the limit (not every run), and log \"recovered\" when it goes back under. (This reduces alert spam — a real monitoring feature.)</p><h2>13. What to submit (evidence)</h2><p>Save the script, a normal run, an alert run, <code>cat ~/monitor.log</code>, and <code>crontab -l</code> in <code>submissions/linux/advanced/project-05/</code>. Then say: <strong>\"I submit Linux Advanced Project 5.\"</strong></p><hr><p><strong>Remember:</strong> Collect, compare, alert, log. This tiny tool teaches the same idea as Prometheus.</p></section>","linux/advanced/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Automated Server Administration</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Idempotent</strong> — safe to run many times; the result is the same. In simple words: running it twice does not cause harm.</li><li><strong>Provisioning</strong> — setting up a server so it is ready to use.</li><li><strong>Runbook</strong> — a written list of steps to run a task.</li><li><strong>Infrastructure as Code (IaC)</strong> — describing servers in files, not by hand.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A senior engineer does not set up servers by hand every time. They <strong>automate</strong> it with scripts. One script can: create users, install tools, set the firewall, and make backups — all correctly, every time.</p><p>A key idea is <strong>idempotent</strong>: running the script twice should be safe. For example, use <code>mkdir -p</code> (does nothing if the folder exists) instead of <code>mkdir</code> (errors if it exists).</p><p>This is the doorway to real DevOps tools like Ansible and Terraform, which do the same thing at a bigger scale.</p><h2>2. Key concepts and terms</h2><ul><li><strong>Idempotent commands:</strong> <code>mkdir -p</code>, <code>id user || useradd user</code>, <code>grep -q ... || echo ... &gt;&gt; file</code>.</li><li><strong>Check-then-act:</strong> only make a change if it is needed.</li><li><strong>Logging + exit codes:</strong> know what ran and if it worked.</li><li><strong>Config in one place:</strong> put settings (users, packages) at the top of the script.</li></ul><h2>3. Practical examples</h2><pre><code># make a user only if it does not exist (idempotent)\nid alice &gt;/dev/null 2&gt;&amp;1 || sudo useradd -m alice\n\n# install a package only if missing\ncommand -v git &gt;/dev/null || sudo apt install -y git\n\n# add a line to a file only once\ngrep -q \"MY_SETTING=1\" /etc/environment || echo \"MY_SETTING=1\" | sudo tee -a /etc/environment</code></pre><h2>4. Commands and config examples</h2><pre><code>#!/bin/bash\nset -euo pipefail\nPACKAGES=(git curl tree)\nfor p in \"${PACKAGES[@]}\"; do\n  command -v \"$p\" &gt;/dev/null || sudo apt install -y \"$p\"\ndone\necho \"All tools ready.\"</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write a loop that installs a list of tools only if they are missing.</li><li>Write an idempotent \"make folder\" step with <code>mkdir -p</code>.</li><li>Add a line to a file only if it is not already there.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> the script errors on the second run.</li></ul><p>  <strong>Fix:</strong> it is not idempotent. Use check-then-act (<code>|| </code>, <code>-p</code>, <code>grep -q</code>).</p><ul><li><strong>Problem:</strong> a step needs root.</li></ul><p>  <strong>Fix:</strong> use <code>sudo</code> for that step, or run the whole thing with the right rights.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Not idempotent — second run breaks. Always check before you change.</li><li>No logging — you cannot see what happened.</li><li>Doing everything as root without care — keep least privilege.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>This mindset (declare what you want, make it true, safely) is the heart of Kubernetes too. You declare a desired state in YAML, and Kubernetes makes it real.</li><li>Understanding idempotency helps you learn Ansible, Terraform, and Kubernetes faster.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does idempotent mean?</li><li>How do you install a package only if it is missing?</li><li>Why is idempotency important for automation?</li></ol><h2>10. References</h2><ul><li>Ansible intro (concept): <a href=\"https://docs.ansible.com/ansible/latest/getting_started/index.html\" target=\"_blank\" rel=\"noopener\">https://docs.ansible.com/ansible/latest/getting_started/index.html</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Ansible / IaC basics\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Automate with check-then-act. Make scripts idempotent so running twice is safe.</p><details><summary>Answers</summary>\n<ol><li>Safe to run many times; the result stays the same.</li><li><code>command -v git &gt;/dev/null || sudo apt install -y git</code>.</li><li>So re-runs do not cause errors or damage — automation must be safe to repeat.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Automate Full Server Setup (Linux Track Boss 🏆🏆)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>final Linux project</strong>. Finish it to complete the <strong>whole Linux track</strong>. You will combine everything you learned. After this, you are ready for Docker.</p><h2>1. Objective</h2><p>Write one idempotent script that provisions a server: creates a user, installs tools, sets up a firewall, and schedules a backup — safely, and safe to run twice.</p><h2>2. Real-world scenario</h2><p>Your team gets new servers often. Setting them up by hand is slow and full of mistakes. Your job: <strong>one script</strong> that sets up a server correctly, every time. This is the start of real DevOps automation.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Idempotent provisioning (check-then-act).</li><li>Combine users, packages, firewall, and backups.</li><li>Strict mode + logging.</li><li>Think in \"desired state\" (the foundation for Kubernetes).</li></ul><h2>4. Prerequisites</h2><ul><li>Advanced Projects 1–5 completed.</li><li>Read: <code>study/linux/advanced/06-automated-admin.md</code>.</li><li>This uses everything from the Linux track. Reuse what you built.</li></ul><h2>5. Step-by-step requirements</h2><p>Write <code>setup-server.sh</code> (with <code>set -euo pipefail</code> and logging) that is <strong>idempotent</strong> and does:</p><ol><li><strong>Config block at the top:</strong> a username, a list of packages, and a backup source folder.</li><li><strong>User:</strong> create the user only if it does not exist.</li><li><strong>Packages:</strong> install each tool only if missing (loop over the list).</li><li><strong>Firewall:</strong> ensure ufw allows 22, 80, 443 (allow rules are naturally idempotent).</li><li><strong>Backup:</strong> copy your backup script into place and add a daily cron line only if it is not already there.</li><li><strong>Log</strong> every step with a timestamp to <code>~/setup.log</code>.</li><li>Run the script <strong>twice</strong>. The second run must not error and must not duplicate anything.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Config block at the top.</li><li>☐ User created only if missing.</li><li>☐ Packages installed only if missing (loop).</li><li>☐ Firewall rules ensured.</li><li>☐ Cron backup line added only once.</li><li>☐ Runs twice with no error and no duplicates.</li></ul><h2>7. Expected outcome</h2><p><code>./setup-server.sh</code> sets up the whole server. Running it again changes nothing and errors nothing. The log shows what happened.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>Script starts with <code>set -euo pipefail</code> and has a clear config block.</li><li>User step is idempotent (uses <code>id user || useradd ...</code>). Show the line.</li><li>Package step loops and installs only if missing (<code>command -v ... || apt install</code>). Show the loop.</li><li>Firewall step ensures 22/80/443 are allowed.</li><li>Cron backup line is added only once (uses <code>crontab -l | grep -q ... ||</code>). Prove the second run does not add a duplicate (<code>crontab -l</code>).</li><li>You run it <strong>twice</strong> and show that the second run has no errors and no duplicate cron lines.</li><li><code>~/setup.log</code> shows timestamped steps.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Idempotent user, packages, firewall, cron.</li><li>☐ Second run clean (no errors, no duplicates).</li><li>☐ Logged with timestamps.</li><li>☐ Evidence saved in <code>submissions/linux/advanced/project-06/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Non-idempotent steps — second run errors or duplicates the cron line.</li><li>No logging.</li><li>Not testing the second run (this is the main test!).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Idempotent cron add: `( crontab -l 2>/dev/null | grep -q backup.sh ) || ( crontab -l 2>/dev/null; echo \"0 2 * * * $HOME/backup.sh\" ) | crontab -`.</details>\n<details><summary>Hint 2</summary>Idempotent user: `id \"$USERNAME\" >/dev/null 2>&1 || sudo useradd -m \"$USERNAME\"`.</details>\n<details><summary>Hint 3</summary>Packages: `for p in \"${PACKAGES[@]}\"; do command -v \"$p\" >/dev/null || sudo apt install -y \"$p\"; done`.</details>\n<h2>12. Final challenge</h2><p>Add a <code>--check</code> mode: if the script is run as <code>./setup-server.sh --check</code>, it only <strong>reports</strong> what it *would* do (user exists? packages present? cron set?) without changing anything. This is like a \"dry run\" — a real DevOps feature.</p><h2>13. What to submit (evidence)</h2><p>Save <code>setup-server.sh</code>, the output of <strong>both</strong> runs, <code>crontab -l</code>, and <code>cat ~/setup.log</code> in <code>submissions/linux/advanced/project-06/</code>. Then say: <strong>\"I submit Linux Advanced Project 6.\"</strong></p><p>When it passes, you complete the <strong>entire Linux track</strong>! 🎉🎉 You are ready for Docker.</p><hr><p><strong>Remember:</strong> Idempotent automation = safe to repeat. Declaring a desired state and making it true is exactly how Kubernetes thinks.</p></section>","docker/beginner/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Run and Manage Containers</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Image</strong> — a saved package with an app inside. The recipe.</li><li><strong>Container</strong> — a running copy of an image. The meal.</li><li><strong>Registry</strong> — an online store of images (like Docker Hub).</li><li><strong>Detached</strong> — running in the background (<code>-d</code>).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Docker runs apps in <strong>containers</strong>. A container comes from an <strong>image</strong>.</p><p>Think of it like cooking:</p><ul><li><strong>Image</strong> = the recipe (saved, does not change).</li><li><strong>Container</strong> = the meal you cook from it (running, you can have many).</li></ul><p>You can start, stop, list, and remove containers. You can also look inside a running one.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>docker run IMAGE</code></strong> — start a container from an image.</li><li><strong><code>-d</code></strong> — run in the background (detached).</li><li><strong><code>-p 8080:80</code></strong> — connect port 8080 on your machine to port 80 in the container.</li><li><strong><code>--name web</code></strong> — give the container a name.</li><li><strong><code>docker ps</code></strong> — list running containers. <code>-a</code> shows stopped ones too.</li><li><strong><code>docker logs NAME</code></strong> — see a container's output.</li><li><strong><code>docker exec -it NAME bash</code></strong> — open a shell inside a running container.</li><li><strong><code>docker stop/rm NAME</code></strong> — stop and remove.</li></ul><h2>3. Practical examples</h2><ul><li>Run nginx in background → <code>docker run -d --name web -p 8080:80 nginx</code></li><li>See it → <code>docker ps</code></li><li>Open the site → visit <code>http://localhost:8080</code></li><li>Look inside → <code>docker exec -it web bash</code></li><li>Logs → <code>docker logs web</code></li><li>Clean up → <code>docker stop web &amp;&amp; docker rm web</code></li></ul><h2>4. Commands and config examples</h2><pre><code>docker run hello-world              # test docker works\ndocker run -d --name web -p 8080:80 nginx   # background web server\ndocker ps                            # running containers\ndocker ps -a                         # all containers (incl. stopped)\ndocker logs web                      # container output\ndocker exec -it web bash             # shell inside (exit to leave)\ndocker stop web                      # stop it\ndocker rm web                        # remove it\ndocker run --rm alpine echo \"hi\"     # run once, auto-remove after</code></pre><h2>5. Hands-on exercises</h2><ol><li>Run <code>hello-world</code>. Read the message.</li><li>Run nginx in the background on port 8080. Open it in a browser.</li><li>List running containers. Read the logs of nginx.</li><li>Open a shell inside the nginx container, run <code>ls</code>, then exit.</li><li>Stop and remove the container.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>port is already allocated</code>.</li></ul><p>  <strong>Fix:</strong> another program uses that port. Pick a different one, like <code>-p 8081:80</code>.</p><ul><li><strong>Problem:</strong> <code>permission denied</code> running docker.</li></ul><p>  <strong>Fix:</strong> add your user to the <code>docker</code> group, or use <code>sudo docker ...</code>.</p><ul><li><strong>Problem:</strong> container exits right away.</li></ul><p>  <strong>Fix:</strong> check <code>docker logs NAME</code>. Some images need a command to keep running.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Forgetting <code>-d</code> — the container holds your terminal. Use <code>-d</code> for servers.</li><li>Wrong port order — it is <code>host:container</code> (<code>-p 8080:80</code>).</li><li>Not cleaning up — stopped containers pile up. Remove them.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Kubernetes runs containers too. Understanding <code>docker run</code>, <code>logs</code>, and <code>exec</code> helps you understand Pods.</li><li><code>kubectl logs</code> and <code>kubectl exec</code> are the Kubernetes versions of these.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is the difference between an image and a container?</li><li>What does <code>-p 8080:80</code> mean?</li><li>How do you open a shell inside a running container?</li></ol><h2>10. References</h2><ul><li>Docker get started: <a href=\"https://docs.docker.com/get-started/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/get-started/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker Tutorial for Beginners\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Image = recipe, container = running meal. <code>run</code>, <code>ps</code>, <code>logs</code>, <code>exec</code>, <code>stop</code>, <code>rm</code>.</p><details><summary>Answers</summary>\n<ol><li>An image is the saved package (recipe); a container is a running copy of it (the meal).</li><li>Connect port 8080 on your computer to port 80 inside the container.</li><li><code>docker exec -it NAME bash</code> (or <code>sh</code>).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Run and Manage Your First Containers</h1><p><strong>Status:</strong> 🔒 Locked (unlocks when Docker Beginner opens)</p><h2>1. Objective</h2><p>Run containers, look inside them, read their logs, and clean them up.</p><h2>2. Real-world scenario</h2><p>Your team says: *\"Run our web server in a container, check it works, and look at its logs.\"* This is the most basic Docker task, and you do it many times a day.</p><h2>3. Skills and concepts you will learn</h2><ul><li><code>docker run</code> with <code>-d</code>, <code>-p</code>, <code>--name</code>.</li><li>List with <code>docker ps</code>.</li><li>Read <code>docker logs</code>.</li><li>Enter a container with <code>docker exec</code>.</li><li>Stop and remove containers.</li></ul><h2>4. Prerequisites</h2><ul><li>Linux track completed.</li><li>Docker installed (<code>docker run hello-world</code> works).</li><li>Read: <code>study/docker/beginner/01-run-containers.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Run <code>hello-world</code> and show the message.</li><li>Run <strong>nginx</strong> in the background, named <code>web</code>, on port <code>8080</code>.</li><li>Show it in <code>docker ps</code>.</li><li>Prove it serves a page: <code>curl -I http://localhost:8080</code> (show <code>HTTP/... 200</code>).</li><li>Show the container logs.</li><li>Open a shell inside <code>web</code>, run <code>ls /usr/share/nginx/html</code>, then exit.</li><li>Stop and remove <code>web</code>. Prove it is gone with <code>docker ps -a</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ hello-world runs.</li><li>☐ nginx runs in background on 8080 with name <code>web</code>.</li><li>☐ <code>curl -I</code> returns 200.</li><li>☐ Logs shown.</li><li>☐ Shell entered and <code>ls</code> run inside.</li><li>☐ Container stopped and removed.</li></ul><h2>7. Expected outcome</h2><p>You ran a web server in a container, tested it, looked inside, and cleaned up.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>hello-world</code> output shown.</li><li><code>docker ps</code> shows <code>web</code> running with <code>0.0.0.0:8080-&gt;80/tcp</code>.</li><li><code>curl -I http://localhost:8080</code> shows <code>200</code>.</li><li><code>docker logs web</code> output shown.</li><li><code>docker exec -it web ...</code> output shows the html folder listing.</li><li>After cleanup, <code>docker ps -a</code> does not list <code>web</code>.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ nginx served a 200.</li><li>☐ Logs + exec shown.</li><li>☐ Cleaned up.</li><li>☐ Evidence saved in <code>submissions/docker/beginner/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Port order wrong — it is <code>-p host:container</code> (<code>8080:80</code>).</li><li>Forgetting <code>-d</code> — terminal gets stuck. (Press Ctrl+C, then use <code>-d</code>.)</li><li>Not removing the container after stopping.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`docker run -d --name web -p 8080:80 nginx`.</details>\n<details><summary>Hint 2</summary>Enter and list: `docker exec -it web ls /usr/share/nginx/html`.</details>\n<details><summary>Hint 3</summary>Cleanup: `docker stop web && docker rm web`. Check with `docker ps -a`.</details>\n<h2>12. Final challenge</h2><p>Run a second nginx named <code>web2</code> on port <code>8081</code> at the same time. Show both in <code>docker ps</code>. Then remove both in one command: <code>docker rm -f web web2</code>.</p><h2>13. What to submit (evidence)</h2><p>Save all commands + output in <code>submissions/docker/beginner/project-01/</code>. Then say: <strong>\"I submit Docker Beginner Project 1.\"</strong></p><hr><p><strong>Remember:</strong> <code>run -d -p --name</code>, then <code>ps</code>, <code>logs</code>, <code>exec</code>, <code>stop</code>, <code>rm</code>. This is your daily Docker.</p></section>","docker/beginner/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Docker Images</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Image</strong> — a saved package with an app and its files.</li><li><strong>Tag</strong> — a label for an image version, like <code>nginx:1.27</code> or <code>node:20</code>.</li><li><strong>Registry</strong> — an online store of images. <strong>Docker Hub</strong> is the default.</li><li><strong>Layer</strong> — an image is built in layers, stacked on top of each other.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>An <strong>image</strong> is a read-only package. You <strong>pull</strong> it from a registry, and you <strong>run</strong> it to make a container.</p><p>Images have <strong>tags</strong> for versions:</p><ul><li><code>nginx:latest</code> — the newest (but \"latest\" can change!).</li><li><code>nginx:1.27</code> — a fixed version (better for real work).</li></ul><p>Images are made of <strong>layers</strong>. Shared layers are stored once, which saves space and time.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>docker pull IMAGE:TAG</code></strong> — download an image.</li><li><strong><code>docker images</code></strong> — list local images.</li><li><strong><code>docker rmi IMAGE</code></strong> — remove an image.</li><li><strong><code>docker tag SRC NEW</code></strong> — give an image a new name/tag.</li><li><strong><code>docker inspect IMAGE</code></strong> — see details.</li><li><strong><code>docker history IMAGE</code></strong> — see the layers.</li></ul><h2>3. Practical examples</h2><ul><li>Pull a fixed version → <code>docker pull nginx:1.27</code></li><li>List images → <code>docker images</code></li><li>Rename/tag → <code>docker tag nginx:1.27 my-nginx:v1</code></li><li>See layers → <code>docker history nginx:1.27</code></li></ul><h2>4. Commands and config examples</h2><pre><code>docker pull python:3.12-slim     # pull a small python image\ndocker images                     # list local images\ndocker tag python:3.12-slim myapp:v1   # add a new tag\ndocker history python:3.12-slim   # show the layers\ndocker rmi myapp:v1               # remove an image tag\ndocker image prune                # remove unused images (careful)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Pull <code>nginx:1.27</code> (a fixed tag).</li><li>List your images. Find the size.</li><li>Tag it as <code>my-nginx:v1</code>. List again — see both names.</li><li>Look at its layers with <code>docker history</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>manifest unknown</code> / tag not found.</li></ul><p>  <strong>Fix:</strong> the tag does not exist. Check the tag list on Docker Hub. Spelling matters.</p><ul><li><strong>Problem:</strong> disk is full of images.</li></ul><p>  <strong>Fix:</strong> remove unused ones with <code>docker image prune</code> (read the warning first).</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using <code>latest</code> in real work — it can change without warning. Pin a version like <code>1.27</code>.</li><li>Never cleaning images — they use disk. Prune sometimes.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> you set image names and tags in Pod YAML. Always pin a version in production.</li><li><strong>CKS:</strong> small, trusted base images (like <code>-slim</code> or <code>distroless</code>) reduce risk.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a tag?</li><li>Why avoid <code>latest</code> in production?</li><li>Which command shows local images?</li></ol><h2>10. References</h2><ul><li>Docker images docs: <a href=\"https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-an-image/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-an-image/</a> (checked: 2026-09-18)</li><li>Docker Hub: <a href=\"https://hub.docker.com/\" target=\"_blank\" rel=\"noopener\">https://hub.docker.com/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Pull images by a fixed tag. <code>docker images</code> lists them. Avoid <code>latest</code> for real work.</p><details><summary>Answers</summary>\n<ol><li>A label for an image version (like <code>nginx:1.27</code>).</li><li>Because \"latest\" can change and break your app without warning.</li><li><code>docker images</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Pull, Tag, and Explore Images</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Learn to pull images by a fixed tag, list them, tag them, and look at their layers.</p><h2>2. Real-world scenario</h2><p>Your team says: *\"Use nginx version 1.27, not latest. And prepare our own tag for it.\"* Pinning versions keeps the app stable. This is a real production rule.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Pull by a fixed tag.</li><li>List and read image sizes.</li><li>Re-tag an image.</li><li>See image layers with <code>docker history</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Beginner Project 1 completed.</li><li>Read: <code>study/docker/beginner/02-images.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Pull <code>nginx:1.27</code> (a fixed tag, not <code>latest</code>).</li><li>List images and find the nginx size.</li><li>Tag it as <code>my-nginx:v1</code>.</li><li>Show <code>docker images</code> again — both names should appear.</li><li>Show the layers with <code>docker history nginx:1.27</code>.</li><li>Pull a small image too: <code>python:3.12-slim</code>. Compare its size to a full image if you want.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Pull <code>nginx:1.27</code>.</li><li>☐ Show image size.</li><li>☐ Tag as <code>my-nginx:v1</code>.</li><li>☐ Show both names in <code>docker images</code>.</li><li>☐ Show <code>docker history</code>.</li></ul><h2>7. Expected outcome</h2><p>You have nginx pinned at 1.27, a second tag <code>my-nginx:v1</code>, and you understand layers and sizes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>docker pull nginx:1.27</code> output shown (not <code>latest</code>).</li><li><code>docker images</code> shows <code>nginx 1.27</code> with a size.</li><li><code>docker tag</code> created <code>my-nginx:v1</code>, and <code>docker images</code> shows both.</li><li><code>docker history nginx:1.27</code> output shown (the layers).</li><li>You explain in one sentence why pinning a version is better than <code>latest</code>.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Fixed tag pulled.</li><li>☐ Re-tag worked.</li><li>☐ Layers shown.</li><li>☐ Evidence saved in <code>submissions/docker/beginner/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Pulling <code>latest</code> by habit — use the fixed tag <code>1.27</code>.</li><li>Confusing <code>tag</code> order — it is <code>docker tag SOURCE NEW</code>.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`docker pull nginx:1.27` then `docker images`.</details>\n<details><summary>Hint 2</summary>`docker tag nginx:1.27 my-nginx:v1`. Then `docker images` shows both names, same image ID.</details>\n<details><summary>Hint 3</summary>Pinning avoids surprise changes: `latest` can update to a new version that breaks your app.</details>\n<h2>12. Final challenge</h2><p>Find how many layers <code>python:3.12-slim</code> has vs <code>python:3.12</code> (the full one). Pull both and compare <code>docker history</code> and sizes. Which is smaller, and why is small better?</p><h2>13. What to submit (evidence)</h2><p>Save all commands + output + your one-sentence explanation in <code>submissions/docker/beginner/project-02/</code>. Then say: <strong>\"I submit Docker Beginner Project 2.\"</strong></p><hr><p><strong>Remember:</strong> Pin versions. Small images are better. <code>docker history</code> shows the layers.</p></section>","docker/beginner/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Write a Dockerfile</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Dockerfile</strong> — a text file with steps to build an image. The recipe you write.</li><li><strong>Build</strong> — turn a Dockerfile into an image (<code>docker build</code>).</li><li><strong>Base image</strong> — the image you start from (<code>FROM</code>).</li><li><strong>Layer</strong> — each instruction makes a new layer.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Until now you used images made by others. Now you make <strong>your own</strong>. You write a <strong>Dockerfile</strong> — a list of steps — then <strong>build</strong> it into an image.</p><p>A Dockerfile is like a recipe:</p><ol><li>Start from a base (<code>FROM</code>).</li><li>Copy your files in (<code>COPY</code>).</li><li>Run setup commands (<code>RUN</code>).</li><li>Say what to run when it starts (<code>CMD</code>).</li></ol><h2>2. Key concepts and terms</h2><ul><li><strong><code>FROM image</code></strong> — the starting base.</li><li><strong><code>WORKDIR /app</code></strong> — set the working folder inside the image.</li><li><strong><code>COPY src dest</code></strong> — copy files from your computer into the image.</li><li><strong><code>RUN command</code></strong> — run a command at build time (e.g. install packages).</li><li><strong><code>EXPOSE 3000</code></strong> — document the port the app uses.</li><li><strong><code>CMD [\"node\",\"app.js\"]</code></strong> — the default command when the container starts.</li><li><strong><code>docker build -t name:tag .</code></strong> — build the image from the Dockerfile in this folder.</li></ul><h2>3. Practical examples</h2><p>A simple Node app Dockerfile:</p><pre><code>FROM node:20-slim\nWORKDIR /app\nCOPY package.json .\nRUN npm install\nCOPY . .\nEXPOSE 3000\nCMD [\"node\", \"app.js\"]</code></pre><p>Build and run:</p><pre><code>docker build -t myapp:v1 .\ndocker run -d -p 3000:3000 --name myapp myapp:v1</code></pre><h2>4. Commands and config examples</h2><pre><code># a tiny static site with nginx\nFROM nginx:1.27\nCOPY index.html /usr/share/nginx/html/index.html</code></pre><pre><code>docker build -t mysite:v1 .        # build (the \".\" means \"this folder\")\ndocker run -d -p 8080:80 mysite:v1 # run it\ncurl http://localhost:8080         # test it</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make a folder with an <code>index.html</code> file (any text).</li><li>Write a Dockerfile that starts from <code>nginx:1.27</code> and copies your <code>index.html</code> in.</li><li>Build it as <code>mysite:v1</code>. Run it on port 8080. Open it.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>COPY failed: no such file</code>.</li></ul><p>  <strong>Fix:</strong> the file path is wrong, or the file is outside the build folder. Files must be in or under the folder you build from.</p><ul><li><strong>Problem:</strong> build is slow every time.</li></ul><p>  <strong>Fix:</strong> put lines that change less (like <code>RUN npm install</code>) <strong>before</strong> copying all code. This uses the build cache.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Copying everything before installing dependencies — breaks caching. Copy <code>package.json</code> and install first.</li><li>Forgetting <code>CMD</code> — the container may start and exit.</li><li>Building without a tag — hard to find later. Use <code>-t name:tag</code>.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> you must understand images and how apps are packaged. Building images is a core \"Application Design &amp; Build\" skill.</li><li>Knowing <code>FROM</code>, <code>COPY</code>, <code>RUN</code>, <code>CMD</code> is enough for most tasks.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does <code>FROM</code> do?</li><li>What is the difference between <code>RUN</code> and <code>CMD</code>?</li><li>Why copy <code>package.json</code> before the rest of the code?</li></ol><h2>10. References</h2><ul><li>Dockerfile reference: <a href=\"https://docs.docker.com/reference/dockerfile/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/reference/dockerfile/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Dockerfile tutorial\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Dockerfile = recipe. <code>FROM</code> → <code>COPY</code> → <code>RUN</code> → <code>CMD</code>. Build with <code>docker build -t name:tag .</code>.</p><details><summary>Answers</summary>\n<ol><li>Sets the base image you start from.</li><li><code>RUN</code> runs at build time (to set up the image); <code>CMD</code> runs when the container starts.</li><li>So the slow <code>npm install</code> layer is cached and not repeated when only your code changes.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build Your Own Image with a Dockerfile</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Write a Dockerfile and build your own image. Run it as a container and test it.</p><h2>2. Real-world scenario</h2><p>Your team has a small website. They say: *\"Package it as a Docker image so anyone can run it with one command.\"* Building images is the core Docker skill.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Write a Dockerfile (<code>FROM</code>, <code>COPY</code>, <code>CMD</code>).</li><li>Build an image with <code>docker build -t</code>.</li><li>Run and test your own image.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Beginner Project 2 completed.</li><li>Read: <code>study/docker/beginner/03-dockerfile.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Make a project folder <code>mysite</code>.</li><li>Inside it, make <code>index.html</code> with a heading like <code>&lt;h1&gt;Hello from my Docker image&lt;/h1&gt;</code>.</li><li>Write a <code>Dockerfile</code> that starts from <code>nginx:1.27</code> and copies your <code>index.html</code> into <code>/usr/share/nginx/html/</code>.</li><li>Build the image as <code>mysite:v1</code>.</li><li>Run it in the background on port 8080, named <code>mysite</code>.</li><li>Test with <code>curl http://localhost:8080</code> — it must show your heading.</li><li>Clean up (stop + rm).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ <code>index.html</code> created with your heading.</li><li>☐ <code>Dockerfile</code> uses <code>FROM nginx:1.27</code> and <code>COPY</code>.</li><li>☐ <code>docker build -t mysite:v1 .</code> succeeds.</li><li>☐ Container runs on 8080.</li><li>☐ <code>curl</code> shows YOUR page (not the default nginx page).</li></ul><h2>7. Expected outcome</h2><p>Your own image serves your own HTML page. You built it from a Dockerfile.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the <code>Dockerfile</code> and the <code>index.html</code>.</li><li><code>docker build -t mysite:v1 .</code> output shows a successful build.</li><li><code>docker images</code> shows <code>mysite v1</code>.</li><li><code>curl http://localhost:8080</code> returns <strong>your</strong> heading text (not the default nginx welcome page).</li><li>You cleaned up the container after.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Dockerfile correct.</li><li>☐ Image built and tagged.</li><li>☐ Your page is served (not default).</li><li>☐ Evidence saved in <code>submissions/docker/beginner/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Wrong copy path — nginx serves from <code>/usr/share/nginx/html/</code>.</li><li>Forgetting the <code>.</code> at the end of <code>docker build -t mysite:v1 .</code>.</li><li>Seeing the default nginx page — that means your COPY did not overwrite <code>index.html</code>.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Dockerfile:\n<pre><code>FROM nginx:1.27\nCOPY index.html /usr/share/nginx/html/index.html</code></pre></details>\n<details><summary>Hint 2</summary>Build and run: `docker build -t mysite:v1 .` then `docker run -d -p 8080:80 --name mysite mysite:v1`.</details>\n<details><summary>Hint 3</summary>If you see the default page, your `index.html` was not copied to the right name/path. Check the COPY line and rebuild.</details>\n<h2>12. Final challenge</h2><p>Add a second file <code>about.html</code> and copy it in too. Then <code>curl http://localhost:8080/about.html</code> to prove it is served.</p><h2>13. What to submit (evidence)</h2><p>Save <code>Dockerfile</code>, <code>index.html</code>, the build output, and the <code>curl</code> result in <code>submissions/docker/beginner/project-03/</code>. Then say: <strong>\"I submit Docker Beginner Project 3.\"</strong></p><hr><p><strong>Remember:</strong> <code>FROM</code> → <code>COPY</code> → build with <code>-t name:tag .</code> → run → test. You made your own image!</p></section>","docker/beginner/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Environment Variables and Volumes</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Environment variable (env var)</strong> — a setting given to the app, like <code>PORT=3000</code>.</li><li><strong>Volume</strong> — storage that lives outside the container, so data is not lost.</li><li><strong>Persist</strong> — keep data even after the container is removed.</li><li><strong>Bind mount</strong> — share a folder from your computer into the container.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Two important needs:</p><ol><li><strong>Configuration</strong> — apps need settings (like a password or a port). You pass them as <strong>environment variables</strong> with <code>-e</code>.</li><li><strong>Saving data</strong> — a container's own files disappear when you remove it. To keep data, you use a <strong>volume</strong> (storage that lives outside the container).</li></ol><h2>2. Key concepts and terms</h2><ul><li><strong><code>-e KEY=VALUE</code></strong> — set an environment variable.</li><li><strong><code>--env-file file</code></strong> — load many env vars from a file.</li><li><strong><code>-v myvol:/data</code></strong> — mount a named <strong>volume</strong> at <code>/data</code>.</li><li><strong><code>-v $(pwd)/site:/usr/share/nginx/html</code></strong> — a <strong>bind mount</strong> (share your folder).</li><li><strong><code>docker volume ls</code></strong> — list volumes.</li></ul><h2>3. Practical examples</h2><ul><li>Pass a setting → <code>docker run -e APP_MODE=prod myapp</code></li><li>Keep database data → <code>docker run -d -e POSTGRES_PASSWORD=secret -v pgdata:/var/lib/postgresql/data postgres:16</code></li><li>Share a folder → <code>docker run -d -p 8080:80 -v $(pwd)/site:/usr/share/nginx/html nginx:1.27</code></li></ul><h2>4. Commands and config examples</h2><pre><code>docker run --rm -e NAME=Sara alpine sh -c 'echo \"Hello $NAME\"'   # env var\ndocker volume create pgdata                                       # make a volume\ndocker run -d --name db -e POSTGRES_PASSWORD=secret \\\n  -v pgdata:/var/lib/postgresql/data postgres:16                  # persist DB data\ndocker volume ls                                                  # list volumes</code></pre><h2>5. Hands-on exercises</h2><ol><li>Run alpine with <code>-e NAME=YourName</code> and print \"Hello YourName\".</li><li>Make a volume <code>mydata</code>. Run a container that writes a file into <code>/data</code>, then remove the container. Run a new container with the same volume and show the file is still there.</li><li>Bind mount a folder into nginx and change the page live.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> data lost after <code>docker rm</code>.</li></ul><p>  <strong>Fix:</strong> you did not use a volume. Mount one with <code>-v name:/path</code>.</p><ul><li><strong>Problem:</strong> bind mount shows empty.</li></ul><p>  <strong>Fix:</strong> the host path is wrong. Use a full path or <code>$(pwd)/folder</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Storing important data inside the container — always use a volume for data.</li><li>Putting secrets in the image — pass them as env vars (better: use secrets, which you learn later).</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> Kubernetes has the same ideas. Env vars → <code>env</code>/ConfigMaps/Secrets. Volumes → Kubernetes Volumes and PersistentVolumes.</li><li>Understanding Docker volumes makes Kubernetes storage much easier.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>How do you pass a setting to a container?</li><li>Why do you need a volume?</li><li>What is a bind mount?</li></ol><h2>10. References</h2><ul><li>Docker volumes: <a href=\"https://docs.docker.com/storage/volumes/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/storage/volumes/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker volumes\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> <code>-e</code> for settings, <code>-v</code> for data that must survive. Never keep important data only inside a container.</p><details><summary>Answers</summary>\n<ol><li>With an environment variable: <code>-e KEY=VALUE</code>.</li><li>So data is kept (persisted) even after the container is removed.</li><li>Sharing a folder from your computer into the container.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Keep Data Safe with Volumes and Config with Env Vars</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Pass settings to a container with environment variables, and keep data safe using a volume.</p><h2>2. Real-world scenario</h2><p>Your team runs a database in Docker. They say: *\"The password must come from a setting, and the data must NOT be lost when we restart the container.\"* Losing database data is a disaster. Volumes prevent it.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Pass settings with <code>-e</code>.</li><li>Create and mount a volume with <code>-v</code>.</li><li>Prove data survives container removal.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Beginner Project 3 completed.</li><li>Read: <code>study/docker/beginner/04-env-and-volumes.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li><strong>Env var test:</strong> run alpine with <code>-e NAME=YourName</code> and print <code>Hello YourName</code>.</li><li><strong>Volume test (the main task):</strong></li></ol><ul><li>Create a volume <code>mydata</code>.</li><li>Run a container that mounts <code>mydata</code> at <code>/data</code>, and write a file: <code>echo \"important\" &gt; /data/note.txt</code>.</li><li>Remove that container.</li><li>Run a <strong>new</strong> container with the <strong>same</strong> volume <code>mydata</code>, and show <code>/data/note.txt</code> still has \"important\".</li></ul><ol><li>Show <code>docker volume ls</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Env var prints your name.</li><li>☐ Volume created.</li><li>☐ File written to the volume.</li><li>☐ First container removed.</li><li>☐ New container shows the file still exists (data survived!).</li></ul><h2>7. Expected outcome</h2><p>You proved that data in a volume survives even after the container is removed. And you passed a setting with an env var.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>The <code>-e NAME=...</code> run prints <code>Hello YourName</code>.</li><li>You created a volume and wrote <code>/data/note.txt</code> in a container using it.</li><li>You removed that container (<code>docker rm</code>).</li><li>A <strong>new</strong> container using the same volume shows <code>note.txt</code> still contains \"important\" (<code>cat /data/note.txt</code>).</li><li><code>docker volume ls</code> shows your volume.</li><li>You explain in one sentence why the data survived.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Env var works.</li><li>☐ Data survived container removal.</li><li>☐ Volume listed.</li><li>☐ Evidence saved in <code>submissions/docker/beginner/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Not using the <strong>same</strong> volume name on the second container.</li><li>Writing to a path that is not the mounted one.</li><li>Confusing volume (<code>name:/path</code>) with bind mount (<code>/host/path:/path</code>).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Env: `docker run --rm -e NAME=Sara alpine sh -c 'echo \"Hello $NAME\"'`.</details>\n<details><summary>Hint 2</summary>Write: `docker run --rm -v mydata:/data alpine sh -c 'echo important > /data/note.txt'`. Read back: `docker run --rm -v mydata:/data alpine cat /data/note.txt`.</details>\n<details><summary>Hint 3</summary>Because the volume `mydata` lives outside any container, its files stay even after you remove the container.</details>\n<h2>12. Final challenge</h2><p>Run a real database with a volume:</p><p><code>docker run -d --name db -e POSTGRES_PASSWORD=secret -v pgdata:/var/lib/postgresql/data postgres:16</code>.</p><p>Show it starts (<code>docker logs db</code>). Then stop + remove it, run it again with the same volume, and confirm it still starts fine (data kept). Clean up after.</p><h2>13. What to submit (evidence)</h2><p>Save all commands + output (especially the \"data survived\" proof) in <code>submissions/docker/beginner/project-04/</code>. Then say: <strong>\"I submit Docker Beginner Project 4.\"</strong></p><hr><p><strong>Remember:</strong> <code>-e</code> for settings, <code>-v</code> for data. Volumes keep data safe across container restarts and removals.</p></section>","docker/beginner/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Container Networking Basics</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Port</strong> — a numbered door for a service.</li><li><strong>Publish a port</strong> — connect a container port to your machine (<code>-p</code>).</li><li><strong>Docker network</strong> — a private network where containers can talk to each other.</li><li><strong>DNS by name</strong> — on a user network, containers find each other by their name.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Two networking needs:</p><ol><li><strong>Reach a container from outside</strong> — publish a port with <code>-p host:container</code>.</li><li><strong>Let containers talk to each other</strong> — put them on the same <strong>Docker network</strong>. Then they find each other <strong>by name</strong>.</li></ol><p>The default <code>bridge</code> network does NOT give name-based DNS. So you make your <strong>own</strong> network for apps that talk to each other.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>-p 8080:80</code></strong> — publish container port 80 as host 8080.</li><li><strong><code>docker network create appnet</code></strong> — make a user network.</li><li><strong><code>--network appnet</code></strong> — put a container on it.</li><li>On a user network, a container named <code>db</code> is reachable at the hostname <code>db</code>.</li><li><strong><code>docker network ls</code></strong> and <strong><code>docker network inspect</code></strong> — see networks.</li></ul><h2>3. Practical examples</h2><pre><code>docker network create appnet\ndocker run -d --name db --network appnet redis:7\ndocker run -d --name app --network appnet alpine sleep 1000\n# now from \"app\", \"db\" is reachable by the name \"db\"\ndocker exec app ping -c 2 db</code></pre><h2>4. Commands and config examples</h2><pre><code>docker network create appnet         # make a private network\ndocker network ls                    # list networks\ndocker run -d --name web --network appnet -p 8080:80 nginx:1.27\ndocker exec web getent hosts db      # name lookup on the network\ndocker network inspect appnet        # details, connected containers</code></pre><h2>5. Hands-on exercises</h2><ol><li>Create a network <code>appnet</code>.</li><li>Run two containers on it: <code>db</code> (redis) and <code>app</code> (alpine with <code>sleep 1000</code>).</li><li>From <code>app</code>, ping <code>db</code> by name. It should work.</li><li>Run a third container NOT on the network. Try to ping <code>db</code> — it should fail.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> container cannot reach another by name.</li></ul><p>  <strong>Fix:</strong> they must be on the <strong>same user network</strong>. The default bridge does not do name DNS.</p><ul><li><strong>Problem:</strong> cannot open the app in a browser.</li></ul><p>  <strong>Fix:</strong> you did not publish the port. Add <code>-p host:container</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Expecting name DNS on the default bridge — it does not work there. Make a user network.</li><li>Confusing publish (<code>-p</code>, for outside access) with network (for container-to-container).</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> Kubernetes Services give Pods stable names and networking. This is the same idea as Docker name-based DNS, but bigger.</li><li>Understanding \"same network → talk by name\" helps you understand Kubernetes Services.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>How do you reach a container from your browser?</li><li>How do two containers talk to each other by name?</li><li>Does the default bridge give name-based DNS?</li></ol><h2>10. References</h2><ul><li>Docker networking: <a href=\"https://docs.docker.com/network/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/network/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker networking\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> <code>-p</code> opens a door to the outside. A user network lets containers talk by name.</p><details><summary>Answers</summary>\n<ol><li>Publish a port with <code>-p host:container</code>.</li><li>Put them on the same user-created Docker network; then they use each other's names.</li><li>No — you need a user-created network for name-based DNS.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Connect Containers on a Network</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Make two containers talk to each other by name on a private Docker network.</p><h2>2. Real-world scenario</h2><p>Your app has a web part and a database part. They must talk to each other, but only the web part should be open to the outside. You set up a private network so they can find each other by name.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a user network.</li><li>Put containers on the same network.</li><li>Reach a container by its name.</li><li>Publish only the port that needs outside access.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Beginner Project 4 completed.</li><li>Read: <code>study/docker/beginner/05-networking.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a network <code>appnet</code>.</li><li>Run a container <code>db</code> (use <code>redis:7</code>) on <code>appnet</code>.</li><li>Run a container <code>app</code> (use <code>alpine</code> with <code>sleep 1000</code>) on <code>appnet</code>.</li><li>From <code>app</code>, prove you can reach <code>db</code> by name (ping or <code>getent hosts db</code>).</li><li>Run a container <code>lonely</code> NOT on <code>appnet</code>. Show it CANNOT reach <code>db</code> by name.</li><li>Clean up all containers and the network.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Network <code>appnet</code> created.</li><li>☐ <code>db</code> and <code>app</code> both on <code>appnet</code>.</li><li>☐ <code>app</code> reaches <code>db</code> by name (success).</li><li>☐ A container off the network fails to reach <code>db</code> (proves isolation).</li><li>☐ Everything cleaned up.</li></ul><h2>7. Expected outcome</h2><p>Containers on the same network talk by name. A container off the network cannot. You understand private networking.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>docker network create appnet</code> shown.</li><li><code>db</code> and <code>app</code> are both running on <code>appnet</code> (show <code>docker ps</code> + the <code>--network appnet</code> commands).</li><li>From <code>app</code>, a name lookup/ping of <code>db</code> <strong>succeeds</strong> (show output).</li><li>A container <strong>not</strong> on <code>appnet</code> <strong>fails</strong> to resolve/reach <code>db</code> (show the failure).</li><li>You cleaned up (containers + <code>docker network rm appnet</code>).</li><li>You explain in one sentence why the <code>lonely</code> container failed.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Same-network name access works.</li><li>☐ Off-network access fails.</li><li>☐ Cleaned up.</li><li>☐ Evidence saved in <code>submissions/docker/beginner/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Using the default bridge and expecting name DNS — make a user network.</li><li>Forgetting <code>--network appnet</code> on one of the containers.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`docker network create appnet`, then add `--network appnet` to each `docker run`.</details>\n<details><summary>Hint 2</summary>Test: `docker exec app getent hosts db` (or `docker exec app ping -c 2 db`).</details>\n<details><summary>Hint 3</summary>The `lonely` container fails because name-based DNS only works between containers on the **same** user network.</details>\n<h2>12. Final challenge</h2><p>Put an nginx <code>web</code> on <code>appnet</code> with <code>-p 8080:80</code>. From <code>app</code>, <code>curl http://web</code> (by name). From your browser, open <code>http://localhost:8080</code>. Show both work — one by name inside, one by published port outside.</p><h2>13. What to submit (evidence)</h2><p>Save all commands + output (success AND the isolation failure) in <code>submissions/docker/beginner/project-05/</code>. Then say: <strong>\"I submit Docker Beginner Project 5.\"</strong></p><hr><p><strong>Remember:</strong> Same network → talk by name. <code>-p</code> → open to the outside. This is the seed of Kubernetes Services.</p></section>","docker/beginner/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Containerize a Simple App</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Containerize</strong> — put an app into a Docker image so it runs anywhere.</li><li><strong>Dependencies</strong> — extra code the app needs to run.</li><li><strong><code>.dockerignore</code></strong> — a file that tells Docker which files to skip.</li><li><strong>Port mapping</strong> — connecting the app's port to your machine.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Now you put a <strong>real (small) app</strong> into a container. The steps are always the same:</p><ol><li>Write the app.</li><li>Write a Dockerfile: base image → copy files → install dependencies → set the start command.</li><li>Build the image.</li><li>Run it and test it.</li></ol><p>We use a tiny web app so the focus stays on Docker, not on coding.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>.dockerignore</code></strong> — skip files like <code>node_modules</code> or <code>.git</code> so the image stays small.</li><li><strong>Order matters:</strong> copy dependency files and install <strong>before</strong> copying all code (for caching).</li><li><strong><code>CMD</code></strong> — the command that starts your app.</li><li><strong><code>EXPOSE</code></strong> — documents the port (you still publish with <code>-p</code> when running).</li></ul><h2>3. Practical examples</h2><p>A tiny Python web app:</p><pre><code># app.py\nfrom http.server import HTTPServer, BaseHTTPRequestHandler\n\nclass H(BaseHTTPRequestHandler):\n    def do_GET(self):\n        self.send_response(200)\n        self.end_headers()\n        self.wfile.write(b\"Hello from my container app!\\n\")\n\nHTTPServer((\"0.0.0.0\", 8000), H).serve_forever()</code></pre><pre><code># Dockerfile\nFROM python:3.12-slim\nWORKDIR /app\nCOPY app.py .\nEXPOSE 8000\nCMD [\"python\", \"app.py\"]</code></pre><pre><code>docker build -t helloapp:v1 .\ndocker run -d -p 8000:8000 --name helloapp helloapp:v1\ncurl http://localhost:8000</code></pre><h2>4. Commands and config examples</h2><pre><code># .dockerignore\n__pycache__/\n*.pyc\n.git</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make the <code>app.py</code> above.</li><li>Write the Dockerfile.</li><li>Build, run, and <code>curl</code> it.</li><li>Add a <code>.dockerignore</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> app not reachable.</li></ul><p>  <strong>Fix:</strong> the app must listen on <code>0.0.0.0</code> (not <code>127.0.0.1</code>) inside the container. And publish the port with <code>-p</code>.</p><ul><li><strong>Problem:</strong> container exits at once.</li></ul><p>  <strong>Fix:</strong> check <code>docker logs</code>. The <code>CMD</code> may be wrong, or the app crashed.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>App listens on <code>127.0.0.1</code> inside the container — then it is not reachable. Use <code>0.0.0.0</code>.</li><li>No <code>.dockerignore</code> — the image includes junk and gets big.</li><li>Forgetting to publish the port.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD</strong> \"Application Design &amp; Build\": you must package an app and run it. This project is exactly that skill.</li><li>Later you deploy this same idea as a Pod in Kubernetes.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why must the app listen on <code>0.0.0.0</code> inside a container?</li><li>What is <code>.dockerignore</code> for?</li><li>Which instruction starts the app?</li></ol><h2>10. References</h2><ul><li>Docker language guides: <a href=\"https://docs.docker.com/language/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/language/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Dockerize an app\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> App → Dockerfile → build → run → test. Listen on <code>0.0.0.0</code>. Keep the image small.</p><details><summary>Answers</summary>\n<ol><li>So it accepts connections from outside the container, not just from inside it.</li><li>To skip files (like caches or <code>.git</code>) so the image stays small and clean.</li><li><code>CMD</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Containerize a Real App (Level Boss 🏆)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>last project</strong> of Docker Beginner. Finish it to complete the level and unlock Docker Intermediate.</p><h2>1. Objective</h2><p>Take a small app, put it in a Docker image, run it, and test it. This is real containerization.</p><h2>2. Real-world scenario</h2><p>A developer gives you a small web app and says: *\"Make it run in Docker so we can deploy it anywhere.\"* You write the Dockerfile, build the image, and prove it works.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Package an app with a Dockerfile.</li><li>Use <code>.dockerignore</code>.</li><li>Publish the app's port.</li><li>Debug with <code>docker logs</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Beginner Project 5 completed.</li><li>Read: <code>study/docker/beginner/06-containerize-app.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Make a folder <code>helloapp</code>. Inside it, make the small web app (use the <code>app.py</code> from the study doc, or any tiny app you like).</li><li>Write a <code>Dockerfile</code> (base image → copy → <code>CMD</code>).</li><li>Add a <code>.dockerignore</code>.</li><li>Build the image as <code>helloapp:v1</code>.</li><li>Run it on port 8000, named <code>helloapp</code>.</li><li>Test with <code>curl http://localhost:8000</code> — it must show your app's message.</li><li>Show <code>docker logs helloapp</code>.</li><li>Clean up.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ App file created.</li><li>☐ Dockerfile + <code>.dockerignore</code> created.</li><li>☐ Image builds as <code>helloapp:v1</code>.</li><li>☐ <code>curl</code> shows the app's message.</li><li>☐ Logs shown.</li></ul><h2>7. Expected outcome</h2><p>Your own app runs inside a container and answers on port 8000. You containerized it end to end.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the app file, the <code>Dockerfile</code>, and the <code>.dockerignore</code>.</li><li><code>docker build -t helloapp:v1 .</code> output shows success.</li><li><code>docker ps</code> shows <code>helloapp</code> with the published port.</li><li><code>curl http://localhost:8000</code> returns your app's message.</li><li><code>docker logs helloapp</code> output shown.</li><li>The app listens on <code>0.0.0.0</code> (not <code>127.0.0.1</code>) — confirm it is reachable.</li><li>You cleaned up after.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ App containerized and reachable.</li><li>☐ Logs shown.</li><li>☐ <code>.dockerignore</code> present.</li><li>☐ Evidence saved in <code>submissions/docker/beginner/project-06/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>App on <code>127.0.0.1</code> inside → not reachable. Use <code>0.0.0.0</code>.</li><li>Forgetting <code>-p 8000:8000</code>.</li><li>No <code>.dockerignore</code> → big image.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the exact `app.py` and Dockerfile from `study/docker/beginner/06-containerize-app.md`, section 3.</details>\n<details><summary>Hint 2</summary>Build + run: `docker build -t helloapp:v1 .` then `docker run -d -p 8000:8000 --name helloapp helloapp:v1`.</details>\n<details><summary>Hint 3</summary>If `curl` fails, check `docker logs helloapp` and make sure the app binds `0.0.0.0:8000`.</details>\n<h2>12. Final challenge</h2><p>Make the app's message come from an <strong>environment variable</strong> (like <code>GREETING</code>). Rebuild, then run with <code>-e GREETING=\"Hi from env\"</code>, and prove the message changed. (This connects env vars + your own app.)</p><h2>13. What to submit (evidence)</h2><p>Save the app file, <code>Dockerfile</code>, <code>.dockerignore</code>, build output, <code>curl</code> result, and logs in <code>submissions/docker/beginner/project-06/</code>. Then say: <strong>\"I submit Docker Beginner Project 6.\"</strong> When it passes, Docker Intermediate unlocks! 🎉</p><hr><p><strong>Remember:</strong> App → Dockerfile → build → run → test. You can now package any app into a container.</p></section>","docker/intermediate/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Multi-Container Apps (By Hand)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Multi-container app</strong> — an app made of several containers working together.</li><li><strong>Tier</strong> — one layer of the app (web tier, database tier).</li><li><strong>Service</strong> — one part of the app (like \"web\" or \"db\").</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Real apps have parts:</p><ul><li>a <strong>web</strong> part (what users see),</li><li>a <strong>database</strong> part (where data is saved),</li><li>sometimes a <strong>cache</strong> part (for speed).</li></ul><p>Each part runs in its own container. They talk over a shared network. In this lesson you connect them <strong>by hand</strong> with <code>docker run</code>. In the next lesson, Compose does it for you.</p><h2>2. Key concepts and terms</h2><ul><li>Put all parts on the <strong>same user network</strong> so they talk by name.</li><li>Give each part a clear <code>--name</code>.</li><li>Only publish the port that users need (usually the web part).</li><li>The web part connects to the database using the database's <strong>container name</strong> as the host.</li></ul><h2>3. Practical examples</h2><p>A web app + redis cache:</p><pre><code>docker network create shopnet\ndocker run -d --name cache --network shopnet redis:7\ndocker run -d --name web --network shopnet -p 8080:80 \\\n  -e CACHE_HOST=cache nginx:1.27</code></pre><p>The web container reaches the cache at hostname <code>cache</code>.</p><h2>4. Commands and config examples</h2><pre><code>docker network create shopnet\ndocker run -d --name db --network shopnet \\\n  -e POSTGRES_PASSWORD=secret -v shopdata:/var/lib/postgresql/data postgres:16\ndocker run -d --name cache --network shopnet redis:7\ndocker run -d --name web --network shopnet -p 8080:80 nginx:1.27\ndocker ps\ndocker exec web getent hosts db     # web can find db by name</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make a network. Run a <code>db</code> (postgres) and a <code>cache</code> (redis) on it.</li><li>Run a <code>web</code> (nginx) on the same network, publish port 8080.</li><li>From <code>web</code>, prove you can resolve <code>db</code> and <code>cache</code> by name.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> web cannot reach db.</li></ul><p>  <strong>Fix:</strong> same network? correct name? Check <code>docker network inspect shopnet</code>.</p><ul><li><strong>Problem:</strong> db keeps restarting.</li></ul><p>  <strong>Fix:</strong> check <code>docker logs db</code>. Postgres needs <code>POSTGRES_PASSWORD</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Different networks for parts that must talk — put them together.</li><li>Publishing the database port to the world — usually not needed and unsafe.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>This is the mental model for Kubernetes: many Pods (parts) on a shared network, talking through Services.</li><li>Doing it by hand first makes Compose and Kubernetes easy.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why put all parts on the same network?</li><li>How does the web part find the database?</li><li>Which part usually publishes a port?</li></ol><h2>10. References</h2><ul><li>Docker multi-container: <a href=\"https://docs.docker.com/get-started/workshop/07_multi_container/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/get-started/workshop/07_multi_container/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker multi-container\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Many parts, one network, talk by name. Publish only what users need.</p><details><summary>Answers</summary>\n<ol><li>So they can find and talk to each other by name.</li><li>By using the database container's name as the hostname.</li><li>The web part (the one users reach).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Run a Multi-Container App by Hand</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Run an app with 3 parts (web, database, cache) as separate containers that talk over one network.</p><h2>2. Real-world scenario</h2><p>Your app has a website, a database, and a cache. They must work as a team. Before using Compose, you set it up by hand to understand how the parts connect.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Connect multiple containers on one network.</li><li>Use container names as hostnames.</li><li>Publish only the web port.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Beginner completed.</li><li>Read: <code>study/docker/intermediate/01-multi-container.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a network <code>shopnet</code>.</li><li>Run <code>db</code> = <code>postgres:16</code> with <code>POSTGRES_PASSWORD=secret</code> and a volume <code>shopdata</code>.</li><li>Run <code>cache</code> = <code>redis:7</code>.</li><li>Run <code>web</code> = <code>nginx:1.27</code> with <code>-p 8080:80</code>.</li><li>All 3 on <code>shopnet</code>.</li><li>From <code>web</code>, prove name access to <code>db</code> and <code>cache</code> (<code>getent hosts db</code>, <code>getent hosts cache</code>).</li><li>Show <code>docker ps</code> (all 3 running). Clean up after.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Network created.</li><li>☐ db, cache, web all on the network.</li><li>☐ web publishes 8080.</li><li>☐ web resolves db and cache by name.</li><li>☐ All cleaned up.</li></ul><h2>7. Expected outcome</h2><p>Three containers run as a team. The web part can reach the db and cache by name. Only web is open to the outside.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>docker network create shopnet</code> shown.</li><li><code>docker ps</code> shows <code>db</code>, <code>cache</code>, <code>web</code> all running, with <code>web</code> publishing 8080.</li><li><code>db</code> uses the <code>shopdata</code> volume and <code>POSTGRES_PASSWORD</code> (show the run command).</li><li>From <code>web</code>, <code>getent hosts db</code> and <code>getent hosts cache</code> both return an IP (name DNS works).</li><li>You cleaned up (containers + network + optionally the volume).</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ 3 parts on one network.</li><li>☐ Name DNS works from web.</li><li>☐ Only web published.</li><li>☐ Evidence saved in <code>submissions/docker/intermediate/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>One part on a different network — it cannot be reached.</li><li>Publishing the db port — not needed, less safe.</li><li>Postgres missing its password env var.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>See the full command set in `study/docker/intermediate/01-multi-container.md`, section 4.</details>\n<details><summary>Hint 2</summary>Test name DNS: `docker exec web getent hosts db`.</details>\n<details><summary>Hint 3</summary>Cleanup: `docker rm -f web db cache && docker network rm shopnet`.</details>\n<h2>12. Final challenge</h2><p>Count how many <code>docker run</code> commands and flags you needed. Write them down. In the next project you will replace all of them with ONE Compose file. This shows why Compose is so useful.</p><h2>13. What to submit (evidence)</h2><p>Save all commands + output in <code>submissions/docker/intermediate/project-01/</code>. Then say: <strong>\"I submit Docker Intermediate Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Many parts, one network, talk by name. This is the hand-made version of what Compose and Kubernetes automate.</p></section>","docker/intermediate/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Docker Compose</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Compose</strong> — a tool to run many containers with one YAML file.</li><li><strong>YAML</strong> — a simple text format for settings (spaces matter!).</li><li><strong>Service</strong> — one container definition in the Compose file.</li><li><strong><code>docker compose up</code></strong> — start everything. <strong><code>down</code></strong> — stop and remove everything.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>In Project 1 you typed many <code>docker run</code> commands. That is slow and easy to get wrong.</p><p><strong>Docker Compose</strong> puts your whole app in one file: <code>compose.yaml</code>. Then one command starts it all. Another stops it all. It is clear, repeatable, and easy to share.</p><h2>2. Key concepts and terms</h2><ul><li>File name: <code>compose.yaml</code> (or <code>docker-compose.yml</code>).</li><li>Top key: <code>services:</code> — each service is one container.</li><li>Common fields: <code>image</code>, <code>build</code>, <code>ports</code>, <code>environment</code>, <code>volumes</code>, <code>depends_on</code>.</li><li>Compose makes a network automatically. Services talk by their <strong>service name</strong>.</li><li>Commands: <code>docker compose up -d</code>, <code>docker compose ps</code>, <code>docker compose logs</code>, <code>docker compose down</code>.</li></ul><h2>3. Practical examples</h2><pre><code># compose.yaml\nservices:\n  web:\n    image: nginx:1.27\n    ports:\n      - \"8080:80\"\n    depends_on:\n      - db\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: secret\n    volumes:\n      - dbdata:/var/lib/postgresql/data\n\nvolumes:\n  dbdata:</code></pre><pre><code>docker compose up -d        # start all\ndocker compose ps           # see services\ndocker compose logs -f web  # follow web logs\ndocker compose down         # stop and remove all</code></pre><h2>4. Commands and config examples</h2><pre><code>docker compose up -d          # start in background\ndocker compose up -d --build  # rebuild images first\ndocker compose ps             # list services\ndocker compose exec web sh    # shell into a service\ndocker compose down           # stop + remove (keeps named volumes)\ndocker compose down -v        # also remove volumes (careful!)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write the <code>compose.yaml</code> above.</li><li><code>docker compose up -d</code>. Check <code>docker compose ps</code>.</li><li>Open <code>http://localhost:8080</code>.</li><li><code>docker compose down</code> to clean up.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> YAML error / bad indentation.</li></ul><p>  <strong>Fix:</strong> YAML uses spaces, not tabs. Keep indentation even. Check with <code>docker compose config</code>.</p><ul><li><strong>Problem:</strong> service cannot reach db.</li></ul><p>  <strong>Fix:</strong> use the <strong>service name</strong> (<code>db</code>) as the host. Compose networks them together.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Tabs in YAML — use spaces only.</li><li>Forgetting the top-level <code>volumes:</code> block when you use a named volume.</li><li>Using <code>down -v</code> by mistake — it deletes your data volumes.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Compose YAML looks a lot like Kubernetes YAML. Learning Compose makes Kubernetes manifests easier.</li><li>The idea \"declare services in a file, then apply\" is the same in both.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does <code>docker compose up -d</code> do?</li><li>How do services find each other in Compose?</li><li>What is the danger of <code>docker compose down -v</code>?</li></ol><h2>10. References</h2><ul><li>Compose docs: <a href=\"https://docs.docker.com/compose/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/compose/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker Compose\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> One <code>compose.yaml</code> = your whole app. <code>up</code> to start, <code>down</code> to stop. Services talk by name.</p><details><summary>Answers</summary>\n<ol><li>Starts all services in the background.</li><li>By their service name (Compose puts them on one network).</li><li>It deletes the named volumes too — you can lose your data.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Run the Whole App with Docker Compose</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Replace all your <code>docker run</code> commands with one <code>compose.yaml</code>. Start and stop the whole app with one command.</p><h2>2. Real-world scenario</h2><p>Your teammate needs to run the app on their laptop. Instead of a long list of commands, you give them one file. They run <code>docker compose up</code> and it just works.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Write <code>compose.yaml</code> with multiple services.</li><li>Use service names for networking.</li><li>Start/stop the whole app.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Intermediate Project 1 completed.</li><li>Read: <code>study/docker/intermediate/02-docker-compose.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write a <code>compose.yaml</code> with 3 services: <code>web</code> (nginx, port 8080), <code>db</code> (postgres with password + named volume), and <code>cache</code> (redis).</li><li><code>docker compose up -d</code>.</li><li>Show <code>docker compose ps</code> (all up).</li><li>Prove <code>web</code> can resolve <code>db</code> by name: <code>docker compose exec web getent hosts db</code>.</li><li>Open <code>http://localhost:8080</code> (or <code>curl</code> it).</li><li><code>docker compose down</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ <code>compose.yaml</code> has 3 services.</li><li>☐ Named volume for db.</li><li>☐ <code>up -d</code> starts everything.</li><li>☐ web resolves db by name.</li><li>☐ <code>down</code> cleans up.</li></ul><h2>7. Expected outcome</h2><p>One file runs your whole 3-part app. One command starts it, one stops it.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the full <code>compose.yaml</code>.</li><li><code>docker compose up -d</code> and <code>docker compose ps</code> show all 3 services running.</li><li>The db uses a <strong>named volume</strong> (show it in the file and in <code>docker volume ls</code>).</li><li><code>docker compose exec web getent hosts db</code> returns an IP (name DNS works).</li><li><code>curl -I http://localhost:8080</code> (or browser) shows the web works.</li><li><code>docker compose down</code> output shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ 3 services in one file.</li><li>☐ Named volume present.</li><li>☐ Service DNS works.</li><li>☐ Evidence saved in <code>submissions/docker/intermediate/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Tabs in YAML (use spaces).</li><li>Missing top-level <code>volumes:</code> block.</li><li>Wrong indentation → run <code>docker compose config</code> to check.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Start from the example in `study/docker/intermediate/02-docker-compose.md`, section 3. Add a `cache` se
