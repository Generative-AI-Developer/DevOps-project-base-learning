rvice using `redis:7`.</details>\n<details><summary>Hint 2</summary>Check your file before running: `docker compose config` (it prints the parsed file or an error).</details>\n<details><summary>Hint 3</summary>`docker compose up -d`, then `docker compose ps`, then `docker compose exec web getent hosts db`.</details>\n<h2>12. Final challenge</h2><p>Add a <code>build:</code> service: point one service at the <code>helloapp</code> Dockerfile you made in Docker Beginner Project 6, and run it with Compose (<code>docker compose up -d --build</code>). Now Compose builds AND runs your own app.</p><h2>13. What to submit (evidence)</h2><p>Save <code>compose.yaml</code>, the <code>up</code>/<code>ps</code> output, the name-DNS proof, and <code>down</code> in <code>submissions/docker/intermediate/project-02/</code>. Then say: <strong>\"I submit Docker Intermediate Project 2.\"</strong></p><hr><p><strong>Remember:</strong> One <code>compose.yaml</code> runs your whole app. This is the doorway to Kubernetes manifests.</p></section>","docker/intermediate/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Custom Networks and Isolation</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Isolation</strong> — keeping parts apart so they cannot reach each other.</li><li><strong>Frontend network</strong> — where the web part lives (open to users).</li><li><strong>Backend network</strong> — where the database lives (private).</li><li><strong>Attach</strong> — put a container on a network.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>For safety, you do not want everything on one big network. You split it:</p><ul><li><strong>frontend</strong> network: web + anything users touch.</li><li><strong>backend</strong> network: database + private parts.</li></ul><p>The web part joins <strong>both</strong> networks (it talks to users and to the db). The database joins <strong>only</strong> the backend. So the database is hidden from the outside. This is <strong>isolation</strong> — a key security idea.</p><h2>2. Key concepts and terms</h2><ul><li>A container can be on <strong>more than one</strong> network.</li><li>Put the db on backend only. Put web on frontend + backend.</li><li>In Compose, define multiple networks and attach each service to the ones it needs.</li></ul><h2>3. Practical examples</h2><pre><code>services:\n  web:\n    image: nginx:1.27\n    ports: [\"8080:80\"]\n    networks: [frontend, backend]\n  db:\n    image: postgres:16\n    environment: { POSTGRES_PASSWORD: secret }\n    networks: [backend]          # backend only — hidden from frontend\n\nnetworks:\n  frontend:\n  backend:</code></pre><h2>4. Commands and config examples</h2><pre><code>docker compose up -d\ndocker compose exec web getent hosts db   # works: web is on backend\n# a frontend-only container could NOT reach db\ndocker network ls\ndocker network inspect &lt;project&gt;_backend</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write a Compose file with <code>frontend</code> and <code>backend</code> networks.</li><li>Put <code>db</code> on backend only, <code>web</code> on both.</li><li>Prove <code>web</code> reaches <code>db</code>. Then reason: could a frontend-only service reach <code>db</code>? (No.)</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> web cannot reach db.</li></ul><p>  <strong>Fix:</strong> web must also be on the <code>backend</code> network.</p><ul><li><strong>Problem:</strong> you wanted db private but it is reachable.</li></ul><p>  <strong>Fix:</strong> remove db from the frontend network; keep it on backend only.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Putting the db on the public/frontend network — it should be private.</li><li>Forgetting to attach web to both networks.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKS:</strong> Kubernetes <code>NetworkPolicies</code> do this same isolation inside the cluster: allow only needed traffic.</li><li>The idea \"only connect what must connect\" is core security.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why split into frontend and backend networks?</li><li>Which networks should the web part join?</li><li>Which network should the database join?</li></ol><h2>10. References</h2><ul><li>Compose networking: <a href=\"https://docs.docker.com/compose/how-tos/networking/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/compose/how-tos/networking/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker networks\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Split networks to hide the database. Connect only what must connect. This is isolation.</p><details><summary>Answers</summary>\n<ol><li>To hide private parts (like the database) from the public part.</li><li>Both frontend and backend.</li><li>Backend only (private).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Isolate the Database with Custom Networks</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Split your app into a frontend and a backend network so the database is private.</p><h2>2. Real-world scenario</h2><p>Security review: *\"The database must not be reachable from the public part except through the web app.\"* You split the networks so the db is hidden.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Define multiple networks in Compose.</li><li>Attach a container to more than one network.</li><li>Keep the database private (backend only).</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Intermediate Project 2 completed.</li><li>Read: <code>study/docker/intermediate/03-custom-networks.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write a <code>compose.yaml</code> with two networks: <code>frontend</code> and <code>backend</code>.</li><li><code>web</code> (nginx, port 8080) on <strong>both</strong> networks.</li><li><code>db</code> (postgres) on <strong>backend only</strong>.</li><li>Add a <code>tester</code> service (alpine, <code>sleep 1000</code>) on <strong>frontend only</strong>.</li><li>Start it. Prove: <code>web</code> can reach <code>db</code>, but <code>tester</code> CANNOT reach <code>db</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Two networks defined.</li><li>☐ web on both, db on backend only, tester on frontend only.</li><li>☐ web resolves/reaches db.</li><li>☐ tester fails to reach db (isolation proven).</li></ul><h2>7. Expected outcome</h2><p>The database is private. Only the web app (on both networks) can reach it. The frontend-only tester cannot.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the <code>compose.yaml</code> showing two networks and the attachments.</li><li><code>db</code> is attached to <code>backend</code> only (not frontend).</li><li>From <code>web</code>: <code>getent hosts db</code> (or a connection) <strong>succeeds</strong>.</li><li>From <code>tester</code>: reaching <code>db</code> by name <strong>fails</strong> (show the failure).</li><li>You explain in one sentence why <code>tester</code> failed.</li><li>You clean up with <code>docker compose down</code>.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ db is backend-only.</li><li>☐ web reaches db.</li><li>☐ tester cannot reach db.</li><li>☐ Evidence saved in <code>submissions/docker/intermediate/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Putting db on frontend too — breaks the isolation.</li><li>Forgetting web needs BOTH networks.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>See the two-network example in `study/docker/intermediate/03-custom-networks.md`, section 3. Add a `tester` on `[frontend]` only.</details>\n<details><summary>Hint 2</summary>Test from tester: `docker compose exec tester getent hosts db` → should find nothing.</details>\n<details><summary>Hint 3</summary>tester fails because it shares no network with db, so it cannot resolve or reach it.</details>\n<h2>12. Final challenge</h2><p>Draw (in text) a small diagram of your two networks and which service is on which. Label which connection is allowed and which is blocked. This is how you plan Kubernetes NetworkPolicies later.</p><h2>13. What to submit (evidence)</h2><p>Save <code>compose.yaml</code>, the success + failure proofs, and your explanation in <code>submissions/docker/intermediate/project-03/</code>. Then say: <strong>\"I submit Docker Intermediate Project 3.\"</strong></p><hr><p><strong>Remember:</strong> Split networks to hide private parts. Connect only what must connect.</p></section>","docker/intermediate/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Persistent Storage Done Right</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Named volume</strong> — Docker-managed storage with a name (best for data).</li><li><strong>Bind mount</strong> — a folder from your computer shared into the container (best for code/config in dev).</li><li><strong>Ephemeral</strong> — temporary; gone when the container is removed.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A container's own files are <strong>ephemeral</strong> — they disappear when you remove it. For data that must live (databases, uploads), you use storage that lives <strong>outside</strong> the container.</p><p>Two kinds:</p><ol><li><strong>Named volume</strong> — Docker manages it. Best for real data (databases).</li><li><strong>Bind mount</strong> — you share a folder from your computer. Best for development (live code editing).</li></ol><h2>2. Key concepts and terms</h2><ul><li>Named volume in Compose:</li></ul><pre><code>  services:\n    db:\n      image: postgres:16\n      volumes: [dbdata:/var/lib/postgresql/data]\n  volumes:\n    dbdata:</code></pre><ul><li><code>docker compose down</code> keeps named volumes. <code>down -v</code> deletes them.</li><li>Back up a volume by copying its contents into a tar file with a helper container.</li></ul><h2>3. Practical examples</h2><pre><code># back up a named volume to a tar file\ndocker run --rm -v dbdata:/data -v \"$(pwd)\":/backup alpine \\\n  tar -czf /backup/dbdata-backup.tar.gz -C /data .\n\n# restore it into a (new) volume\ndocker run --rm -v dbdata:/data -v \"$(pwd)\":/backup alpine \\\n  sh -c \"cd /data &amp;&amp; tar -xzf /backup/dbdata-backup.tar.gz\"</code></pre><h2>4. Commands and config examples</h2><pre><code>docker volume ls\ndocker volume inspect dbdata\ndocker compose down        # keeps volumes (data safe)\ndocker compose up -d        # data still there\ndocker compose down -v      # DELETES volumes (data gone) — careful!</code></pre><h2>5. Hands-on exercises</h2><ol><li>Run a postgres with a named volume via Compose. Create a table/row (or just let it init).</li><li><code>docker compose down</code> (no <code>-v</code>). Then <code>up -d</code>. Prove the data is still there.</li><li>Back up the volume to a tar file using the helper container above.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> data gone after <code>down</code>.</li></ul><p>  <strong>Fix:</strong> you used <code>down -v</code>, or you did not use a named volume. Use a named volume and plain <code>down</code>.</p><ul><li><strong>Problem:</strong> bind mount empty in the container.</li></ul><p>  <strong>Fix:</strong> wrong host path. Use a full path.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using <code>down -v</code> by habit — it deletes data.</li><li>Storing DB data in the container instead of a volume.</li><li>No backups of volumes.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> Kubernetes uses PersistentVolumes (PV) and PersistentVolumeClaims (PVC). A named volume is the small version of this idea.</li><li>StatefulSets (later) rely on persistent storage — this lesson prepares you.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Named volume vs bind mount — when to use each?</li><li>What does <code>down -v</code> do?</li><li>How do you keep data across <code>down</code> and <code>up</code>?</li></ol><h2>10. References</h2><ul><li>Docker storage: <a href=\"https://docs.docker.com/storage/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/storage/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker volumes\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Named volume for data, bind mount for dev. Plain <code>down</code> keeps data; <code>down -v</code> deletes it.</p><details><summary>Answers</summary>\n<ol><li>Named volume for real data (like databases); bind mount for sharing code/config in development.</li><li>Stops containers AND deletes the named volumes (data lost).</li><li>Use a named volume and use plain <code>docker compose down</code> (no <code>-v</code>).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Make Data Survive and Back It Up</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Prove database data survives restarts using a named volume, and back up that volume to a file.</p><h2>2. Real-world scenario</h2><p>The team runs a database in Docker. They ask: *\"Prove our data is safe when we restart, and show me a backup we can restore.\"* Losing data is not allowed.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Use a named volume for a database.</li><li>Prove data survives <code>down</code> and <code>up</code>.</li><li>Back up and restore a volume.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Intermediate Project 3 completed.</li><li>Read: <code>study/docker/intermediate/04-persistent-storage.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Compose file with a <code>db</code> (postgres) using a named volume <code>dbdata</code>.</li><li>Start it. Create some data: connect and make a table + a row.</li></ol><p>   (Tip: <code>docker compose exec db psql -U postgres -c \"CREATE TABLE t(x int); INSERT INTO t VALUES(1);\"</code>)</p><ol><li><code>docker compose down</code> (NO <code>-v</code>). Then <code>up -d</code>.</li><li>Prove the data is still there (<code>SELECT * FROM t;</code>).</li><li>Back up the <code>dbdata</code> volume to a tar file using a helper container.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Named volume used.</li><li>☐ Data created.</li><li>☐ Data survives down + up.</li><li>☐ Volume backed up to a tar file.</li></ul><h2>7. Expected outcome</h2><p>Your database data survives a restart, and you have a backup file of the volume.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>compose.yaml</code> shows a named volume for the db.</li><li>You created data (show the CREATE/INSERT).</li><li>After <code>docker compose down</code> (no <code>-v</code>) and <code>up -d</code>, <code>SELECT * FROM t;</code> still returns the row.</li><li>You produced a backup file of the volume (show <code>ls -l</code> of the <code>.tar.gz</code>).</li><li>You explain in one sentence the difference between <code>down</code> and <code>down -v</code>.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Data survived restart.</li><li>☐ Backup file created.</li><li>☐ Evidence saved in <code>submissions/docker/intermediate/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Using <code>down -v</code> and losing the data.</li><li>Not using a named volume at all.</li><li>Wrong host path in the backup helper.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Make data: `docker compose exec db psql -U postgres -c \"CREATE TABLE t(x int); INSERT INTO t VALUES(1);\"`.</details>\n<details><summary>Hint 2</summary>Check after restart: `docker compose exec db psql -U postgres -c \"SELECT * FROM t;\"`.</details>\n<details><summary>Hint 3</summary>Backup command is in `study/docker/intermediate/04-persistent-storage.md`, section 3.</details>\n<h2>12. Final challenge</h2><p>Do a full restore test: <code>docker compose down -v</code> (deletes the volume), then restore your backup tar into a fresh <code>dbdata</code> volume, start the db, and show the row is back. This proves your backup really works.</p><h2>13. What to submit (evidence)</h2><p>Save <code>compose.yaml</code>, the data creation, the survive-restart proof, and the backup file listing in <code>submissions/docker/intermediate/project-04/</code>. Then say: <strong>\"I submit Docker Intermediate Project 4.\"</strong></p><hr><p><strong>Remember:</strong> Named volume = data lives. Plain <code>down</code> keeps it, <code>down -v</code> deletes it. Always test your restore.</p></section>","docker/intermediate/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Health Checks</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Health check</strong> — a test Docker runs to see if a container is really working.</li><li><strong>Healthy / unhealthy</strong> — the result of the health check.</li><li><strong><code>depends_on</code> with condition</strong> — wait for one service to be healthy before starting another.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A container can be \"running\" but not actually <strong>working</strong> (for example, the app is stuck). A <strong>health check</strong> is a small test Docker runs again and again. If the test passes, the container is <strong>healthy</strong>. If it fails, it is <strong>unhealthy</strong>.</p><p>This helps you and Docker know the truth, and lets one service <strong>wait</strong> for another to be ready.</p><h2>2. Key concepts and terms</h2><ul><li>In a Dockerfile: <code>HEALTHCHECK CMD &lt;test&gt;</code>.</li><li>In Compose: a <code>healthcheck:</code> block with <code>test</code>, <code>interval</code>, <code>timeout</code>, <code>retries</code>.</li><li><code>depends_on</code> with <code>condition: service_healthy</code> waits for health, not just start.</li></ul><h2>3. Practical examples</h2><p>Dockerfile health check:</p><pre><code>FROM nginx:1.27\nHEALTHCHECK --interval=10s --timeout=3s --retries=3 \\\n  CMD curl -f http://localhost/ || exit 1</code></pre><p>Compose health check + wait:</p><pre><code>services:\n  db:\n    image: postgres:16\n    environment: { POSTGRES_PASSWORD: secret }\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 5s\n      timeout: 3s\n      retries: 5\n  web:\n    image: nginx:1.27\n    depends_on:\n      db:\n        condition: service_healthy</code></pre><h2>4. Commands and config examples</h2><pre><code>docker ps                       # STATUS shows (healthy) or (unhealthy)\ndocker inspect --format '{{.State.Health.Status}}' &lt;container&gt;\ndocker compose up -d            # web waits until db is healthy</code></pre><h2>5. Hands-on exercises</h2><ol><li>Add a <code>healthcheck</code> to a postgres service in Compose.</li><li><code>docker compose up -d</code>. Watch <code>docker ps</code> until db shows <code>(healthy)</code>.</li><li>Make <code>web</code> wait for db with <code>condition: service_healthy</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> container stuck \"unhealthy\".</li></ul><p>  <strong>Fix:</strong> the test command is wrong, or the app is truly failing. Run the test by hand inside the container.</p><ul><li><strong>Problem:</strong> the health tool is missing (like <code>curl</code>).</li></ul><p>  <strong>Fix:</strong> use a tool that exists in the image, or install one, or use <code>CMD-SHELL</code> with a built-in.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using a tool not in the image (like <code>curl</code> in a slim image).</li><li>Interval too short — wastes resources. Use a sensible interval.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> Kubernetes has <strong>liveness</strong>, <strong>readiness</strong>, and <strong>startup</strong> probes — the same idea as health checks. This lesson is direct prep.</li><li>\"Running\" is not the same as \"ready\". Probes/health checks tell the difference.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why is \"running\" not the same as \"healthy\"?</li><li>What does <code>depends_on: condition: service_healthy</code> do?</li><li>Where does <code>docker ps</code> show health?</li></ol><h2>10. References</h2><ul><li>Dockerfile HEALTHCHECK: <a href=\"https://docs.docker.com/reference/dockerfile/#healthcheck\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/reference/dockerfile/#healthcheck</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker healthcheck\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Health checks prove a container really works. This is the Docker version of Kubernetes probes.</p><details><summary>Answers</summary>\n<ol><li>A container can run but be stuck or broken; the health check tests if it actually works.</li><li>It makes a service wait until another service is healthy before starting.</li><li>In the STATUS column (it shows <code>(healthy)</code> or <code>(unhealthy)</code>).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Add Health Checks and Startup Order</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Add a health check to a service and make another service wait until it is healthy.</p><h2>2. Real-world scenario</h2><p>The web app sometimes starts before the database is ready, and it crashes. The fix: make the web wait until the database is truly <strong>healthy</strong>, not just started.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Add a <code>healthcheck</code> to a Compose service.</li><li>Read health in <code>docker ps</code>.</li><li>Use <code>depends_on: condition: service_healthy</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Intermediate Project 4 completed.</li><li>Read: <code>study/docker/intermediate/05-health-checks.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Compose file with a <code>db</code> (postgres) that has a <code>healthcheck</code> using <code>pg_isready</code>.</li><li>A <code>web</code> service that uses <code>depends_on: db: condition: service_healthy</code>.</li><li>Start it. Watch <code>docker ps</code> until db shows <code>(healthy)</code>.</li><li>Show that <code>web</code> started only after db became healthy (check the timing / logs).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ db has a working healthcheck.</li><li>☐ <code>docker ps</code> shows db <code>(healthy)</code>.</li><li>☐ web waits for db health.</li><li>☐ You can show the health status via <code>docker inspect</code>.</li></ul><h2>7. Expected outcome</h2><p>The db reports healthy, and the web starts only after that. No more \"started too early\" crashes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>compose.yaml</code> shows a <code>healthcheck</code> on db (with <code>test</code>, <code>interval</code>, <code>retries</code>).</li><li><code>docker ps</code> output shows db STATUS as <code>(healthy)</code>.</li><li><code>web</code> uses <code>depends_on</code> with <code>condition: service_healthy</code> (show the file).</li><li><code>docker inspect --format '{{.State.Health.Status}}' &lt;db&gt;</code> returns <code>healthy</code>.</li><li>You explain in one sentence why \"running\" is not the same as \"healthy\".</li><li>Cleaned up with <code>docker compose down</code>.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Healthcheck works.</li><li>☐ web waits for health.</li><li>☐ Health status shown.</li><li>☐ Evidence saved in <code>submissions/docker/intermediate/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Using <code>curl</code> in a slim image that has no curl — use a tool that exists (postgres has <code>pg_isready</code>).</li><li>Forgetting the <code>condition:</code> — plain <code>depends_on</code> waits only for start, not health.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the exact healthcheck + depends_on example in `study/docker/intermediate/05-health-checks.md`, section 3.</details>\n<details><summary>Hint 2</summary>db healthcheck test: `[\"CMD-SHELL\", \"pg_isready -U postgres\"]`.</details>\n<details><summary>Hint 3</summary>Check status: `docker inspect --format '{{.State.Health.Status}}' $(docker compose ps -q db)`.</details>\n<h2>12. Final challenge</h2><p>Break the healthcheck on purpose (use a wrong test). Watch db become <code>(unhealthy)</code> and see that <code>web</code> never starts. Then fix it. This shows why the check matters.</p><h2>13. What to submit (evidence)</h2><p>Save <code>compose.yaml</code>, <code>docker ps</code> (healthy), the inspect output, and your explanation in <code>submissions/docker/intermediate/project-05/</code>. Then say: <strong>\"I submit Docker Intermediate Project 5.\"</strong></p><hr><p><strong>Remember:</strong> Health checks prove readiness. This is exactly what Kubernetes probes do.</p></section>","docker/intermediate/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Debugging Containers</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Debug</strong> — find out why something is broken.</li><li><strong>Exit code</strong> — the number a container returns when it stops. <code>0</code> = ok.</li><li><strong><code>docker inspect</code></strong> — show all details of a container.</li><li><strong><code>docker stats</code></strong> — live CPU/memory use of containers.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>When a container does not work, you need a method. The best order:</p><ol><li><strong><code>docker ps -a</code></strong> — is it running or exited? What exit code?</li><li><strong><code>docker logs</code></strong> — what did it say before it stopped?</li><li><strong><code>docker exec</code></strong> — go inside and look around (if it is running).</li><li><strong><code>docker inspect</code></strong> — check config, env, mounts, network.</li><li><strong><code>docker stats</code></strong> — is it out of CPU or memory?</li></ol><h2>2. Key concepts and terms</h2><ul><li><strong>Exit code 0</strong> = clean stop. <strong>Non-zero</strong> = error. <code>137</code> often means killed (out of memory or <code>kill -9</code>).</li><li><strong><code>docker logs --tail 50 NAME</code></strong> — last 50 log lines.</li><li><strong><code>docker inspect NAME</code></strong> — big JSON; use <code>--format</code> to pick fields.</li><li><strong><code>docker events</code></strong> — a live stream of what Docker is doing.</li><li><strong>Restart policy:</strong> <code>--restart on-failure</code> tries again if it crashes.</li></ul><h2>3. Practical examples</h2><pre><code>docker ps -a                                   # status + exit code\ndocker logs --tail 50 web                       # recent logs\ndocker inspect --format '{{.State.ExitCode}}' web\ndocker inspect --format '{{json .Config.Env}}' web\ndocker stats --no-stream                        # one snapshot of usage\ndocker exec -it web sh                          # look inside</code></pre><h2>4. Commands and config examples</h2><pre><code>docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' &lt;name&gt;\ndocker inspect --format '{{range .Mounts}}{{.Source}}-&gt;{{.Destination}} {{end}}' &lt;name&gt;\ndocker top &lt;name&gt;            # processes inside the container\ndocker diff &lt;name&gt;           # files changed since start</code></pre><h2>5. Hands-on exercises</h2><ol><li>Run a container that fails on purpose: <code>docker run --name boom alpine sh -c \"exit 1\"</code>. Check its exit code.</li><li>Read the logs of a running container with <code>--tail</code>.</li><li>Use <code>docker inspect --format</code> to print a container's env vars and mounts.</li><li>Use <code>docker stats --no-stream</code> to see resource use.</li></ol><h2>6. Troubleshooting (common cases)</h2><ul><li><strong>Exits at once, code non-zero</strong> → app crash; read <code>docker logs</code>.</li><li><strong>Code 137</strong> → killed, often out of memory; check <code>docker stats</code> and limits.</li><li><strong>Cannot connect</strong> → wrong port publish, or app listens on 127.0.0.1.</li><li><strong>File/config missing</strong> → check mounts with <code>docker inspect</code>.</li></ul><h2>7. Common mistakes and how to avoid them</h2><ul><li>Guessing instead of reading logs — always read <code>docker logs</code> first.</li><li>Ignoring the exit code — it tells you a lot.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> the same method works for Pods: <code>kubectl get pods</code> (status), <code>kubectl logs</code>, <code>kubectl describe</code>, <code>kubectl exec</code>. Learn the pattern here.</li><li>Reading exit codes and logs fast saves exam time.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does exit code 137 often mean?</li><li>Which command shows recent logs only?</li><li>How do you see a container's env vars?</li></ol><h2>10. References</h2><ul><li>Docker CLI docs: <a href=\"https://docs.docker.com/reference/cli/docker/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/reference/cli/docker/</a> (checked: 2026-09-18)</li><li>Video: <strong>That DevOps Guy</strong> — \"Debugging containers\" — <a href=\"https://www.youtube.com/@MarcelDempers\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@MarcelDempers</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> ps -a → logs → exec → inspect → stats. Read, do not guess. This method works for Kubernetes too.</p><details><summary>Answers</summary>\n<ol><li>The container was killed — often out of memory (or a <code>kill -9</code>).</li><li><code>docker logs --tail N NAME</code>.</li><li><code>docker inspect --format '{{json .Config.Env}}' NAME</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Debug Broken Containers</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Learn a clear method to debug containers: status, logs, inspect, exit codes, and resource use.</p><h2>2. Real-world scenario</h2><p>A container keeps crashing in production. The team asks: *\"Find out why.\"* You must use a method, not guesses, to find and explain the cause.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Read status and exit codes (<code>docker ps -a</code>).</li><li>Read logs (<code>docker logs</code>).</li><li>Inspect config, env, and mounts.</li><li>Check resource use (<code>docker stats</code>).</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Intermediate Project 5 completed.</li><li>Read: <code>study/docker/intermediate/06-debugging.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li><strong>Broken case A (bad command):</strong> run <code>docker run --name boom alpine sh -c \"echo starting; exit 3\"</code>. Find its exit code and explain it.</li><li><strong>Broken case B (wrong port):</strong> run nginx but publish the wrong container port (e.g. <code>-p 8080:8081</code>). Show <code>curl</code> fails, then find the mistake with <code>docker inspect</code>/<code>docker port</code>, and fix it.</li><li>Use <code>docker inspect --format</code> to print the env vars and mounts of a running container.</li><li>Use <code>docker stats --no-stream</code> to show resource use.</li><li>Write a short \"debug report\": for each broken case, what the tools showed and what the cause was.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Find the exit code of the failing container.</li><li>☐ Diagnose the wrong-port case and fix it.</li><li>☐ Print env + mounts with inspect.</li><li>☐ Show resource use with stats.</li><li>☐ Write a short debug report.</li></ul><h2>7. Expected outcome</h2><p>You found the cause of two broken containers using a clear method, and explained each in simple words.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show <code>docker ps -a</code> with the exited container and its <strong>exit code 3</strong>, and explain what caused it.</li><li>For the wrong-port case: you show the failing <code>curl</code>, then the fix (correct <code>-p</code>), then a working <code>curl</code>.</li><li><code>docker inspect --format</code> output shows env vars and mounts of a container.</li><li><code>docker stats --no-stream</code> output shown.</li><li>Your debug report explains the cause of each case in simple English.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Exit code found + explained.</li><li>☐ Port bug fixed.</li><li>☐ Inspect + stats shown.</li><li>☐ Report written.</li><li>☐ Evidence saved in <code>submissions/docker/intermediate/project-06/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Guessing instead of reading logs and exit codes.</li><li>Confusing host and container port order in <code>-p</code>.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Exit code: `docker inspect --format '{{.State.ExitCode}}' boom`.</details>\n<details><summary>Hint 2</summary>Port mapping check: `docker port <name>` shows what maps to what.</details>\n<details><summary>Hint 3</summary>Env + mounts: `docker inspect --format '{{json .Config.Env}}' <name>` and `docker inspect --format '{{json .Mounts}}' <name>`.</details>\n<h2>12. Final challenge</h2><p>Create a memory limit and force an out-of-memory kill: run a container with <code>--memory=20m</code> that tries to use more, and show it exits with code <code>137</code>. Explain what 137 means.</p><h2>13. What to submit (evidence)</h2><p>Save all commands, outputs, and your debug report in <code>submissions/docker/intermediate/project-06/</code>. Then say: <strong>\"I submit Docker Intermediate Project 6.\"</strong></p><hr><p><strong>Remember:</strong> ps -a → logs → inspect → stats. A method beats guessing. The same method works for Kubernetes Pods.</p></section>","docker/intermediate/project-07":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: A CI/CD-Style Image Workflow</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>CI/CD</strong> — Continuous Integration / Continuous Delivery. In simple words: an automatic pipeline that builds, tests, and ships your app.</li><li><strong>Registry</strong> — where images are stored and shared.</li><li><strong>Push / Pull</strong> — upload / download an image.</li><li><strong>Semantic version</strong> — a version like <code>1.2.3</code> (major.minor.patch).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>In real teams, images follow a flow:</p><ol><li><strong>Build</strong> the image from a Dockerfile.</li><li><strong>Tag</strong> it with a clear version (like <code>1.0.0</code>) — not just <code>latest</code>.</li><li><strong>Test</strong> it (run it, check it works).</li><li><strong>Push</strong> it to a registry so others (and Kubernetes) can pull it.</li></ol><p>This is the heart of CI/CD. You will do it by hand first, so you understand what the pipeline does.</p><h2>2. Key concepts and terms</h2><ul><li>Tag format: <code>registry/name:version</code>, e.g. <code>docker.io/youruser/helloapp:1.0.0</code>.</li><li><strong>Local registry</strong> for practice: <code>docker run -d -p 5000:5000 --name registry registry:2</code>. Then push to <code>localhost:5000/helloapp:1.0.0</code>.</li><li><code>docker login</code> (for Docker Hub) before pushing to a real registry.</li><li>Keep a <code>.dockerignore</code> so images stay small.</li></ul><h2>3. Practical examples</h2><pre><code># build with a version tag\ndocker build -t localhost:5000/helloapp:1.0.0 .\n# run + test\ndocker run -d -p 8000:8000 --name test localhost:5000/helloapp:1.0.0\ncurl -f http://localhost:8000\n# push to a local registry\ndocker run -d -p 5000:5000 --name registry registry:2   # start a local registry\ndocker push localhost:5000/helloapp:1.0.0\n# pull it back to prove it is stored\ndocker pull localhost:5000/helloapp:1.0.0</code></pre><h2>4. Commands and config examples</h2><pre><code>docker tag helloapp:1.0.0 localhost:5000/helloapp:1.0.0\ndocker push localhost:5000/helloapp:1.0.0\ndocker image inspect localhost:5000/helloapp:1.0.0 --format '{{.Size}}'\n# a simple build+test+push script (the \"pipeline\" by hand)</code></pre><pre><code>#!/bin/bash\nset -euo pipefail\nIMAGE=\"localhost:5000/helloapp\"\nVERSION=\"1.0.0\"\ndocker build -t \"$IMAGE:$VERSION\" .\ndocker run --rm -d -p 8000:8000 --name test \"$IMAGE:$VERSION\"\nsleep 2\ncurl -f http://localhost:8000 &amp;&amp; echo \"TEST PASSED\"\ndocker stop test\ndocker push \"$IMAGE:$VERSION\"\necho \"Shipped $IMAGE:$VERSION\"</code></pre><h2>5. Hands-on exercises</h2><ol><li>Start a local registry (<code>registry:2</code>) on port 5000.</li><li>Build your <code>helloapp</code> with a version tag pointing at <code>localhost:5000</code>.</li><li>Test it, then push it. Then pull it back.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>push</code> refused / http error.</li></ul><p>  <strong>Fix:</strong> for a local registry use <code>localhost:5000/...</code>. For Docker Hub, <code>docker login</code> first.</p><ul><li><strong>Problem:</strong> image too big.</li></ul><p>  <strong>Fix:</strong> use a slim base and a <code>.dockerignore</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Shipping <code>latest</code> — always tag a real version.</li><li>Pushing without testing — always run + test before push.</li><li>No <code>.dockerignore</code> — bloated images.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> you deploy images by name:tag in Pod specs. Clear versioning matters.</li><li><strong>CKS:</strong> trusted registries and scanned images are part of supply-chain security (you will go deeper in the CKS track).</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why tag a version instead of <code>latest</code>?</li><li>What are the 4 steps of the image flow?</li><li>What is a registry?</li></ol><h2>10. References</h2><ul><li>Docker registry: <a href=\"https://docs.docker.com/registry/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/registry/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker registry / CI\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Build → tag a version → test → push. This is CI/CD by hand. Never ship untested <code>latest</code>.</p><details><summary>Answers</summary>\n<ol><li>So you know exactly which version runs, and can roll back; <code>latest</code> can change.</li><li>Build, tag (version), test, push.</li><li>A store where images are saved and shared (and pulled by Kubernetes).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build a Build-Test-Push Pipeline (Level Boss 🏆)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>last project</strong> of Docker Intermediate. Finish it to unlock Docker Advanced.</p><h2>1. Objective</h2><p>Write a small script that builds your image with a version tag, tests it, and pushes it to a registry — a CI/CD pipeline by hand.</p><h2>2. Real-world scenario</h2><p>Your team wants a repeatable way to ship images: build, test, and push with a clear version. You automate it in one script, the way a CI pipeline does.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Version tags (<code>1.0.0</code>, not <code>latest</code>).</li><li>Run a local registry.</li><li>A build → test → push script.</li><li>Keep images small with <code>.dockerignore</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Intermediate Project 6 completed.</li><li>Read: <code>study/docker/intermediate/07-cicd-workflow.md</code>.</li><li>Use your <code>helloapp</code> from Docker Beginner Project 6.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Start a local registry: <code>docker run -d -p 5000:5000 --name registry registry:2</code>.</li><li>Write <code>pipeline.sh</code> (with <code>set -euo pipefail</code>) that:</li></ol><ul><li>builds <code>localhost:5000/helloapp:1.0.0</code>,</li><li>runs it and tests it with <code>curl -f</code> (fail the script if the test fails),</li><li>stops the test container,</li><li>pushes the image to the local registry,</li><li>prints a clear \"Shipped ...\" message.</li></ul><ol><li>Run the script. Then prove the image is in the registry by pulling it back.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Local registry running.</li><li>☐ <code>pipeline.sh</code> builds with a version tag.</li><li>☐ Test step fails the script if the app is broken.</li><li>☐ Push succeeds.</li><li>☐ Pull-back proves it is stored.</li></ul><h2>7. Expected outcome</h2><p><code>./pipeline.sh</code> builds, tests, and pushes your image with a version tag. You can pull it back from the registry.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste <code>pipeline.sh</code> (it uses <code>set -euo pipefail</code>).</li><li>The image is tagged <code>localhost:5000/helloapp:1.0.0</code> (a real version, not <code>latest</code>).</li><li>The script's test uses <code>curl -f</code> so a broken app <strong>fails</strong> the pipeline (explain how).</li><li><code>docker push</code> output shows a successful push.</li><li><code>docker pull localhost:5000/helloapp:1.0.0</code> (after removing the local copy) succeeds — proving it is stored.</li><li>A <code>.dockerignore</code> is present.</li><li>All commands and script output shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Versioned tag.</li><li>☐ Test gates the push.</li><li>☐ Push + pull-back work.</li><li>☐ Evidence saved in <code>submissions/docker/intermediate/project-07/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Tagging <code>latest</code> — use <code>1.0.0</code>.</li><li>Test does not actually fail the script — use <code>curl -f</code> and <code>set -e</code>.</li><li>Forgetting to start the local registry.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Start the registry: `docker run -d -p 5000:5000 --name registry registry:2`.</details>\n<details><summary>Hint 2</summary>Use the pipeline script in `study/docker/intermediate/07-cicd-workflow.md`, section 4. Adjust the app/port to your `helloapp`.</details>\n<details><summary>Hint 3</summary>Prove storage: `docker rmi localhost:5000/helloapp:1.0.0` then `docker pull localhost:5000/helloapp:1.0.0`.</details>\n<h2>12. Final challenge</h2><p>Add a second tag automatically: also tag and push <code>:latest</code> <strong>and</strong> <code>:1.0.0</code> from the same build, and add a git-style short version (like <code>1.0.0-$(date +%Y%m%d)</code>). Real pipelines often push several tags.</p><h2>13. What to submit (evidence)</h2><p>Save <code>pipeline.sh</code>, <code>.dockerignore</code>, the full run output, and the pull-back proof in <code>submissions/docker/intermediate/project-07/</code>. Then say: <strong>\"I submit Docker Intermediate Project 7.\"</strong> When it passes, Docker Advanced unlocks! 🎉</p><hr><p><strong>Remember:</strong> Build → test → push, with a real version tag. You just built a CI/CD pipeline by hand.</p></section>","docker/advanced/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Multi-Stage Builds and Small Images</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Multi-stage build</strong> — a Dockerfile with more than one <code>FROM</code>. You build in one stage, then copy only the result into a small final stage.</li><li><strong>Build tools</strong> — things needed to build, but not to run (compilers, dev packages).</li><li><strong>Layer caching</strong> — reusing unchanged layers to build faster.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Big images are slow and less safe. You want the final image to hold <strong>only what the app needs to run</strong> — not the build tools.</p><p>A <strong>multi-stage build</strong> solves this:</p><ol><li><strong>Stage 1 (builder):</strong> install build tools, build the app.</li><li><strong>Stage 2 (final):</strong> start from a small base, copy only the built result. Throw away the build tools.</li></ol><p>The final image is small, fast to pull, and has fewer things that could be attacked.</p><h2>2. Key concepts and terms</h2><ul><li>Name a stage: <code>FROM node:20 AS builder</code>.</li><li>Copy from a stage: <code>COPY --from=builder /app/dist ./dist</code>.</li><li>Small bases: <code>-slim</code>, <code>alpine</code>, or <code>distroless</code> (very small, no shell).</li><li>Order layers so slow steps (installing deps) are cached.</li></ul><h2>3. Practical examples</h2><pre><code># Stage 1: build\nFROM node:20 AS builder\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build          # makes /app/dist\n\n# Stage 2: small final image\nFROM nginx:1.27-alpine\nCOPY --from=builder /app/dist /usr/share/nginx/html</code></pre><h2>4. Commands and config examples</h2><pre><code>docker build -t myweb:1.0.0 .\ndocker image ls myweb                # compare size to a single-stage build\ndocker history myweb:1.0.0           # see the layers\ndocker build --target builder -t myweb:build .   # build only stage 1 (for debugging)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write a multi-stage Dockerfile (builder + small final).</li><li>Build it. Note the final size.</li><li>Write a single-stage version too. Compare the sizes.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>COPY --from</code> path not found.</li></ul><p>  <strong>Fix:</strong> the path must exist in the builder stage. Check where your build output lands.</p><ul><li><strong>Problem:</strong> app missing a runtime file.</li></ul><p>  <strong>Fix:</strong> copy all needed runtime files into the final stage, not just some.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Shipping build tools in the final image — use multi-stage.</li><li>Copying the whole builder — copy only the result.</li><li>Big base image — use slim/alpine/distroless.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKS:</strong> small images reduce attack surface (fewer tools for an attacker). Multi-stage + distroless is a known best practice.</li><li>Smaller images pull faster in Kubernetes too.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why use a multi-stage build?</li><li>How do you copy a file from a previous stage?</li><li>Why is a smaller image safer?</li></ol><h2>10. References</h2><ul><li>Multi-stage builds: <a href=\"https://docs.docker.com/build/building/multi-stage/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/build/building/multi-stage/</a> (checked: 2026-09-18)</li><li>Distroless images: <a href=\"https://github.com/GoogleContainerTools/distroless\" target=\"_blank\" rel=\"noopener\">https://github.com/GoogleContainerTools/distroless</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Build in one stage, ship a small final stage. Copy only the result. Small = fast + safe.</p><details><summary>Answers</summary>\n<ol><li>To keep build tools out of the final image, making it small and safe.</li><li><code>COPY --from=&lt;stage&gt; &lt;src&gt; &lt;dest&gt;</code>.</li><li>Fewer tools/files means fewer things an attacker can use.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Shrink an Image with a Multi-Stage Build</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Build the same app two ways — single-stage and multi-stage — and prove the multi-stage image is much smaller.</p><h2>2. Real-world scenario</h2><p>Your images are huge and slow to pull. The team asks you to make them small and safe. Multi-stage builds are the answer.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Write a multi-stage Dockerfile.</li><li>Copy only the build result into a small final image.</li><li>Compare image sizes.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Intermediate completed.</li><li>Read: <code>study/docker/advanced/01-multi-stage-builds.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Make a small app that needs a \"build\" step. Easiest option: a static site where the \"build\" just copies HTML, OR a tiny compiled program. (If unsure, use a small static site built by a Node stage, as in the study doc.)</li><li>Write <code>Dockerfile.single</code> — a single-stage version (includes build tools).</li><li>Write <code>Dockerfile</code> — a multi-stage version (builder + small final).</li><li>Build both. Record both image sizes.</li><li>Run the multi-stage image and prove the app works.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Single-stage image built.</li><li>☐ Multi-stage image built.</li><li>☐ Multi-stage image is clearly smaller.</li><li>☐ Multi-stage app runs and works.</li></ul><h2>7. Expected outcome</h2><p>Two images for the same app. The multi-stage one is much smaller and still works.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste both Dockerfiles (<code>Dockerfile.single</code> and the multi-stage <code>Dockerfile</code>).</li><li><code>docker image ls</code> shows both images with their sizes, and the multi-stage one is <strong>smaller</strong> (say by how much).</li><li>The multi-stage <code>Dockerfile</code> uses a named builder stage and <code>COPY --from=...</code>.</li><li>The multi-stage image runs and the app responds (show <code>curl</code> or a browser check).</li><li>You explain in one sentence why the multi-stage image is smaller.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Both images built.</li><li>☐ Size difference shown.</li><li>☐ Multi-stage app works.</li><li>☐ Evidence saved in <code>submissions/docker/advanced/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Copying the whole builder into the final image.</li><li><code>COPY --from</code> path wrong.</li><li>Using a big final base — pick slim/alpine.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the multi-stage example in `study/docker/advanced/01-multi-stage-builds.md`, section 3.</details>\n<details><summary>Hint 2</summary>Build with a name: `docker build -f Dockerfile.single -t app:single .` and `docker build -t app:multi .`.</details>\n<details><summary>Hint 3</summary>Compare: `docker image ls | grep app`. The multi image is smaller because it does not carry build tools.</details>\n<h2>12. Final challenge</h2><p>Try a <strong>distroless</strong> or <code>alpine</code> final base and compare again. How small can you get it while the app still runs?</p><h2>13. What to submit (evidence)</h2><p>Save both Dockerfiles, the <code>image ls</code> size comparison, and the working app proof in <code>submissions/docker/advanced/project-01/</code>. Then say: <strong>\"I submit Docker Advanced Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Build in one stage, ship a small final stage. Small images pull faster and are safer.</p></section>","docker/advanced/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Run as a Non-Root User</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>root</strong> — the super user (all powers). Default user inside many containers.</li><li><strong>Non-root user</strong> — a normal, limited user. Much safer.</li><li><strong>UID</strong> — user ID number. <code>root</code> is UID 0.</li><li><strong>Least privilege</strong> — give the smallest powers needed.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>By default, many containers run as <strong>root</strong> inside. If an attacker breaks in, they have full powers. That is dangerous.</p><p>The fix: run the app as a <strong>non-root user</strong>. If someone breaks in, they have fewer powers. This is a simple, strong safety win.</p><h2>2. Key concepts and terms</h2><ul><li>In a Dockerfile: create a user and switch to it:</li></ul><pre><code>  RUN adduser --disabled-password --uid 10001 appuser\n  USER appuser</code></pre><ul><li>At run time: <code>docker run --user 10001 ...</code>.</li><li>Check who you are inside: <code>docker exec &lt;c&gt; id</code> (should not be uid=0).</li><li>The app must be able to write only where it needs (own its files).</li></ul><h2>3. Practical examples</h2><pre><code>FROM python:3.12-slim\nRUN adduser --disabled-password --uid 10001 appuser\nWORKDIR /app\nCOPY app.py .\nUSER appuser            # switch to non-root\nEXPOSE 8000\nCMD [\"python\", \"app.py\"]</code></pre><pre><code>docker build -t safeapp:1.0.0 .\ndocker run -d -p 8000:8000 --name safe safeapp:1.0.0\ndocker exec safe id     # uid should NOT be 0</code></pre><h2>4. Commands and config examples</h2><pre><code>docker run --user 10001:10001 safeapp:1.0.0   # force a non-root uid\ndocker exec &lt;name&gt; whoami\ndocker exec &lt;name&gt; id</code></pre><h2>5. Hands-on exercises</h2><ol><li>Add a non-root user to a Dockerfile and switch with <code>USER</code>.</li><li>Build and run. Check <code>id</code> inside — it must not be uid 0.</li><li>Try to write to a folder the user does not own — see it fail (that is the point).</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> app cannot write files.</li></ul><p>  <strong>Fix:</strong> make sure the app writes to a folder the non-root user owns (<code>chown</code> it in the build, or use a volume with the right permissions).</p><ul><li><strong>Problem:</strong> port under 1024 fails as non-root.</li></ul><p>  <strong>Fix:</strong> use a high port (like 8000) inside the container.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Leaving the app as root — always add and switch to a non-root user.</li><li>Ports below 1024 as non-root — use high ports.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKS:</strong> Pods should run as non-root. Kubernetes has <code>securityContext.runAsNonRoot: true</code> and <code>runAsUser</code>. This lesson is direct prep.</li><li>Many exam points come from \"do not run as root\".</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why is running as root inside a container risky?</li><li>How do you switch users in a Dockerfile?</li><li>What UID is root?</li></ol><h2>10. References</h2><ul><li>Dockerfile USER: <a href=\"https://docs.docker.com/reference/dockerfile/#user\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/reference/dockerfile/#user</a> (checked: 2026-09-18)</li><li>Video: <strong>That DevOps Guy</strong> — \"Container security basics\" — <a href=\"https://www.youtube.com/@MarcelDempers\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@MarcelDempers</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Do not run as root. Add a non-root user and <code>USER</code> it. Less power = less risk.</p><details><summary>Answers</summary>\n<ol><li>If an attacker breaks in, they get full (root) powers inside the container.</li><li><code>USER &lt;name-or-uid&gt;</code> (after creating the user).</li><li>UID 0.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Run Your App as a Non-Root User</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Change your image so the app runs as a non-root user, and prove it.</p><h2>2. Real-world scenario</h2><p>Security says: *\"No container may run as root.\"* You must update the image so the app runs as a limited user. This reduces damage if the app is ever hacked.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a user in a Dockerfile.</li><li>Switch to it with <code>USER</code>.</li><li>Prove the app is non-root.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Advanced Project 1 completed.</li><li>Read: <code>study/docker/advanced/02-run-as-nonroot.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Take your <code>helloapp</code> (or any small app).</li><li>Update the Dockerfile: create a non-root user (uid 10001) and add <code>USER appuser</code> before <code>CMD</code>.</li><li>Make sure the app listens on a high port (like 8000).</li><li>Build and run.</li><li>Prove the app is non-root: <code>docker exec &lt;name&gt; id</code> (uid must not be 0).</li><li>Prove the app still works (<code>curl</code>).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Non-root user created in the Dockerfile.</li><li>☐ <code>USER</code> switches before <code>CMD</code>.</li><li>☐ <code>id</code> inside shows a non-zero uid.</li><li>☐ App still works.</li></ul><h2>7. Expected outcome</h2><p>Your app runs as a limited user, not root, and still serves requests.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the Dockerfile showing the user creation and <code>USER</code> line.</li><li><code>docker exec &lt;name&gt; id</code> shows <code>uid=10001</code> (or your chosen non-zero uid), <strong>not</strong> uid=0.</li><li><code>curl</code> (or browser) shows the app still responds.</li><li>You explain in one sentence why non-root is safer.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ App runs as non-root.</li><li>☐ App still works.</li><li>☐ Evidence saved in <code>submissions/docker/advanced/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Putting <code>USER</code> after <code>CMD</code> (it must be before).</li><li>App writing to a folder the user does not own.</li><li>Using a low port (&lt;1024) as non-root.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the Dockerfile in `study/docker/advanced/02-run-as-nonroot.md`, section 3.</details>\n<details><summary>Hint 2</summary>Check: `docker exec <name> id` and `docker exec <name> whoami`.</details>\n<details><summary>Hint 3</summary>If the app fails to write, `chown` its work folder to the new user in the build, or write to a mounted volume with correct permissions.</details>\n<h2>12. Final challenge</h2><p>Also run it with <code>docker run --user 10001:10001 ...</code> at run time (not just in the Dockerfile). Show both ways force non-root. This matches how Kubernetes <code>securityContext</code> overrides the user.</p><h2>13. What to submit (evidence)</h2><p>Save the Dockerfile, the <code>id</code> proof, and the working app in <code>submissions/docker/advanced/project-02/</code>. Then say: <strong>\"I submit Docker Advanced Project 2.\"</strong></p><hr><p><strong>Remember:</strong> No root inside. Add a user, <code>USER</code> it, use a high port. This is a CKS must-know.</p></section>","docker/advanced/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Harden Containers at Runtime</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Capabilities</strong> — small pieces of root power. You can drop the ones you do not need.</li><li><strong>Read-only filesystem</strong> — the container cannot change its own files.</li><li><strong>no-new-privileges</strong> — the process cannot gain more power later.</li><li><strong>Attack surface</strong> — all the ways an attacker could get in. Smaller is better.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Even a non-root container can be made safer. You remove powers it does not need:</p><ol><li><strong>Drop capabilities</strong> — take away root powers the app never uses.</li><li><strong>Read-only filesystem</strong> — stop the app (or an attacker) from changing files.</li><li><strong>no-new-privileges</strong> — stop the process from gaining more power.</li><li><strong>Limit resources</strong> — stop one container from using everything.</li></ol><p>Each step makes the container harder to attack.</p><h2>2. Key concepts and terms</h2><ul><li><code>--cap-drop ALL</code> then add back only what you need with <code>--cap-add</code>.</li><li><code>--read-only</code> makes the root filesystem read-only; add <code>--tmpfs /tmp</code> for temp space.</li><li><code>--security-opt no-new-privileges:true</code>.</li><li><code>--memory</code> and <code>--cpus</code> limit resources.</li></ul><h2>3. Practical examples</h2><pre><code>docker run -d --name hard \\\n  --user 10001 \\\n  --cap-drop ALL \\\n  --read-only --tmpfs /tmp \\\n  --security-opt no-new-privileges:true \\\n  --memory 128m --cpus 0.5 \\\n  safeapp:1.0.0</code></pre><h2>4. Commands and config examples</h2><pre><code># in compose.yaml\nservices:\n  app:\n    image: safeapp:1.0.0\n    user: \"10001\"\n    read_only: true\n    tmpfs: [/tmp]\n    cap_drop: [ALL]\n    security_opt: [\"no-new-privileges:true\"]\n    mem_limit: 128m\n    cpus: 0.5</code></pre><h2>5. Hands-on exercises</h2><ol><li>Run your safe app with <code>--cap-drop ALL</code> and <code>--read-only --tmpfs /tmp</code>.</li><li>Try to write to a read-only path inside — see it fail (good).</li><li>Add <code>--memory 128m</code> and check <code>docker stats</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> app crashes with read-only.</li></ul><p>  <strong>Fix:</strong> the app needs to write somewhere. Give it a <code>--tmpfs</code> or a writable volume for that path only.</p><ul><li><strong>Problem:</strong> app needs a capability you dropped.</li></ul><p>  <strong>Fix:</strong> add back only that one with <code>--cap-add</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Dropping a needed capability and not adding it back.</li><li>Read-only without a writable temp path.</li><li>No resource limits — one container can starve others.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKS:</strong> Kubernetes <code>securityContext</code> does all of this: <code>capabilities.drop</code>, <code>readOnlyRootFilesystem</code>, <code>allowPrivilegeEscalation: false</code>, resource limits. This lesson maps directly.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does <code>--cap-drop ALL</code> do?</li><li>Why add a <code>--tmpfs</code> when using <code>--read-only</code>?</li><li>What does no-new-privileges prevent?</li></ol><h2>10. References</h2><ul><li>Docker security: <a href=\"https://docs.docker.com/engine/security/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/engine/security/</a> (checked: 2026-09-18)</li><li>CKS security context (K8s): <a href=\"https://kubernetes.io/docs/tasks/configure-pod-container/security-context/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/configure-pod-container/security-context/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Drop powers, read-only files, no new privileges, limit resources. Smaller attack surface = safer.</p><details><summary>Answers</summary>\n<ol><li>Removes all Linux capabilities (extra root powers) from the container.</li><li>Because the app still needs somewhere to write temporary files.</li><li>It stops the process from gaining more privileges than it started with.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Harden a Container (Drop Powers, Read-Only)</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Run your app with a hardened setup: dropped capabilities, read-only filesystem, no-new-privileges, and resource limits.</p><h2>2. Real-world scenario</h2><p>Security wants your container locked down: it should have only the powers it needs and nothing more. You apply hardening flags and prove they work.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Drop capabilities.</li><li>Make the filesystem read-only (with a temp space).</li><li>Set no-new-privileges.</li><li>Add memory and CPU limits.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Advanced Project 2 completed (non-root app).</li><li>Read: <code>study/docker/advanced/03-container-hardening.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Run your non-root <code>safeapp</code> with ALL of these:</li></ol><ul><li><code>--cap-drop ALL</code></li><li><code>--read-only --tmpfs /tmp</code></li><li><code>--security-opt no-new-privileges:true</code></li><li><code>--memory 128m --cpus 0.5</code></li></ul><ol><li>Prove the app still works (<code>curl</code>).</li><li>Prove the filesystem is read-only: try to create a file in a read-only path and show it fails.</li><li>Show the limits with <code>docker stats --no-stream</code>.</li><li>Write the same setup as a <code>compose.yaml</code> block.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ App runs with all hardening flags.</li><li>☐ App still works.</li><li>☐ Read-only proven (a write fails).</li><li>☐ Limits shown.</li><li>☐ Compose version written.</li></ul><h2>7. Expected outcome</h2><p>Your container runs with the smallest powers and still works. You can prove the hardening is active.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show the full <code>docker run</code> command with all four hardening options.</li><li><code>curl</code> shows the app still responds.</li><li>You show a write attempt to a read-only path failing (e.g. <code>docker exec &lt;name&gt; sh -c 'touch /app/x'</code> → error).</li><li><code>docker stats --no-stream</code> shows the memory limit (128m).</li><li>You paste an equal <code>compose.yaml</code> block (read_only, cap_drop, security_opt, limits).</li><li>You explain in one sentence why dropping capabilities helps security.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ All hardening flags used.</li><li>☐ Read-only proven.</li><li>☐ Limits shown.</li><li>☐ Compose version written.</li><li>☐ Evidence saved in <code>submissions/docker/advanced/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Read-only with no <code>--tmpfs</code> → app crashes when it writes temp files.</li><li>Dropping a needed capability without adding it back.</li><li>Forgetting the resource limits.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the full `docker run` command in `study/docker/advanced/03-container-hardening.md`, section 3.</details>\n<details><summary>Hint 2</summary>Prove read-only: `docker exec <name> sh -c 'echo hi > /app/test'` should fail with \"Read-only file system\".</details>\n<details><summary>Hint 3</summary>The compose block is in the study doc, section 4.</details>\n<h2>12. Final challenge</h2><p>Map each flag you used to its Kubernetes <code>securityContext</code> field (for example: <code>--cap-drop ALL</code> → <code>capabilities.drop: [ALL]</code>). Write the mapping. You will use these exact fields in the CKS track.</p><h2>13. What to submit (evidence)</h2><p>Save the run command, the working app, the read-only failure, stats, and the compose block in <code>submissions/docker/advanced/project-03/</code>. Then say: <strong>\"I submit Docker Advanced Project 3.\"</strong></p><hr><p><strong>Remember:</strong> Drop powers, read-only files, no new privileges, limit resources. This is the Docker version of a K8s securityContext.</p></section>","docker/advanced/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Reverse Proxy in Front of Your App</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Reverse proxy</strong> — a server in front that takes requests and sends them to the right app behind it.</li><li><strong>Upstream</strong> — the app behind the proxy.</li><li><strong>Route</strong> — a rule that says \"this path goes to this app\".</li><li><strong>TLS/HTTPS</strong> — secure, encrypted web traffic.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>In production, users do not hit your app directly. They hit a <strong>reverse proxy</strong> first. The proxy:</p><ul><li>sends each request to the right app (routing),</li><li>can serve many apps behind one door,</li><li>can add HTTPS (encryption),</li><li>can balance load across copies.</li></ul><p>Common proxies: <strong>nginx</strong> and <strong>Traefik</strong>.</p><h2>2. Key concepts and terms</h2><ul><li>The proxy is the only container that publishes a port (like 80/443).</li><li>Apps behind it do <strong>not</strong> publish ports; the proxy reaches them by name on a shared network.</li><li>A path like <code>/api</code> can route to the <code>api</code> service, and <code>/</code> to the <code>web</code> service.</li></ul><h2>3. Practical examples</h2><p>nginx as a reverse proxy (compose):</p><pre><code>services:\n  proxy:\n    image: nginx:1.27\n    ports: [\"8080:80\"]\n    volumes: [\"./nginx.conf:/etc/nginx/conf.d/default.conf:ro\"]\n    depends_on: [web]\n  web:\n    image: nginx:1.27   # pretend this is your app</code></pre><p><code>nginx.conf</code>:</p><pre><code>server {\n  listen 80;\n  location / {\n    proxy_pass http://web:80;   # send to the \"web\" service by name\n  }\n}</code></pre><h2>4. Commands and config examples</h2><pre><code>docker compose up -d\ncurl -I http://localhost:8080     # hits the proxy, which forwards to web</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write a compose with a <code>proxy</code> (nginx) and a <code>web</code> app behind it.</li><li>Only the proxy publishes a port.</li><li><code>curl</code> the proxy and confirm you reach the app behind it.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> 502 Bad Gateway.</li></ul><p>  <strong>Fix:</strong> the proxy cannot reach the app. Check the service name in <code>proxy_pass</code> and that both are on the same network.</p><ul><li><strong>Problem:</strong> config not applied.</li></ul><p>  <strong>Fix:</strong> mount the conf file to the right path and reload/restart the proxy.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Publishing app ports too — only the proxy needs a public port.</li><li>Wrong upstream name in <code>proxy_pass</code>.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> Kubernetes <strong>Ingress</strong> is the cluster version of a reverse proxy. It routes outside traffic to Services. This lesson prepares you for Ingress.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a reverse proxy?</li><li>Which container publishes a port when using a proxy?</li><li>What Kubernetes object is like a reverse proxy?</li></ol><h2>10. References</h2><ul><li>nginx as proxy: <a href=\"https://docs.nginx.com/nginx/admin-guide/web-server/reverse-proxy/\" target=\"_blank\" rel=\"noopener\">https://docs.nginx.com/nginx/admin-guide/web-server/reverse-proxy/</a> (checked: 2026-09-18)</li><li>Traefik: <a href=\"https://doc.traefik.io/traefik/\" target=\"_blank\" rel=\"noopener\">https://doc.traefik.io/traefik/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> The proxy is the front door. Apps sit behind it, reached by name. This is like Kubernetes Ingress.</p><details><summary>Answers</summary>\n<ol><li>A server in front that forwards requests to the right app behind it.</li><li>Only the proxy.</li><li>Ingress.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Put a Reverse Proxy in Front</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Run a reverse proxy that forwards requests to your app behind it. Only the proxy is public.</p><h2>2. Real-world scenario</h2><p>You have two apps and want one public door. A reverse proxy sends <code>/</code> to the website and <code>/api</code> to the API. Users see one address; the proxy routes behind the scenes.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Configure nginx as a reverse proxy.</li><li>Route paths to different services.</li><li>Keep apps private behind the proxy.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Advanced Project 3 completed.</li><li>Read: <code>study/docker/advanced/04-reverse-proxy.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Compose with 3 services: <code>proxy</code> (nginx, the only public one on 8080), <code>web</code> (a page), and <code>api</code> (return some text/JSON — you can reuse <code>helloapp</code>).</li><li>Write an <code>nginx.conf</code> that routes <code>/</code> → <code>web</code> and <code>/api</code> → <code>api</code>.</li><li>Start it. <code>curl http://localhost:8080/</code> → the web page; <code>curl http://localhost:8080/api</code> → the api response.</li><li>Show that <code>web</code> and <code>api</code> do NOT publish ports themselves.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Only <code>proxy</code> publishes a port.</li><li>☐ <code>/</code> routes to <code>web</code>.</li><li>☐ <code>/api</code> routes to <code>api</code>.</li><li>☐ Both work through the single door.</li></ul><h2>7. Expected outcome</h2><p>One public address serves two apps by path. The apps stay private behind the proxy.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste <code>compose.yaml</code> and <code>nginx.conf</code>.</li><li>Only <code>proxy</code> has a <code>ports:</code> entry (web and api do not).</li><li><code>curl http://localhost:8080/</code> returns the web content.</li><li><code>curl http://localhost:8080/api</code> returns the api content.</li><li>You explain in one sentence how this is like Kubernetes Ingress.</li><li>Cleaned up with <code>docker compose down</code>.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Single public door.</li><li>☐ Two paths route correctly.</li><li>☐ Apps private.</li><li>☐ Evidence saved in <code>submissions/docker/advanced/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Publishing app ports too — only the proxy should.</li><li>Wrong service name in <code>proxy_pass</code>.</li><li>502 errors → proxy cannot reach the upstream (check network + names).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the proxy example in `study/docker/advanced/04-reverse-proxy.md`, section 3. Add a second `location /api { proxy_pass http://api:8000/; }`.</details>\n<details><summary>Hint 2</summary>Mount the conf: `./nginx.conf:/etc/nginx/conf.d/default.conf:ro`.</details>\n<details><summary>Hint 3</summary>Test both paths with `curl -i http://localhost:8080/` and `curl -i http://localhost:8080/api`.</details>\n<h2>12. Final challenge</h2><p>Run <strong>two copies</strong> of <code>api</code> and let the proxy balance between them (nginx <code>upstream</code> block with two servers). Refresh a few times and show requests hitting different copies (add a copy id to the response). This previews load balancing, which Kubernetes Services do automatically.</p><h2>13. What to submit (evidence)</h2><p>Save <code>compose.yaml</code>, <code>nginx.conf</code>, and both <code>curl</code> results in <code>submissions/docker/advanced/project-04/</code>. Then say: <strong>\"I submit Docker Advanced Project 4.\"</strong></p><hr><p><strong>Remember:</strong> The proxy is the front door; apps hide behind it. This is exactly what Kubernetes Ingress does.</p></section>","docker/advanced/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Observability (Logs, Health, Metrics)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Observability</strong> — being able to see what your system is doing. In simple words: knowing what is happening inside.</li><li><strong>Logs</strong> — messages the app writes.</li><li><strong>Metrics</strong> — numbers about health (CPU, memory, requests).</li><li><strong>Logging driver</strong> — how Docker sends logs somewhere.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>In production, you must <strong>see</strong> what is happening. Three pillars:</p><ol><li><strong>Logs</strong> — what the app says (events, errors).</li><li><strong>Metrics</strong> — numbers (CPU, memory, request count).</li><li><strong>Health</strong> — is it working right now (health checks).</li></ol><p>Docker gives you logs (<code>docker logs</code>, <code>docker compose logs</code>) and live metrics (<code>docker stats</code>). Real teams add tools like Prometheus (metrics) and Loki/ELK (logs).</p><h2>2. Key concepts and terms</h2><ul><li><strong>Log to stdout/stderr:</strong> apps in containers should print logs to the screen, not to files. Docker collects them.</li><li><strong>Logging drivers:</strong> <code>json-file</code> (default), <code>local</code>, or send to a system (<code>syslog</code>, <code>fluentd</code>).</li><li><strong><code>docker stats</code></strong> — live CPU/memory per container.</li><li><strong>Health checks</strong> (from the earlier lesson) tell you readiness.</li></ul><h2>3. Practical examples</h2><pre><code>docker compose logs -f              # follow all service logs\ndocker compose logs --tail 100 web  # last 100 lines of one service\ndocker stats                        # live metrics (Ctrl+C to stop)\ndocker events                       # live stream of docker events</code></pre><p>Set a log driver in compose:</p><pre><code>services:\n  web:\n    image: nginx:1.27\n    logging:\n      driver: json-file\n      options: { max-size: \"10m\", max-file: \"3\" }   # rotate logs</code></pre><h2>4. Commands and config examples</h2><pre><code>docker inspect --format '{{.HostConfig.LogConfig.Type}}' &lt;name&gt;   # which log driver\ndocker stats --no-stream --format \"table {{.Name}}\\t{{.CPUPerc}}\\t{{.MemUsage}}\"</code></pre><h2>5. Hands-on exercises</h2><ol><li>Follow logs of a running app with <code>docker compose logs -f</code>.</li><li>Set log rotation (<code>max-size</code>, <code>max-file</code>) in compose.</li><li>Watch <code>docker stats</code> while the app handles some <code>curl</code> requests.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> logs are huge and fill the disk.</li></ul><p>  <strong>Fix:</strong> set <code>max-size</code> and <code>max-file</code> to rotate them.</p><ul><li><strong>Problem:</strong> no logs at all.</li></ul><p>  <strong>Fix:</strong> the app writes to a file inside instead of stdout. Make it log to stdout/stderr.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>App logs to a file inside the container — logs get lost. Log to stdout.</li><li>No log rotation — disk fills.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA/CKAD:</strong> <code>kubectl logs</code> and <code>kubectl top</code> are the Kubernetes versions. Same idea.</li><li><strong>CKS:</strong> logging and runtime monitoring (like Falco) are part of the exam.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Where should a container app send its logs?</li><li>Why set <code>max-size</code> on logs?</li><li>Which command s
