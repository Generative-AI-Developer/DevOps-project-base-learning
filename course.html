up/production-environment/tools/kubeadm/high-availability/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> HA = run more than one. DR = backups + a plan. For node work: cordon → drain → fix → uncordon.</p><details><summary>Answers</summary>\n<ol><li>Cordon stops new Pods; drain also moves existing Pods off.</li><li>Keeps a minimum number of Pods running during voluntary disruptions.</li><li>Multiple replicas of apps, and multiple control-plane nodes (replicated etcd).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Survive a Disaster (K8s Advanced Boss 🏆🏆)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>final Kubernetes Advanced project</strong>. Finish it to complete the level and unlock the <strong>Certification Level</strong> (CKAD, CKA, CKS). It combines your CKA skills into one disaster-recovery drill.</p><h2>1. Objective</h2><p>Do a full node-maintenance + recovery drill: run an app with HA settings, safely drain a node, restore from an etcd backup, and prove the app stayed available.</p><h2>2. Real-world scenario</h2><p>A node must go down for maintenance, and later someone deletes important objects. You must keep the app running through the maintenance, and restore the cluster after the deletion — with no lasting damage.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Run an app with replicas + a PodDisruptionBudget.</li><li>Cordon and drain a node safely.</li><li>Restore etcd (from Project 3).</li><li>Prove availability throughout.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Advanced Projects 1–9 completed.</li><li>Read: <code>study/kubernetes/advanced/10-disaster-recovery.md</code>.</li><li>Multi-node cluster + etcd access (kubeadm or killercoda).</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Deploy an app <code>web</code> with <strong>3 replicas</strong>, spread across nodes (anti-affinity is a plus), plus a <strong>PodDisruptionBudget</strong> <code>minAvailable: 2</code>.</li><li>Start a loop that curls the app through its Service/Ingress.</li><li><strong>Node maintenance:</strong> cordon + drain one worker node. Show Pods move to other nodes and the curl loop keeps working (no downtime).</li><li>Uncordon the node.</li><li><strong>Disaster + restore:</strong> take an etcd snapshot, create a marker object, then restore the snapshot and show the marker is gone (state rolled back) — reusing your Project 3 skills.</li><li>Write a short \"DR report\": what you did, and how availability was kept.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ App with 3 replicas + PDB.</li><li>☐ Node drained with no app downtime.</li><li>☐ Node uncordoned.</li><li>☐ etcd snapshot + restore done.</li><li>☐ DR report written.</li></ul><h2>7. Expected outcome</h2><p>The app survived a node drain with no downtime, and you restored the cluster from an etcd backup. You proved both HA and DR.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>web</code> runs 3 replicas and has a PodDisruptionBudget (<code>kubectl get pdb</code>).</li><li>You cordon + drain a node and show Pods rescheduling to other nodes (<code>kubectl get pods -o wide</code>).</li><li>Your curl loop shows the app stayed reachable during the drain (no failed requests, or a clear near-zero failure explanation).</li><li>You uncordon the node and it accepts Pods again.</li><li>You show an etcd snapshot, a marker object created after it, and that the marker is gone after restore.</li><li>Your DR report explains what kept the app available (replicas spread across nodes + PDB).</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ HA app + PDB.</li><li>☐ Drain with no downtime.</li><li>☐ etcd restore proven.</li><li>☐ DR report written.</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-10/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Only 1–2 replicas on one node → downtime during drain.</li><li>No PDB → drain can remove too many Pods.</li><li>Not testing the etcd restore.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Spread replicas: use `podAntiAffinity` (from Project 4's final challenge) so copies land on different nodes.</details>\n<details><summary>Hint 2</summary>Drain: `kubectl drain <node> --ignore-daemonsets --delete-emptydir-data`. Watch Pods move with `kubectl get pods -o wide -w`.</details>\n<details><summary>Hint 3</summary>Reuse your etcd save/restore commands from `study/kubernetes/advanced/03-etcd-backup.md`.</details>\n<h2>12. Final challenge</h2><p>Write a one-page <strong>runbook</strong> (in simple English) titled \"How to safely take a node down and restore the cluster\". List each step and each check. Real teams keep runbooks like this for emergencies.</p><h2>13. What to submit (evidence)</h2><p>Save all commands, the no-downtime proof, the etcd restore proof, and your DR report/runbook in <code>submissions/kubernetes/advanced/project-10/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 10.\"</strong></p><p>When it passes, you complete <strong>Kubernetes Advanced</strong> and unlock the <strong>Certification Level</strong> (CKAD, CKA, CKS)! 🎉🎉</p><hr><p><strong>Remember:</strong> HA = spread replicas + PDB. DR = etcd backup + restore. For nodes: cordon → drain → fix → uncordon.</p></section>","kubernetes/cert/ckad/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: CKAD Exam Guide and Speed Tips</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Performance-based</strong> — you do real tasks, not multiple choice.</li><li><strong>Open book</strong> — you may use the official Kubernetes docs during the exam.</li><li><strong>Imperative command</strong> — a quick <code>kubectl</code> command that does a thing (fast).</li><li><strong>Declarative YAML</strong> — a file you <code>apply</code> (clear and repeatable).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>CKAD is a <strong>doing</strong> exam. You get tasks like \"create a Deployment with 3 replicas and this config\". You must do them <strong>fast and correctly</strong> in ~2 hours.</p><p>The biggest skill is <strong>speed</strong>: generate YAML quickly, edit a little, apply. Do not write YAML from memory by hand.</p><h2>2. Key concepts and terms (speed toolkit)</h2><ul><li><code>alias k=kubectl</code> — saves lots of typing.</li><li><code>--dry-run=client -o yaml</code> — generate YAML without creating.</li><li><code>kubectl explain &lt;resource&gt;.&lt;field&gt;</code> — built-in docs.</li><li><code>-n &lt;ns&gt;</code> — always work in the right namespace.</li><li><code>kubectl &lt;verb&gt; --help</code> — quick flag reminder.</li></ul><h2>3. Practical examples</h2><pre><code># fast Deployment YAML\nkubectl create deploy web --image=nginx:1.27 --replicas=3 --dry-run=client -o yaml &gt; web.yaml\n# fast Pod\nkubectl run p --image=nginx --dry-run=client -o yaml &gt; p.yaml\n# fast Service\nkubectl expose deploy web --port=80 --dry-run=client -o yaml &gt; svc.yaml\n# fast ConfigMap / Secret\nkubectl create configmap cfg --from-literal=A=1 --dry-run=client -o yaml &gt; cfg.yaml\nkubectl create secret generic s --from-literal=P=x --dry-run=client -o yaml &gt; s.yaml</code></pre><h2>4. Commands and config examples</h2><pre><code># time-savers\nexport do=\"--dry-run=client -o yaml\"   # then: kubectl run p --image=nginx $do\nexport now=\"--grace-period=0 --force\"  # fast delete\nkubectl config set-context --current --namespace=&lt;ns&gt;   # stop typing -n</code></pre><h2>5. Hands-on exercises</h2><ol><li>Set the <code>k</code> alias and the <code>do</code> variable. Generate 3 kinds of YAML with them.</li><li>Time yourself creating a Deployment + Service + ConfigMap. Aim for under 3 minutes.</li><li>Practice <code>kubectl explain</code> for a field you forget (like <code>probe</code> timing).</li></ol><h2>6. Troubleshooting (exam mindset)</h2><ul><li>Stuck on a task? Flag it, move on, come back. Do easy points first.</li><li>Always double-check the <strong>namespace</strong> and <strong>names</strong> in the task.</li><li>Verify each answer (<code>kubectl get</code>, <code>describe</code>) before moving on.</li></ul><h2>7. Common mistakes and how to avoid them</h2><ul><li>Writing YAML fully by hand (slow) — generate it.</li><li>Wrong namespace.</li><li>Not verifying — a small typo can cost the whole task.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Speed + accuracy. Use imperative commands to generate, then tweak.</li><li>The docs are open — bookmark the pages you use most (probes, volumes, security context).</li></ul><h2>9. Practice questions and tasks</h2><ol><li>How do you generate YAML without creating the object?</li><li>How do you stop typing <code>-n &lt;ns&gt;</code> every time?</li><li>What should you do before leaving a task?</li></ol><h2>10. References</h2><ul><li>CKAD curriculum: <a href=\"https://github.com/cncf/curriculum\" target=\"_blank\" rel=\"noopener\">https://github.com/cncf/curriculum</a> (checked: 2026-09-18)</li><li>Exam tips: <a href=\"https://kubernetes.io/docs/reference/kubectl/quick-reference/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/reference/kubectl/quick-reference/</a> (checked: 2026-09-18)</li><li>Video: <strong>KodeKloud</strong> — \"CKAD\" course — <a href=\"https://www.youtube.com/@KodeKloud\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@KodeKloud</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Generate YAML, do not hand-write it. Set the namespace once. Verify every answer. Speed + correctness.</p><details><summary>Answers</summary>\n<ol><li>Add <code>--dry-run=client -o yaml</code>.</li><li><code>kubectl config set-context --current --namespace=&lt;ns&gt;</code>.</li><li>Verify it with <code>kubectl get</code>/<code>describe</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKAD Drill: Application Design and Build (20%)</h1><p><strong>Status:</strong> 🔒 Locked (unlocks when the Certification Level opens)</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>25 minutes</strong>. Work fast, generate YAML, verify.</p><h2>1. Objective</h2><p>Practice building Pods, multi-container Pods, init containers, and Jobs quickly — the CKAD \"Design and Build\" domain.</p><h2>2. Real-world scenario</h2><p>The exam gives short tasks like \"create a Pod that...\". You must do them fast and correctly.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Fast Pod/Job creation with <code>--dry-run</code>.</li><li>Multi-container and init container patterns.</li><li>Batch workloads.</li></ul><h2>4. Prerequisites</h2><ul><li>All Kubernetes Beginner/Intermediate/Advanced completed.</li><li>Read: <code>study/kubernetes/certification/ckad/00-ckad-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements (do all within the time limit)</h2><ol><li>Create a Pod <code>p1</code> (image <code>busybox</code>) that runs <code>sleep 3600</code>.</li><li>Create a Pod with an <strong>init container</strong> that writes a file, and a main container that reads it (shared <code>emptyDir</code>).</li><li>Create a <strong>Job</strong> that prints a message and completes; show <code>COMPLETIONS 1/1</code>.</li><li>Create a <strong>CronJob</strong> that runs every minute.</li><li>Verify each with <code>kubectl get</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Pod created fast (dry-run).</li><li>☐ Init + main sharing a volume.</li><li>☐ Job completes.</li><li>☐ CronJob scheduled.</li></ul><h2>7. Expected outcome</h2><p>All four objects created correctly within 25 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>p1</code> runs <code>sleep 3600</code> (show <code>kubectl get pod p1</code>).</li><li>The init+main Pod shows the init file readable by the main container.</li><li>The Job shows <code>1/1</code> completions and its logs.</li><li>The CronJob exists with a valid schedule.</li><li>You report how long it took (aim: under 25 min).</li></ol><h2>9. Verification checklist</h2><ul><li>☐ All 4 objects correct.</li><li>☐ Time recorded.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/ckad/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Hand-writing YAML (slow).</li><li>Wrong <code>restartPolicy</code> for the Job.</li><li>Not verifying.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`kubectl run p1 --image=busybox --dry-run=client -o yaml -- sleep 3600 > p1.yaml`.</details>\n<details><summary>Hint 2</summary>Reuse the init/sidecar YAML from Intermediate Project 3.</details>\n<details><summary>Hint 3</summary>`kubectl create job j --image=busybox -- echo hi` and `kubectl create cronjob c --image=busybox --schedule=\"*/1 * * * *\" -- date`.</details>\n<h2>12. Final challenge</h2><p>Redo the whole drill and beat your time. Speed is the point of this domain.</p><h2>13. What to submit (evidence)</h2><p>Save the YAML, <code>kubectl get</code> proofs, and your time in <code>submissions/kubernetes/certification/ckad/project-01/</code>. Then say: <strong>\"I submit CKAD Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Generate, apply, verify — fast. This domain is 20% of CKAD.</p></section>","kubernetes/cert/ckad/project-02":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKAD Drill: Application Deployment (20%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>25 minutes</strong>.</p><h2>1. Objective</h2><p>Practice Deployments, rolling updates, rollbacks, and scaling — fast.</p><h2>2. Real-world scenario</h2><p>Exam tasks like \"update this Deployment to a new image and roll back the last change\".</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create/scale Deployments quickly.</li><li>Rolling update + rollback.</li><li>Read rollout history.</li></ul><h2>4. Prerequisites</h2><ul><li>CKAD Project 1 completed.</li><li>Read: <code>study/kubernetes/certification/ckad/00-ckad-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Create a Deployment <code>web</code> (nginx:1.27, 3 replicas).</li><li>Scale it to 5, then to 2.</li><li>Update the image to a new tag; check <code>rollout status</code>.</li><li>Roll back to the previous version.</li><li>Show <code>rollout history</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Deployment created.</li><li>☐ Scaled up/down.</li><li>☐ Rolling update done.</li><li>☐ Rollback done.</li><li>☐ History shown.</li></ul><h2>7. Expected outcome</h2><p>You performed a full deployment lifecycle within 25 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>Deployment <code>web</code> runs the requested replicas.</li><li>You show scaling to 5 and back to 2.</li><li>You show a rolling update (<code>kubectl set image</code> + <code>rollout status</code>).</li><li>You show a successful <code>rollout undo</code>.</li><li><code>kubectl rollout history deploy web</code> shown.</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Full lifecycle done.</li><li>☐ Time recorded.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/ckad/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Editing Pods instead of the Deployment.</li><li>Forgetting to record the change cause (use <code>--record</code> or annotations if needed).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`kubectl create deploy web --image=nginx:1.27 --replicas=3`.</details>\n<details><summary>Hint 2</summary>`kubectl set image deploy web nginx=nginx:1.27.1 && kubectl rollout status deploy web`.</details>\n<details><summary>Hint 3</summary>`kubectl rollout undo deploy web` and `kubectl rollout history deploy web`.</details>\n<h2>12. Final challenge</h2><p>Change the Deployment's update strategy <code>maxSurge</code>/<code>maxUnavailable</code> and explain how they affect the update speed and availability.</p><h2>13. What to submit (evidence)</h2><p>Save commands, outputs, and your time in <code>submissions/kubernetes/certification/ckad/project-02/</code>. Then say: <strong>\"I submit CKAD Project 2.\"</strong></p><hr><p><strong>Remember:</strong> create → scale → update → rollback → history. Fast and correct. 20% of CKAD.</p></section>","kubernetes/cert/ckad/project-03":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKAD Drill: Environment, Config and Security (25%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>30 minutes</strong>. This is the biggest CKAD domain.</p><h2>1. Objective</h2><p>Practice ConfigMaps, Secrets, ServiceAccounts, securityContext, and resources — fast.</p><h2>2. Real-world scenario</h2><p>Exam tasks like \"inject this config and secret, run as non-root, and set resource limits\".</p><h2>3. Skills and concepts you will learn</h2><ul><li>Config and secrets as env and files.</li><li>ServiceAccount on a Pod.</li><li>securityContext (non-root, drop capabilities).</li><li>Requests/limits.</li></ul><h2>4. Prerequisites</h2><ul><li>CKAD Project 2 completed.</li><li>Read: <code>study/kubernetes/certification/ckad/00-ckad-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Create a ConfigMap and a Secret. Inject the ConfigMap as env and mount the Secret as a file in a Pod.</li><li>Create a ServiceAccount and set it on a Pod.</li><li>Add a <code>securityContext</code>: <code>runAsNonRoot: true</code>, <code>runAsUser: 10001</code>, and drop all capabilities.</li><li>Add resource requests and limits.</li><li>Verify: <code>printenv</code>, the mounted secret file, the SA, and non-root (<code>id</code>).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Config env + secret file.</li><li>☐ ServiceAccount set.</li><li>☐ securityContext non-root + drop caps.</li><li>☐ Requests/limits set.</li></ul><h2>7. Expected outcome</h2><p>A Pod that is configured, uses a ServiceAccount, runs non-root with dropped capabilities, and has resource limits — within 30 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>printenv</code> shows the ConfigMap value; the Secret is readable as a mounted file.</li><li><code>kubectl get pod &lt;p&gt; -o jsonpath='{.spec.serviceAccountName}'</code> shows your SA.</li><li>The Pod's <code>securityContext</code> sets <code>runAsNonRoot</code>, <code>runAsUser</code>, and <code>capabilities.drop: [ALL]</code> (show YAML + <code>id</code> inside is non-root).</li><li>The container has <code>resources.requests</code> and <code>resources.limits</code>.</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Config + secret injected.</li><li>☐ SA set.</li><li>☐ Non-root + drop caps.</li><li>☐ Limits set.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/ckad/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Putting secrets in a ConfigMap.</li><li>Forgetting <code>runAsNonRoot</code> needs the image to support a non-root user.</li><li>Missing requests or limits.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Reuse Beginner Projects 5/6 (Config/Secret) and Docker Advanced hardening ideas mapped to `securityContext`.</details>\n<details><summary>Hint 2</summary>securityContext fields: `runAsNonRoot: true`, `runAsUser: 10001`, `capabilities: { drop: [ALL] }`, `allowPrivilegeEscalation: false`.</details>\n<details><summary>Hint 3</summary>Check SA: `kubectl get pod <p> -o jsonpath='{.spec.serviceAccountName}'`.</details>\n<h2>12. Final challenge</h2><p>Add <code>readOnlyRootFilesystem: true</code> and a writable <code>emptyDir</code> for <code>/tmp</code>. Show the app still works. This mirrors your Docker hardening project.</p><h2>13. What to submit (evidence)</h2><p>Save the YAML, all verifications, and your time in <code>submissions/kubernetes/certification/ckad/project-03/</code>. Then say: <strong>\"I submit CKAD Project 3.\"</strong></p><hr><p><strong>Remember:</strong> config + secrets + SA + securityContext + resources. This domain is the biggest (25%).</p></section>","kubernetes/cert/ckad/project-04":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKAD Drill: Services and Networking (20%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>25 minutes</strong>.</p><h2>1. Objective</h2><p>Practice Services, NetworkPolicies, and Ingress — fast.</p><h2>2. Real-world scenario</h2><p>Exam tasks like \"expose this Deployment and allow traffic only from that Pod\".</p><h2>3. Skills and concepts you will learn</h2><ul><li>Expose Deployments with Services.</li><li>Restrict traffic with a NetworkPolicy.</li><li>Route with Ingress.</li></ul><h2>4. Prerequisites</h2><ul><li>CKAD Project 3 completed.</li><li>Read: <code>study/kubernetes/certification/ckad/00-ckad-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Expose a Deployment with a ClusterIP Service; verify endpoints and reach it by name.</li><li>Add a NetworkPolicy that allows traffic to it only from Pods with a given label; prove another Pod is blocked.</li><li>Create an Ingress that routes a path to the Service.</li><li>Verify all three.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Service + endpoints.</li><li>☐ NetworkPolicy allows/blocks correctly.</li><li>☐ Ingress routes.</li></ul><h2>7. Expected outcome</h2><p>A Service reachable by name, protected by a NetworkPolicy, and fronted by Ingress — within 25 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>The Service has endpoints and is reachable by name from a temp Pod.</li><li>The NetworkPolicy allows the intended Pod and blocks another (show both).</li><li>The Ingress routes a path to the Service (show a <code>curl</code>).</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Service works.</li><li>☐ Policy allows/blocks.</li><li>☐ Ingress routes.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/ckad/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Label/selector mismatch → no endpoints.</li><li>NetworkPolicy on a CNI that ignores it.</li><li>Ingress with no controller.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Reuse Beginner Project 4 (Services), Advanced Project 6 (NetworkPolicy), Intermediate Project 7 (Ingress).</details>\n<details><summary>Hint 2</summary>Test policy with a busybox Pod: allowed vs blocked.</details>\n<details><summary>Hint 3</summary>Ingress needs a controller (minikube addon or nginx-ingress on kind).</details>\n<h2>12. Final challenge</h2><p>Add an egress NetworkPolicy that lets a Pod reach ONLY the DNS service and one other Pod. Egress rules are a common tricky exam item.</p><h2>13. What to submit (evidence)</h2><p>Save YAML, tests, and your time in <code>submissions/kubernetes/certification/ckad/project-04/</code>. Then say: <strong>\"I submit CKAD Project 4.\"</strong></p><hr><p><strong>Remember:</strong> Service (endpoints) → NetworkPolicy (allow/block) → Ingress (route). 20% of CKAD.</p></section>","kubernetes/cert/ckad/project-05":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKAD Drill: Observability + Take the Mock Exam</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>last CKAD project</strong>. It has two parts: a short observability drill, then the <strong>full CKAD Mock Exam</strong>. Passing this (with no weak domain) marks you <strong>CKAD-ready</strong> and unlocks <strong>CKA</strong>.</p><h2>1. Objective</h2><p>Practice probes and debugging, then take a timed, scored mock exam that measures every CKAD domain.</p><h2>2. Real-world scenario</h2><p>This is your rehearsal for the real exam: 120 minutes, hands-on, scored against the domains.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Probes and debugging under time pressure.</li><li>Sitting a full timed mock.</li><li>Seeing your weak domains.</li></ul><h2>4. Prerequisites</h2><ul><li>CKAD Projects 1–4 completed.</li><li>Read: <code>study/kubernetes/certification/ckad/00-ckad-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><p><strong>Part A — Observability drill (20 min):</strong></p><ol><li>Add liveness + readiness probes to a Deployment; show it becomes READY.</li><li>Create a failing Pod; find the cause with <code>describe</code>/<code>logs</code>; write the reason.</li></ol><p><strong>Part B — Mock Exam (120 min):</strong></p><ol><li>Open <code>exams/ckad/mock-1.md</code>. Set a 120-minute timer. Do the 10 tasks.</li><li>Save all evidence under <code>submissions/kubernetes/certification/ckad/mock-1/</code>.</li><li>Ask the mentor to grade it with <code>exams/ckad/rubric-1.md</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Probes drill done.</li><li>☐ Debug drill done.</li><li>☐ Mock exam attempted within 120 min.</li><li>☐ Evidence saved for grading.</li></ul><h2>7. Expected outcome</h2><p>You complete the mock, get a score per domain, and know your weak areas (if any).</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>Part A: probes make the Pod READY; the failing Pod's cause is correctly identified.</li><li>Part B: you attempted the mock within the time limit and saved evidence for each task.</li><li>The mentor grades the mock with the rubric and writes <strong>domainScores</strong> into <code>progress.json</code>.</li><li><strong>Overall score ≥ 0.66</strong> AND <strong>no domain below 0.66</strong>. (If a domain is weak, it becomes a weak area — fix the matching drill and re-score before CKA unlocks.)</li><li>You report your total time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Mock attempted + saved.</li><li>☐ Domain scores recorded.</li><li>☐ No weak domain remaining.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/ckad/project-05/</code> (+ the mock folder).</li></ul><h2>10. Common mistakes</h2><ul><li>Running out of time (practice speed!).</li><li>Skipping verification.</li><li>Leaving a weak domain unfixed.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Do easy tasks first. Flag hard ones and return.</details>\n<details><summary>Hint 2</summary>Use `--dry-run=client -o yaml` for every object.</details>\n<details><summary>Hint 3</summary>If a domain is weak, redo that domain's drill (Projects 1–4) and take the mock again.</details>\n<h2>12. Final challenge</h2><p>Retake the mock and beat both your <strong>score</strong> and your <strong>time</strong>. Aim for 80%+ with time to spare.</p><h2>13. What to submit (evidence)</h2><p>Save Part A proofs and the full mock evidence in <code>submissions/kubernetes/certification/ckad/</code>. Then say: <strong>\"I submit CKAD Project 5 (Mock Exam).\"</strong> When it passes with no weak domain, CKA unlocks! 🎉</p><hr><p><strong>Remember:</strong> This is your rehearsal. Score ≥ 66% on every domain. Fix weak areas, then move to CKA.</p></section>","kubernetes/cert/cka/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: CKA Exam Guide and Speed Tips</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>kubeadm</strong> — builds/upgrades the cluster.</li><li><strong>etcd</strong> — cluster database (backup/restore is a top task).</li><li><strong>kubeconfig</strong> — the file that says how to reach a cluster and as who.</li><li><strong>drain/cordon</strong> — safely take a node down.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>CKA is the <strong>admin</strong> exam. You will: fix broken nodes, back up etcd, set RBAC, manage storage, and repair Services. <strong>Troubleshooting is 30%</strong> — the biggest slice.</p><p>Speed and a clear method win. Use the docs (they are open), but know where things are.</p><h2>2. Key concepts and terms (admin toolkit)</h2><ul><li><code>journalctl -u kubelet</code> — node problems (Linux skill!).</li><li><code>/etc/kubernetes/manifests/</code> — control-plane static Pods.</li><li><code>etcdctl snapshot save/restore</code> — backup/restore.</li><li><code>kubectl drain/cordon/uncordon</code> — node maintenance.</li><li><code>kubectl auth can-i</code> — check RBAC.</li><li>Switch clusters/contexts fast: <code>kubectl config use-context &lt;name&gt;</code> (the exam has many clusters!).</li></ul><h2>3. Practical examples</h2><pre><code>kubectl config get-contexts          # the exam lists several\nkubectl config use-context &lt;name&gt;    # ALWAYS switch to the task's cluster first\nsudo systemctl status kubelet\njournalctl -u kubelet | tail</code></pre><h2>4. Commands and config examples</h2><pre><code>alias k=kubectl\nkubectl get nodes -o wide\nkubectl -n kube-system get pods\nETCDCTL_API=3 etcdctl snapshot save /opt/e.db --cacert=... --cert=... --key=...</code></pre><h2>5. Hands-on exercises</h2><ol><li>Practice switching contexts (the exam penalizes working on the wrong cluster).</li><li>Do a timed etcd backup + restore.</li><li>Do a timed drain + uncordon.</li></ol><h2>6. Troubleshooting (exam mindset)</h2><ul><li><strong>Read the task's cluster/context first.</strong> Switch to it. This is the #1 CKA mistake.</li><li>Use the method: get → describe → logs → node (kubelet) → control plane.</li><li>Verify your fix.</li></ul><h2>7. Common mistakes and how to avoid them</h2><ul><li>Working on the wrong cluster (switch context first!).</li><li>Forgetting the node side (kubelet, systemd).</li><li>Not verifying.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Troubleshooting 30%, Architecture/Install 25% — practice these most.</li><li>Know etcd backup/restore, kubeadm upgrade, RBAC, static Pods cold.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is the #1 mistake on a multi-cluster exam?</li><li>Where do you look for a NotReady node?</li><li>Which command backs up etcd?</li></ol><h2>10. References</h2><ul><li>CKA curriculum: <a href=\"https://github.com/cncf/curriculum\" target=\"_blank\" rel=\"noopener\">https://github.com/cncf/curriculum</a> (checked: 2026-09-18)</li><li>Video: <strong>KodeKloud</strong> — \"CKA\" course — <a href=\"https://www.youtube.com/@KodeKloud\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@KodeKloud</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Switch to the task's cluster first. Method beats luck. Troubleshooting is 30%.</p><details><summary>Answers</summary>\n<ol><li>Working on the wrong cluster — always <code>use-context</code> first.</li><li>The node's kubelet: <code>systemctl status kubelet</code>, <code>journalctl -u kubelet</code>.</li><li><code>etcdctl snapshot save</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKA Drill: Architecture, Install &amp; Config (25%)</h1><p><strong>Status:</strong> 🔒 Locked (unlocks after CKAD is complete)</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>30 minutes</strong>.</p><h2>1. Objective</h2><p>Practice the admin core: etcd backup/restore, RBAC, static Pods, and kubeconfig/context handling.</p><h2>2. Real-world scenario</h2><p>The exam mixes install/config tasks: \"back up etcd\", \"create this Role\", \"find the static Pod\".</p><h2>3. Skills and concepts you will learn</h2><ul><li>etcd snapshot save/restore under time.</li><li>RBAC quickly.</li><li>Static Pods and context switching.</li></ul><h2>4. Prerequisites</h2><ul><li>CKAD completed.</li><li>Read: <code>study/kubernetes/certification/cka/00-cka-exam-guide.md</code>.</li><li>Use kubeadm/killercoda (etcd + static Pods need a real cluster).</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Switch to the correct context (practice this habit).</li><li>Take an etcd snapshot and check its status.</li><li>Create a Role + RoleBinding that lets a ServiceAccount read Pods in one namespace; verify with <code>auth can-i</code>.</li><li>Find the control-plane static Pods and name where their files live.</li><li>Restore etcd from your snapshot (or clearly show the restore steps on a throwaway cluster).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Context switched first.</li><li>☐ etcd snapshot + status.</li><li>☐ RBAC created + verified.</li><li>☐ Static Pods found.</li><li>☐ etcd restore done/shown.</li></ul><h2>7. Expected outcome</h2><p>You handled the main install/config admin tasks within 30 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show switching context (<code>kubectl config use-context</code>).</li><li><code>etcdctl snapshot save</code> + <code>snapshot status</code> shown.</li><li>RBAC: <code>auth can-i list pods</code> yes, <code>delete pods</code> no (for the SA).</li><li>You show the static Pod files location (<code>/etc/kubernetes/manifests/</code>).</li><li>You show an etcd restore (or the exact restore steps on a practice cluster).</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ etcd backup/restore.</li><li>☐ RBAC verified.</li><li>☐ Static Pods located.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cka/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Working on the wrong cluster.</li><li>Wrong etcd cert paths.</li><li>RBAC binding in the wrong namespace.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Reuse Advanced Project 3 (etcd) and Project 7 (RBAC).</details>\n<details><summary>Hint 2</summary>Always `kubectl config use-context <task-cluster>` first.</details>\n<details><summary>Hint 3</summary>killercoda has guided etcd + RBAC CKA labs.</details>\n<h2>12. Final challenge</h2><p>Do a kubeadm <strong>upgrade</strong> of one node (drain → upgrade → uncordon) on a practice cluster. Upgrades appear on the exam.</p><h2>13. What to submit (evidence)</h2><p>Save all commands, outputs, and your time in <code>submissions/kubernetes/certification/cka/project-01/</code>. Then say: <strong>\"I submit CKA Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Switch context first. etcd backup/restore + RBAC + static Pods are core install/config points (25%).</p></section>","kubernetes/cert/cka/project-02":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKA Drill: Workloads and Scheduling (15%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>20 minutes</strong>.</p><h2>1. Objective</h2><p>Practice placing and scaling workloads: DaemonSets, taints/tolerations, affinity, and manual scheduling.</p><h2>2. Real-world scenario</h2><p>Exam tasks like \"run this only on nodes with label X\" or \"make this Pod tolerate the control-plane taint\".</p><h2>3. Skills and concepts you will learn</h2><ul><li>DaemonSets with tolerations.</li><li>nodeSelector / affinity placement.</li><li>Taint a node and schedule around it.</li></ul><h2>4. Prerequisites</h2><ul><li>CKA Project 1 completed.</li><li>Read: <code>study/kubernetes/certification/cka/00-cka-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Create a DaemonSet that also runs on the control-plane node (add the toleration).</li><li>Label a node; use <code>nodeSelector</code> to place a Pod there.</li><li>Taint a node <code>NoSchedule</code>; show a normal Pod avoids it; add a toleration so a Pod can land.</li><li>Verify placements with <code>-o wide</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ DaemonSet on all nodes (incl. control plane).</li><li>☐ nodeSelector placement.</li><li>☐ Taint + toleration.</li></ul><h2>7. Expected outcome</h2><p>You controlled where several workloads run, within 20 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>DaemonSet runs on every node including the control plane (show the toleration + <code>-o wide</code>).</li><li>A <code>nodeSelector</code> Pod landed on the labeled node.</li><li>A taint blocks a normal Pod; a toleration lets one land (both shown).</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ DaemonSet everywhere.</li><li>☐ Placement controlled.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cka/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>DaemonSet skips control plane (missing toleration).</li><li>Forgetting the trailing <code>-</code> to remove a taint.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Reuse Advanced Projects 4 (scheduling) and 5 (DaemonSets).</details>\n<details><summary>Hint 2</summary>Control-plane taint is usually `node-role.kubernetes.io/control-plane:NoSchedule` — tolerate it.</details>\n<details><summary>Hint 3</summary>Verify with `kubectl get pods -o wide`.</details>\n<h2>12. Final challenge</h2><p>Use <code>podAntiAffinity</code> so two replicas never share a node. Prove they spread. HA + scheduling in one.</p><h2>13. What to submit (evidence)</h2><p>Save YAML, <code>-o wide</code> proofs, and your time in <code>submissions/kubernetes/certification/cka/project-02/</code>. Then say: <strong>\"I submit CKA Project 2.\"</strong></p><hr><p><strong>Remember:</strong> nodeSelector/affinity place Pods; taints keep them off; tolerations let them in. 15% of CKA.</p></section>","kubernetes/cert/cka/project-03":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKA Drill: Services, Networking and Storage (20% + 10%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>25 minutes</strong>.</p><h2>1. Objective</h2><p>Practice Services, DNS, NetworkPolicies, and PV/PVC storage — the networking + storage domains.</p><h2>2. Real-world scenario</h2><p>Exam tasks like \"expose this app\", \"restrict traffic\", \"create a PVC and mount it\".</p><h2>3. Skills and concepts you will learn</h2><ul><li>Services + endpoints + DNS.</li><li>NetworkPolicy allow/deny.</li><li>PV/PVC and StorageClass.</li></ul><h2>4. Prerequisites</h2><ul><li>CKA Project 2 completed.</li><li>Read: <code>study/kubernetes/certification/cka/00-cka-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Expose a Deployment as a Service; verify endpoints and DNS.</li><li>Add a NetworkPolicy restricting who may reach it; prove allow + block.</li><li>Create a PVC (1Gi); mount it in a Pod; write a file; prove it persists across a Pod restart.</li><li>Show <code>kubectl get svc,endpoints,pvc,pv</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Service + DNS.</li><li>☐ NetworkPolicy allow/block.</li><li>☐ PVC persistence.</li></ul><h2>7. Expected outcome</h2><p>Networking and storage tasks done within 25 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>Service has endpoints; a temp Pod resolves it by name.</li><li>NetworkPolicy: allowed Pod reaches it; blocked Pod does not (both shown).</li><li>PVC bound; data survives a Pod restart (write → delete Pod → new Pod reads it).</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Service/DNS works.</li><li>☐ Policy allow/block.</li><li>☐ PVC persists.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cka/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Label/selector mismatch → no endpoints.</li><li>CNI ignores policies.</li><li>emptyDir instead of a PVC.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Reuse Beginner 4 (Services), Intermediate 5 (PVC), Advanced 6 (NetworkPolicy).</details>\n<details><summary>Hint 2</summary>Persistence test: write a file, delete the Pod, recreate with the same PVC, read the file.</details>\n<details><summary>Hint 3</summary>`kubectl get endpoints <svc>` proves the Service is wired.</details>\n<h2>12. Final challenge</h2><p>Create a PV manually (not dynamic) with a specific <code>hostPath</code> and bind a PVC to it. Understand static vs dynamic provisioning.</p><h2>13. What to submit (evidence)</h2><p>Save YAML, tests, and your time in <code>submissions/kubernetes/certification/cka/project-03/</code>. Then say: <strong>\"I submit CKA Project 3.\"</strong></p><hr><p><strong>Remember:</strong> Service+DNS, NetworkPolicy, PVC persistence. Networking is 20%, storage 10%.</p></section>","kubernetes/cert/cka/project-04":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKA Drill: Troubleshooting (30%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>30 minutes</strong>. This is the biggest CKA domain.</p><h2>1. Objective</h2><p>Practice fixing broken things fast: a NotReady node, a broken control-plane static Pod, and a broken Service.</p><h2>2. Real-world scenario</h2><p>The exam gives broken clusters and asks you to fix them. Speed + method are everything.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Node/kubelet repair.</li><li>Control-plane static Pod repair.</li><li>Service/DNS debug.</li></ul><h2>4. Prerequisites</h2><ul><li>CKA Project 3 completed.</li><li>Read: <code>study/kubernetes/certification/cka/00-cka-exam-guide.md</code>.</li><li>Use killercoda CKA troubleshooting scenarios or a throwaway kubeadm cluster you can break safely.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li><strong>Node:</strong> stop the kubelet on a node → node NotReady. Diagnose with <code>journalctl -u kubelet</code> and fix (start kubelet). Node returns to Ready.</li><li><strong>Control plane:</strong> introduce a small typo into the kube-apiserver static Pod manifest → apiserver down. Diagnose via kubelet logs / crictl, fix the file, recover.</li><li><strong>Service:</strong> break a Service selector → no endpoints. Fix the labels; endpoints return.</li><li>Write a short \"cause → fix\" note for each.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Node recovered.</li><li>☐ Control plane recovered.</li><li>☐ Service fixed.</li><li>☐ Notes written.</li></ul><h2>7. Expected outcome</h2><p>You fixed three failures using the method, within 30 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>Node: shown NotReady → diagnosed via kubelet logs → recovered to Ready.</li><li>Control plane: apiserver broken → diagnosed → fixed via the manifest → recovered. (If your lab cannot break the control plane safely, clearly explain the exact steps you would take and demonstrate the node + Service fixes fully.)</li><li>Service: empty endpoints → fixed labels → endpoints return.</li><li>A short cause→fix note for each.</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ 3 failures fixed (or 2 fixed + control-plane steps explained).</li><li>☐ Notes written.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cka/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Guessing instead of reading logs.</li><li>Working on the wrong cluster.</li><li>Forgetting the node/systemd side.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Reuse Advanced Project 9 (troubleshooting). Method: get → describe → logs → kubelet → control plane.</details>\n<details><summary>Hint 2</summary>Control-plane static Pod files: `/etc/kubernetes/manifests/`. kubelet restarts them from the files.</details>\n<details><summary>Hint 3</summary>killercoda's CKA troubleshooting scenarios are the safest place to practice breaking things.</details>\n<h2>12. Final challenge</h2><p>Fix a <strong>CoreDNS</strong> problem (scale it to 0, then back to 2, and confirm cluster DNS recovers). DNS issues are a classic exam trap.</p><h2>13. What to submit (evidence)</h2><p>Save each cause→fix, the logs, and your time in <code>submissions/kubernetes/certification/cka/project-04/</code>. Then say: <strong>\"I submit CKA Project 4.\"</strong></p><hr><p><strong>Remember:</strong> Method beats luck: get → describe → logs → kubelet → control plane. Troubleshooting is 30% of CKA.</p></section>","kubernetes/cert/cka/project-05":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKA: Take the Mock Exam</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>last CKA project</strong>. Take the full CKA Mock Exam. Passing it (with no weak domain) marks you <strong>CKA-ready</strong> and unlocks <strong>CKS</strong>.</p><h2>1. Objective</h2><p>Sit a timed, scored CKA mock that covers every domain, and find/fix your weak areas.</p><h2>2. Real-world scenario</h2><p>Your CKA rehearsal: 120 minutes, multiple clusters, real repairs.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Full-exam pacing across many clusters.</li><li>Weak-domain review.</li></ul><h2>4. Prerequisites</h2><ul><li>CKA Projects 1–4 completed.</li><li>Read: <code>study/kubernetes/certification/cka/00-cka-exam-guide.md</code>.</li><li>A practice environment (killercoda CKA scenarios recommended).</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Open <code>exams/cka/mock-1.md</code>. Set a 120-minute timer.</li><li>Do the 11 tasks. <strong>Switch to the right cluster for each.</strong></li><li>Save all evidence under <code>submissions/kubernetes/certification/cka/mock-1/</code>.</li><li>Ask the mentor to grade with <code>exams/cka/rubric-1.md</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Mock attempted within 120 min.</li><li>☐ Evidence saved per task.</li><li>☐ Domain scores recorded.</li><li>☐ Weak areas (if any) fixed.</li></ul><h2>7. Expected outcome</h2><p>A domain-by-domain score and a clear picture of readiness.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You attempted the mock within the time limit and saved evidence for each task.</li><li>The mentor grades it with the rubric and writes <code>domainScores</code> into <code>progress.json</code>.</li><li><strong>Overall ≥ 0.66</strong> AND <strong>no domain below 0.66</strong> (troubleshooting especially).</li><li>Any weak domain was fixed (redo its drill, re-score) before this passes.</li><li>You report your total time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Mock graded.</li><li>☐ No weak domain remaining.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cka/project-05/</code> (+ mock folder).</li></ul><h2>10. Common mistakes</h2><ul><li>Wrong cluster.</li><li>Running out of time.</li><li>Leaving troubleshooting points on the table.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Do quick wins first (Service, RBAC, scheduling), then the heavy troubleshooting.</details>\n<details><summary>Hint 2</summary>Always `kubectl config use-context <task>` before starting a task.</details>\n<details><summary>Hint 3</summary>Weak domain? Redo that drill (Projects 1–4) and retake.</details>\n<h2>12. Final challenge</h2><p>Retake and beat your score + time. Aim for 80%+ with the troubleshooting domain strong.</p><h2>13. What to submit (evidence)</h2><p>Save the full mock evidence in <code>submissions/kubernetes/certification/cka/</code>. Then say: <strong>\"I submit CKA Project 5 (Mock Exam).\"</strong> When it passes with no weak domain, CKS unlocks! 🎉</p><hr><p><strong>Remember:</strong> Switch context, do easy points first, and be strong on troubleshooting (30%). Fix weak areas before CKS.</p></section>","kubernetes/cert/cks/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: CKS Exam Guide and Security Tools</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Hardening</strong> — making things harder to attack.</li><li><strong>CIS benchmark</strong> — a checklist of security best practices.</li><li><strong>seccomp</strong> — limits which system calls a container may make.</li><li><strong>AppArmor</strong> — limits what a container may do on the host.</li><li><strong>Admission controller</strong> — checks/blocks objects as they are created.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>CKS is about <strong>security</strong>. The whole idea is <strong>least privilege</strong>: give the smallest access, the smallest image, the fewest powers — and <strong>watch</strong> for anything strange.</p><p>You will use tools: <strong>kube-bench</strong> (check the cluster), <strong>Trivy</strong> (scan images), <strong>Falco</strong> (watch runtime), plus <strong>seccomp/AppArmor</strong>, <strong>NetworkPolicies</strong>, <strong>RBAC</strong>, and <strong>audit logging</strong>.</p><h2>2. Key concepts and terms</h2><ul><li><strong>Pod Security Admission</strong> — enforces baseline/restricted Pod rules per namespace.</li><li><strong>securityContext</strong> — non-root, drop caps, read-only fs, no privilege escalation.</li><li><strong>NetworkPolicy</strong> — default-deny, allow only needed traffic.</li><li><strong>Secrets</strong> — encrypt at rest; limit who can read them (RBAC).</li><li><strong>Image safety</strong> — small/trusted base, scan for CVEs, allow only approved registries.</li><li><strong>Runtime</strong> — Falco alerts on odd behavior; audit logs record apiserver actions.</li></ul><h2>3. Practical examples</h2><pre><code># scan an image for vulnerabilities\ntrivy image nginx:1.27\n# check the cluster against CIS\nkube-bench run --targets master\n# a restricted Pod securityContext\n#   runAsNonRoot, drop ALL caps, readOnlyRootFilesystem, allowPrivilegeEscalation: false</code></pre><h2>4. Commands and config examples</h2><pre><code># label a namespace for restricted Pod Security\nkubectl label ns prod pod-security.kubernetes.io/enforce=restricted\n# seccomp: securityContext.seccompProfile.type: RuntimeDefault\n# audit: apiserver flags --audit-policy-file and --audit-log-path</code></pre><h2>5. Hands-on exercises</h2><ol><li>Scan an image with Trivy; read the CVE list.</li><li>Apply a restricted securityContext to a Pod.</li><li>Add a default-deny NetworkPolicy to a namespace.</li></ol><h2>6. Troubleshooting (exam mindset)</h2><ul><li>Many tasks are \"make this Pod comply\" — read the required policy carefully.</li><li>Verify with the tool (Trivy, kube-bench, Falco output).</li><li>Least privilege first; add back only what is needed.</li></ul><h2>7. Common mistakes and how to avoid them</h2><ul><li>Leaving a Pod as root or privileged.</li><li>Allowing all network traffic.</li><li>Using a big base image with many CVEs.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Know securityContext, Pod Security Admission, NetworkPolicies, RBAC, seccomp/AppArmor, image scanning, and runtime tools.</li><li>Encrypt Secrets at rest; enable audit logging.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does \"least privilege\" mean?</li><li>Which tool scans images for CVEs?</li><li>How do you enforce restricted Pod rules on a namespace?</li></ol><h2>10. References</h2><ul><li>CKS curriculum: <a href=\"https://github.com/cncf/curriculum\" target=\"_blank\" rel=\"noopener\">https://github.com/cncf/curriculum</a> (checked: 2026-09-18)</li><li>Pod Security: <a href=\"https://kubernetes.io/docs/concepts/security/pod-security-admission/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/security/pod-security-admission/</a> (checked: 2026-09-18)</li><li>Trivy: <a href=\"https://aquasecurity.github.io/trivy/\" target=\"_blank\" rel=\"noopener\">https://aquasecurity.github.io/trivy/</a> · Falco: <a href=\"https://falco.org/docs/\" target=\"_blank\" rel=\"noopener\">https://falco.org/docs/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Least privilege everywhere: smallest image, fewest powers, least access, watch everything.</p><details><summary>Answers</summary>\n<ol><li>Give each user/app/container only the access it truly needs.</li><li>Trivy.</li><li>Label the namespace: <code>pod-security.kubernetes.io/enforce=restricted</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKS Drill: Cluster Setup &amp; Hardening (10% + 15%)</h1><p><strong>Status:</strong> 🔒 Locked (unlocks after CKA is complete)</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>30 minutes</strong>.</p><h2>1. Objective</h2><p>Harden the cluster: default-deny networking, least-privilege RBAC, and CIS checks.</p><h2>2. Real-world scenario</h2><p>A security audit says the cluster is too open. You tighten networking and access.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Run kube-bench (CIS checks).</li><li>Default-deny NetworkPolicy.</li><li>Tight RBAC.</li></ul><h2>4. Prerequisites</h2><ul><li>CKA completed.</li><li>Read: <code>study/kubernetes/certification/cks/00-cks-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Run <code>kube-bench</code> and read a few failed checks; fix or explain one.</li><li>Add a <strong>default-deny</strong> ingress NetworkPolicy to a namespace, then allow only one needed flow.</li><li>Create a tight RBAC Role (only what is needed) and prove with <code>auth can-i</code>.</li><li>(Bonus) Restrict access to the Secret resource via RBAC.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ kube-bench run + one finding addressed.</li><li>☐ Default-deny + one allow.</li><li>☐ Tight RBAC verified.</li></ul><h2>7. Expected outcome</h2><p>A more locked-down cluster: default-deny networking and least-privilege access, within 30 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>kube-bench</code> output shown; you address or clearly explain one failed check.</li><li>A default-deny ingress policy applies to a namespace; you show a blocked Pod and one allowed flow.</li><li>An RBAC Role gives only needed verbs; <code>auth can-i</code> proves the limits.</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ CIS check addressed.</li><li>☐ Default-deny works.</li><li>☐ RBAC least privilege.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cks/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Allowing all traffic.</li><li>Broad RBAC.</li><li>Ignoring kube-bench findings.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Default-deny ingress: a NetworkPolicy with `podSelector: {}` and `policyTypes: [Ingress]` and no ingress rules.</details>\n<details><summary>Hint 2</summary>Reuse Advanced Projects 6 (NetworkPolicy) and 7 (RBAC).</details>\n<details><summary>Hint 3</summary>Install kube-bench per its docs; run against the control plane and node.</details>\n<h2>12. Final challenge</h2><p>Restrict who can read Secrets in a namespace using RBAC, and prove a normal SA cannot read them. Protecting Secrets is a core CKS goal.</p><h2>13. What to submit (evidence)</h2><p>Save outputs, policies, and your time in <code>submissions/kubernetes/certification/cks/project-01/</code>. Then say: <strong>\"I submit CKS Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Default-deny networking + least-privilege RBAC + CIS checks. Setup 10% + Hardening 15%.</p></section>","kubernetes/cert/cks/project-02":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKS Drill: System Hardening (15%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>25 minutes</strong>.</p><h2>1. Objective</h2><p>Harden the host and containers: seccomp, AppArmor, and reducing the attack surface.</p><h2>2. Real-world scenario</h2><p>You limit what containers can do on the host, so a break-in does less damage.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Apply a seccomp profile (<code>RuntimeDefault</code>).</li><li>Apply an AppArmor profile to a Pod.</li><li>Reduce host attack surface (fewer services, least privilege — Linux skills!).</li></ul><h2>4. Prerequisites</h2><ul><li>CKS Project 1 completed.</li><li>Read: <code>study/kubernetes/certification/cks/00-cks-exam-guide.md</code>.</li><li>Reuse your Linux Advanced hardening skills.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Run a Pod with <code>securityContext.seccompProfile.type: RuntimeDefault</code>. Confirm it runs.</li><li>Apply an AppArmor profile to a container (annotation/securityContext depending on version) and show it is loaded.</li><li>On the node, show host hardening basics: only needed services running, non-root usage, updates. (Reuse Linux Advanced Project 4.)</li><li>Explain how each step reduces risk.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ seccomp RuntimeDefault applied.</li><li>☐ AppArmor profile applied.</li><li>☐ Host hardening shown.</li></ul><h2>7. Expected outcome</h2><p>Containers and host are more locked down, within 25 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>A Pod uses <code>seccompProfile: RuntimeDefault</code> and runs (show the YAML + <code>kubectl get pod</code>).</li><li>You apply an AppArmor profile to a container and show it is in effect (or clearly show the mechanism if your kernel/runtime lacks AppArmor, and do seccomp fully).</li><li>You show at least 3 host-hardening facts (services/updates/non-root) from the node.</li><li>You explain each step's security benefit in simple English.</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ seccomp applied.</li><li>☐ AppArmor applied/explained.</li><li>☐ Host hardening shown.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cks/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Forgetting seccomp makes some syscalls blocked — test the app.</li><li>AppArmor profile not loaded on the node.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>seccomp: `securityContext: { seccompProfile: { type: RuntimeDefault } }`.</details>\n<details><summary>Hint 2</summary>Reuse Linux Advanced Project 4 (hardening) for the host part.</details>\n<details><summary>Hint 3</summary>Check AppArmor status on the node: `sudo aa-status`.</details>\n<h2>12. Final challenge</h2><p>Write a custom seccomp profile that blocks a specific syscall, apply it, and show the blocked call fails. Custom seccomp is an advanced CKS skill.</p><h2>13. What to submit (evidence)</h2><p>Save YAML, node hardening facts, and your time in <code>submissions/kubernetes/certification/cks/project-02/</code>. Then say: <strong>\"I submit CKS Project 2.\"</strong></p><hr><p><strong>Remember:</strong> seccomp + AppArmor + host hardening reduce what an attacker can do. 15% of CKS.</p></section>","kubernetes/cert/cks/project-03":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKS Drill: Minimize Microservice Vulnerabilities (20%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>30 minutes</strong>.</p><h2>1. Objective</h2><p>Lock down Pods: restricted securityContext, Pod Security Admission, and safer Secrets.</p><h2>2. Real-world scenario</h2><p>Make every Pod follow strict rules so a compromised app cannot do much.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Restricted securityContext (non-root, drop caps, read-only, no priv-esc).</li><li>Enforce Pod Security Admission (<code>restricted</code>).</li><li>Encrypt Secrets at rest (idea + config).</li></ul><h2>4. Prerequisites</h2><ul><li>CKS Project 2 completed.</li><li>Read: <code>study/kubernetes/certification/cks/00-cks-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Label a namespace to <strong>enforce</strong> the <code>restricted</code> Pod Security standard.</li><li>Try to create a privileged/root Pod there; show it is <strong>rejected</strong>.</li><li>Create a compliant Pod (non-root, drop ALL caps, read-only fs, no privilege escalation) and show it runs.</li><li>Explain (or configure on a practice cluster) <strong>encryption at rest</strong> for Secrets (EncryptionConfiguration).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Namespace enforces <code>restricted</code>.</li><li>☐ Bad Pod rejected.</li><li>☐ Compliant Pod runs.</li><li>☐ Secret encryption explained/configured.</li></ul><h2>7. Expected outcome</h2><p>Pods must be safe by policy; unsafe Pods are blocked. Within 30 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>The namespace has <code>pod-security.kubernetes.io/enforce=restricted</code>.</li><li>A privileged/root Pod is <strong>rejected</strong> (show the error).</li><li>A compliant Pod runs (show its securityContext: runAsNonRoot, drop ALL, readOnlyRootFilesystem, allowPrivilegeEscalation false).</li><li>You correctly describe (or configure) Secret encryption at rest.</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Restricted enforced.</li><li>☐ Bad Pod blocked.</li><li>☐ Compliant Pod runs.</li><li>☐ Secret encryption covered.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cks/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Compliant Pod missing one field → rejected.</li><li>Confusing enforce vs warn vs audit labels.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Enforce: `kubectl label ns <ns> pod-security.kubernetes.io/enforce=restricted`.</details>\n<details><summary>Hint 2</summary>Reuse the securityContext from CKAD Project 3 / Docker Advanced hardening.</details>\n<details><summary>Hint 3</summary>Secret encryption: an EncryptionConfiguration file referenced by the apiserver `--encryption-provider-config` flag.</details>\n<h2>12. Final challenge</h2><p>Add an admission policy tool (OPA Gatekeeper or Kyverno) that blocks images from untrusted registries. Policy-as-code is a strong CKS skill.</p><h2>13. What to submit (evidence)</h2><p>Save the namespace label, the rejection, the compliant Pod, and your notes in <code>submissions/kubernetes/certification/cks/project-03/</code>. Then say: <strong>\"I submit CKS Project 3.\"</strong></p><hr><p><strong>Remember:</strong> Restricted Pods by policy; block unsafe ones; encrypt Secrets. 20% of CKS.</p></section>","kubernetes/cert/cks/project-04":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKS Drill: Supply Chain Security (20%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>25 minutes</strong>.</p><h2>1. Objective</h2><p>Make the image pipeline safe: scan for CVEs, use minimal base images, and allow only trusted images.</p><h2>2. Real-world scenario</h2><p>A vulnerable image was deployed and got exploited. Now every image must be scanned and only trusted ones allowed.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Scan images with Trivy.</li><li>Choose minimal/distroless bases.</li><li>Restrict which images/registries may run.</li></ul><h2>4. Prerequisites</h2><ul><li>CKS Project 3 completed.</li><li>Read: <code>study/kubernetes/certification/cks/00-cks-exam-guide.md</code>.</li><li>Reuse Docker Advanced (multi-stage, small images).</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Scan a big image (e.g. <code>nginx:1.27</code>) with <code>trivy image</code>; note high/critical CVEs.</li><li>Scan a small base (e.g. <code>nginx:1.27-alpine</code> or a distroless-based build); compare CVE counts.</li><li>Show an <strong>image allowlist</strong> approach: an admission policy (OPA/Kyverno) OR <code>imagePolicyWebhook</code>/<code>ImagePullPolicy</code> reasoning that only trusted registries are allowed.</li><li>Explain image signing/verification (cosign) in one paragraph.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Trivy scan on a big image.</li><li>☐ Trivy scan on a small image (compare).</li><li>☐ Allowlist approach shown/explained.</li><li>☐ Signing explained.</li></ul><h2>7. Expected outcome</h2><p>You can scan images, pick safer bases, and restrict which images run — within 25 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>trivy image</code> output shown for a big image, with CVE counts.</li><li>A smaller base scanned and compared (fewer CVEs) — show both.</li><li>You show or clearly describe an allowlist mechanism (Kyverno/OPA policy, or webhook) that blocks untrusted registries.</li><li>You explain image signing/verification (cosign) correctly.</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Scans done + compared.</li><li>☐ Allowlist shown/explained.</li><li>☐ Signing explained.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cks/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Using a big base with many CVEs.</li><li>No image restrictions (any registry allowed).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`trivy image nginx:1.27` then `trivy image nginx:1.27-alpine`.</details>\n<details><summary>Hint 2</summary>Reuse Docker Advanced Project 1 (multi-stage/small images).</details>\n<details><summary>Hint 3</summary>Kyverno/OPA can require images to come from `myregistry.example.com/*` only.</details>\n<h2>12. Final challenge</h2><p>Write a Kyverno (or OPA Gatekeeper) policy that blocks any image tagged <code>latest</code> and any image not from your registry. Enforce it and show a bad Pod rejected.</p><h2>13. What to submit (evidence)</h2><p>Save the scans, the comparison, the allowlist policy/notes, and your time in <code>submissions/kubernetes/certification/cks/project-04/</code>. Then say: <strong>\"I submit CKS Project 4.\"</strong></p><hr><p><strong>Remember:</strong> Scan images, use small trusted bases, allow only trusted registries, verify signatures. 20% of CKS.</p></section>","kubernetes/cert/cks/project-05":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKS Drill: Monitoring, Logging &amp; Runtime Security (20%)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>⏱️ <strong>Timed drill.</strong> Set a timer for <strong>30 minutes</strong>.</p><h2>1. Objective</h2><p>Watch for attacks at runtime: Falco alerts and apiserver audit logging.</p><h2>2. Real-world scenario</h2><p>You must detect if someone opens a shell in a container or does something odd. Falco and audit logs give you eyes.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Install/use Falco to detect strange behavior.</li><li>Enable apiserver audit logging.</li><li>Read and reason about alerts.</li></ul><h2>4. Prerequisites</h2><ul><li>CKS Project 4 completed.</li><li>Read: <code>study/kubernetes/certification/cks/00-cks-exam-guide.md</code>.</li></ul><h2>5. Step-by-step requirements (within the time limit)</h2><ol><li>Install Falco (or use a cluster where it runs). Trigger an event: exec a shell into a Pod. Show Falco's alert.</li><li>Enable <strong>audit logging</strong> on the apiserver (audit policy file + log path). Show an audit log entry for an action you took.</li><li>Explain what each tool detects and why it matters.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Falco alert triggered and shown.</li><li>☐ Audit logging enabled + an entry shown.</li><li>☐ Explanation written.</li></ul><h2>7. Expected outcome</h2><p>You can detect runtime events (Falco) and record apiserver actions (audit), within 30 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You trigger a Falco rule (e.g. \"shell in a container\") and show the alert output.</li><li>You enable audit logging (show the policy file + apiserver flags) and show one audit log entry for an action you performed. (If your lab cannot change the apiserver safely, show the exact config and demonstrate Falco fully.)</li><li>You explain in simple English what Falco and audit logs each detect.</li><li>You report your time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Falco alert shown.</li><li>☐ Audit logging shown/explained.</li><li>☐ Explanation written.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cks/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Falco not running on the node.</li><li>Wrong audit policy path/flags.</li><li>Not testing (no alert produced).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Trigger Falco: `kubectl exec -it <pod> -- sh` usually fires a \"shell in container\" rule.</details>\n<details><summary>Hint 2</summary>Audit: apiserver flags `--audit-policy-file` and `--audit-log-path`; edit the static Pod manifest on a practice cluster.</details>\n<details><summary>Hint 3</summary>killercoda has Falco + audit CKS scenarios.</details>\n<h2>12. Final challenge</h2><p>Write a custom Falco rule that alerts when a file in <code>/etc</code> is written inside a container, trigger it, and show the alert. Custom rules are a strong CKS skill.</p><h2>13. What to submit (evidence)</h2><p>Save the Falco alert, the audit config + entry, and your time in <code>submissions/kubernetes/certification/cks/project-05/</code>. Then say: <strong>\"I submit CKS Project 5.\"</strong></p><hr><p><strong>Remember:</strong> Falco watches runtime behavior; audit logs record apiserver actions. Detect early. 20% of CKS.</p></section>","kubernetes/cert/cks/project-06":"<section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>CKS: Take the Mock Exam</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>last CKS project</strong> and the last of the whole Certification Level. Take the full CKS Mock Exam. Passing it (with no weak domain) marks you <strong>CKS-ready</strong> and completes the certification tier. Then the <strong>Capstone</strong> awaits.</p><h2>1. Objective</h2><p>Sit a timed, scored CKS mock covering every security domain, and fix any weak areas.</p><h2>2. Real-world scenario</h2><p>Your CKS rehearsal: 120 minutes of hardening, policies, scanning, and runtime detection.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Full-exam security pacing.</li><li>Weak-domain review.</li></ul><h2>4. Prerequisites</h2><ul><li>CKS Projects 1–5 completed.</li><li>Read: <code>study/kubernetes/certification/cks/00-cks-exam-guide.md</code>.</li><li>A practice environment with the tools (killercoda CKS scenarios recommended).</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Open <code>exams/cks/mock-1.md</code>. Set a 120-minute timer.</li><li>Do the 11 tasks. Switch to the right cluster for each.</li><li>Save all evidence under <code>submissions/kubernetes/certification/cks/mock-1/</code>.</li><li>Ask the mentor to grade with <code>exams/cks/rubric-1.md</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Mock attempted within 120 min.</li><li>☐ Evidence saved per task.</li><li>☐ Domain scores recorded.</li><li>☐ Weak areas fixed.</li></ul><h2>7. Expected outcome</h2><p>A domain-by-domain security score and confidence you are CKS-ready.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You attempted the mock within the time limit and saved evidence for each task.</li><li>The mentor grades it with the rubric and writes <code>domainScores</code> into <code>progress.json</code>.</li><li><strong>Overall ≥ 0.66</strong> AND <strong>no domain below 0.66</strong>.</li><li>Any weak domain was fixed (redo its drill, re-score) before this passes.</li><li>You report your total time.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Mock graded.</li><li>☐ No weak domain remaining.</li><li>☐ Evidence saved in <code>submissions/kubernetes/certification/cks/project-06/</code> (+ mock folder).</li></ul><h2>10. Common mistakes</h2><ul><li>Leaving a Pod root/privileged.</li><li>Allowing all traffic or all images.</li><li>Not testing Falco/Trivy output.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Do the \"for real\" tasks first (NetworkPolicy, RBAC, seccomp, Pod Security, Trivy, Falco).</details>\n<details><summary>Hint 2</summary>For apiserver-level tasks (audit, encryption), use a throwaway cluster you can rebuild.</details>\n<details><summary>Hint 3</summary>Weak domain? Redo that drill (Projects 1–5) and retake.</details>\n<h2>12. Final challenge</h2><p>Retake and beat your score + time. Aim for 80%+ across all six security domains.</p><h2>13. What to submit (evidence)</h2><p>Save the full mock evidence in <code>submissions/kubernetes/certification/cks/</code>. Then say: <strong>\"I submit CKS Project 6 (Mock Exam).\"</strong> When it passes with no weak domain, you complete the <strong>Certification Level</strong> — CKAD, CKA, and CKS! 🎉🎉🎉 Next: the Capstone.</p><hr><p><strong>Remember:</strong> Least privilege everywhere. Scan, restrict, watch. Fix weak areas, then take on the Capstone.</p></section>","anthropic/beginner/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Write a Good Prompt</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Claude</strong> — an AI assistant made by Anthropic. You talk to it in normal language.</li><li><strong>Prompt</strong> — the message you send to Claude.</li><li><strong>Prompt engineering</strong> — In simple words: the skill of writing prompts that get good answers.</li><li><strong>Context</strong> — the extra information you give so Claude understands your need.</li><li><strong>Output</strong> — the answer Claude writes back.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Claude is smart, but it cannot read your mind. It only knows what you write.</p><p>Think of Claude like a very fast helper who just joined your team today. 🧑‍💻</p><ul><li>If you say \"fix it\", the helper does not know what \"it\" is.</li><li>If you say \"Fix the spelling mistakes in this email, and keep it polite\", the helper knows exactly what to do.</li></ul><p>So the secret is simple: <strong>say clearly what you want.</strong></p><p>A good prompt usually has these parts:</p><ol><li><strong>The task</strong> — what you want (e.g. \"Write a summary\").</li><li><strong>The context</strong> — the details or the text to work on.</li><li><strong>The rules</strong> — how you want it (e.g. \"in 3 bullet points, simple English\").</li><li><strong>The example</strong> (optional) — show one example of a good answer.</li></ol><h2>2. Key concepts and terms</h2><ul><li><strong>Be specific</strong> — In simple words: give exact details, not vague words.</li><li><strong>Give context</strong> — In simple words: paste the text or facts Claude needs.</li><li><strong>Set the format</strong> — In simple words: tell Claude the shape of the answer (list, table, short, long).</li><li><strong>Iterate</strong> — In simple words: if the answer is not perfect, change your prompt and try again.</li></ul><h2>3. Practical examples</h2><p><strong>Weak prompt:</strong></p><blockquote><p>Tell me about Linux.</p></blockquote><p><strong>Strong prompt:</strong></p><blockquote><p>Explain what Linux is to a total beginner.</p><p>Use very simple English. Use 3 short bullet points. Give one real-life example.</p></blockquote><p>The strong prompt gives a much better answer, because it says the <strong>audience</strong>, the <strong>format</strong>, and asks for an <strong>example</strong>.</p><h2>4. Commands and config examples</h2><p>You do not need code for this lesson. You just write text prompts. Here is a simple prompt \"recipe\" you can copy:</p><pre><code>Task: &lt;what you want Claude to do&gt;\nText/Context: &lt;paste the text or facts here&gt;\nRules: &lt;format, length, tone, language&gt;\nExample (optional): &lt;show one good example&gt;</code></pre><h2>5. Hands-on exercises (do these now)</h2><ol><li>Take a weak prompt: \"Help with my CV.\" Rewrite it to be strong (add task, context, rules).</li><li>Ask Claude to explain \"what is a container\" in simple English, in 3 bullets.</li><li>Ask the same question again, but this time say: \"Explain it to a 12-year-old with a fun example.\" See how the answer changes.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> The answer is too long.</li></ul><p>  <strong>Fix:</strong> Add a rule: \"Answer in 3 short bullet points.\"</p><ul><li><strong>Problem:</strong> The answer is too hard to read.</li></ul><p>  <strong>Fix:</strong> Add: \"Use very simple English. Explain hard words.\"</p><ul><li><strong>Problem:</strong> Claude misunderstood you.</li></ul><p>  <strong>Fix:</strong> Give more context. Show one example of what a good answer looks like.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li><strong>Too vague</strong> (\"make it better\") — instead say exactly what \"better\" means.</li><li><strong>No context</strong> — always paste the text or facts Claude needs.</li><li><strong>Many questions in one messy prompt</strong> — ask one clear thing at a time.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>For <strong>CCAO-F</strong> (Associate) and <strong>CCDV-F</strong> (Developer): you must know good prompting basics — being specific, giving context, setting the format, and using examples.</li><li>Remember the idea of <strong>iteration</strong>: improve the prompt step by step.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Name 3 parts of a good prompt.</li><li>Why is \"fix it\" a weak prompt?</li><li>Rewrite this weak prompt to be strong: \"Write about dogs.\"</li></ol><h2>10. References (official docs + good free resources)</h2><ul><li>Anthropic docs — Prompt engineering overview: <a href=\"https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview\" target=\"_blank\" rel=\"noopener\">https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview</a> (checked: 2026-09-18)</li><li>Anthropic Academy (free courses): <a href=\"https://www.anthropic.com/learn\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/learn</a> (checked: 2026-09-18)</li><li>Video: <strong>Anthropic</strong> official YouTube channel — search \"prompt engineering\" — <a href=\"https://www.youtube.com/@anthropic-ai\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@anthropic-ai</a> (checked: 2026-09-18)</li></ul><p>*(If a link changed, search the title on the official Anthropic site.)*</p><hr><p><strong>Remember:</strong> Say the <strong>task</strong>, give the <strong>context</strong>, set the <strong>rules</strong>. Clear prompt → clear answer.</p><details><summary>Answers to practice questions</summary>\n<ol><li>Task, context, rules (and optionally an example).</li><li>Because \"it\" has no context — Claude does not know what to fix or how.</li><li>Example strong version: \"Write a short, friendly paragraph (4 sentences) about why dogs make good pets. Use simple English. Give one real example.\"</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Talk to Claude: Your First Good Prompt</h1><p><strong>Status:</strong> ▶️ Start</p><p>*(The real status lives in <code>progress.json</code>.)*</p><h2>1. Objective</h2><p>Learn to write clear prompts. You will turn weak prompts into strong prompts and see how the answers get better.</p><h2>2. Real-world scenario</h2><p>You work in a company. You must write a short, polite email to a customer. You want Claude to help, fast. If your prompt is weak, the email is bad. If your prompt is strong
