hows live metrics?</li></ol><h2>10. References</h2><ul><li>Docker logging: <a href=\"https://docs.docker.com/config/containers/logging/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/config/containers/logging/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Monitoring &amp; logging\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Log to stdout, rotate logs, watch metrics with <code>docker stats</code>, and use health checks. See everything.</p><details><summary>Answers</summary>\n<ol><li>To stdout/stderr (the screen), so Docker collects them.</li><li>So logs rotate and do not fill the disk.</li><li><code>docker stats</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Make Your App Observable</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Set up logs, log rotation, live metrics, and health so you can see what your app is doing.</p><h2>2. Real-world scenario</h2><p>An app failed last night and nobody knew until users complained. The team wants observability: good logs, rotation, metrics, and health — so problems are seen early.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Log to stdout and view with <code>docker compose logs</code>.</li><li>Set log rotation.</li><li>Watch metrics with <code>docker stats</code>.</li><li>Check health status.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Advanced Project 4 completed.</li><li>Read: <code>study/docker/advanced/05-observability.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Compose with your app + a health check + log rotation (<code>max-size</code>, <code>max-file</code>).</li><li>Start it. Make some traffic (a few <code>curl</code> requests).</li><li>Show <code>docker compose logs --tail 50</code> for the app (proves logs go to stdout).</li><li>Show <code>docker stats --no-stream</code> for the app (metrics).</li><li>Show the app's health status (<code>docker ps</code> shows <code>(healthy)</code>).</li><li>Show the log driver config is applied (<code>docker inspect</code>).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Logs visible via <code>docker compose logs</code>.</li><li>☐ Log rotation configured.</li><li>☐ Metrics shown with stats.</li><li>☐ Health shown.</li></ul><h2>7. Expected outcome</h2><p>You can see your app's logs, metrics, and health at any time. Logs rotate so they never fill the disk.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>compose.yaml</code> shows a <code>logging</code> block with <code>max-size</code> and <code>max-file</code>.</li><li><code>docker compose logs --tail 50 &lt;app&gt;</code> shows real log lines (app logs to stdout).</li><li><code>docker stats --no-stream</code> shows CPU and memory for the app.</li><li><code>docker ps</code> shows the app <code>(healthy)</code> (health check present).</li><li>You explain in one sentence why apps should log to stdout, not a file inside the container.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Logs + rotation.</li><li>☐ Metrics.</li><li>☐ Health.</li><li>☐ Evidence saved in <code>submissions/docker/advanced/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>App logs to a file inside → logs lost. Log to stdout.</li><li>No rotation → disk fills.</li><li>No health check → cannot tell if the app is really working.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Add the `logging` block from `study/docker/advanced/05-observability.md`, section 3.</details>\n<details><summary>Hint 2</summary>Make traffic: `for i in $(seq 1 20); do curl -s http://localhost:8080/ >/dev/null; done`.</details>\n<details><summary>Hint 3</summary>Metrics format: `docker stats --no-stream --format \"table {{.Name}}\\t{{.CPUPerc}}\\t{{.MemUsage}}\"`.</details>\n<h2>12. Final challenge</h2><p>Add a real metrics tool: run <code>prom/prometheus</code> (or <code>cadvisor</code>) in your compose to collect container metrics, and open its web UI. This is a small preview of production monitoring.</p><h2>13. What to submit (evidence)</h2><p>Save <code>compose.yaml</code>, the logs, stats, and health outputs in <code>submissions/docker/advanced/project-05/</code>. Then say: <strong>\"I submit Docker Advanced Project 5.\"</strong></p><hr><p><strong>Remember:</strong> Logs (stdout + rotation), metrics (stats), health (checks). See everything, early.</p></section>","docker/advanced/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Resource Limits and Restart Policies</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Resource limit</strong> — a cap on how much CPU or memory a container may use.</li><li><strong>Restart policy</strong> — what Docker does if a container stops (restart it or not).</li><li><strong>OOM</strong> — Out Of Memory. When a process uses too much memory and gets killed.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>In production, you must protect the machine and keep apps running.</p><ol><li><strong>Limits</strong> stop one container from eating all CPU/memory and starving others.</li><li><strong>Restart policies</strong> bring an app back if it crashes.</li></ol><p>Together they make your app <strong>reliable</strong> and <strong>fair</strong>.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>--memory 256m</code></strong> — max memory. If passed, the app is killed (OOM, code 137).</li><li><strong><code>--cpus 0.5</code></strong> — max half a CPU.</li><li><strong>Restart policies:</strong></li><li><code>no</code> — never restart (default).</li><li><code>on-failure</code> — restart only if it crashes (non-zero exit).</li><li><code>always</code> — always restart.</li><li><code>unless-stopped</code> — restart unless you stopped it by hand.</li></ul><h2>3. Practical examples</h2><pre><code>docker run -d --name app --memory 256m --cpus 0.5 --restart on-failure:5 myapp:1.0.0</code></pre><p>In compose:</p><pre><code>services:\n  app:\n    image: myapp:1.0.0\n    mem_limit: 256m\n    cpus: 0.5\n    restart: unless-stopped</code></pre><h2>4. Commands and config examples</h2><pre><code>docker stats --no-stream          # see usage vs limits\ndocker inspect --format '{{.HostConfig.RestartPolicy.Name}}' &lt;name&gt;\ndocker inspect --format '{{.State.ExitCode}}' &lt;name&gt;   # 137 = OOM/killed</code></pre><h2>5. Hands-on exercises</h2><ol><li>Run a container with <code>--memory 128m</code> and try to use more; see it killed (137).</li><li>Run with <code>--restart on-failure</code> and make it crash; watch it restart.</li><li>Check the restart policy with <code>docker inspect</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> container keeps getting killed (137).</li></ul><p>  <strong>Fix:</strong> it needs more memory, or has a leak. Raise the limit or fix the app.</p><ul><li><strong>Problem:</strong> crashed app does not come back.</li></ul><p>  <strong>Fix:</strong> set a restart policy (<code>on-failure</code> or <code>unless-stopped</code>).</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>No limits — one container can crash the whole machine.</li><li><code>restart: always</code> on a broken app — it loops forever. Use <code>on-failure</code> with a max, and fix the app.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> Kubernetes uses <code>resources.requests</code> and <code>resources.limits</code>, and restart is built into Pods (<code>restartPolicy</code>). This lesson maps to those.</li><li>Setting requests/limits is a common exam task.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does exit code 137 mean?</li><li>Which restart policy restarts only on a crash?</li><li>Why set resource limits?</li></ol><h2>10. References</h2><ul><li>Docker resource limits: <a href=\"https://docs.docker.com/config/containers/resource_constraints/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/config/containers/resource_constraints/</a> (checked: 2026-09-18)</li><li>Restart policies: <a href=\"https://docs.docker.com/config/containers/start-containers-automatically/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/config/containers/start-containers-automatically/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Limits protect the machine; restart policies keep apps up. This maps to K8s requests/limits and restartPolicy.</p><details><summary>Answers</summary>\n<ol><li>The container was killed — often out of memory (OOM).</li><li><code>on-failure</code>.</li><li>To stop one container from using all resources and hurting others.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Set Limits and Auto-Restart</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Protect the machine with resource limits, and keep the app up with a restart policy.</p><h2>2. Real-world scenario</h2><p>One buggy container used all the memory and crashed the server. The team wants limits on every container, and auto-restart for crashes.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Set memory and CPU limits.</li><li>See an OOM kill (exit 137).</li><li>Use restart policies.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker Advanced Project 5 completed.</li><li>Read: <code>study/docker/advanced/06-resource-limits.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Run your app with <code>--memory 256m --cpus 0.5</code> and <code>--restart on-failure:3</code>.</li><li>Show the limits are active (<code>docker stats --no-stream</code>, <code>docker inspect</code> restart policy).</li><li><strong>OOM demo:</strong> run a throwaway container with <code>--memory 64m</code> that tries to use more memory, and show it exits with code <strong>137</strong>.</li><li><strong>Restart demo:</strong> run a container that crashes (<code>exit 1</code>) with <code>--restart on-failure:3</code>, and show Docker restarts it (RestartCount goes up).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ App runs with memory + CPU limits.</li><li>☐ Restart policy set.</li><li>☐ OOM kill shown (137).</li><li>☐ Auto-restart shown (RestartCount rises).</li></ul><h2>7. Expected outcome</h2><p>Your app has limits and auto-restart. You saw an OOM kill and an auto-restart in action.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show the <code>docker run</code> (or compose) with <code>--memory</code>, <code>--cpus</code>, and a restart policy.</li><li><code>docker stats --no-stream</code> shows the memory limit.</li><li>The OOM demo container exits with code <strong>137</strong> (show <code>docker inspect --format '{{.State.ExitCode}}'</code>).</li><li>The restart demo shows RestartCount increasing (<code>docker inspect --format '{{.RestartCount}}'</code>).</li><li>You explain in one sentence what code 137 means.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Limits active.</li><li>☐ OOM (137) shown.</li><li>☐ Auto-restart shown.</li><li>☐ Evidence saved in <code>submissions/docker/advanced/project-06/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>No limits at all.</li><li><code>restart: always</code> on a broken app → infinite loop. Use <code>on-failure</code> with a max.</li><li>Confusing exit 0 (clean) with non-zero (error).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>OOM demo: run a small script in a container with `--memory 64m` that keeps allocating memory (e.g. a Python list that grows). It will be killed with 137.</details>\n<details><summary>Hint 2</summary>Crash + restart: `docker run -d --name crasher --restart on-failure:3 alpine sh -c \"sleep 2; exit 1\"`. Watch `docker inspect --format '{{.RestartCount}}' crasher`.</details>\n<details><summary>Hint 3</summary>137 means the process was killed — usually out of memory.</details>\n<h2>12. Final challenge</h2><p>Write the Kubernetes equivalent of your limits as a Pod snippet: <code>resources.requests</code> and <code>resources.limits</code> for memory and CPU. You will use this exact YAML in the Kubernetes track.</p><h2>13. What to submit (evidence)</h2><p>Save the run/compose config, stats, the 137 proof, and the restart-count proof in <code>submissions/docker/advanced/project-06/</code>. Then say: <strong>\"I submit Docker Advanced Project 6.\"</strong></p><hr><p><strong>Remember:</strong> Limits protect the machine; restart policies keep apps up. Straight prep for K8s requests/limits.</p></section>","docker/advanced/project-07":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Ship a Production-Ready Service</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Production-ready</strong> — safe, small, reliable, and watchable enough for real users.</li><li><strong>Checklist</strong> — a list you tick to make sure nothing is missed.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Now you put everything together. A production-ready container service should be:</p><ol><li><strong>Small</strong> — multi-stage build, slim base.</li><li><strong>Safe</strong> — non-root, dropped capabilities, read-only, no-new-privileges.</li><li><strong>Reliable</strong> — health checks, resource limits, restart policy.</li><li><strong>Watchable</strong> — logs to stdout with rotation, metrics.</li><li><strong>Behind a proxy</strong> — one clean public door.</li><li><strong>Data-safe</strong> — named volumes for data.</li></ol><p>This is a <strong>checklist</strong> you will use in real jobs.</p><h2>2. Key concepts and terms</h2><p>The production checklist (tick each one):</p><ul><li>☐ Multi-stage build, slim/distroless base</li><li>☐ Runs as non-root</li><li>☐ <code>cap_drop: [ALL]</code>, <code>read_only: true</code>, <code>no-new-privileges</code></li><li>☐ Health check</li><li>☐ <code>mem_limit</code> + <code>cpus</code></li><li>☐ <code>restart: unless-stopped</code></li><li>☐ Logs to stdout + rotation</li><li>☐ Reverse proxy in front</li><li>☐ Named volume for data</li><li>☐ <code>.dockerignore</code> and a pinned image version</li></ul><h2>3. Practical examples</h2><p>A hardened, reliable compose service:</p><pre><code>services:\n  app:\n    build: .\n    image: myservice:1.0.0\n    user: \"10001\"\n    read_only: true\n    tmpfs: [/tmp]\n    cap_drop: [ALL]\n    security_opt: [\"no-new-privileges:true\"]\n    mem_limit: 256m\n    cpus: 0.5\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD-SHELL\", \"wget -qO- http://localhost:8000/ || exit 1\"]\n      interval: 10s\n      retries: 3\n    logging:\n      driver: json-file\n      options: { max-size: \"10m\", max-file: \"3\" }</code></pre><h2>4. Commands and config examples</h2><pre><code>docker compose up -d --build\ndocker compose ps            # healthy?\ndocker stats --no-stream     # within limits?\ndocker exec &lt;app&gt; id         # non-root?</code></pre><h2>5. Hands-on exercises</h2><ol><li>Take your app and apply every item on the checklist.</li><li>Verify each one with a command.</li><li>Write down which command proves each item.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> read-only breaks the app.</li></ul><p>  <strong>Fix:</strong> add a <code>tmpfs</code> or a writable volume for the path it needs.</p><ul><li><strong>Problem:</strong> health check fails.</li></ul><p>  <strong>Fix:</strong> use a tool that exists in the image; test the command by hand inside.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Doing some items but not all — use the full checklist.</li><li>Not verifying — prove each item with a command.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>This checklist maps almost one-to-one to a secure, reliable Kubernetes Deployment (securityContext, probes, resources, restart). You are now ready for Kubernetes.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Name 3 things that make a service \"safe\".</li><li>Name 2 things that make it \"reliable\".</li><li>Why put it behind a proxy?</li></ol><h2>10. References</h2><ul><li>Docker best practices: <a href=\"https://docs.docker.com/develop/dev-best-practices/\" target=\"_blank\" rel=\"noopener\">https://docs.docker.com/develop/dev-best-practices/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Docker best practices\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Small + Safe + Reliable + Watchable + Proxied + Data-safe = production-ready. Use the checklist.</p><details><summary>Answers</summary>\n<ol><li>Non-root, dropped capabilities, read-only filesystem (also: no-new-privileges, small image).</li><li>Health checks, resource limits, restart policy (any two).</li><li>To have one clean public door and keep the apps private behind it.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Ship a Production-Ready Service (Docker Track Boss 🏆🏆)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>final Docker project</strong>. Finish it to complete the <strong>whole Docker track</strong>. You will combine every Docker skill. After this, you are ready for Kubernetes.</p><h2>1. Objective</h2><p>Package and run a full service that ticks every item on the production checklist: small, safe, reliable, watchable, proxied, and data-safe.</p><h2>2. Real-world scenario</h2><p>Your service goes live next week. It must pass a production review: small image, non-root, hardened, health-checked, resource-limited, auto-restart, good logs, behind a proxy, with safe data. You build it to this standard.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Combine multi-stage, security, health, limits, proxy, volumes, and observability into one service.</li><li>Verify every item.</li></ul><h2>4. Prerequisites</h2><ul><li>All Docker Advanced projects 1–6 completed.</li><li>Read: <code>study/docker/advanced/07-production-ready.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><p>Build a <code>compose.yaml</code> for a real small app (reuse <code>helloapp</code> or similar) plus an nginx <code>proxy</code>, meeting the <strong>production checklist</strong>:</p><ol><li>App image built with a <strong>multi-stage</strong> Dockerfile, slim base.</li><li>App runs <strong>non-root</strong>.</li><li>App hardened: <code>cap_drop: [ALL]</code>, <code>read_only: true</code> (+ tmpfs), <code>no-new-privileges</code>.</li><li>App has a <strong>health check</strong>.</li><li>App has <code>mem_limit</code>, <code>cpus</code>, and <code>restart: unless-stopped</code>.</li><li>Logs to stdout with <strong>rotation</strong>.</li><li>A <strong>reverse proxy</strong> in front (only the proxy is public).</li><li>A <strong>named volume</strong> for any data.</li><li><code>.dockerignore</code> present and image version pinned.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Every checklist item applied.</li><li>☐ Each item proven with a command.</li><li>☐ The whole stack starts with <code>docker compose up -d --build</code> and works.</li></ul><h2>7. Expected outcome</h2><p>One <code>docker compose up</code> starts a production-ready service that passes every checklist item, and you can prove each one.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the multi-stage <code>Dockerfile</code>, <code>compose.yaml</code>, <code>nginx.conf</code>, and <code>.dockerignore</code>.</li><li><code>docker compose ps</code> shows the app <code>(healthy)</code> and reachable <strong>through the proxy</strong> (<code>curl http://localhost:8080/</code>).</li><li><code>docker exec &lt;app&gt; id</code> shows <strong>non-root</strong>.</li><li><code>docker inspect</code> shows the hardening (read-only, cap_drop, no-new-privileges) and the limits.</li><li>The <code>compose.yaml</code> shows <code>restart:</code>, <code>logging:</code> with rotation, and a <strong>named volume</strong>.</li><li>You provide a filled <strong>checklist</strong> (each item) with the command that proves it.</li><li>Only the proxy publishes a port.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ All 9 checklist items applied AND proven.</li><li>☐ Stack works through the proxy.</li><li>☐ Evidence saved in <code>submissions/docker/advanced/project-07/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Missing one or two checklist items — do all of them.</li><li>Not proving each item — attach the command output.</li><li>App breaks under read-only — add a tmpfs/volume for its write path.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Start from the hardened compose service in `study/docker/advanced/07-production-ready.md`, section 3, and add the proxy from Project 4.</details>\n<details><summary>Hint 2</summary>Make a small table: Item | Command | Result. Fill one row per checklist item.</details>\n<details><summary>Hint 3</summary>Health test tool must exist in your base image (e.g. `wget` in alpine, or `pg_isready` for postgres).</details>\n<h2>12. Final challenge</h2><p>Write a one-page \"production readiness report\" for your service: each checklist item, its status, and the proof. This is a real document DevOps teams use before going live. Keep it in simple English.</p><h2>13. What to submit (evidence)</h2><p>Save all files, the working proof through the proxy, the filled checklist with proofs, and your readiness report in <code>submissions/docker/advanced/project-07/</code>. Then say: <strong>\"I submit Docker Advanced Project 7.\"</strong></p><p>When it passes, you complete the <strong>entire Docker track</strong>! 🎉🎉 Next stop: Kubernetes.</p><hr><p><strong>Remember:</strong> Small + Safe + Reliable + Watchable + Proxied + Data-safe. This is production. And it maps straight to a secure Kubernetes Deployment.</p></section>","kubernetes/beginner/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: kubectl and Your Cluster</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Cluster</strong> — a group of machines that run your containers together.</li><li><strong>Node</strong> — one machine in the cluster.</li><li><strong>Control plane</strong> — the \"brain\" that makes decisions.</li><li><strong>kubectl</strong> — the command tool you use to talk to the cluster. (Say \"kube control\".)</li><li><strong>Context</strong> — which cluster + user + namespace <code>kubectl</code> is pointing at.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Kubernetes is a <strong>cluster</strong> of machines (<strong>nodes</strong>). One part, the <strong>control plane</strong>, is the brain. The others run your apps.</p><p>You talk to the cluster with <strong><code>kubectl</code></strong>. You ask it questions (\"show me the nodes\") and give it instructions (\"run this app\"). It talks to the control plane for you.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>kubectl get X</code></strong> — list things (nodes, pods, services...).</li><li><strong><code>kubectl describe X name</code></strong> — full details of one thing.</li><li><strong><code>kubectl cluster-info</code></strong> — where the control plane is.</li><li><strong><code>-n namespace</code></strong> — work in a namespace (a folder for objects).</li><li><strong><code>kubectl config ...</code></strong> — manage contexts (which cluster you point at).</li><li><strong><code>kubectl explain X</code></strong> — built-in help for any object (great in the exam!).</li></ul><h2>3. Practical examples</h2><ul><li>Show nodes → <code>kubectl get nodes</code></li><li>Cluster info → <code>kubectl cluster-info</code></li><li>All pods everywhere → <code>kubectl get pods -A</code></li><li>Help for a Pod → <code>kubectl explain pod.spec</code></li></ul><h2>4. Commands and config examples</h2><pre><code>kubectl version --short          # client + server versions\nkubectl get nodes -o wide        # nodes with more detail\nkubectl cluster-info             # control plane address\nkubectl config current-context   # which cluster am I using?\nkubectl get pods -A              # pods in all namespaces\nkubectl explain deployment.spec.replicas   # docs for a field</code></pre><h2>5. Hands-on exercises</h2><ol><li>Start a cluster (<code>kind create cluster</code> or <code>minikube start</code>).</li><li>Run <code>kubectl get nodes</code>. See the node(s).</li><li>Run <code>kubectl cluster-info</code>.</li><li>Run <code>kubectl get pods -A</code> (system pods live in <code>kube-system</code>).</li><li>Try <code>kubectl explain pod</code> and read the top.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>The connection to the server ... was refused</code>.</li></ul><p>  <strong>Fix:</strong> the cluster is not running or the context is wrong. Start the cluster; check <code>kubectl config current-context</code>.</p><ul><li><strong>Problem:</strong> <code>kubectl: command not found</code>.</li></ul><p>  <strong>Fix:</strong> install kubectl (see references).</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Wrong context — you act on the wrong cluster. Always check <code>current-context</code>.</li><li>Forgetting <code>-n</code> — you look in the wrong namespace.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>The whole CKA/CKAD/CKS exam is <code>kubectl</code> in a terminal. Speed matters.</li><li>Set an alias: <code>alias k=kubectl</code>. Learn <code>kubectl explain</code> — it is your in-exam help.</li><li>Enable autocomplete to type faster.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a node?</li><li>Which command lists all pods in all namespaces?</li><li>What does <code>kubectl explain</code> do?</li></ol><h2>10. References</h2><ul><li>kubectl basics: <a href=\"https://kubernetes.io/docs/reference/kubectl/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/reference/kubectl/</a> (checked: 2026-09-18)</li><li>Install kubectl: <a href=\"https://kubernetes.io/docs/tasks/tools/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/tools/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Kubernetes Tutorial for Beginners\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> <code>kubectl get</code> to list, <code>describe</code> for details, <code>explain</code> for help. Check your context first.</p><details><summary>Answers</summary>\n<ol><li>One machine in the cluster.</li><li><code>kubectl get pods -A</code> (or <code>--all-namespaces</code>).</li><li>Shows built-in docs for any object or field.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Meet Your Cluster with kubectl</h1><p><strong>Status:</strong> 🔒 Locked (unlocks when Kubernetes Beginner opens)</p><h2>1. Objective</h2><p>Set up a small cluster and explore it with <code>kubectl</code>. Get comfortable listing and describing things.</p><h2>2. Real-world scenario</h2><p>Your first day on a Kubernetes team. Your boss says: *\"Log in, check the cluster is healthy, and show me the nodes and the system pods.\"* You must be at home in <code>kubectl</code>.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Start a local cluster (kind or minikube).</li><li>List and describe cluster objects.</li><li>Check your context.</li><li>Use <code>kubectl explain</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Docker track completed (kind runs on Docker).</li><li>kubectl + kind (or minikube) installed.</li><li>Read: <code>study/kubernetes/beginner/01-kubectl-and-cluster.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a cluster: <code>kind create cluster</code> (or <code>minikube start</code>).</li><li>Show the nodes: <code>kubectl get nodes -o wide</code>.</li><li>Show cluster info: <code>kubectl cluster-info</code>.</li><li>Show your current context: <code>kubectl config current-context</code>.</li><li>Show all pods in all namespaces: <code>kubectl get pods -A</code>.</li><li>Describe one system pod: <code>kubectl describe pod -n kube-system &lt;a-pod-name&gt;</code>.</li><li>Use <code>kubectl explain pod.spec</code> and read a bit.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Cluster running (node is <code>Ready</code>).</li><li>☐ <code>kubectl get nodes</code> works.</li><li>☐ <code>cluster-info</code> shown.</li><li>☐ <code>get pods -A</code> shows system pods.</li><li>☐ One pod described.</li><li>☐ <code>explain</code> tried.</li></ul><h2>7. Expected outcome</h2><p>You have a running cluster and can explore it confidently with <code>kubectl</code>.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>kubectl get nodes</code> shows at least one node in <code>Ready</code> state.</li><li><code>kubectl cluster-info</code> output shown.</li><li><code>kubectl config current-context</code> output shown.</li><li><code>kubectl get pods -A</code> shows pods in <code>kube-system</code>.</li><li><code>kubectl describe pod -n kube-system &lt;name&gt;</code> output shown (any system pod).</li><li>You paste a few lines from <code>kubectl explain pod.spec</code>.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Node Ready.</li><li>☐ Explored with get/describe/explain.</li><li>☐ Evidence saved in <code>submissions/kubernetes/beginner/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Cluster not started → connection refused. Start it first.</li><li>Wrong context → acting on the wrong cluster.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`kind create cluster` then `kubectl get nodes`. Wait until the node is `Ready`.</details>\n<details><summary>Hint 2</summary>Set `alias k=kubectl` to type faster. `k get pods -A` lists everything.</details>\n<details><summary>Hint 3</summary>Pick any pod name from `kubectl get pods -n kube-system`, then `kubectl describe pod -n kube-system <that-name>`.</details>\n<h2>12. Final challenge</h2><p>Turn on kubectl autocomplete and the <code>k</code> alias for this session (see the kubectl docs cheat sheet). Being fast in the terminal is worth real exam points.</p><h2>13. What to submit (evidence)</h2><p>Save all command outputs in <code>submissions/kubernetes/beginner/project-01/</code>. Then say: <strong>\"I submit Kubernetes Beginner Project 1.\"</strong></p><hr><p><strong>Remember:</strong> <code>kubectl get</code>, <code>describe</code>, <code>explain</code>. Check your context. This is your home for the whole K8s journey.</p></section>","kubernetes/beginner/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Pods</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Pod</strong> — the smallest thing Kubernetes runs. It holds one (or a few) containers.</li><li><strong>Manifest</strong> — a YAML file that describes what you want.</li><li><strong>apply</strong> — send a manifest to the cluster (<code>kubectl apply -f file.yaml</code>).</li><li><strong>kind</strong> (in YAML) — the type of object (Pod, Deployment, Service...).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>In Kubernetes you do not run containers directly. You run <strong>Pods</strong>. A Pod is a small wrapper around one container (sometimes a few that must stay together).</p><p>You describe a Pod in a <strong>YAML manifest</strong>, then <strong>apply</strong> it. Kubernetes creates it and keeps it running.</p><blockquote><p>Note: you rarely create bare Pods in real work. You use Deployments (next lesson). But learning Pods first makes everything else clear.</p></blockquote><h2>2. Key concepts and terms</h2><ul><li>A Pod has: a name, one or more containers, each with an <code>image</code>.</li><li><code>kubectl run</code> makes a quick Pod. <code>kubectl apply -f</code> uses a YAML file.</li><li><code>kubectl get pods</code>, <code>kubectl describe pod</code>, <code>kubectl logs</code>, <code>kubectl exec</code> — same ideas as Docker.</li><li>Pods are <strong>ephemeral</strong> — if one dies, it is gone (a Deployment would replace it).</li></ul><h2>3. Practical examples</h2><p>A Pod manifest:</p><pre><code>apiVersion: v1\nkind: Pod\nmetadata:\n  name: web\n  labels:\n    app: web\nspec:\n  containers:\n    - name: nginx\n      image: nginx:1.27\n      ports:\n        - containerPort: 80</code></pre><pre><code>kubectl apply -f pod.yaml\nkubectl get pods\nkubectl logs web\nkubectl exec -it web -- sh\nkubectl delete pod web</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl run tmp --image=nginx:1.27           # quick pod\nkubectl get pod web -o yaml                   # see the full object\nkubectl describe pod web                       # events + details\nkubectl run test --image=busybox -it --rm -- sh   # throwaway shell pod\n# generate YAML without creating (great for the exam):\nkubectl run web --image=nginx:1.27 --dry-run=client -o yaml &gt; pod.yaml</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write <code>pod.yaml</code> for an nginx pod. <code>apply</code> it. Check <code>get pods</code>.</li><li>See its logs and describe it.</li><li><code>exec</code> into it and run <code>ls</code>.</li><li>Delete it.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Pod stuck in <code>ImagePullBackOff</code>.</li></ul><p>  <strong>Fix:</strong> wrong image name/tag, or no internet. Check the image with <code>kubectl describe pod</code>.</p><ul><li><strong>Problem:</strong> Pod <code>CrashLoopBackOff</code>.</li></ul><p>  <strong>Fix:</strong> the app keeps crashing. Read <code>kubectl logs</code>.</p><ul><li><strong>Problem:</strong> Pod <code>Pending</code>.</li></ul><p>  <strong>Fix:</strong> no node has room, or it is waiting. <code>kubectl describe pod</code> shows why.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Wrong indentation in YAML — use spaces, keep it even.</li><li>Wrong <code>apiVersion</code>/<code>kind</code> — Pod is <code>apiVersion: v1</code>, <code>kind: Pod</code>.</li><li>Expecting a bare Pod to restart itself after delete — it will not. Use a Deployment.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> you create Pods and read their status a lot. Learn to generate YAML fast with <code>--dry-run=client -o yaml</code>.</li><li><code>kubectl describe pod</code> + <code>kubectl logs</code> solve most Pod problems.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a Pod?</li><li>How do you apply a manifest?</li><li>What does <code>ImagePullBackOff</code> mean?</li></ol><h2>10. References</h2><ul><li>Pods: <a href=\"https://kubernetes.io/docs/concepts/workloads/pods/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/workloads/pods/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Kubernetes Pods\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> A Pod wraps a container. Write YAML, <code>apply</code>, then <code>get</code>/<code>describe</code>/<code>logs</code>. Generate YAML with <code>--dry-run=client -o yaml</code>.</p><details><summary>Answers</summary>\n<ol><li>The smallest unit Kubernetes runs — a wrapper around one (or a few) containers.</li><li><code>kubectl apply -f file.yaml</code>.</li><li>Kubernetes could not pull the container image (wrong name/tag or no access).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Run and Inspect a Pod</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Create a Pod from a YAML manifest, inspect it, read its logs, and go inside it.</p><h2>2. Real-world scenario</h2><p>You need to test a container in the cluster. You write a small Pod manifest, apply it, and check it is healthy — the most basic Kubernetes skill.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Write a Pod manifest.</li><li>Apply it and read its status.</li><li>Use <code>describe</code>, <code>logs</code>, and <code>exec</code>.</li><li>Generate YAML with <code>--dry-run</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Beginner Project 1 completed.</li><li>Read: <code>study/kubernetes/beginner/02-pods.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Generate a starting YAML: <code>kubectl run web --image=nginx:1.27 --dry-run=client -o yaml &gt; pod.yaml</code>.</li><li>Add a label <code>app: web</code> in the manifest (if not there).</li><li><code>kubectl apply -f pod.yaml</code>.</li><li>Show <code>kubectl get pods</code> (Pod should become <code>Running</code>).</li><li><code>kubectl describe pod web</code> — read the events.</li><li><code>kubectl logs web</code> and <code>kubectl exec -it web -- ls /usr/share/nginx/html</code>.</li><li>Delete the Pod.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Pod YAML created (via dry-run).</li><li>☐ Label <code>app: web</code> present.</li><li>☐ Pod is <code>Running</code>.</li><li>☐ describe, logs, and exec shown.</li><li>☐ Pod deleted.</li></ul><h2>7. Expected outcome</h2><p>Your Pod runs. You can inspect it fully and clean it up.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the <code>pod.yaml</code> (kind: Pod, image nginx:1.27, label <code>app: web</code>).</li><li><code>kubectl get pods</code> shows <code>web</code> as <code>Running</code>.</li><li><code>kubectl describe pod web</code> output shown (events section visible).</li><li><code>kubectl exec web -- ls /usr/share/nginx/html</code> shows files.</li><li>You show you generated the YAML with <code>--dry-run=client -o yaml</code>.</li><li>You deleted the Pod at the end.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Pod Running.</li><li>☐ Inspected fully.</li><li>☐ YAML generated with dry-run.</li><li>☐ Evidence saved in <code>submissions/kubernetes/beginner/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>YAML indentation errors (use spaces).</li><li><code>ImagePullBackOff</code> from a wrong image tag.</li><li>Expecting the Pod to come back after delete (it will not — that is a Deployment's job).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Fastest start: `kubectl run web --image=nginx:1.27 --dry-run=client -o yaml > pod.yaml`, then edit.</details>\n<details><summary>Hint 2</summary>If a Pod is not Running, `kubectl describe pod web` shows the reason in the Events at the bottom.</details>\n<details><summary>Hint 3</summary>Exec form uses `--`: `kubectl exec -it web -- sh`.</details>\n<h2>12. Final challenge</h2><p>Make the Pod fail on purpose: set the image to <code>nginx:doesnotexist</code>. Apply it, see <code>ImagePullBackOff</code>, find the cause in <code>describe</code>, then fix it. This is real troubleshooting.</p><h2>13. What to submit (evidence)</h2><p>Save <code>pod.yaml</code>, the get/describe/logs/exec outputs in <code>submissions/kubernetes/beginner/project-02/</code>. Then say: <strong>\"I submit Kubernetes Beginner Project 2.\"</strong></p><hr><p><strong>Remember:</strong> Write YAML → <code>apply</code> → <code>get</code>/<code>describe</code>/<code>logs</code>/<code>exec</code>. Generate YAML fast with <code>--dry-run=client -o yaml</code>.</p></section>","kubernetes/beginner/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Deployments (Run Many Copies)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Deployment</strong> — an object that runs and manages many copies of a Pod.</li><li><strong>Replica</strong> — one copy of the Pod. <code>replicas: 3</code> means 3 copies.</li><li><strong>ReplicaSet</strong> — the thing a Deployment uses to keep the right number of Pods.</li><li><strong>Self-healing</strong> — if a Pod dies, Kubernetes makes a new one.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A bare Pod does not come back if it dies. A <strong>Deployment</strong> fixes this. It says \"always keep N copies running\". If one dies, Kubernetes makes a new one. This is <strong>self-healing</strong>.</p><p>A Deployment also makes <strong>updates</strong> easy: change the image, and Kubernetes replaces Pods slowly (a rolling update), with no downtime.</p><h2>2. Key concepts and terms</h2><ul><li><code>replicas: 3</code> — how many copies you want.</li><li>A <code>selector</code> + Pod <code>labels</code> connect the Deployment to its Pods.</li><li><code>kubectl scale</code> — change the number of replicas.</li><li><code>kubectl rollout</code> — manage and undo updates.</li><li>Deployment → ReplicaSet → Pods (three layers).</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: web\n  template:\n    metadata:\n      labels:\n        app: web\n    spec:\n      containers:\n        - name: nginx\n          image: nginx:1.27\n          ports:\n            - containerPort: 80</code></pre><pre><code>kubectl apply -f deploy.yaml\nkubectl get deploy,rs,pods\nkubectl scale deploy web --replicas=5\nkubectl set image deploy web nginx=nginx:1.27.1   # update\nkubectl rollout status deploy web\nkubectl rollout undo deploy web                    # go back</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl create deploy web --image=nginx:1.27 --replicas=3 --dry-run=client -o yaml &gt; deploy.yaml\nkubectl get pods -l app=web            # pods with this label\nkubectl delete pod &lt;one-web-pod&gt;       # watch a new one appear (self-healing)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Create a Deployment with 3 replicas (from YAML).</li><li>See 3 Pods. Delete one. Watch a new one appear.</li><li>Scale to 5. Then scale back to 2.</li><li>Update the image and check the rollout.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Pods do not appear.</li></ul><p>  <strong>Fix:</strong> the <code>selector.matchLabels</code> must match the Pod <code>template</code> labels exactly.</p><ul><li><strong>Problem:</strong> rollout stuck.</li></ul><p>  <strong>Fix:</strong> <code>kubectl rollout status</code> + <code>kubectl describe deploy</code> show why (often a bad image).</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Selector labels not matching template labels.</li><li>Editing Pods directly instead of the Deployment — the Deployment will fight you.</li><li>Forgetting <code>apps/v1</code> for Deployments.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> Deployments, scaling, and rollouts are core, common tasks.</li><li>Learn <code>kubectl create deploy ... --dry-run=client -o yaml</code>, <code>scale</code>, <code>set image</code>, <code>rollout undo</code> cold.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does a Deployment give you that a bare Pod does not?</li><li>How do you scale a Deployment?</li><li>How do you undo a bad update?</li></ol><h2>10. References</h2><ul><li>Deployments: <a href=\"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/workloads/controllers/deployment/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Kubernetes Deployment\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Deployment keeps N copies alive and updates them safely. Deployment → ReplicaSet → Pods.</p><details><summary>Answers</summary>\n<ol><li>Self-healing (keeps N copies) and easy rolling updates/rollbacks.</li><li><code>kubectl scale deploy &lt;name&gt; --replicas=N</code>.</li><li><code>kubectl rollout undo deploy &lt;name&gt;</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Run Many Copies with a Deployment</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Create a Deployment with several replicas. See self-healing, scaling, and a rolling update.</p><h2>2. Real-world scenario</h2><p>Your app must stay up even if a Pod dies, and handle more users at busy times. A Deployment keeps copies running and lets you scale.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Write a Deployment with replicas.</li><li>See self-healing (delete a Pod, a new one appears).</li><li>Scale up and down.</li><li>Do a rolling update and undo it.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Beginner Project 2 completed.</li><li>Read: <code>study/kubernetes/beginner/03-deployments.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a Deployment <code>web</code> (nginx:1.27) with <code>replicas: 3</code> (from YAML).</li><li>Show 3 Pods with <code>kubectl get pods -l app=web</code>.</li><li><strong>Self-healing:</strong> delete one Pod, then show a new Pod appears (still 3).</li><li><strong>Scale:</strong> scale to 5, then back to 2.</li><li><strong>Update:</strong> change the image to <code>nginx:1.27.1</code> (or another tag), and show <code>kubectl rollout status</code>.</li><li><strong>Undo:</strong> roll back with <code>kubectl rollout undo</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Deployment with 3 replicas.</li><li>☐ Self-healing proven.</li><li>☐ Scaled up and down.</li><li>☐ Rolling update done.</li><li>☐ Rollback done.</li></ul><h2>7. Expected outcome</h2><p>You control a set of Pods with one Deployment: it heals, scales, updates, and rolls back.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the Deployment YAML (kind: Deployment, apps/v1, replicas 3, matching labels).</li><li><code>kubectl get pods -l app=web</code> shows 3 Pods running.</li><li>You delete one Pod and show a replacement Pod appears (count back to 3).</li><li>You show scaling to 5 and back to 2 (<code>kubectl get deploy web</code>).</li><li>You show a rolling update (<code>kubectl set image ...</code> + <code>kubectl rollout status deploy web</code>).</li><li>You show a successful <code>kubectl rollout undo deploy web</code>.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Self-healing shown.</li><li>☐ Scale up/down shown.</li><li>☐ Update + rollback shown.</li><li>☐ Evidence saved in <code>submissions/kubernetes/beginner/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Selector labels not matching template labels → no Pods.</li><li>Deleting the Deployment instead of a Pod for the self-healing test.</li><li>Bad image tag → rollout stuck (read describe).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Generate: `kubectl create deploy web --image=nginx:1.27 --replicas=3 --dry-run=client -o yaml > deploy.yaml`.</details>\n<details><summary>Hint 2</summary>Self-heal test: `kubectl delete pod <one-web-pod>` then `kubectl get pods -l app=web` — a new one is created.</details>\n<details><summary>Hint 3</summary>Update: `kubectl set image deploy web nginx=nginx:1.27.1`, then `kubectl rollout status deploy web`, then `kubectl rollout undo deploy web`.</details>\n<h2>12. Final challenge</h2><p>Use <code>kubectl rollout history deploy web</code> to see the versions. Roll back to a <strong>specific</strong> revision with <code>--to-revision=N</code>. Managing revisions is a real CKAD skill.</p><h2>13. What to submit (evidence)</h2><p>Save the YAML and all command outputs (self-heal, scale, update, undo) in <code>submissions/kubernetes/beginner/project-03/</code>. Then say: <strong>\"I submit Kubernetes Beginner Project 3.\"</strong></p><hr><p><strong>Remember:</strong> A Deployment keeps N copies alive and updates them safely. Scale, update, and undo with <code>kubectl</code>.</p></section>","kubernetes/beginner/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Services (Stable Networking)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Service</strong> — a stable name and address for a set of Pods.</li><li><strong>ClusterIP</strong> — a Service reachable only inside the cluster (the default).</li><li><strong>NodePort</strong> — a Service reachable from outside on a node's port.</li><li><strong>Endpoint</strong> — the actual Pod IPs a Service sends traffic to.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Pods come and go. Their IP addresses change. So you cannot rely on a Pod's IP.</p><p>A <strong>Service</strong> gives a <strong>stable</strong> name and IP for a group of Pods. It also <strong>load-balances</strong> across them. You talk to the Service; it forwards to a healthy Pod.</p><p>Types you need now:</p><ul><li><strong>ClusterIP</strong> (default): only inside the cluster.</li><li><strong>NodePort</strong>: opens a port on every node, so you can reach it from outside (good for testing).</li></ul><h2>2. Key concepts and terms</h2><ul><li>A Service uses a <strong>selector</strong> (labels) to find its Pods.</li><li>Inside the cluster, a Service is reachable by its <strong>name</strong> (DNS): <code>http://web</code> or <code>http://web.default.svc.cluster.local</code>.</li><li><code>port</code> = the Service port; <code>targetPort</code> = the Pod's container port.</li><li><code>kubectl expose</code> quickly makes a Service for a Deployment.</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: v1\nkind: Service\nmetadata:\n  name: web\nspec:\n  selector:\n    app: web          # matches Pods with label app=web\n  ports:\n    - port: 80         # service port\n      targetPort: 80   # container port\n  type: ClusterIP</code></pre><pre><code>kubectl expose deploy web --port=80 --target-port=80   # quick service\nkubectl get svc\nkubectl get endpoints web            # which Pods it points to\n# test from inside the cluster:\nkubectl run test --image=busybox -it --rm -- wget -qO- http://web</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl expose deploy web --port=80 --name=web --dry-run=client -o yaml &gt; svc.yaml\nkubectl get svc web -o wide\nkubectl describe svc web          # selector + endpoints\n# NodePort for outside access (testing):\nkubectl expose deploy web --port=80 --type=NodePort --name=web-np</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make a Deployment <code>web</code> (3 replicas). Expose it as a ClusterIP Service.</li><li>From a temporary Pod, <code>wget</code> the Service by name. It should answer.</li><li>Look at the endpoints — see the Pod IPs behind the Service.</li><li>Make a NodePort Service and reach it from outside.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Service has no endpoints.</li></ul><p>  <strong>Fix:</strong> the Service <code>selector</code> does not match any Pod labels. Fix the labels/selector.</p><ul><li><strong>Problem:</strong> cannot reach a ClusterIP from your laptop.</li></ul><p>  <strong>Fix:</strong> ClusterIP is inside-only. Use NodePort (or port-forward) for outside access.</p><ul><li><strong><code>kubectl port-forward svc/web 8080:80</code></strong> is a handy way to test locally.</li></ul><h2>7. Common mistakes and how to avoid them</h2><ul><li>Selector/label mismatch → no endpoints → nothing works.</li><li>Confusing <code>port</code> and <code>targetPort</code>.</li><li>Trying to reach ClusterIP from outside.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> Services &amp; Networking is ~20% of the exam.</li><li>Know ClusterIP vs NodePort, selectors, endpoints, and <code>kubectl expose</code>.</li><li><code>kubectl port-forward</code> is great for quick testing.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why do Pods need a Service in front of them?</li><li>What is the difference between ClusterIP and NodePort?</li><li>What does \"no endpoints\" usually mean?</li></ol><h2>10. References</h2><ul><li>Services: <a href=\"https://kubernetes.io/docs/concepts/services-networking/service/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/services-networking/service/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Kubernetes Services\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> A Service is a stable name + load balancer for Pods. It finds Pods by labels. ClusterIP inside, NodePort for outside.</p><details><summary>Answers</summary>\n<ol><li>Because Pod IPs change; a Service gives a stable name/IP and load-balances.</li><li>ClusterIP is inside-only; NodePort also opens a port on nodes for outside access.</li><li>The Service selector does not match any Pod labels.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Give Your App a Stable Address with a Service</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Put a Service in front of your Deployment so it has a stable name and load-balances across Pods.</p><h2>2. Real-world scenario</h2><p>Your app has 3 Pods. Other apps must reach it reliably, even as Pods restart. A Service gives one stable address and spreads traffic across the Pods.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a ClusterIP Service.</li><li>Reach a Service by name from inside the cluster.</li><li>See endpoints (the Pods behind it).</li><li>Use NodePort / port-forward for outside testing.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Beginner Project 3 completed (you have a <code>web</code> Deployment).</li><li>Read: <code>study/kubernetes/beginner/04-services.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Make sure <code>web</code> Deployment (3 replicas, label <code>app: web</code>) is running.</li><li>Create a ClusterIP Service <code>web</code> (port 80 → targetPort 80, selector <code>app: web</code>).</li><li>Show <code>kubectl get svc web</code> and <code>kubectl get endpoints web</code> (should list Pod IPs).</li><li>From a temporary Pod, <code>wget -qO- http://web</code> — it must return the nginx page.</li><li>Use <code>kubectl port-forward svc/web 8080:80</code> and <code>curl http://localhost:8080</code> to reach it from your machine.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ ClusterIP Service created.</li><li>☐ Endpoints list the Pod IPs.</li><li>☐ Reached by name from inside the cluster.</li><li>☐ Reached via port-forward from your machine.</li></ul><h2>7. Expected outcome</h2><p>Your Deployment has a stable Service address. Traffic reaches the Pods by name and is load-balanced.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the Service YAML (selector <code>app: web</code>, port 80, targetPort 80).</li><li><code>kubectl get endpoints web</code> shows one or more Pod IPs (not empty).</li><li>From a temp Pod, <code>wget -qO- http://web</code> returns HTML (name DNS works).</li><li><code>kubectl port-forward svc/web 8080:80</code> + <code>curl http://localhost:8080</code> works.</li><li>You explain in one sentence why a Service is needed instead of a Pod IP.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Service + endpoints correct.</li><li>☐ Reached by name and by port-forward.</li><li>☐ Evidence saved in <code>submissions/kubernetes/beginner/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Selector does not match Pod labels → no endpoints.</li><li>Mixing up <code>port</code> and <code>targetPort</code>.</li><li>Trying to hit ClusterIP directly from the laptop (use port-forward or NodePort).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Quick service: `kubectl expose deploy web --port=80 --target-port=80 --name=web`.</details>\n<details><summary>Hint 2</summary>Test by name: `kubectl run test --image=busybox -it --rm -- wget -qO- http://web`.</details>\n<details><summary>Hint 3</summary>If endpoints are empty, compare `kubectl get pods --show-labels` with the Service selector.</details>\n<h2>12. Final challenge</h2><p>Create a <strong>NodePort</strong> Service too, and reach the app from your host using the node's IP and the NodePort (<code>kubectl get svc</code> shows the port). Explain when you would use ClusterIP vs NodePort.</p><h2>13. What to submit (evidence)</h2><p>Save the Service YAML, endpoints, the in-cluster test, and the port-forward test in <code>submissions/kubernetes/beginner/project-04/</code>. Then say: <strong>\"I submit Kubernetes Beginner Project 4.\"</strong></p><hr><p><strong>Remember:</strong> A Service = stable name + load balancer, found by labels. ClusterIP inside; NodePort/port-forward for outside.</p></section>","kubernetes/beginner/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: ConfigMaps (App Settings)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>ConfigMap</strong> — an object that holds settings (non-secret) for your app.</li><li><strong>Key-value</strong> — a name and a value, like <code>COLOR=blue</code>.</li><li><strong>Mount</strong> — make ConfigMap data appear as files inside a Pod.</li><li><strong>envFrom</strong> — load all ConfigMap keys as environment variables.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Apps need settings: a mode, a color, a URL. You should not bake these into the image. Instead, put them in a <strong>ConfigMap</strong>. Then the same image can run with different settings.</p><p>You can give ConfigMap data to a Pod in two ways:</p><ol><li>As <strong>environment variables</strong>.</li><li>As <strong>files</strong> (mounted into a folder).</li></ol><blockquote><p>ConfigMaps are for <strong>non-secret</strong> settings. Secrets (passwords) go in a Secret (next lesson).</p></blockquote><h2>2. Key concepts and terms</h2><ul><li>Make one: <code>kubectl create configmap app-config --from-literal=COLOR=blue --from-literal=MODE=prod</code>.</li><li>Use as env: <code>envFrom: [configMapRef: {name: app-config}]</code>.</li><li>Use one key: <code>valueFrom: {configMapKeyRef: {name: app-config, key: COLOR}}</code>.</li><li>Mount as files: a <code>volume</code> of type <code>configMap</code>, mounted at a path.</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app-config\ndata:\n  COLOR: \"blue\"\n  MODE: \"prod\"\n---\napiVersion: v1\nkind: Pod\nmetadata: { name: demo }\nspec:\n  containers:\n    - name: app\n      image: busybox\n      command: [\"sh\",\"-c\",\"echo COLOR=$COLOR MODE=$MODE; sleep 3600\"]\n      envFrom:\n        - configMapRef:\n            name: app-config</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl create configmap app-config \\\n  --from-literal=COLOR=blue --from-literal=MODE=prod\nkubectl get configmap app-config -o yaml\nkubectl exec demo -- printenv | grep -E \"COLOR|MODE\"\n# from a file:\nkubectl create configmap web-html --from-file=index.html</code></pre><h2>5. Hands-on exercises</h2><ol><li>Create a ConfigMap with 2 keys.</li><li>Use it as env vars in a Pod. Print them with <code>printenv</code>.</li><li>Mount a ConfigMap as a file and read it inside the Pod.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> env var missing in the Pod.</li></ul><p>  <strong>Fix:</strong> check the ConfigMap name and key spelling; the Pod must reference the right name.</p><ul><li><strong>Problem:</strong> changed the ConfigMap but the Pod still has old values.</li></ul><p>  <strong>Fix:</strong> env vars are set at start. Restart the Pod (or Deployment) to pick up changes. (Mounted files can update, with a delay.)</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Putting secrets in a ConfigMap — use a Secret instead.</li><li>Expecting env changes without a restart.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> \"Application Environment, Configuration and Security\" is ~25%. ConfigMaps are core.</li><li>Know both ways: env (<code>envFrom</code>, <code>configMapKeyRef</code>) and mounted files.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a ConfigMap for?</li><li>Two ways to give ConfigMap data to a Pod?</li><li>Why restart a Pod after changing an env-based ConfigMap?</li></ol><h2>10. References</h2><ul><li>ConfigMaps: <a href=\"https://kubernetes.io/docs/concepts/configuration/configmap/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/configuration/configmap/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"ConfigMap &amp; Secret\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> ConfigMap = non-secret settings. Give them as env vars or files. Restart Pods to pick up env changes.</p><details><summary>Answers</summary>\n<ol><li>Holding non-secret settings for your app, outside the image.</li><li>As environment variables, or as mounted files.</li><li>Because env vars are read at start; a restart re-reads them.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Configure an App with a ConfigMap</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Store app settings in a ConfigMap and give them to a Pod as environment variables and as a file.</p><h2>2. Real-world scenario</h2><p>The same app must run in \"dev\" and \"prod\" with different settings. Instead of building two images, you keep the settings in ConfigMaps and change them per environment.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a ConfigMap.</li><li>Use it as env vars in a Pod.</li><li>Mount it as a file.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Beginner Project 4 completed.</li><li>Read: <code>study/kubernetes/beginner/05-configmaps.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a ConfigMap <code>app-config</code> with <code>COLOR=blue</code> and <code>MODE=prod</code>.</li><li>Create a Pod that loads these as env vars (<code>envFrom</code>). Print them inside with <code>printenv</code>.</li><li>Create a second ConfigMap from a file (e.g. <code>message.txt</code>), mount it into a Pod, and read the file inside.</li><li>Change <code>COLOR</code> to <code>green</code>, restart the Pod, and show the new value.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ ConfigMap with 2 keys created.</li><li>☐ Env vars visible inside the Pod.</li><li>☐ A ConfigMap mounted as a file and read.</li><li>☐ Changed value shown after restart.</li></ul><h2>7. Expected outcome</h2><p>Your Pod gets its settings from ConfigMaps — as env vars and as a mounted file — and you can change them without rebuilding the image.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>kubectl get configmap app-config -o yaml</code> shows COLOR and MODE.</li><li>Inside the Pod, <code>printenv</code> shows <code>COLOR</code> and <code>MODE</code> from the ConfigMap.</li><li>A ConfigMap is mounted as a file, and you show its content with <code>kubectl exec ... cat &lt;path&gt;</code>.</li><li>After changing COLOR and restarting the Pod, <code>printenv</code> shows the new value.</li><li>You explain in one sentence the difference between a ConfigMap and a Secret.</li><li>All YAML and commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Env vars from ConfigMap.</li><li>☐ Mounted file works.</li><li>☐ Change picked up after restart.</li><li>☐ Evidence saved in <code>submissions/kubernetes/beginner/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Wrong ConfigMap name/key in the Pod.</li><li>Expecting env changes with no restart.</li><li>Putting a password in a ConfigMap (use a Secret).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Create: `kubectl create configmap app-config --from-literal=COLOR=blue --from-literal=MODE=prod`.</details>\n<details><summary>Hint 2</summary>Use the `envFrom` Pod example in `study/kubernetes/beginner/05-configmaps.md`, section 3.</details>\n<details><summary>Hint 3</summary>Mount: add a `volumes: [{name: cfg, configMap: {name: web-html}}]` and a `volumeMounts` at a path, then `cat` the file inside.</details>\n<h2>12. Final challenge</h2><p>Use only ONE key from a ConfigMap as an env var with <code>configMapKeyRef</code> (not the whole map with <code>envFrom</code>). This finer control is common in the exam.</p><h2>13. What to submit (evidence)</h2><p>Save the ConfigMaps, Pod YAML, <code>printenv</code>, the mounted-file read, and the change proof in <code>submissions/kubernetes/beginner/project-05/</code>. Then say: <strong>\"I submit Kubernetes Beginner Project 5.\"</strong></p><hr><p><strong>Remember:</strong> ConfigMap = non-secret settings, as env vars or files. Same image, different settings.</p></section>","kubernetes/beginner/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Secrets (Sensitive Settings)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Secret</strong> — an object for sensitive data (passwords, tokens, keys).</li><li><strong>base64</strong> — a way to encode text. NOT encryption. In simple words: it hides text, but anyone can decode it.</li><li><strong>Mount</strong> — make a Secret appear as files in a Pod.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A <strong>Secret</strong> is like a ConfigMap, but for <strong>sensitive</strong> data: passwords, API keys, tokens.</p><p>⚠️ Important truth: by default, Secret values are only <strong>base64 encoded</strong>, not encrypted. Base64 is easy to decode. So a Secret is a bit safer than a ConfigMap (it is handled more carefully, less shown in logs), but it is <strong>not</strong> strong protection by itself. Real security needs more (you learn this in CKS).</p><h2>2. Key concepts and terms</h2><ul><li>Make one: <code>kubectl create secret generic db-secret --from-literal=PASSWORD=s3cret</code>.</li><li>Use as env: <code>valueFrom: {secretKeyRef: {name: db-secret, key: PASSWORD}}</code>.</li><li>Mount as files: a <code>volume</code> of type <code>secret</code>.</li><li><code>kubectl get secret NAME -o yaml</code> shows base64. Decode with <code>base64 -d</code>.</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: v1\nkind: Pod\nmetadata: { name: db-user }\nspec:\n  containers:\n    - name: app\n      image: busybox\n      command: [\"sh\",\"-c\",\"echo pw=$DB_PASSWORD; sleep 3600\"]\n      env:\n        - name: DB_PASSWORD\n          valueFrom:\n            secretKeyRef:\n              name: db-secret\n              key: PASSWORD</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl create secret generic db-secret --from-literal=PASSWORD=s3cret\nkubectl get secret db-secret -o jsonpath='{.data.PASSWORD}' | base64 -d ; echo\nkubectl exec db-user -- printenv | grep DB_PASSWORD</code></pre><h2>5. Hands-on exercises</h2><ol><li>Create a Secret with a password.</li><li>Show it is base64 (and decode it — see it is not real encryption).</li><li>Use it as an env var in a Pod. Print it inside.</li><li>Mount a Secret as a file and read it.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> value looks like gibberish in <code>get secret -o yaml</code>.</li></ul><p>  <strong>Fix:</strong> that is base64. Decode with <code>base64 -d</code>.</p><ul><li><strong>Problem:</strong> Pod cannot find the secret key.</li></ul><p>  <strong>Fix:</strong> check the Secret name and key spelling in <code>secretKeyRef</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Thinking base64 = secure. It is not. Do not commit Secrets to git in plain form.</li><li>Putting secrets in a ConfigMap by mistake.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> creating and using Secrets (env + volume) is core.</li><li><strong>CKS:</strong> goes deeper — encryption at rest for Secrets, limiting who can read them (RBAC), and external secret stores.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a Secret for?</li><li>Is base64 the same as encryption?</li><li>How do you decode a Secret value?</li></ol><h2>10. References</h2><ul><li>Secrets: <a href=\"https://kubernetes.io/docs/concepts/configuration/secret/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/configuration/secret/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"ConfigMap &amp; Secret\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Secret = sensitive settings, base64 by default (not encrypted). Use env or files. Real protection comes later (CKS).</p><details><summary>Answers</summary>\n<ol><li>Holding sensitive data like passwords, tokens, and keys.</li><li>No — base64 only hides text; anyone can decode it.</li><li><code>... | base64 -d</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Handle Passwords with Secrets</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Store a password in a Secret and give it to a Pod safely as an env var and as a file. Understand that base64 is not encryption.</p><h2>2. Real-world scenario</h2><p>Your app needs a database password. You must not put it in the image or a ConfigMap. You store it in a Secret and inject it into the Pod.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a Secret.</li><li>Use it as an env var (<code>secretKeyRef</code>).</li><li>Mount it as a file.</li><li>Decode base64 and understand its limits.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Beginner Project 5 completed.</li><li>Read: <code>study/kubernetes/beginner/06-secrets.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a Secret <code>db-secret</code> with <code>PASSWORD=s3cret</code>.</li><li>Show it is base64 in <code>kubectl get secret ... -o yaml</code>, and decode it with <code>base64 -d</code>.</li><li>Create a Pod that reads <code>PASSWORD</code> as an env var (<code>secretKeyRef</code>). Print it inside.</li><li>Mount the Secret as a file in a second Pod and read the file.</li><li>Write 2 sentences: why base64 is NOT enough, and one real way to protect Secrets (hint: encryption at rest, RBAC).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Secret created.</li><li>☐ base64 decoded (shown it is not encryption).</li><li>☐ Env var from Secret works.</li><li>☐ Secret mounted as a file.</li><li>☐ Short note on real protection.</li></ul><h2>7. Expected outcome</h2><p>Your Pod gets a password from a Secret. You understand base64's limits and how real protection works.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>kubectl get secret db-secret -o yaml</code> shows the value as base64.</li><li>You decode it with <code>base64 -d</code> and show it equals <code>s3cret</code>.</li><li>Inside a Pod, <code>printenv</code> shows <code>PASSWORD</code> (via <code>secretKeyRef</code>).</li><li>A second Pod mounts the Secret as a file; you <code>cat</code> the file inside.</li><li>Your note correctly says base64 is not encryption and names one real protection (encryption at rest, RBAC, or an external secret store).</li><li>All YAML and commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Secret used as env + file.</li><li>☐ base64 truth shown.</li><li>☐ Real-protection note written.</li><li>☐ Evidence saved in <code>submissions/kubernetes/beginner/project-06/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Believing base64 is secure.</li><li>Wrong key name in <code>secretKeyRef</code>.</li><li>Committing the plain Secret to git.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Create: `kubectl create secret generic db-secret --from-literal=PASSWORD=s3cret`.</details>\n<details><summary>Hint 2</summary>Decode: `kubectl get secret db-secret -o jsonpath='{.data.PASSWORD}' | base64 -d; echo`.</details>\n<details><summary>Hint 3</summary>Env use: the `secretKeyRef` Pod example is in `study/kubernetes/beginner/06-secrets.md`, section 3.</details>\n<h2>12. Final challenge</h2><p>Make a <code>docker-registry</code> type Secret (<code>kubectl create secret docker-registry ...</code>) — the kind used to pull private images. Explain in one line where a Pod would use it (<code>imagePullSecrets</code>).</p><h2>13. What to submit (evidence)</h2><p>Save the Secret YAML, the decode proof, the env + file use, and your note in <code>submissions/kubernetes/beginner/project-06/</code>. Then say: <strong>\"I submit Kubernetes Beginner Project 6.\"</strong></p><hr><p><strong>Remember:</strong> Secret = sensitive settings, base64 by default (not safe alone). Real safety = encryption at rest + RBAC (CKS).</p></section>","kubernetes/beginner/project-07":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Namespaces and Labels</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Namespace</strong> — a folder inside the cluster to group objects.</li><li><strong>Label</strong> — a small tag on an object, like <code>app: web</code> or <code>env: prod</code>.</li><li><strong>Selector</strong> — a filter that picks objects by their labels.</li><li><strong>Annotation</strong> — extra notes on an object (not used for selecting).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Two tools keep a cluster tidy:</p><ol><li><strong>Namespaces</strong> — like folders. You can put \"team A\" and \"team B\" apps in different namespaces so they do not clash.</li><li><strong>Labels</strong> — small tags on objects. You use them to <strong>find</strong> and <strong>group</strong> objects (and Services use them to find Pods).</li></ol><h2>2. Key concepts and terms</h2><ul><li><code>kubectl create namespace dev</code>.</li><li>Work in a namespace: <code>-n dev</code> on any command.</li><li>Default namespace is <code>default</code>. System stuff is in <code>kube-system</code>.</li><li>Add labels: <code>kubectl label pod web tier=frontend</code>.</li><li>Filter by label: <code>kubectl get pods -l app=web</code>.</li><li>Selectors also power Services and Deployments.</li></ul><h2>3. Practical examples</h2><pre><code>kubectl create namespace dev\nkubectl run web --image=nginx:1.27 -n dev\nkubectl get pods -n dev\nkubectl get pods -A                      # all namespaces\nkubectl label pod web env=prod -n dev\nkubectl get pods -n dev -l env=prod      # filter by label</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl get ns                                  # list namespaces\nkubectl config set-context --current --namespace=dev   # default to dev\nkubectl get all -n dev                           # everything in dev\nkubectl get pods -l 'app in (web,api)'           # set-based selector</code></pre><h2>5. Hands-on exercises</h2><ol><li>Create a namespace <code>dev</code>. Run a Pod in it.</li><li>List Pods in <code>dev</code> only, and in all namespaces.</li><li>Add a label to the Pod. Filter Pods by that label.</li><li>Set your default namespace to <code>dev</code>, then back to <code>default</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> \"I created it but cannot find it.\"</li></ul><p>  <strong>Fix:</strong> you are in the wrong namespace. Add <code>-n &lt;namespace&gt;</code> or set your default.</p><ul><li><strong>Problem:</strong> a Service finds no Pods.</li></ul><p>  <strong>Fix:</strong> labels and selectors must match (and be in the same namespace).</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Forgetting <code>-n</code> — you look in the wrong namespace.</li><li>Deleting a namespace — it deletes EVERYTHING inside it. Be careful.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Exam tasks often say \"in namespace X\". Always read the namespace!</li><li>Set your default namespace to save typing: <code>kubectl config set-context --current --namespace=X</code>.</li><li>Labels/selectors appear everywhere (Services, Deployments, NetworkPolicies).</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a namespace?</li><li>How do you filter Pods by a label?</li><li>What happens if you delete a namespace?</li></ol><h2>10. References</h2><ul><li>Namespaces: <a href=\"https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/</a> (checked: 2026-09-18)</li><li>Labels: <a href=\"https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Namespaces = folders. Labels = tags for finding/grouping. Always know which namespace you are in.</p><details><summary>Answers</summary>\n<ol><li>A folder inside the cluster that groups objects.</li><li><code>kubectl get pods -l key=value</code>.</li><li>Everything inside that namespace is deleted.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Organize with Namespaces and Labels</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Use namespaces to separate environments, and labels to find and group objects.</p><h2>2. Real-world scenario</h2><p>Two teams share one cluster. Their apps must not clash. You put each team in its own namespace, and use labels to organize and filter Pods.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create and use namespaces.</li><li>Add labels and filter by them.</li><li>Set a default namespace.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Beginner Project 6 completed.</li><li>Read: <code>study/kubernetes/beginner/07-namespaces-labels.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create two namespaces: <code>dev</code> and <code>prod</code>.</li><li>Run an nginx Pod in each (<code>web</code>), with a label <code>env=dev</code> or <code>env=prod</code>.</li><li>List Pods in <code>dev</code> only, then in all namespaces.</li><li>Filter Pods by label across a namespace (<code>-l env=prod</code>).</li><li>Set your default namespace to <code>dev</code>, run a command without <code>-n</code>, then set it back to <code>default</code>.</li><li>Clean up both namespaces at the end.</li></ol><h2>6. Ta
