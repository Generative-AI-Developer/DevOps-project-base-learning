  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}

  header h1{font-size:16px;margin:0}
  .layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 52px)}
  @media(max-width:820px){.layout{grid-template-columns:1fr} nav.side{display:none} nav.side.open{display:block}}
  nav.side{border-right:1px solid var(--line);background:var(--panel2);overflow:auto;max-height:calc(100vh - 52px);padding:8px}

  .level>.l-title{padding:6px 10px;color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;border-radius:8px}
  .level>.l-title:hover{background:#1c2140}
  .item{padding:6px 10px 6px 22px;font-size:13px;cursor:pointer;border-radius:8px;color:var(--ink);display:flex;gap:6px;align-items:flex-start}
  .item:hover{background:#1c2140}
  .item.locked{opacity:.55}
  .item.current{background:#20264a;outline:1px solid var(--accent)}
  .ic{width:16px;flex:0 0 16px;text-align:center}
  main{padding:24px 30px;overflow:auto;max-height:calc(100vh - 52px)}
  main .tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-bottom:6px}
  section.lesson,section.project{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:20px}
  main h1{font-size:22px;margin:.2em 0 .5em}
  main h2{font-size:18px;margin:1.1em 0 .4em;border-top:1px solid var(--line);padding-top:.7em}
  main h3{font-size:15.5px;margin:1em 0 .3em}
  main code{background:#0c0f1e;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px}
  main pre{background:#0c0f1e;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto}
  main pre code{border:0;padding:0;background:none}
  main table{border-collapse:collapse;width:100%;margin:10px 0;overflow:auto;display:block}
  main th,main td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:13.5px}
  main th{background:#1c2140}
  main blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:6px 14px;background:#12162a;border-radius:0 10px 10px 0;color:var(--muted)}
  main a{color:#9ab0ff}
  main details{margin:8px 0;background:#12162a;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
  main summary{cursor:pointer;color:var(--good)}
  main hr{border:0;border-top:1px dashed var(--line);margin:14px 0}
  .welcome{color:var(--muted)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
  .legend{font-size:12px;color:var(--muted);margin-left:auto}
  .dashlink{background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
  .dashlink:hover{filter:brightness(1.1)}

"id":"anthropic/cert/ccdv-f/project-01","status":"locked"},{"label":"CCDV-F Drill: Prompting and Structured Output","id":"anthropic/cert/ccdv-f/project-02","status":"locked"},{"label":"CCDV-F Drill: Tool Use and Agents","id":"anthropic/cert/ccdv-f/project-03","status":"locked"},{"label":"CCDV-F Drill: Evals and Cost","id":"anthropic/cert/ccdv-f/project-04","status":"locked"},{"label":"CCDV-F: Take the Mock Exam","id":"anthropic/cert/ccdv-f/project-05","status":"locked"}]},{"label":"CCAR-F","kind":"exam","status":"locked","children":[{"label":"CCAR-F Drill: Choose the Right Architecture","id":"anthropic/cert/ccar-f/project-01","status":"locked"},{"label":"CCAR-F Drill: Data Privacy by Design","id":"anthropic/cert/ccar-f/project-02","status":"locked"},{"label":"CCAR-F Drill: Security Frameworks and Guardrails","id":"anthropic/cert/ccar-f/project-03","status":"locked"},{"label":"CCAR-F Drill: Multi-Model Deployment","id":"anthropic/cert/ccar-f/project-04","status":"locked"},{"label":"CCAR-F: Take the Mock Exam","id":"anthropic/cert/ccar-f/project-05","status":"locked"}]},{"label":"CCAR-P","kind":"exam","status":"locked","children":[{"label":"CCAR-P Drill: Enterprise Architecture at Scale","id":"anthropic/cert/ccar-p/project-01","status":"locked"},{"label":"CCAR-P Drill: Reliability and Observability","id":"anthropic/cert/ccar-p/project-02","status":"locked"},{"label":"CCAR-P Drill: Cost Governance at Scale","id":"anthropic/cert/ccar-p/project-03","status":"locked"},{"label":"CCAR-P Drill: Advanced Deployment and Customization","id":"anthropic/cert/ccar-p/project-04","status":"locked"},{"label":"CCAR-P: Take the Mock Exam (Top Anthropic Cert)","id":"anthropic/cert/ccar-p/project-05","status":"locked"}]}]}]},{"label":"🏆 Capstone","kind":"track","status":"locked","children":[{"label":"Final DevOps Capstone","id":"capstone","status":"locked"}]}],"content":{"linux/beginner/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Move Around Linux and Read Files</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Terminal</strong> — the screen where you type commands.</li><li><strong>Shell</strong> — the program that reads your commands (we use <code>bash</code>).</li><li><strong>Directory</strong> — another word for a <strong>folder</strong>.</li><li><strong>Path</strong> — the address of a file or folder, like <code>/home/you/notes.txt</code>.</li><li><strong>Command</strong> — a word you type to make Linux do something.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>In Linux, you talk to the computer by typing <strong>commands</strong>. You are always \"standing\" inside one folder. This folder is called your <strong>current directory</strong>.</p><p>Think of folders like rooms in a house. 🏠</p><ul><li>You can see which room you are in.</li><li>You can walk into another room.</li><li>You can look at what is in the room.</li></ul><p>Linux has commands for all of this.</p><h2>2. Key concepts and terms</h2><ul><li><strong>Home directory</strong> — In simple words: your own folder. It is usually <code>/home/yourname</code>. The short sign for it is <code>~</code>.</li><li><strong>Absolute path</strong> — starts from the top <code>/</code>. Example: <code>/etc/hostname</code>.</li><li><strong>Relative path</strong> — starts from where you are now. Example: <code>notes/todo.txt</code>.</li><li><strong>Hidden file</strong> — a file whose name starts with a dot <code>.</code>. You need <code>ls -a</code> to see it.</li></ul><h2>3. Practical examples</h2><ul><li>Where am I? → <code>pwd</code></li><li>What is here? → <code>ls</code></li><li>Go into a folder → <code>cd Documents</code></li><li>Go back up one folder → <code>cd ..</code></li><li>Go to my home → <code>cd ~</code>  (or just <code>cd</code>)</li></ul><h2>4. Commands and config examples</h2><pre><code>pwd                 # print working directory: shows your current folder\nls                  # list files in this folder\nls -l               # list with details (size, owner, date)\nls -a               # list ALL, including hidden files\ncd /etc             # change directory to /etc\ncd ..               # go up one level\ncd ~                # go to your home folder\n\ncat file.txt        # show the whole file\nless file.txt       # show a big file page by page (press q to quit)\nhead -n 5 file.txt  # show the first 5 lines\ntail -n 5 file.txt  # show the last 5 lines\necho \"hello\"        # print text\nwhoami              # show your username</code></pre><h2>5. Hands-on exercises (do these now)</h2><ol><li>Run <code>pwd</code>. Read your current folder.</li><li>Run <code>ls -l</code>. Look at the columns.</li><li>Go to <code>/etc</code> with <code>cd /etc</code>, then run <code>ls</code>. Then go home with <code>cd ~</code>.</li><li>Run <code>cat /etc/hostname</code>. This shows your computer's name.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>bash: cd: /wrong: No such file or directory</code>.</li></ul><p>  <strong>Fix:</strong> the folder name is wrong or does not exist. Check spelling. Use <code>ls</code> to see real names. Linux is <strong>case-sensitive</strong> (<code>Docs</code> and <code>docs</code> are different).</p><ul><li><strong>Problem:</strong> <code>cat: bigfile: Is a directory</code>.</li></ul><p>  <strong>Fix:</strong> <code>cat</code> is for files, not folders. Use <code>ls</code> on a folder instead.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Typing a wrong capital letter — Linux cares about big/small letters. Type names exactly.</li><li>Forgetting where you are — run <code>pwd</code> any time you feel lost.</li><li>Using <code>cat</code> on a huge file fills your screen — use <code>less</code> for big files.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>In the CKA/CKAD/CKS exams you live in the terminal. Fast, correct navigation saves time.</li><li>Learn <code>cd -</code> (go back to the last folder) and Tab-completion (press <strong>Tab</strong> to auto-finish names). These make you fast.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Which command shows your current folder?</li><li>How do you see hidden files?</li><li>What does <code>cd ..</code> do?</li><li>Show only the last 3 lines of <code>/etc/passwd</code>. (Write the command.)</li></ol><h2>10. References (official docs + good free videos)</h2><ul><li>The Linux command line (official-style guide): <a href=\"https://linuxcommand.org/\" target=\"_blank\" rel=\"noopener\">https://linuxcommand.org/</a></li><li>Video: <strong>Learn Linux TV</strong> — \"Linux Crash Course — The Command Line\" — <a href=\"https://www.youtube.com/c/LearnLinuxTV\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/LearnLinuxTV</a> (checked: 2026-09-18)</li><li>Video: <strong>freeCodeCamp.org</strong> — search \"Linux for Beginners full course\" — <a href=\"https://www.youtube.com/c/Freecodecamp\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/Freecodecamp</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> <code>pwd</code> = where am I, <code>ls</code> = what is here, <code>cd</code> = go somewhere, <code>cat</code>/<code>less</code> = read a file.</p><details><summary>Answers to practice questions</summary>\n<ol><li><code>pwd</code></li><li><code>ls -a</code></li><li>Moves you up one folder (to the parent folder).</li><li><code>tail -n 3 /etc/passwd</code></li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Move Around Linux: Your First Commands</h1><p><strong>Status:</strong> ▶️ Start</p><p>*(The real status lives in <code>progress.json</code>.)*</p><h2>1. Objective</h2><p>Learn to move around Linux folders and read files using the terminal. By the end, you can find where you are, go anywhere, and look inside files.</p><h2>2. Real-world scenario</h2><p>You are a new junior engineer. Your boss says: *\"Log in to the server and check the machine's hostname and the list of users.\"* There is no mouse. Only a terminal. You must use commands. This is a normal day for a Linux engineer.</p><h2>3. Skills and concepts you will learn</h2><ul><li><strong>Navigation</strong> — In simple words: moving between folders with <code>cd</code>.</li><li><strong>Listing</strong> — In simple words: seeing what is inside a folder with <code>ls</code>.</li><li><strong>Reading files</strong> — In simple words: looking inside a file with <code>cat</code>, <code>less</code>, <code>head</code>, <code>tail</code>.</li><li><strong>Paths</strong> — In simple words: the address of a file or folder.</li></ul><h2>4. Prerequisites</h2><ul><li>A Linux terminal (you have one).</li><li>Read this first: <code>study/linux/beginner/01-command-line-basics.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Find your current folder.</li><li>Go to your home folder.</li><li>Make a folder called <code>linux-lab</code> inside your home folder. *(Hint: the command is <code>mkdir</code>.)*</li><li>Go into <code>linux-lab</code>.</li><li>Read the file <code>/etc/hostname</code> and the first 5 lines of <code>/etc/passwd</code>.</li><li>Save proof of your work (see section 13).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Show your current folder with one command.</li><li>☐ List files in <code>/etc</code> with details.</li><li>☐ Create the folder <code>~/linux-lab</code> and move into it.</li><li>☐ Show the whole <code>/etc/hostname</code> file.</li><li>☐ Show only the first 5 lines of <code>/etc/passwd</code>.</li><li>☐ Show only the last 3 lines of <code>/etc/passwd</code>.</li></ul><h2>7. Expected outcome</h2><p>You can run each command with no error. You have a folder <code>~/linux-lab</code>. You can read the two files. You understand what each command did.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>The work passes only if ALL of these are true:</p><ol><li>You show the output of <code>pwd</code> (your current folder).</li><li>You show <code>ls -l /etc</code> output (or a clear part of it).</li><li>The folder <code>~/linux-lab</code> exists — you show the output of <code>ls -ld ~/linux-lab</code>.</li><li>You show the output of <code>cat /etc/hostname</code>.</li><li>You show the first 5 lines of <code>/etc/passwd</code> (command + output).</li><li>You show the last 3 lines of <code>/etc/passwd</code> (command + output).</li><li>You write one or two simple sentences: \"How I solved it.\"</li></ol><h2>9. Verification checklist (check before you submit)</h2><ul><li>☐ I ran every command myself.</li><li>☐ I copied the commands AND their output.</li><li>☐ The folder <code>~/linux-lab</code> really exists.</li><li>☐ I saved my evidence in <code>submissions/linux/beginner/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Wrong capital letters — Linux is case-sensitive. Type names exactly.</li><li>Using <code>cat</code> on a folder — <code>cat</code> is for files. Use <code>ls</code> for folders.</li><li>Forgetting <code>~</code> means home — <code>mkdir ~/linux-lab</code> makes the folder in your home, not where you stand.</li></ul><h2>11. Hints (ask for these — do not read unless you are stuck)</h2><details><summary>Hint 1 (small nudge)</summary>Start with `pwd` and `cd ~`. Then think about `mkdir`.</details>\n<details><summary>Hint 2 (bigger help)</summary>To make and enter a folder: `mkdir ~/linux-lab` then `cd ~/linux-lab`. To read part of a file, use `head -n 5 FILE` and `tail -n 3 FILE`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>\n<pre><code>pwd\nls -l /etc\nmkdir ~/linux-lab &amp;&amp; cd ~/linux-lab\ncat /etc/hostname\nhead -n 5 /etc/passwd\ntail -n 3 /etc/passwd\nls -ld ~/linux-lab</code></pre></details>\n<h2>12. Final challenge (a little harder)</h2><p>Find and show <strong>only the line</strong> in <code>/etc/passwd</code> that contains your own username.</p><p>*(Tip: you will meet a tool called <code>grep</code> soon. Try <code>grep yourname /etc/passwd</code>.)*</p><h2>13. What to submit (evidence)</h2><p>Save a text file in <code>submissions/linux/beginner/project-01/</code> (for example <code>output.txt</code>) with:</p><ul><li>Each command you ran and its output.</li><li>One or two simple sentences: \"How I solved it.\"</li></ul><p>Then tell me: <strong>\"I submit Linux Beginner Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Try first. Ask for hints if stuck. Submit when YOU are ready.</p></section>","linux/beginner/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Make and Manage Files and Folders</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Create</strong> — make something new.</li><li><strong>Copy</strong> — make a second same thing (<code>cp</code>).</li><li><strong>Move</strong> — change where something is, or rename it (<code>mv</code>).</li><li><strong>Remove</strong> — delete (<code>rm</code>).</li><li><strong>Redirect</strong> — send command output into a file (<code>&gt;</code> and <code>&gt;&gt;</code>).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>You already know how to look around. Now you learn to <strong>change</strong> things: make files and folders, copy them, move them, and delete them.</p><p>Think of it like tidying a desk. ✍️ You make new papers, copy them, move them to a drawer, or throw them away.</p><p>⚠️ <strong>Warning:</strong> In Linux, <code>rm</code> deletes for real. There is no trash bin. Be careful.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>touch</code></strong> — In simple words: make a new empty file.</li><li><strong><code>mkdir</code></strong> — make a new folder. <code>mkdir -p a/b/c</code> makes all folders in the path.</li><li><strong><code>cp</code></strong> — copy a file. <code>cp -r</code> copies a whole folder.</li><li><strong><code>mv</code></strong> — move OR rename (same command).</li><li><strong><code>rm</code></strong> — delete a file. <code>rm -r</code> deletes a folder and everything in it.</li><li><strong>Redirect <code>&gt;</code></strong> — write output into a file (replaces the file).</li><li><strong>Redirect <code>&gt;&gt;</code></strong> — add output to the end of a file (keeps old text).</li></ul><h2>3. Practical examples</h2><ul><li>New empty file → <code>touch notes.txt</code></li><li>New folder → <code>mkdir project</code></li><li>Copy → <code>cp notes.txt backup.txt</code></li><li>Rename → <code>mv notes.txt todo.txt</code></li><li>Delete → <code>rm todo.txt</code></li><li>Save text to a file → <code>echo \"hello\" &gt; hello.txt</code></li></ul><h2>4. Commands and config examples</h2><pre><code>touch a.txt                 # make an empty file\nmkdir -p demo/sub           # make folder demo and demo/sub together\necho \"line 1\" &gt; demo/a.txt  # write text INTO a file (replace)\necho \"line 2\" &gt;&gt; demo/a.txt # ADD text to the end\ncp demo/a.txt demo/b.txt    # copy a file\ncp -r demo demo-copy        # copy a whole folder\nmv demo/b.txt demo/c.txt    # rename (move) a file\nrm demo/c.txt               # delete a file\nrm -r demo-copy             # delete a folder and all inside (careful!)</code></pre><h2>5. Hands-on exercises (do these now)</h2><ol><li>Make a folder <code>~/practice</code> and go into it.</li><li>Make a file <code>hello.txt</code> with the text \"Hi Linux\".</li><li>Copy it to <code>hello2.txt</code>. Then rename <code>hello2.txt</code> to <code>world.txt</code>.</li><li>Add a second line to <code>hello.txt</code> using <code>&gt;&gt;</code>.</li><li>Delete <code>world.txt</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>rm: cannot remove 'x': Is a directory</code>.</li></ul><p>  <strong>Fix:</strong> to delete a folder, use <code>rm -r x</code>.</p><ul><li><strong>Problem:</strong> You lost file text after using <code>&gt;</code>.</li></ul><p>  <strong>Fix:</strong> <code>&gt;</code> replaces the file. To add without losing, use <code>&gt;&gt;</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using <code>rm -rf</code> on the wrong folder — this deletes everything with no undo. Always check <code>pwd</code> and the path first.</li><li>Mixing up <code>&gt;</code> and <code>&gt;&gt;</code> — <code>&gt;</code> replaces, <code>&gt;&gt;</code> adds.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Redirects (<code>&gt;</code>, <code>&gt;&gt;</code>) and quick file edits are used a lot in the K8s exams (for example, saving a YAML file with <code>kubectl ... &gt; pod.yaml</code>).</li><li><code>mkdir -p</code> and <code>cp -r</code> save time. Learn them well.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is the difference between <code>&gt;</code> and <code>&gt;&gt;</code>?</li><li>How do you delete a folder and all its files?</li><li>Write a command to rename <code>old.txt</code> to <code>new.txt</code>.</li></ol><h2>10. References</h2><ul><li>Official-style guide: <a href=\"https://linuxcommand.org/lc3_learning_the_shell.php\" target=\"_blank\" rel=\"noopener\">https://linuxcommand.org/lc3_learning_the_shell.php</a> (checked: 2026-09-18)</li><li>Video: <strong>Learn Linux TV</strong> — \"Linux Crash Course\" series — <a href=\"https://www.youtube.com/c/LearnLinuxTV\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/LearnLinuxTV</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> <code>touch</code>/<code>mkdir</code> make, <code>cp</code> copies, <code>mv</code> moves/renames, <code>rm</code> deletes (no undo!). <code>&gt;</code> replaces, <code>&gt;&gt;</code> adds.</p><details><summary>Answers</summary>\n<ol><li><code>&gt;</code> replaces the whole file; <code>&gt;&gt;</code> adds to the end.</li><li><code>rm -r foldername</code></li><li><code>mv old.txt new.txt</code></li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Organize Files Like an Engineer</h1><p><strong>Status:</strong> 🔒 Locked (unlocks after Project 1)</p><h2>1. Objective</h2><p>Learn to make, copy, move, rename, and delete files and folders. Learn to save command output into files.</p><h2>2. Real-world scenario</h2><p>Your team says: *\"Set up a clean project folder for our new app. Add a README and a notes file, and keep a backup.\"* You must build this folder tree fast, with commands only.</p><h2>3. Skills and concepts you will learn</h2><ul><li><strong>Create</strong> files and folders (<code>touch</code>, <code>mkdir -p</code>).</li><li><strong>Copy / move / rename</strong> (<code>cp</code>, <code>mv</code>).</li><li><strong>Delete safely</strong> (<code>rm</code>, <code>rm -r</code>) — In simple words: delete with care, because there is no undo.</li><li><strong>Redirects</strong> (<code>&gt;</code>, <code>&gt;&gt;</code>) — In simple words: send text into a file.</li></ul><h2>4. Prerequisites</h2><ul><li>Project 1 completed.</li><li>Read: <code>study/linux/beginner/02-files-and-directories.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Make this folder tree in your home: <code>~/myapp</code>, with subfolders <code>src</code>, <code>docs</code>, and <code>backup</code>.</li><li>In <code>~/myapp/docs</code>, make a file <code>README.md</code> with the line: <code># My App</code>.</li><li>Add a second line to <code>README.md</code>: <code>This is my first Linux project.</code></li><li>Copy <code>README.md</code> into <code>~/myapp/backup/</code>.</li><li>In <code>src</code>, make an empty file <code>app.txt</code>. Then rename it to <code>main.txt</code>.</li><li>Delete the <code>backup</code> copy of the README (but keep the docs one).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Build the folder tree with one <code>mkdir -p</code> style approach.</li><li>☐ Create <code>README.md</code> with two lines (use <code>&gt;</code> then <code>&gt;&gt;</code>).</li><li>☐ Copy the README to <code>backup/</code>.</li><li>☐ Create and rename <code>app.txt</code> → <code>main.txt</code>.</li><li>☐ Delete only the backup README.</li><li>☐ Show the final tree (use <code>ls -R ~/myapp</code>).</li></ul><h2>7. Expected outcome</h2><p>Your folder <code>~/myapp</code> has: <code>src/main.txt</code>, <code>docs/README.md</code> (2 lines), and an empty <code>backup/</code> folder. <code>ls -R ~/myapp</code> shows this clearly.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>ls -R ~/myapp</code> output shows <code>src</code>, <code>docs</code>, <code>backup</code>.</li><li><code>src</code> contains <code>main.txt</code> (not <code>app.txt</code>).</li><li><code>docs/README.md</code> has <strong>two</strong> lines: <code># My App</code> and <code>This is my first Linux project.</code> (show <code>cat docs/README.md</code>).</li><li><code>backup/</code> does not contain the README anymore (show <code>ls ~/myapp/backup</code>).</li><li>You show all your commands AND their output.</li><li>You write 1–2 sentences: \"How I solved it.\"</li></ol><h2>9. Verification checklist</h2><ul><li>☐ <code>ls -R ~/myapp</code> matches the expected tree.</li><li>☐ <code>cat ~/myapp/docs/README.md</code> shows 2 lines.</li><li>☐ Evidence saved in <code>submissions/linux/beginner/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Using <code>&gt;</code> twice — the second <code>&gt;</code> erases line 1. Use <code>&gt;&gt;</code> for line 2.</li><li>Deleting the wrong README — check the path before <code>rm</code>.</li><li>Forgetting <code>-p</code> on <code>mkdir</code> for nested folders.</li></ul><h2>11. Hints</h2><details><summary>Hint 1 (small nudge)</summary>Start with `mkdir -p ~/myapp/{src,docs,backup}`. The `{}` makes all three at once.</details>\n<details><summary>Hint 2 (bigger help)</summary>`echo \"# My App\" > ~/myapp/docs/README.md` then `echo \"This is my first Linux project.\" >> ~/myapp/docs/README.md`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>\n<pre><code>mkdir -p ~/myapp/{src,docs,backup}\necho \"# My App\" &gt; ~/myapp/docs/README.md\necho \"This is my first Linux project.\" &gt;&gt; ~/myapp/docs/README.md\ncp ~/myapp/docs/README.md ~/myapp/backup/\ntouch ~/myapp/src/app.txt &amp;&amp; mv ~/myapp/src/app.txt ~/myapp/src/main.txt\nrm ~/myapp/backup/README.md\nls -R ~/myapp</code></pre></details>\n<h2>12. Final challenge</h2><p>Make a copy of the whole <code>~/myapp</code> folder called <code>~/myapp-v2</code> using one command. (Tip: <code>cp -r</code>.)</p><h2>13. What to submit (evidence)</h2><p>Save a file in <code>submissions/linux/beginner/project-02/</code> with your commands + output + your short note. Then say: <strong>\"I submit Linux Beginner Project 2.\"</strong></p><hr><p><strong>Remember:</strong> <code>&gt;</code> replaces, <code>&gt;&gt;</code> adds. Check the path before you delete.</p></section>","linux/beginner/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Users, Groups, and Permissions</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>User</strong> — a person or program account on the system.</li><li><strong>Group</strong> — a set of users who share access.</li><li><strong>Permission</strong> — who is allowed to read, write, or run a file.</li><li><strong>root</strong> — the super user (the boss). Can do anything.</li><li><strong>sudo</strong> — In simple words: \"do this one command as root\".</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Linux is made for many users. So every file has an <strong>owner</strong> and a set of <strong>permissions</strong>. Permissions decide who can <strong>read (r)</strong>, <strong>write (w)</strong>, and <strong>execute/run (x)</strong> a file.</p><p>Think of a file like a room with 3 doors: read, write, run. Permissions say who holds the keys. 🔑</p><p>There are 3 groups of people for each file:</p><ol><li><strong>owner</strong> (the user who owns it),</li><li><strong>group</strong> (users in the file's group),</li><li><strong>others</strong> (everyone else).</li></ol><h2>2. Key concepts and terms</h2><ul><li><strong><code>ls -l</code></strong> shows permissions, like <code>-rw-r--r--</code>.</li><li>First letter: <code>-</code> file, <code>d</code> folder.</li><li>Next 3: owner's rights. Next 3: group's rights. Last 3: others' rights.</li><li><strong><code>chmod</code></strong> — change permissions.</li><li><strong><code>chown</code></strong> — change the owner.</li><li><strong>Numbers:</strong> r=4, w=2, x=1. Add them: <code>7 = rwx</code>, <code>6 = rw-</code>, <code>5 = r-x</code>, <code>4 = r--</code>.</li><li><code>chmod 644 file</code> → owner rw, group r, others r.</li><li><code>chmod 755 script.sh</code> → owner rwx, group r-x, others r-x.</li></ul><h2>3. Practical examples</h2><ul><li>See permissions → <code>ls -l file</code></li><li>Make a script runnable → <code>chmod +x script.sh</code></li><li>Set exact permissions → <code>chmod 640 secret.txt</code></li><li>Run one command as root → <code>sudo apt update</code></li></ul><h2>4. Commands and config examples</h2><pre><code>whoami                 # your username\nid                     # your user id and groups\nls -l                  # see permissions\nchmod +x run.sh        # add \"run\" permission\nchmod 600 secret.txt   # owner read+write only, no one else\nsudo chown root file   # change owner to root (needs sudo)\ncat /etc/passwd        # list of users (one per line)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Run <code>id</code>. Read your user and groups.</li><li>Make a file <code>secret.txt</code>. Set it to <code>600</code>. Check with <code>ls -l</code>.</li><li>Make a file <code>run.sh</code>. Add run permission with <code>chmod +x</code>. Check with <code>ls -l</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>Permission denied</code> when running a script.</li></ul><p>  <strong>Fix:</strong> the file has no run permission. Do <code>chmod +x file</code>.</p><ul><li><strong>Problem:</strong> <code>Operation not permitted</code> when changing owner.</li></ul><p>  <strong>Fix:</strong> changing owner needs root. Use <code>sudo</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using <code>chmod 777</code> on everything — this gives all rights to everyone. It is unsafe. Give only what is needed.</li><li>Forgetting <code>sudo</code> for admin tasks.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKS</strong> (security) cares a lot about permissions and least privilege (give the smallest access needed).</li><li>Know <code>chmod</code> numbers (644, 600, 755) by heart. It saves time.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does <code>chmod 755 file</code> mean?</li><li>Which permission lets you run a file?</li><li>How do you run one command as root?</li></ol><h2>10. References</h2><ul><li>Official-style guide (permissions): <a href=\"https://linuxcommand.org/lc3_lts0090.php\" target=\"_blank\" rel=\"noopener\">https://linuxcommand.org/lc3_lts0090.php</a> (checked: 2026-09-18)</li><li>Video: <strong>NetworkChuck</strong> — \"Linux permissions explained\" — <a href=\"https://www.youtube.com/@NetworkChuck\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@NetworkChuck</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> r=4, w=2, x=1. Owner / group / others. Give the least access needed.</p><details><summary>Answers</summary>\n<ol><li>Owner = rwx (7), group = r-x (5), others = r-x (5).</li><li>The execute permission (<code>x</code>).</li><li><code>sudo &lt;command&gt;</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Lock It Down: Users and Permissions</h1><p><strong>Status:</strong> 🔒 Locked (unlocks after Project 2)</p><h2>1. Objective</h2><p>Learn to read and set file permissions. Learn who can read, write, and run a file.</p><h2>2. Real-world scenario</h2><p>Your boss says: *\"This file has a password inside. Make sure only you can read it. And make this script runnable.\"* Wrong permissions can leak secrets. This is a real security job.</p><h2>3. Skills and concepts you will learn</h2><ul><li><strong>Reading <code>ls -l</code></strong> — In simple words: understand the <code>rwx</code> letters.</li><li><strong><code>chmod</code></strong> — set who can read/write/run.</li><li><strong><code>chmod</code> numbers</strong> — 600, 644, 755.</li><li><strong><code>sudo</code></strong> — In simple words: do one command as the boss (root).</li></ul><h2>4. Prerequisites</h2><ul><li>Project 2 completed.</li><li>Read: <code>study/linux/beginner/03-users-and-permissions.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>In <code>~/practice</code>, make a file <code>secret.txt</code> with any text.</li><li>Set its permissions so <strong>only the owner</strong> can read and write it (no group, no others).</li><li>Make a file <code>hello.sh</code> with this text: <code>echo \"Hello from my script\"</code>.</li><li>Give <code>hello.sh</code> run permission.</li><li>Run it with <code>./hello.sh</code> and show the output.</li><li>Show <code>ls -l</code> of both files.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Create <code>secret.txt</code> and set it to <code>600</code>.</li><li>☐ Create <code>hello.sh</code> and make it runnable (<code>chmod +x</code>).</li><li>☐ Run <code>./hello.sh</code> successfully.</li><li>☐ Show <code>ls -l secret.txt hello.sh</code>.</li><li>☐ Explain in one sentence what <code>600</code> means.</li></ul><h2>7. Expected outcome</h2><p><code>secret.txt</code> shows <code>-rw-------</code> (only owner read/write). <code>hello.sh</code> is runnable and prints its message.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>ls -l secret.txt</code> shows <code>-rw-------</code> (mode 600).</li><li><code>ls -l hello.sh</code> shows an <code>x</code> (it is runnable).</li><li>Running <code>./hello.sh</code> prints <code>Hello from my script</code>.</li><li>You explain what <code>600</code> means in simple words.</li><li>You show all commands and output.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ <code>secret.txt</code> is <code>600</code>.</li><li>☐ <code>hello.sh</code> runs and prints the message.</li><li>☐ Evidence saved in <code>submissions/linux/beginner/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Using <code>chmod 777</code> — too open, unsafe. Use <code>600</code> for secrets.</li><li>Forgetting <code>./</code> before a script name — Linux needs the path to run it.</li><li>Script has no run permission → <code>Permission denied</code>.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>For \"only owner read/write\", the number is `600`. For \"runnable\", use `chmod +x`.</details>\n<details><summary>Hint 2</summary>`chmod 600 secret.txt` and `chmod +x hello.sh`. Run with `./hello.sh`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>\n<pre><code>cd ~/practice\necho \"my-password-123\" &gt; secret.txt\nchmod 600 secret.txt\necho 'echo \"Hello from my script\"' &gt; hello.sh\nchmod +x hello.sh\n./hello.sh\nls -l secret.txt hello.sh</code></pre></details>\n<h2>12. Final challenge</h2><p>Try to change <code>secret.txt</code>'s owner to <code>root</code> using <code>sudo chown root secret.txt</code>. Then check <code>ls -l</code>. Then change it back to yourself.</p><h2>13. What to submit (evidence)</h2><p>Save your commands + output + your one-sentence explanation in <code>submissions/linux/beginner/project-03/</code>. Then say: <strong>\"I submit Linux Beginner Project 3.\"</strong></p><hr><p><strong>Remember:</strong> <code>600</code> = only owner. <code>chmod +x</code> = make runnable. Run scripts with <code>./name</code>.</p></section>","linux/beginner/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Processes and Services</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Process</strong> — a running program. In simple words: a program that is working right now.</li><li><strong>PID</strong> — process ID. A number that names one process.</li><li><strong>Service (daemon)</strong> — a program that runs in the background all the time (like a web server).</li><li><strong>systemd / systemctl</strong> — the tool that starts and stops services on most Linux systems.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>When you run a program, Linux makes a <strong>process</strong> for it. Each process has a number, the <strong>PID</strong>. You can list processes, and you can stop one if it is stuck.</p><p>Some programs run quietly in the background all the time. These are <strong>services</strong>. Example: a web server. You control services with <strong><code>systemctl</code></strong>.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>ps</code></strong> — list processes.</li><li><strong><code>top</code> / <code>htop</code></strong> — live view of processes (like a task manager).</li><li><strong><code>kill</code></strong> — stop a process by its PID. <code>kill -9</code> forces it.</li><li><strong><code>systemctl status NAME</code></strong> — is a service running?</li><li><strong><code>systemctl start/stop/restart NAME</code></strong> — control a service (needs <code>sudo</code>).</li></ul><h2>3. Practical examples</h2><ul><li>See top programs → <code>top</code> (press <code>q</code> to quit)</li><li>Find a process → <code>ps aux | grep bash</code></li><li>Stop a process → <code>kill 1234</code> (1234 is the PID)</li><li>Check a service → <code>systemctl status ssh</code></li></ul><h2>4. Commands and config examples</h2><pre><code>ps aux                 # list all processes (a=all users, x=background too)\nps aux | grep nginx    # find processes with \"nginx\" in the name\ntop                    # live process view; press q to quit\nkill 1234              # ask process 1234 to stop\nkill -9 1234           # force process 1234 to stop\nsystemctl status ssh   # see if the ssh service runs\nsudo systemctl restart ssh   # restart it (needs sudo)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Run <code>ps aux | head</code>. Read the columns (USER, PID, COMMAND).</li><li>Run <code>top</code>. Watch it for 5 seconds. Press <code>q</code>.</li><li>Start a slow command in the background: <code>sleep 300 &amp;</code>. Find its PID with <code>ps</code>. Stop it with <code>kill</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> a program is frozen.</li></ul><p>  <strong>Fix:</strong> find its PID (<code>ps aux | grep name</code>), then <code>kill PID</code>. If it will not stop, use <code>kill -9 PID</code>.</p><ul><li><strong>Problem:</strong> <code>systemctl</code> says \"access denied\".</li></ul><p>  <strong>Fix:</strong> start/stop needs root. Use <code>sudo</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using <code>kill -9</code> first — try a normal <code>kill</code> first. <code>-9</code> is the last resort.</li><li>Killing the wrong PID — check the name with <code>ps</code> before you kill.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Kubernetes runs services with systemd on nodes (like <code>kubelet</code>). In the CKA exam you often run <code>systemctl status kubelet</code> and read logs with <code>journalctl -u kubelet</code>.</li><li>Learn <code>journalctl -u NAME</code> to read a service's logs.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a PID?</li><li>How do you see if the <code>ssh</code> service is running?</li><li>What is the difference between <code>kill</code> and <code>kill -9</code>?</li></ol><h2>10. References</h2><ul><li>systemd/systemctl docs: <a href=\"https://www.freedesktop.org/software/systemd/man/systemctl.html\" target=\"_blank\" rel=\"noopener\">https://www.freedesktop.org/software/systemd/man/systemctl.html</a> (checked: 2026-09-18)</li><li>Video: <strong>Learn Linux TV</strong> — \"systemd/systemctl\" — <a href=\"https://www.youtube.com/c/LearnLinuxTV\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/LearnLinuxTV</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> <code>ps</code>/<code>top</code> list programs, <code>kill</code> stops one, <code>systemctl</code> controls services (with <code>sudo</code>).</p><details><summary>Answers</summary>\n<ol><li>A process ID — a number that names one running program.</li><li><code>systemctl status ssh</code>.</li><li><code>kill</code> politely asks to stop; <code>kill -9</code> forces it to stop now.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Watch and Control Running Programs</h1><p><strong>Status:</strong> 🔒 Locked (unlocks after Project 3)</p><h2>1. Objective</h2><p>Learn to list running programs, stop a stuck one, and check a system service.</p><h2>2. Real-world scenario</h2><p>A program is stuck and using all the CPU. The server is slow. Your job: find that program and stop it. Also, check that the SSH service (which lets people log in) is running.</p><h2>3. Skills and concepts you will learn</h2><ul><li>List processes (<code>ps</code>, <code>top</code>).</li><li>Stop a process (<code>kill</code>).</li><li>Check a service (<code>systemctl status</code>).</li><li>Read a service's logs (<code>journalctl</code>).</li></ul><h2>4. Prerequisites</h2><ul><li>Project 3 completed.</li><li>Read: <code>study/linux/beginner/04-processes-and-services.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Start a fake long job in the background: <code>sleep 600 &amp;</code>.</li><li>Find its PID with <code>ps</code>.</li><li>Stop that job with <code>kill</code>.</li><li>Show <code>top</code> output (a screenshot or the top few lines is fine).</li><li>Check the status of the <code>ssh</code> (or <code>sshd</code>) service with <code>systemctl status</code>.</li><li>Show the last log lines of that service with <code>journalctl -u ssh --no-pager | tail</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Start <code>sleep 600 &amp;</code> and get its PID.</li><li>☐ Kill that PID and prove it is gone (<code>ps</code> shows nothing).</li><li>☐ Capture <code>top</code> (a few lines).</li><li>☐ Show <code>systemctl status</code> for ssh.</li><li>☐ Show some <code>journalctl</code> log lines for ssh.</li></ul><h2>7. Expected outcome</h2><p>You started a background job, found it, and stopped it. You can show the SSH service status and its logs.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show the <code>sleep</code> PID from <code>ps</code> output.</li><li>After <code>kill</code>, <code>ps aux | grep sleep</code> shows the job is gone (only the grep line, or nothing).</li><li>You show <code>top</code> output (a few lines).</li><li>You show <code>systemctl status ssh</code> (or <code>sshd</code>) — active or inactive is fine, just show it.</li><li>You show at least 3 log lines from <code>journalctl -u ssh</code>.</li><li>You show all commands and output.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ The background job was found and killed.</li><li>☐ Service status and logs are shown.</li><li>☐ Evidence saved in <code>submissions/linux/beginner/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Killing the grep line's PID instead of the sleep PID — read carefully.</li><li>Wrong service name — try both <code>ssh</code> and <code>sshd</code>.</li><li>Using <code>kill -9</code> first — try normal <code>kill</code> first.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Find the PID: `ps aux | grep sleep`. The number in the second column is the PID.</details>\n<details><summary>Hint 2</summary>`kill <PID>`. Then check again with `ps aux | grep sleep`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>\n<pre><code>sleep 600 &amp;\nps aux | grep sleep          # note the PID (2nd column)\nkill &lt;PID&gt;\nps aux | grep sleep          # gone now\ntop | head -n 12\nsystemctl status ssh || systemctl status sshd\njournalctl -u ssh --no-pager | tail -n 5</code></pre></details>\n<h2>12. Final challenge</h2><p>Find which running process uses the most memory. (Tip: <code>ps aux --sort=-%mem | head</code>.)</p><h2>13. What to submit (evidence)</h2><p>Save commands + output in <code>submissions/linux/beginner/project-04/</code>. Then say: <strong>\"I submit Linux Beginner Project 4.\"</strong></p><hr><p><strong>Remember:</strong> <code>ps</code>/<code>top</code> to find, <code>kill</code> to stop, <code>systemctl</code>/<code>journalctl</code> for services.</p></section>","linux/beginner/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Install Software (Package Manager)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Package</strong> — software ready to install. In simple words: an app in a box.</li><li><strong>Package manager</strong> — the tool that installs, updates, and removes packages.</li><li><strong>Repository (repo)</strong> — an online store of packages.</li><li><strong>apt</strong> — the package manager on Ubuntu/Debian. <strong>dnf/yum</strong> — on Fedora/RHEL.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>You do not download apps from random websites in Linux. You use a <strong>package manager</strong>. It gets safe software from a trusted <strong>repository</strong> and installs it for you.</p><p>Think of it like an app store, but in the terminal. 📦</p><p>Most likely you use <strong>Ubuntu/Debian</strong>, so your tool is <strong><code>apt</code></strong>.</p><h2>2. Key concepts and terms</h2><ul><li><strong>Update the list</strong> — <code>sudo apt update</code> (refresh what is available).</li><li><strong>Install</strong> — <code>sudo apt install NAME</code>.</li><li><strong>Remove</strong> — <code>sudo apt remove NAME</code>.</li><li><strong>Search</strong> — <code>apt search NAME</code>.</li><li><strong>Upgrade all</strong> — <code>sudo apt upgrade</code>.</li></ul><h2>3. Practical examples</h2><ul><li>Refresh + install a tool → <code>sudo apt update &amp;&amp; sudo apt install tree</code></li><li>See where a tool lives → <code>which tree</code></li><li>Remove it → <code>sudo apt remove tree</code></li></ul><h2>4. Commands and config examples</h2><pre><code>sudo apt update                 # refresh the package list\nsudo apt install -y tree        # install \"tree\" (shows folder trees)\ntree ~/myapp                    # use the new tool\nwhich tree                      # show the path of the program\napt list --installed | wc -l    # count installed packages\nsudo apt remove -y tree         # remove it</code></pre><p>*(On Fedora/RHEL, swap <code>apt</code> for <code>dnf</code>: <code>sudo dnf install tree</code>.)*</p><h2>5. Hands-on exercises</h2><ol><li>Run <code>sudo apt update</code>.</li><li>Install the tool <code>tree</code>.</li><li>Use <code>tree</code> on a folder.</li><li>Find where it lives with <code>which tree</code>.</li><li>Remove it with <code>sudo apt remove tree</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>E: Unable to locate package X</code>.</li></ul><p>  <strong>Fix:</strong> run <code>sudo apt update</code> first. Check the name spelling.</p><ul><li><strong>Problem:</strong> <code>Permission denied</code> / <code>are you root?</code>.</li></ul><p>  <strong>Fix:</strong> installing needs root. Use <code>sudo</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Installing without <code>apt update</code> first — the list may be old.</li><li>Downloading software from random sites — use the package manager, it is safer.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>On exam nodes you install tools with the package manager. Know <code>apt</code> (Debian/Ubuntu) and <code>dnf/yum</code> (RHEL/Fedora).</li><li>For CKS you may install security tools (like <code>trivy</code>) this way.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Which command refreshes the package list?</li><li>How do you install <code>git</code>?</li><li>What is a repository?</li></ol><h2>10. References</h2><ul><li>Ubuntu apt guide: <a href=\"https://ubuntu.com/server/docs/package-management\" target=\"_blank\" rel=\"noopener\">https://ubuntu.com/server/docs/package-management</a> (checked: 2026-09-18)</li><li>Video: <strong>NetworkChuck</strong> — \"Linux package managers\" — <a href=\"https://www.youtube.com/@NetworkChuck\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@NetworkChuck</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> <code>sudo apt update</code> first, then <code>sudo apt install NAME</code>. Use the package manager, not random downloads.</p><details><summary>Answers</summary>\n<ol><li><code>sudo apt update</code>.</li><li><code>sudo apt install git</code>.</li><li>An online store of trusted packages.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Install and Remove Software Safely</h1><p><strong>Status:</strong> 🔒 Locked (unlocks after Project 4)</p><h2>1. Objective</h2><p>Learn to install, use, and remove software with the package manager.</p><h2>2. Real-world scenario</h2><p>You get a fresh server. It has no tools. You must install the tools your team needs — safely, from the official repository, not from random websites.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Refresh the package list (<code>apt update</code>).</li><li>Install a package (<code>apt install</code>).</li><li>Find and use it (<code>which</code>).</li><li>Remove it (<code>apt remove</code>).</li></ul><h2>4. Prerequisites</h2><ul><li>Project 4 completed.</li><li>Read: <code>study/linux/beginner/05-package-management.md</code>.</li><li>Note: uses <code>apt</code> (Ubuntu/Debian). If you use Fedora/RHEL, use <code>dnf</code> and say so.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Run <code>sudo apt update</code>.</li><li>Install the tool <code>tree</code>.</li><li>Use <code>tree ~/myapp</code> (from Project 2) and show the output.</li><li>Show where <code>tree</code> lives with <code>which tree</code>.</li><li>Remove <code>tree</code> with <code>sudo apt remove</code>.</li><li>Prove it is gone: <code>which tree</code> shows nothing.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ <code>sudo apt update</code> runs with no error.</li><li>☐ Install <code>tree</code>.</li><li>☐ Show <code>tree ~/myapp</code> output.</li><li>☐ Show <code>which tree</code> (a path).</li><li>☐ Remove <code>tree</code> and prove it is gone.</li></ul><h2>7. Expected outcome</h2><p>You installed a tool, used it, and removed it cleanly. You understand the install → use → remove flow.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show <code>sudo apt update</code> finished (last lines).</li><li>You show <code>tree ~/myapp</code> output (the folder tree).</li><li><code>which tree</code> showed a real path while it was installed.</li><li>After remove, <code>which tree</code> shows nothing (or \"not found\").</li><li>You show all commands and output.</li><li>If you used <code>dnf</code> instead of <code>apt</code>, you said so.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Tool installed, used, and removed.</li><li>☐ Evidence saved in <code>submissions/linux/beginner/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Skipping <code>apt update</code> — install may fail with \"Unable to locate package\".</li><li>Forgetting <code>sudo</code> — install/remove needs root.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Order is: update → install → use → remove.</details>\n<details><summary>Hint 2</summary>`sudo apt update` then `sudo apt install -y tree`. Use `tree ~/myapp`. Remove with `sudo apt remove -y tree`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>\n<pre><code>sudo apt update\nsudo apt install -y tree\ntree ~/myapp\nwhich tree\nsudo apt remove -y tree\nwhich tree || echo \"tree is gone\"</code></pre></details>\n<h2>12. Final challenge</h2><p>Install <code>git</code>, check its version with <code>git --version</code>, and keep it (you will use git later). Show the version output.</p><h2>13. What to submit (evidence)</h2><p>Save commands + output in <code>submissions/linux/beginner/project-05/</code>. Then say: <strong>\"I submit Linux Beginner Project 5.\"</strong></p><hr><p><strong>Remember:</strong> update → install → use → remove. Always from the package manager.</p></section>","linux/beginner/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Your First Bash Script</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Script</strong> — a text file with commands inside. In simple words: a saved list of commands the computer runs for you.</li><li><strong>Shebang</strong> — the first line <code>#!/bin/bash</code>. It tells Linux which program runs the script.</li><li><strong>Variable</strong> — a name that holds a value, like <code>name=\"Sara\"</code>.</li><li><strong>Argument</strong> — extra input you give the script, like <code>./hi.sh Sara</code>.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A <strong>script</strong> saves you time. Instead of typing 10 commands every day, you put them in one file and run that file.</p><p>The first line is special: <code>#!/bin/bash</code>. This is the <strong>shebang</strong>. It says \"run me with bash\".</p><p>A script can use:</p><ul><li><strong>Variables</strong> to store values.</li><li><strong><code>if</code></strong> to make choices.</li><li><strong>Loops</strong> to repeat.</li><li><strong>Arguments</strong> to take input.</li></ul><h2>2. Key concepts and terms</h2><ul><li><strong>Make a variable:</strong> <code>name=\"Sara\"</code> (no spaces around <code>=</code>).</li><li><strong>Use a variable:</strong> <code>echo \"Hello $name\"</code>.</li><li><strong>Arguments:</strong> <code>$1</code> is the first input, <code>$2</code> the second, <code>$0</code> is the script name.</li><li><strong>If:</strong> check a condition and act.</li><li><strong>For loop:</strong> repeat over a list.</li></ul><h2>3. Practical examples</h2><pre><code>#!/bin/bash\nname=\"$1\"                 # first argument\nif [ -z \"$name\" ]; then   # -z means \"empty\"\n  echo \"Please give me a name. Example: ./hi.sh Sara\"\n  exit 1\nfi\necho \"Hello, $name!\"\nfor i in 1 2 3; do\n  echo \"Count $i\"\ndone</code></pre><h2>4. Commands and config examples</h2><pre><code># make the script\nnano hi.sh          # or: use any editor\nchmod +x hi.sh      # make it runnable\n./hi.sh Sara        # run it with an argument</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make a script <code>hi.sh</code> that prints \"Hello\" + the name you give it.</li><li>Add an <code>if</code> check: if no name is given, print a help message and exit.</li><li>Add a loop that counts from 1 to 5.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>Permission denied</code>.</li></ul><p>  <strong>Fix:</strong> <code>chmod +x hi.sh</code>, then run <code>./hi.sh</code>.</p><ul><li><strong>Problem:</strong> <code>name: command not found</code>.</li></ul><p>  <strong>Fix:</strong> you wrote <code>name = \"Sara\"</code> with spaces. Remove the spaces: <code>name=\"Sara\"</code>.</p><ul><li><strong>Problem:</strong> variable is empty.</li></ul><p>  <strong>Fix:</strong> use <code>$1</code> for the first argument; run the script WITH an argument.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Spaces around <code>=</code> in a variable — do not do it.</li><li>Forgetting <code>chmod +x</code>.</li><li>Forgetting to quote variables — use <code>\"$name\"</code> to be safe.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Scripts are used to automate tasks. In exams and jobs, quick bash saves time.</li><li>Learn <code>exit 0</code> (success) and <code>exit 1</code> (error). These \"exit codes\" matter for automation.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does the shebang line do?</li><li>How do you read the first argument in a script?</li><li>How do you make a script runnable?</li></ol><h2>10. References</h2><ul><li>Bash guide for beginners: <a href=\"https://tldp.org/LDP/Bash-Beginners-Guide/html/\" target=\"_blank\" rel=\"noopener\">https://tldp.org/LDP/Bash-Beginners-Guide/html/</a> (checked: 2026-09-18)</li><li>Video: <strong>freeCodeCamp.org</strong> — \"Bash scripting full course\" — <a href=\"https://www.youtube.com/c/Freecodecamp\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/Freecodecamp</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Start with <code>#!/bin/bash</code>, <code>chmod +x</code>, run with <code>./name</code>. <code>$1</code> is the first input.</p><details><summary>Answers</summary>\n<ol><li>It tells Linux which program (bash) should run the script.</li><li><code>$1</code>.</li><li><code>chmod +x scriptname</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build Your First Bash Script (Level Boss 🏆)</h1><p><strong>Status:</strong> 🔒 Locked (unlocks after Project 5)</p><p>This is the <strong>last project</strong> of Linux Beginner. Finish it to complete the level. Then <strong>Docker Beginner unlocks</strong>! 🔓</p><h2>1. Objective</h2><p>Write a real bash script that takes input, makes a choice with <code>if</code>, and repeats with a loop.</p><h2>2. Real-world scenario</h2><p>Your team makes new project folders every week, by hand. It is slow and full of mistakes. Your job: write one script that builds a project folder correctly, every time.</p><h2>3. Skills and concepts you will learn</h2><ul><li>The shebang line and running scripts.</li><li>Variables and arguments (<code>$1</code>).</li><li><code>if</code> checks (and exit codes).</li><li>A <code>for</code> loop.</li><li>Putting it all together into a useful tool.</li></ul><h2>4. Prerequisites</h2><ul><li>Projects 1–5 completed.</li><li>Read: <code>study/linux/beginner/06-first-bash-script.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><p>Write a script called <code>new-project.sh</code> that:</p><ol><li>Takes one argument: the project name (<code>$1</code>).</li><li>If no name is given, prints a help message and exits with code <code>1</code>.</li><li>Makes a folder with that name, and inside it makes 3 subfolders: <code>src</code>, <code>docs</code>, <code>tests</code> (use a loop).</li><li>Makes a <code>README.md</code> inside the project with the line: <code># &lt;project name&gt;</code>.</li><li>At the end, prints: <code>Project &lt;name&gt; is ready!</code> and lists the tree (<code>ls -R &lt;name&gt;</code>).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Script starts with <code>#!/bin/bash</code> and is runnable.</li><li>☐ Running it with no name shows help and exits 1.</li><li>☐ Running <code>./new-project.sh shop</code> makes <code>shop/</code> with <code>src</code>, <code>docs</code>, <code>tests</code>.</li><li>☐ <code>shop/README.md</code> contains <code># shop</code>.</li><li>☐ The script prints the success message and the tree.</li></ul><h2>7. Expected outcome</h2><p><code>./new-project.sh shop</code> builds a full project folder in one step, correctly, every time.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>The script has <code>#!/bin/bash</code> as line 1 and is runnable (<code>ls -l</code> shows <code>x</code>).</li><li>With <strong>no</strong> argument, it prints a help message and <code>echo $?</code> after it shows <code>1</code>.</li><li>With argument <code>shop</code>, it creates <code>shop/src</code>, <code>shop/docs</code>, <code>shop/tests</code> (show <code>ls -R shop</code>).</li><li><code>cat shop/README.md</code> shows <code># shop</code>.</li><li>The script uses a <strong>loop</strong> to make the 3 subfolders (show the script text).</li><li>You paste the full script AND the output of running it.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ No-argument case exits with code 1.</li><li>☐ <code>shop/</code> tree is correct and README is right.</li><li>☐ A loop is used (not 3 separate mkdir lines).</li><li>☐ Evidence saved in <code>submissions/linux/beginner/project-06/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Spaces around <code>=</code> in variables.</li><li>Forgetting <code>chmod +x</code>.</li><li>Not quoting <code>\"$1\"</code> — breaks if the name has spaces.</li><li>Making the 3 folders with 3 lines instead of a loop (the task asks for a loop).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Read `$1` into a variable. Check if it is empty with `if [ -z \"$name\" ]; then ... exit 1; fi`.</details>\n<details><summary>Hint 2</summary>Use a loop: `for d in src docs tests; do mkdir -p \"$name/$d\"; done`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>\n<pre><code>#!/bin/bash\nname=\"$1\"\nif [ -z \"$name\" ]; then\n  echo \"Usage: ./new-project.sh &lt;project-name&gt;\"\n  exit 1\nfi\nmkdir -p \"$name\"\nfor d in src docs tests; do\n  mkdir -p \"$name/$d\"\ndone\necho \"# $name\" &gt; \"$name/README.md\"\necho \"Project $name is ready!\"\nls -R \"$name\"</code></pre></details>\n<h2>12. Final challenge</h2><p>Add a check: if the folder already exists, print <code>Project already exists</code> and exit <code>2</code> (do not overwrite).</p><h2>13. What to submit (evidence)</h2><p>Save the full script and the run output in <code>submissions/linux/beginner/project-06/</code>. Also show:</p><ul><li>The no-argument run + <code>echo $?</code> (should be 1).</li><li>The <code>shop</code> run + <code>ls -R shop</code> + <code>cat shop/README.md</code>.</li></ul><p>Then say: <strong>\"I submit Linux Beginner Project 6.\"</strong> When it passes, you complete Linux Beginner and unlock Docker Beginner! 🎉</p><hr><p><strong>Remember:</strong> A good script checks its input, does the work with loops, and reports the result.</p></section>","linux/intermediate/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Backups and Cron</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Backup</strong> — a safe copy of your files.</li><li><strong>Archive</strong> — many files packed into one file (with <code>tar</code>).</li><li><strong>Compress</strong> — make a file smaller (with <code>gzip</code>).</li><li><strong>cron</strong> — a Linux clock that runs jobs on a schedule.</li><li><strong>Retention</strong> — how long you keep old backups before deleting them.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Servers can break. Files can be lost. So engineers make <strong>backups</strong>.</p><p>A good backup:</p><ol><li>Packs files into one archive (<code>tar</code>).</li><li>Makes it small (<code>gzip</code>).</li><li>Runs automatically on a schedule (<code>cron</code>).</li><li>Deletes very old backups (retention), so the disk does not fill up.</li></ol><h2>2. Key concepts and terms</h2><ul><li><strong><code>tar -czf out.tar.gz folder/</code></strong> — pack and compress a folder. (<code>c</code>=create, <code>z</code>=gzip, <code>f</code>=file.)</li><li><strong><code>tar -xzf out.tar.gz</code></strong> — unpack it. (<code>x</code>=extract.)</li><li><strong>cron table (crontab)</strong> — the list of scheduled jobs. Edit with <code>crontab -e</code>.</li><li><strong>cron time format:</strong> <code>min hour day month weekday command</code>.</li><li><code>0 2 * * *</code> = every day at 2:00 AM.</li></ul><h2>3. Practical examples</h2><ul><li>Pack a folder → <code>tar -czf backup.tar.gz ~/myapp</code></li><li>Add a date to the name → <code>tar -czf backup-$(date +%F).tar.gz ~/myapp</code></li><li>Schedule daily at 2 AM → in <code>crontab -e</code>: <code>0 2 * * * /home/you/backup.sh</code></li></ul><h2>4. Commands and config examples</h2><pre><code># a simple backup script (backup.sh)\n#!/bin/bash\nSRC=\"$HOME/myapp\"\nDEST=\"$HOME/backups\"\nmkdir -p \"$DEST\"\nSTAMP=\"$(date +%F_%H-%M)\"\ntar -czf \"$DEST/myapp-$STAMP.tar.gz\" \"$SRC\"\n# retention: delete backups older than 7 days\nfind \"$DEST\" -name \"myapp-*.tar.gz\" -mtime +7 -delete\necho \"Backup done: myapp-$STAMP.tar.gz\"</code></pre><pre><code>crontab -e         # edit your cron jobs\ncrontab -l         # list your cron jobs\n# line to add: run backup every day at 2 AM\n0 2 * * * /home/you/backup.sh &gt;&gt; /home/you/backup.log 2&gt;&amp;1</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make <code>backup.sh</code> like above. Run it once by hand. Check the archive appears.</li><li>Unpack the archive into a test folder to prove it works.</li><li>Add a cron line to run it every day. Then <code>crontab -l</code> to see it.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> cron job did not run.</li></ul><p>  <strong>Fix:</strong> cron needs full paths (not <code>~</code>). Use <code>/home/you/...</code>. Check the log file you redirected to.</p><ul><li><strong>Problem:</strong> <code>tar: Removing leading /</code>.</li></ul><p>  <strong>Fix:</strong> this is just a warning. It is safe.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using <code>~</code> inside cron — cron may not know your home. Use full paths.</li><li>No retention — old backups fill the disk. Always delete old ones.</li><li>Not testing restore — a backup you cannot restore is useless. Test it.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA</strong> has an important task: <strong>backup and restore etcd</strong> (the Kubernetes database). The idea is the same as here: make a safe copy, and be able to restore it.</li><li>Know <code>tar</code>, <code>cron</code>, and <code>find -mtime</code> well.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does <code>tar -czf</code> do?</li><li>Write a cron line for \"every day at 2 AM\".</li><li>Why do you need retention?</li></ol><h2>10. References</h2><ul><li>crontab guide: <a href=\"https://man7.org/linux/man-pages/man5/crontab.5.html\" target=\"_blank\" rel=\"noopener\">https://man7.org/linux/man-pages/man5/crontab.5.html</a> (checked: 2026-09-18)</li><li>Cron helper: <a href=\"https://crontab.guru/\" target=\"_blank\" rel=\"noopener\">https://crontab.guru/</a> (checked: 2026-09-18)</li><li>Video: <strong>Learn Linux TV</strong> — \"cron jobs\" — <a href=\"https://www.youtube.com/c/LearnLinuxTV\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/LearnLinuxTV</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Pack (<code>tar</code>), schedule (<code>cron</code>), and clean old copies (retention). Always test the restore.</p><details><summary>Answers</summary>\n<ol><li>Creates a compressed archive (one small file) from files/folders.</li><li><code>0 2 * * * /path/to/script.sh</code></li><li>So old backups do not fill the disk.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build an Automated Backup System</h1><p><strong>Status:</strong> 🔒 Locked (unlocks when Linux Intermediate opens)</p><h2>1. Objective</h2><p>Write a script that backs up a folder into a dated, compressed archive, deletes old backups, and can run on a schedule with cron.</p><h2>2. Real-world scenario</h2><p>Your company stores important files in <code>~/myapp</code>. The manager says: *\"Back this up every day. Keep 7 days of backups. Do it automatically.\"* If the server dies, these backups save the business.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Pack and compress with <code>tar</code>.</li><li>Add a date stamp to file names.</li><li>Delete old files with <code>find -mtime</code>.</li><li>Schedule with <code>cron</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Linux Beginner completed.</li><li>Read: <code>study/linux/intermediate/01-backups-and-cron.md</code>.</li><li>You need a folder to back up. Use <code>~/myapp</code> from Beginner Project 2 (or make one).</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write <code>backup.sh</code> that:</li></ol><ul><li>packs <code>~/myapp</code> into <code>~/backups/myapp-&lt;date&gt;.tar.gz</code>,</li><li>makes the <code>~/backups</code> folder if missing,</li><li>deletes backups older than 7 days.</li></ul><ol><li>Run the script by hand. Show the new archive.</li><li>Restore test: unpack the archive into <code>~/restore-test</code> and show the files are there.</li><li>Add a cron line to run it daily at 2 AM. Show <code>crontab -l</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ <code>backup.sh</code> runs and creates a dated <code>.tar.gz</code> in <code>~/backups</code>.</li><li>☐ The script has a retention step (delete older than 7 days).</li><li>☐ You restore the archive and prove the files come back.</li><li>☐ A cron line is added and shown with <code>crontab -l</code>.</li></ul><h2>7. Expected outcome</h2><p>Running <code>./backup.sh</code> makes <code>~/backups/myapp-YYYY-MM-DD_HH-MM.tar.gz</code>. Old backups are cleaned. Cron will run it daily.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the full <code>backup.sh</code> script.</li><li><code>ls -l ~/backups/</code> shows a dated <code>myapp-*.tar.gz</code> file.</li><li>The script includes a retention line using <code>find ... -mtime +7 -delete</code>.</li><li>You show a working restore: unpack into <code>~/restore-test</code> and <code>ls -R ~/restore-test</code> shows the files.</li><li><code>crontab -l</code> shows a line that runs the script daily (e.g. <code>0 2 * * *</code>).</li><li>You explain in one sentence why full paths are needed in cron.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Archive is created and dated.</li><li>☐ Retention step exists.</li><li>☐ Restore works.</li><li>☐ Cron line shown.</li><li>☐ Evidence saved in <code>submissions/linux/intermediate/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Using <code>~</code> in the cron line — use full paths like <code>/home/you/backup.sh</code>.</li><li>No retention — disk fills up.</li><li>Never testing restore — always test it.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use a date stamp: `STAMP=\"$(date +%F_%H-%M)\"`. Then name the file `myapp-$STAMP.tar.gz`.</details>\n<details><summary>Hint 2</summary>Retention: `find ~/backups -name \"myapp-*.tar.gz\" -mtime +7 -delete`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>See the full example script in `study/linux/intermediate/01-backups-and-cron.md`, section 4. Adapt the paths to yours.</details>\n<h2>12. Final challenge</h2><p>Make the script send its output to a log file <code>~/backup.log</code> (append). Then set the cron line to append there too: <code>... &gt;&gt; /home/you/backup.log 2&gt;&amp;1</code>.</p><h2>13. What to submit (evidence)</h2><p>Save the script, the run output, the restore proof, and <code>crontab -l</code> in <code>submissions/linux/intermediate/project-01/</code>. Then say: <strong>\"I submit Linux Intermediate Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Backup = pack + schedule + clean old + test restore. This is the same idea as etcd backup in CKA.</p></section>","linux/intermediate/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Log Monitoring</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Log</strong> — a file where programs write what they do. In simple words: a diary of the program.</li><li><strong>journald / journalctl</strong> — the tool that reads systemd service logs.</li><li><strong>Follow</strong> — watch a log live as new lines come (<code>tail -f</code>).</li><li><strong>Filter</strong> — show only the lines you care about (<code>grep</code>).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>When something breaks, the answer is often in the <strong>logs</strong>. Logs are files that record events: errors, warnings, and normal messages.</p><p>Two big places for logs:</p><ol><li>Text files in <code>/var/log/</code> (like <code>/var/log/syslog</code>).</li><li>The systemd journal, read with <code>journalctl</code>.</li></ol><p>You learn to <strong>read</strong>, <strong>follow</strong>, and <strong>filter</strong> logs to find problems fast.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>tail -f file</code></strong> — watch a log live (press Ctrl+C to stop).</li><li><strong><code>grep \"error\" file</code></strong> — show only lines with \"error\".</li><li><strong><code>grep -i</code></strong> — ignore big/small letters.</li><li><strong><code>journalctl -u NAME</code></strong> — logs for one service.</li><li><strong><code>journalctl -p err</code></strong> — only error-level messages.</li><li><strong><code>journalctl --since \"10 min ago\"</code></strong> — recent logs.</li></ul><h2>3. Practical examples</h2><ul><li>Live watch → <code>sudo tail -f /var/log/syslog</code></li><li>Find errors → <code>grep -i error /var/log/syslog</code></li><li>Service logs → <code>journalctl -u ssh --no-pager | tail</code></li><li>Count errors → <code>grep -ic error /var/log/syslog</code></li></ul><h2>4. Commands and config examples</h2><pre><code>sudo tail -n 50 /var/log/syslog        # last 50 lines\nsudo tail -f /var/log/syslog           # live follow\ngrep -i \"fail\" /var/log/syslog         # find failures\njournalctl -u ssh --since \"1 hour ago\" # recent ssh logs\njournalctl -p err -b                   # errors since last boot</code></pre><pre><code># a tiny log-watch alert script (watch-log.sh)\n#!/bin/bash\nLOG=\"/var/log/syslog\"\nWORD=\"${1:-error}\"          # word to look for; default \"error\"\nCOUNT=$(grep -ic \"$WORD\" \"$LOG\")\necho \"Found $COUNT lines with '$WORD' in $LOG\"\nif [ \"$COUNT\" -gt 0 ]; then\n  echo \"ALERT: check the log!\"\nfi</code></pre><h2>5. Hands-on exercises</h2><ol><li>Show the last 20 lines of <code>/var/log/syslog</code>.</li><li>Find all lines with \"error\" (ignore case).</li><li>Follow the log live for 10 seconds, then stop with Ctrl+C.</li><li>Show ssh service logs from the last hour.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>Permission denied</code> reading <code>/var/log/syslog</code>.</li></ul><p>  <strong>Fix:</strong> use <code>sudo</code>.</p><ul><li><strong>Problem:</strong> No <code>/var/log/syslog</code> file.</li></ul><p>  <strong>Fix:</strong> some systems use <code>/var/log/messages</code>, or only <code>journalctl</code>. Try <code>journalctl -xe</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Reading the whole huge log — filter with <code>grep</code> or use <code>tail</code>.</li><li>Forgetting <code>-i</code> in grep — you miss \"Error\" vs \"error\".</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Troubleshooting is <strong>30% of the CKA exam</strong>. Reading logs fast is key.</li><li>In Kubernetes you also use <code>kubectl logs POD</code> — same idea, different tool.</li><li>Learn <code>journalctl -u kubelet</code> for node problems.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>How do you watch a log live?</li><li>How do you show only error lines, ignoring case?</li><li>Which command shows logs for one service?</li></ol><h2>10. References</h2><ul><li>journalctl docs: <a href=\"https://www.freedesktop.org/software/systemd/man/journalctl.html\" target=\"_blank\" rel=\"noopener\">https://www.freedesktop.org/software/systemd/man/journalctl.html</a> (checked: 2026-09-18)</li><li>Video: <strong>Learn Linux TV</strong> — \"journalctl\" — <a href=\"https://www.youtube.com/c/LearnLinuxTV\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/LearnLinuxTV</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> <code>tail -f</code> to watch, <code>grep -i</code> to filter, <code>journalctl -u</code> for services. Logs tell you what broke.</p><details><summary>Answers</summary>\n<ol><li><code>tail -f file</code>.</li><li><code>grep -i error file</code>.</li><li><code>journalctl -u SERVICENAME</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build a Log Monitor with Alerts</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Write a script that reads a log, counts problem lines (like \"error\"), and prints an alert if it finds any.</p><h2>2. Real-world scenario</h2><p>A server had a problem last night. The manager says: *\"Watch the logs. If you see errors, tell me.\"* You cannot stare at the screen all day. So you write a script that checks for you.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Read logs with <code>tail</code> and <code>journalctl</code>.</li><li>Filter with <code>grep -i</code>.</li><li>Count matches and make a simple alert.</li><li>Accept a search word as an argument.</li></ul><h2>4. Prerequisites</h2><ul><li>Intermediate Project 1 completed.</li><li>Read: <code>study/linux/intermediate/02-log-monitoring.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write <code>watch-log.sh</code> that:</li></ol><ul><li>takes one argument: the word to search (default <code>error</code>),</li><li>counts matching lines (ignore case) in a log file,</li><li>prints the count, and prints <code>ALERT</code> if the count is more than 0.</li></ul><ol><li>Test it on <code>/var/log/syslog</code> (or <code>journalctl</code> output saved to a file).</li><li>Show the last 20 lines of the log too.</li><li>Run the script with a custom word (like <code>fail</code>).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Script counts matching lines with <code>grep -ic</code>.</li><li>☐ Script uses a default word if none is given.</li><li>☐ Script prints an ALERT when count &gt; 0.</li><li>☐ You test it with two different words.</li></ul><h2>7. Expected outcome</h2><p><code>./watch-log.sh error</code> prints how many error lines are in the log, and alerts if there are any.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the full <code>watch-log.sh</code>.</li><li>The script uses a default word (so running with no argument still works). Show both runs.</li><li>The count uses case-insensitive matching (<code>grep -i</code>). Show a run.</li><li>When count &gt; 0, the script prints an ALERT line.</li><li>You show the log source (e.g. last 20 lines of <code>/var/log/syslog</code> or a saved <code>journalctl</code> file).</li><li>You test at least two search words.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Default word works.</li><li>☐ Case-insensitive count works.</li><li>☐ ALERT prints when needed.</li><li>☐ Evidence saved in <code>submissions/linux/intermediate/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Forgetting <code>-i</code> in grep — you miss \"Error\".</li><li>Using <code>-c</code> wrong — <code>grep -ic word file</code> gives the count.</li><li>Reading a log with no permission — use <code>sudo</code> or save <code>journalctl</code> to a file first.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Default argument: `WORD=\"${1:-error}\"`.</details>\n<details><summary>Hint 2</summary>`COUNT=$(grep -ic \"$WORD\" \"$LOG\")`. Then `if [ \"$COUNT\" -gt 0 ]; then echo \"ALERT\"; fi`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>See the `watch-log.sh` example in `study/linux/intermediate/02-log-monitoring.md`, section 4.</details>\n<h2
