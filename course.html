sks / challenges</h2><ul><li>☐ Two namespaces created.</li><li>☐ A labeled Pod in each.</li><li>☐ Listed per-namespace and all-namespaces.</li><li>☐ Filtered by label.</li><li>☐ Default namespace changed and restored.</li></ul><h2>7. Expected outcome</h2><p>You can separate work with namespaces and find things fast with labels.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>kubectl get ns</code> shows <code>dev</code> and <code>prod</code>.</li><li>There is a Pod in each namespace with the right <code>env</code> label (show <code>kubectl get pods -n dev --show-labels</code> and same for prod).</li><li><code>kubectl get pods -A</code> shows both.</li><li>A label filter works: <code>kubectl get pods -n prod -l env=prod</code> returns the Pod.</li><li>You show setting the default namespace and running a command without <code>-n</code>, then restoring <code>default</code>.</li><li>You cleaned up (deleted the namespaces).</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Namespaces + labeled Pods.</li><li>☐ Filtering works.</li><li>☐ Default namespace changed/restored.</li><li>☐ Evidence saved in <code>submissions/kubernetes/beginner/project-07/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Forgetting <code>-n</code> and looking in the wrong place.</li><li>Deleting a namespace with things you wanted to keep.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`kubectl create namespace dev` and `kubectl run web --image=nginx:1.27 -n dev --labels=env=dev`.</details>\n<details><summary>Hint 2</summary>Set default: `kubectl config set-context --current --namespace=dev`. Restore with `--namespace=default`.</details>\n<details><summary>Hint 3</summary>Cleanup: `kubectl delete namespace dev prod` (this removes everything inside them).</details>\n<h2>12. Final challenge</h2><p>Give the <code>dev</code> namespace a <strong>ResourceQuota</strong> that limits it to a small number of Pods (e.g. 2). Try to create a 3rd Pod and see it blocked. Quotas are a real multi-team feature (and a CKA topic).</p><h2>13. What to submit (evidence)</h2><p>Save all commands + outputs (including <code>--show-labels</code>) in <code>submissions/kubernetes/beginner/project-07/</code>. Then say: <strong>\"I submit Kubernetes Beginner Project 7.\"</strong></p><hr><p><strong>Remember:</strong> Namespaces separate; labels organize and select. Always know your namespace.</p></section>","kubernetes/beginner/project-08":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Deploy a Full App</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Manifest set</strong> — several YAML files (or one file with <code>---</code> between them) that describe a whole app.</li><li><strong>Wire together</strong> — connect the parts (Deployment + Service + Config + Secret).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Now you combine everything you learned into one small app:</p><ul><li>A <strong>Deployment</strong> runs the app Pods.</li><li>A <strong>Service</strong> gives it a stable address.</li><li>A <strong>ConfigMap</strong> holds settings.</li><li>A <strong>Secret</strong> holds a password.</li><li>All in one <strong>namespace</strong>, with clear <strong>labels</strong>.</li></ul><p>This is a real, small Kubernetes app.</p><h2>2. Key concepts and terms</h2><ul><li>Put many objects in one file, separated by <code>---</code>.</li><li>Apply the whole folder: <code>kubectl apply -f ./app/</code>.</li><li>Check everything: <code>kubectl get all -n &lt;ns&gt;</code>.</li><li>Test the Service by name from inside, or with <code>port-forward</code>.</li></ul><h2>3. Practical examples</h2><pre><code># one file, several objects\napiVersion: v1\nkind: ConfigMap\nmetadata: { name: web-config, namespace: shop }\ndata: { WELCOME: \"Hello from Kubernetes\" }\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata: { name: web, namespace: shop }\nspec:\n  replicas: 2\n  selector: { matchLabels: { app: web } }\n  template:\n    metadata: { labels: { app: web } }\n    spec:\n      containers:\n        - name: nginx\n          image: nginx:1.27\n          ports: [{ containerPort: 80 }]\n          envFrom: [{ configMapRef: { name: web-config } }]\n---\napiVersion: v1\nkind: Service\nmetadata: { name: web, namespace: shop }\nspec:\n  selector: { app: web }\n  ports: [{ port: 80, targetPort: 80 }]</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl create namespace shop\nkubectl apply -f app.yaml\nkubectl get all -n shop\nkubectl port-forward -n shop svc/web 8080:80\ncurl http://localhost:8080</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write one YAML file with a ConfigMap + Deployment + Service in a <code>shop</code> namespace.</li><li>Apply it. Check <code>kubectl get all -n shop</code>.</li><li>Test the Service with <code>port-forward</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Service has no endpoints.</li></ul><p>  <strong>Fix:</strong> Deployment Pod labels must match the Service selector.</p><ul><li><strong>Problem:</strong> wrong namespace.</li></ul><p>  <strong>Fix:</strong> every object needs the same namespace; use <code>-n shop</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Objects in different namespaces that should be together.</li><li>Label/selector mismatch → Service finds no Pods.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> deploying and wiring app parts is the heart of the exam.</li><li>Practice doing this fast: generate YAML, edit, apply, verify.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>How do you put several objects in one file?</li><li>How do you see everything in a namespace?</li><li>What connects a Service to its Pods?</li></ol><h2>10. References</h2><ul><li>Deploy an app: <a href=\"https://kubernetes.io/docs/tutorials/kubernetes-basics/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tutorials/kubernetes-basics/</a> (checked: 2026-09-18)</li><li>Video: <strong>KodeKloud</strong> — \"Kubernetes for Beginners\" (freeCodeCamp) — <a href=\"https://www.youtube.com/@KodeKloud\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@KodeKloud</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Deployment + Service + ConfigMap + Secret, same namespace, matching labels = a working app.</p><details><summary>Answers</summary>\n<ol><li>Separate them with <code>---</code> in one file.</li><li><code>kubectl get all -n &lt;namespace&gt;</code>.</li><li>Matching labels (Service selector = Pod labels).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Deploy a Full App (K8s Beginner Boss 🏆)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>last project</strong> of Kubernetes Beginner. Finish it to complete the level and unlock Kubernetes Intermediate.</p><h2>1. Objective</h2><p>Deploy a small but complete app: a Deployment + Service + ConfigMap + Secret, in one namespace, wired together.</p><h2>2. Real-world scenario</h2><p>Your team gives you an app to deploy. It needs several copies, a stable address, settings, and a password. You put it all in YAML and deploy it cleanly in its own namespace.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Combine all Beginner objects into one app.</li><li>Deploy into a namespace.</li><li>Verify everything works together.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Beginner Projects 1–7 completed.</li><li>Read: <code>study/kubernetes/beginner/08-deploy-full-app.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a namespace <code>shop</code>.</li><li>Write ONE YAML file (<code>app.yaml</code>) with (all in <code>shop</code>):</li></ol><ul><li>a <strong>ConfigMap</strong> (e.g. <code>WELCOME=...</code>),</li><li>a <strong>Secret</strong> (e.g. <code>API_KEY=...</code>),</li><li>a <strong>Deployment</strong> <code>web</code> (nginx:1.27, 2 replicas) that uses the ConfigMap (envFrom) and the Secret (secretKeyRef),</li><li>a <strong>Service</strong> <code>web</code> (ClusterIP) selecting the Deployment's Pods.</li></ul><ol><li><code>kubectl apply -f app.yaml</code>.</li><li>Show <code>kubectl get all -n shop</code> (Deployment, ReplicaSet, Pods, Service).</li><li>Show the Service has endpoints.</li><li><code>port-forward</code> the Service and <code>curl</code> it.</li><li>Show the ConfigMap and Secret values are in a Pod (<code>printenv</code>).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Namespace <code>shop</code> created.</li><li>☐ One YAML with 4 objects, all in <code>shop</code>.</li><li>☐ Deployment uses ConfigMap + Secret.</li><li>☐ Service has endpoints.</li><li>☐ App reachable via port-forward.</li></ul><h2>7. Expected outcome</h2><p>A complete little app runs in the <code>shop</code> namespace: several copies, stable address, settings, and a secret — all wired together.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste <code>app.yaml</code> with ConfigMap, Secret, Deployment, and Service — all with <code>namespace: shop</code>.</li><li><code>kubectl get all -n shop</code> shows the Deployment (2/2 ready), the Pods, and the Service.</li><li><code>kubectl get endpoints web -n shop</code> shows Pod IPs (not empty).</li><li><code>kubectl port-forward -n shop svc/web 8080:80</code> + <code>curl http://localhost:8080</code> works.</li><li>Inside a Pod, <code>printenv</code> shows BOTH the ConfigMap value and the Secret value.</li><li>Labels and selectors match (that is why endpoints exist).</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ 4 objects, one namespace.</li><li>☐ Service has endpoints.</li><li>☐ Config + Secret reach the Pod.</li><li>☐ App reachable.</li><li>☐ Evidence saved in <code>submissions/kubernetes/beginner/project-08/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Objects in different namespaces.</li><li>Label/selector mismatch → no endpoints.</li><li>Forgetting to reference the ConfigMap/Secret in the Deployment.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Start from the multi-object example in `study/kubernetes/beginner/08-deploy-full-app.md`, section 3. Add a Secret and use `secretKeyRef` in the Deployment.</details>\n<details><summary>Hint 2</summary>Check wiring: `kubectl get endpoints web -n shop`. Empty means labels do not match.</details>\n<details><summary>Hint 3</summary>Verify env: `kubectl exec -n shop deploy/web -- printenv | grep -E \"WELCOME|API_KEY\"`.</details>\n<h2>12. Final challenge</h2><p>Scale the Deployment to 4, do a rolling image update, and confirm the Service keeps working the whole time (no downtime) by curling it during the update via port-forward. This shows the real power of Deployments + Services.</p><h2>13. What to submit (evidence)</h2><p>Save <code>app.yaml</code>, <code>kubectl get all -n shop</code>, endpoints, the port-forward test, and the env proof in <code>submissions/kubernetes/beginner/project-08/</code>. Then say: <strong>\"I submit Kubernetes Beginner Project 8.\"</strong> When it passes, Kubernetes Intermediate unlocks! 🎉</p><hr><p><strong>Remember:</strong> Deployment + Service + ConfigMap + Secret, one namespace, matching labels = a real app. This is the core of CKAD.</p></section>","kubernetes/intermediate/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Health Probes (Liveness, Readiness, Startup)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Probe</strong> — a test Kubernetes runs on a container to check its health.</li><li><strong>Liveness probe</strong> — \"is it alive?\" If it fails, Kubernetes restarts the container.</li><li><strong>Readiness probe</strong> — \"is it ready for traffic?\" If it fails, the Pod is taken out of the Service.</li><li><strong>Startup probe</strong> — \"has it finished starting?\" Good for slow-starting apps.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A container can be \"running\" but not working. Probes tell Kubernetes the truth. There are three:</p><ol><li><strong>Liveness</strong> — if this fails, the container is restarted (it is stuck/dead).</li><li><strong>Readiness</strong> — if this fails, the Pod stops getting traffic (it is not ready yet, but not dead).</li><li><strong>Startup</strong> — waits for a slow app to start before the other probes begin.</li></ol><p>This is the same idea as Docker health checks, but Kubernetes acts on the result.</p><h2>2. Key concepts and terms</h2><ul><li>Probe types: <code>httpGet</code>, <code>tcpSocket</code>, or <code>exec</code> (run a command).</li><li>Timing: <code>initialDelaySeconds</code>, <code>periodSeconds</code>, <code>failureThreshold</code>.</li><li>Liveness → restart. Readiness → remove from Service endpoints. Startup → gate the others.</li></ul><h2>3. Practical examples</h2><pre><code>containers:\n  - name: web\n    image: nginx:1.27\n    ports: [{ containerPort: 80 }]\n    livenessProbe:\n      httpGet: { path: /, port: 80 }\n      initialDelaySeconds: 5\n      periodSeconds: 10\n    readinessProbe:\n      httpGet: { path: /, port: 80 }\n      initialDelaySeconds: 3\n      periodSeconds: 5</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl describe pod &lt;name&gt;        # see probe results + restarts\nkubectl get pod &lt;name&gt;             # READY column: 1/1 means readiness passed\n# exec probe example:\n#   exec: { command: [\"cat\",\"/tmp/ready\"] }</code></pre><h2>5. Hands-on exercises</h2><ol><li>Add a liveness and a readiness probe to a Pod.</li><li>Break the liveness path (wrong path) and watch the container restart.</li><li>Use an <code>exec</code> readiness probe that checks for a file; create/remove the file to flip readiness.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Pod keeps restarting.</li></ul><p>  <strong>Fix:</strong> the liveness probe fails. Check the path/port and <code>initialDelaySeconds</code> (maybe the app needs more time).</p><ul><li><strong>Problem:</strong> Pod is Running but gets no traffic.</li></ul><p>  <strong>Fix:</strong> readiness probe is failing → not in the Service endpoints. Check <code>kubectl describe pod</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li><code>initialDelaySeconds</code> too short — the app is restarted before it even starts. Use a startup probe or a longer delay.</li><li>Using liveness where readiness is meant — you restart a Pod that is just \"not ready yet\".</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> \"Application Observability and Maintenance\" (~15%). Probes are a common task.</li><li>Know the 3 probe types and what each one does when it fails.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What happens when a liveness probe fails?</li><li>What happens when a readiness probe fails?</li><li>When do you use a startup probe?</li></ol><h2>10. References</h2><ul><li>Probes: <a href=\"https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Kubernetes probes\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Liveness → restart. Readiness → remove from traffic. Startup → wait for slow apps. Probes tell Kubernetes the truth.</p><details><summary>Answers</summary>\n<ol><li>Kubernetes restarts the container.</li><li>The Pod is removed from the Service endpoints (gets no traffic) until it passes again.</li><li>For apps that take a long time to start, to avoid early restarts.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Add Health Probes to a Pod</h1><p><strong>Status:</strong> 🔒 Locked (unlocks when Kubernetes Intermediate opens)</p><h2>1. Objective</h2><p>Add liveness and readiness probes to an app, and see what happens when each one fails.</p><h2>2. Real-world scenario</h2><p>Your app sometimes freezes but stays \"running\". Kubernetes does not restart it, so users suffer. Probes fix this: liveness restarts a frozen app, readiness keeps traffic away until it is ready.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Add liveness, readiness, and (optionally) startup probes.</li><li>See liveness cause a restart.</li><li>See readiness remove a Pod from traffic.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Beginner completed.</li><li>Read: <code>study/kubernetes/intermediate/01-probes.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a Deployment with a liveness probe and a readiness probe (httpGet on <code>/</code>).</li><li>Show the Pod is <code>1/1 READY</code> (readiness passed).</li><li><strong>Break liveness:</strong> set the liveness path to a wrong path (e.g. <code>/nope</code>). Apply. Watch the RESTARTS count go up (<code>kubectl get pods -w</code>).</li><li>Fix it back.</li><li><strong>Readiness test:</strong> use an <code>exec</code> readiness probe that checks for a file <code>/tmp/ready</code>. Show the Pod is <code>0/1</code> until you create the file inside, then <code>1/1</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Liveness + readiness probes added.</li><li>☐ Broken liveness causes restarts.</li><li>☐ Readiness controls the READY state.</li><li>☐ Fixed and healthy at the end.</li></ul><h2>7. Expected outcome</h2><p>You saw liveness restart a bad container, and readiness control whether the Pod is \"ready\". You can read probe results.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the Deployment YAML showing <code>livenessProbe</code> and <code>readinessProbe</code>.</li><li>With a healthy config, <code>kubectl get pod</code> shows <code>1/1</code> READY.</li><li>With a broken liveness path, <code>kubectl get pods</code> shows the RESTARTS count increasing, and <code>kubectl describe pod</code> shows the liveness failure.</li><li>With an <code>exec</code> readiness probe checking <code>/tmp/ready</code>, the Pod is <code>0/1</code> before the file exists and <code>1/1</code> after you create it inside.</li><li>You explain in one line the difference between liveness and readiness.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Both probes work.</li><li>☐ Restart-on-liveness shown.</li><li>☐ Readiness flips READY state.</li><li>☐ Evidence saved in <code>submissions/kubernetes/intermediate/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li><code>initialDelaySeconds</code> too short → app restarted before it starts.</li><li>Using liveness where readiness is meant.</li><li>Wrong port/path in the probe.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the probe YAML in `study/kubernetes/intermediate/01-probes.md`, section 3.</details>\n<details><summary>Hint 2</summary>Watch restarts: `kubectl get pods -w`. Details: `kubectl describe pod <name>`.</details>\n<details><summary>Hint 3</summary>Readiness file test: `readinessProbe: { exec: { command: [\"cat\",\"/tmp/ready\"] } }`. Create it inside with `kubectl exec <pod> -- touch /tmp/ready`.</details>\n<h2>12. Final challenge</h2><p>Add a <strong>startup probe</strong> to a slow-starting container (simulate slow start with a <code>sleep</code> before the app), and show the startup probe protects it from early liveness restarts.</p><h2>13. What to submit (evidence)</h2><p>Save the YAML and all command outputs (restart proof, readiness flip) in <code>submissions/kubernetes/intermediate/project-01/</code>. Then say: <strong>\"I submit Kubernetes Intermediate Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Liveness restarts; readiness gates traffic; startup waits for slow apps. Probes are CKAD gold.</p></section>","kubernetes/intermediate/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Resource Requests and Limits</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Request</strong> — how much CPU/memory a container is guaranteed. Used for scheduling.</li><li><strong>Limit</strong> — the maximum a container may use.</li><li><strong>CPU units</strong> — <code>1</code> = 1 CPU, <code>500m</code> = half a CPU (m = milli = 1/1000).</li><li><strong>Memory units</strong> — <code>Mi</code> (mebibytes), <code>Gi</code> (gibibytes).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Each container should say what it needs.</p><ul><li><strong>Request</strong> = \"I need at least this much.\" Kubernetes uses this to pick a node with room.</li><li><strong>Limit</strong> = \"Never let me use more than this.\" Protects the node from a greedy container.</li></ul><p>If a container passes its <strong>memory limit</strong>, it is killed (OOM). If it passes its <strong>CPU limit</strong>, it is slowed down (throttled), not killed.</p><h2>2. Key concepts and terms</h2><ul><li><code>requests</code> affect <strong>scheduling</strong> (where the Pod goes).</li><li><code>limits</code> affect <strong>runtime</strong> (the cap).</li><li>No request set → the scheduler guesses; can lead to bad placement.</li><li><strong>QoS classes:</strong> Guaranteed (requests = limits), Burstable (some set), BestEffort (none). Higher QoS = less likely to be evicted.</li></ul><h2>3. Practical examples</h2><pre><code>containers:\n  - name: app\n    image: nginx:1.27\n    resources:\n      requests:\n        cpu: \"250m\"\n        memory: \"64Mi\"\n      limits:\n        cpu: \"500m\"\n        memory: \"128Mi\"</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl top pods                     # live usage (needs metrics-server)\nkubectl describe pod &lt;name&gt;          # shows requests/limits + QoS class\nkubectl describe node &lt;node&gt;         # shows allocated vs capacity</code></pre><h2>5. Hands-on exercises</h2><ol><li>Add requests and limits to a Deployment.</li><li>Check the QoS class with <code>kubectl describe pod</code>.</li><li>Set a tiny memory limit and run a memory-heavy container; see it OOM-killed.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Pod <code>Pending</code> with \"Insufficient cpu/memory\".</li></ul><p>  <strong>Fix:</strong> the request is bigger than any node has free. Lower the request or free up space.</p><ul><li><strong>Problem:</strong> container keeps getting OOMKilled.</li></ul><p>  <strong>Fix:</strong> raise the memory limit, or fix the app's memory use.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>No requests → bad scheduling.</li><li>Limit far below what the app needs → constant OOM kills.</li><li>Setting CPU limit too low → the app is slow (throttled).</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> setting requests/limits is a common task.</li><li>Know the units (<code>m</code> for CPU, <code>Mi</code>/<code>Gi</code> for memory) and QoS classes.</li><li><strong>LimitRange</strong> and <strong>ResourceQuota</strong> set defaults/caps per namespace (CKA).</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is the difference between a request and a limit?</li><li>What happens when a container passes its memory limit? Its CPU limit?</li><li>Which value does the scheduler use?</li></ol><h2>10. References</h2><ul><li>Resources: <a href=\"https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/</a> (checked: 2026-09-18)</li><li>Video: <strong>KodeKloud</strong> — \"Requests and limits\" — <a href=\"https://www.youtube.com/@KodeKloud\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@KodeKloud</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Request = guaranteed (for scheduling). Limit = maximum (for runtime). Memory over limit → killed; CPU over limit → throttled.</p><details><summary>Answers</summary>\n<ol><li>Request is the guaranteed amount (used to schedule); limit is the maximum allowed.</li><li>Over memory limit → OOMKilled; over CPU limit → throttled (slowed).</li><li>The request.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Set Requests and Limits (and See QoS)</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Add resource requests and limits to a Deployment, check its QoS class, and see an out-of-memory kill.</p><h2>2. Real-world scenario</h2><p>One app used all the node's memory and crashed others. The team now requires requests and limits on every container. You add them and prove they work.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Set CPU/memory requests and limits.</li><li>Read the QoS class.</li><li>Cause and read an OOMKilled event.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Intermediate Project 1 completed.</li><li>Read: <code>study/kubernetes/intermediate/02-resources.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a Deployment with requests (<code>cpu: 250m</code>, <code>memory: 64Mi</code>) and limits (<code>cpu: 500m</code>, <code>memory: 128Mi</code>).</li><li>Show the QoS class with <code>kubectl describe pod</code> (look for <code>QoS Class</code>).</li><li>Make requests = limits for a second Pod and show its QoS class is <code>Guaranteed</code>.</li><li><strong>OOM demo:</strong> run a Pod with <code>memory</code> limit <code>32Mi</code> and a container that allocates more (e.g. a small stress or a busybox loop). Show it becomes <code>OOMKilled</code> in <code>kubectl describe pod</code> / <code>kubectl get pod</code>.</li><li>If <code>kubectl top pods</code> works, show live usage.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Requests + limits set.</li><li>☐ QoS class shown (Burstable).</li><li>☐ A Guaranteed Pod shown.</li><li>☐ OOMKilled demonstrated.</li></ul><h2>7. Expected outcome</h2><p>Your Pods have sensible requests/limits. You understand QoS and saw an OOM kill.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the Deployment YAML with <code>resources.requests</code> and <code>resources.limits</code>.</li><li><code>kubectl describe pod &lt;name&gt;</code> shows the QoS Class (e.g. <code>Burstable</code>).</li><li>You show a Pod where requests = limits and its QoS Class is <code>Guaranteed</code>.</li><li>You show a Pod that gets <code>OOMKilled</code> (in <code>kubectl get pod</code> reason or <code>kubectl describe pod</code> Last State).</li><li>You explain in one line what the scheduler uses <code>requests</code> for.</li><li>All YAML and commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Requests/limits set.</li><li>☐ QoS classes shown.</li><li>☐ OOMKilled shown.</li><li>☐ Evidence saved in <code>submissions/kubernetes/intermediate/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Wrong units (<code>m</code> for CPU, <code>Mi</code>/<code>Gi</code> for memory).</li><li>Memory limit too low → constant OOM.</li><li>No requests → poor scheduling.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the resources block in `study/kubernetes/intermediate/02-resources.md`, section 3.</details>\n<details><summary>Hint 2</summary>OOM demo: a busybox container with `--limits=memory=32Mi` running a memory-filling command, or use `polinux/stress` with `stress --vm 1 --vm-bytes 100M`.</details>\n<details><summary>Hint 3</summary>QoS: requests = limits for BOTH cpu and memory → `Guaranteed`. Some set → `Burstable`. None → `BestEffort`.</details>\n<h2>12. Final challenge</h2><p>Create a <strong>LimitRange</strong> in a namespace that gives default requests/limits to Pods that do not set their own. Create a Pod with no resources and show it inherited the defaults. (LimitRange is a CKA topic.)</p><h2>13. What to submit (evidence)</h2><p>Save the YAML, the QoS outputs, and the OOMKilled proof in <code>submissions/kubernetes/intermediate/project-02/</code>. Then say: <strong>\"I submit Kubernetes Intermediate Project 2.\"</strong></p><hr><p><strong>Remember:</strong> Request = guaranteed (scheduling); limit = max (runtime). Memory over limit = killed. Always set both.</p></section>","kubernetes/intermediate/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Init Containers and Sidecars</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Init container</strong> — a container that runs and finishes BEFORE the main app starts.</li><li><strong>Sidecar</strong> — a helper container that runs ALONGSIDE the main app in the same Pod.</li><li><strong>Shared volume</strong> — storage both containers in the Pod can use.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A Pod can have more than one container.</p><ul><li><strong>Init container:</strong> runs first, does setup (wait for something, download a file), then exits. The main app starts only after all init containers succeed.</li><li><strong>Sidecar:</strong> runs next to the main app for its whole life. It helps — for example, it reads the app's logs, or refreshes config.</li></ul><p>They often share a <strong>volume</strong> so they can pass files to each other.</p><h2>2. Key concepts and terms</h2><ul><li><code>initContainers:</code> run in order, before the main containers.</li><li>Sidecar = just an extra entry in <code>containers:</code> (or a native sidecar via <code>initContainers</code> with <code>restartPolicy: Always</code> in newer versions).</li><li>A shared <code>emptyDir</code> volume lets containers share files.</li></ul><h2>3. Practical examples</h2><p>Init container that waits, then a main app:</p><pre><code>spec:\n  initContainers:\n    - name: wait-for-it\n      image: busybox\n      command: [\"sh\",\"-c\",\"echo waiting; sleep 5; echo done\"]\n  containers:\n    - name: app\n      image: nginx:1.27</code></pre><p>Sidecar sharing a volume:</p><pre><code>spec:\n  volumes:\n    - name: shared\n      emptyDir: {}\n  containers:\n    - name: app\n      image: busybox\n      command: [\"sh\",\"-c\",\"while true; do date &gt;&gt; /data/log.txt; sleep 2; done\"]\n      volumeMounts: [{ name: shared, mountPath: /data }]\n    - name: sidecar\n      image: busybox\n      command: [\"sh\",\"-c\",\"tail -f /data/log.txt\"]\n      volumeMounts: [{ name: shared, mountPath: /data }]</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl logs &lt;pod&gt; -c app          # logs of a specific container\nkubectl logs &lt;pod&gt; -c sidecar\nkubectl get pod &lt;pod&gt; -o jsonpath='{.spec.initContainers[*].name}'</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make a Pod with an init container that sleeps 5s, then a main nginx.</li><li>Watch the Pod: it stays <code>Init:0/1</code> until the init finishes.</li><li>Make a sidecar that reads a file the main container writes (shared <code>emptyDir</code>).</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Pod stuck at <code>Init:0/1</code>.</li></ul><p>  <strong>Fix:</strong> the init container has not finished (or failed). Check <code>kubectl logs &lt;pod&gt; -c &lt;init-name&gt;</code>.</p><ul><li><strong>Problem:</strong> sidecar cannot see the file.</li></ul><p>  <strong>Fix:</strong> both containers must mount the same volume at a path.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Forgetting <code>-c &lt;container&gt;</code> when reading logs of a multi-container Pod.</li><li>Not sharing a volume between the two containers.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> multi-container Pod patterns (init, sidecar, adapter, ambassador) are a known topic.</li><li>Know how to read logs per container and share an <code>emptyDir</code>.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>When does an init container run?</li><li>What is a sidecar?</li><li>How do two containers in a Pod share files?</li></ol><h2>10. References</h2><ul><li>Init containers: <a href=\"https://kubernetes.io/docs/concepts/workloads/pods/init-containers/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/workloads/pods/init-containers/</a> (checked: 2026-09-18)</li><li>Sidecars: <a href=\"https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Init runs first and exits; sidecar runs alongside. Share files with an <code>emptyDir</code> volume.</p><details><summary>Answers</summary>\n<ol><li>Before the main containers start (and it must finish successfully first).</li><li>A helper container that runs next to the main app for the Pod's life.</li><li>By mounting the same volume (like an <code>emptyDir</code>) in both.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Init Containers and a Sidecar</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Build a Pod with an init container (setup first) and a sidecar (helper alongside), sharing a volume.</p><h2>2. Real-world scenario</h2><p>Your app needs a setup step before it starts, and a helper that ships its logs. You use an init container for setup and a sidecar for the helper.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Add an init container that runs first.</li><li>Add a sidecar that runs alongside.</li><li>Share files with an <code>emptyDir</code>.</li><li>Read logs of a specific container.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Intermediate Project 2 completed.</li><li>Read: <code>study/kubernetes/intermediate/03-init-sidecar.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a Pod with:</li></ol><ul><li>an <strong>init container</strong> that writes a file into a shared volume (e.g. <code>echo hello &gt; /data/init.txt</code>), then exits,</li><li>a <strong>main</strong> container that appends the time to <code>/data/log.txt</code> every 2 seconds,</li><li>a <strong>sidecar</strong> container that tails <code>/data/log.txt</code>.</li></ul><p>   All three share an <code>emptyDir</code> volume mounted at <code>/data</code>.</p><ol><li>Watch the Pod go from <code>Init:...</code> to <code>Running</code>.</li><li>Show the init file exists (<code>kubectl exec ... cat /data/init.txt</code>).</li><li>Show the sidecar's logs contain the time lines (<code>kubectl logs &lt;pod&gt; -c sidecar</code>).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Init container runs first and writes the file.</li><li>☐ Main writes to the shared volume.</li><li>☐ Sidecar reads the shared volume.</li><li>☐ Per-container logs shown.</li></ul><h2>7. Expected outcome</h2><p>An init container prepares data, and a sidecar shares the main container's files — all in one Pod.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the Pod YAML with <code>initContainers</code>, two <code>containers</code>, and a shared <code>emptyDir</code>.</li><li>You show the Pod passing through an <code>Init:</code> phase before <code>Running</code> (<code>kubectl get pods</code>).</li><li><code>kubectl exec &lt;pod&gt; -c app -- cat /data/init.txt</code> shows the init container's file.</li><li><code>kubectl logs &lt;pod&gt; -c sidecar</code> shows the time lines the main container wrote.</li><li>You explain in one line the difference between an init container and a sidecar.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Init ran first.</li><li>☐ Sidecar shares files.</li><li>☐ Per-container logs shown.</li><li>☐ Evidence saved in <code>submissions/kubernetes/intermediate/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Not sharing the volume in all containers.</li><li>Forgetting <code>-c &lt;container&gt;</code> for logs/exec.</li><li>Init container that never exits (it must finish).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the two examples in `study/kubernetes/intermediate/03-init-sidecar.md`, section 3, and combine them into one Pod.</details>\n<details><summary>Hint 2</summary>Watch phases: `kubectl get pods -w` shows `Init:0/1` → `Running`.</details>\n<details><summary>Hint 3</summary>Logs of the sidecar: `kubectl logs <pod> -c sidecar`.</details>\n<h2>12. Final challenge</h2><p>Turn the sidecar into a real \"adapter\": make it transform the log (e.g. add a prefix) and write to a second file. This is the adapter pattern — a known CKAD multi-container pattern.</p><h2>13. What to submit (evidence)</h2><p>Save the Pod YAML and all outputs in <code>submissions/kubernetes/intermediate/project-03/</code>. Then say: <strong>\"I submit Kubernetes Intermediate Project 3.\"</strong></p><hr><p><strong>Remember:</strong> Init runs first and exits; sidecar runs alongside. Share files with <code>emptyDir</code>. Read logs with <code>-c</code>.</p></section>","kubernetes/intermediate/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Jobs and CronJobs</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Job</strong> — runs a Pod until the task finishes successfully, then stops.</li><li><strong>CronJob</strong> — a Job on a schedule (like Linux cron).</li><li><strong>Completions</strong> — how many times the Job must succeed.</li><li><strong>backoffLimit</strong> — how many retries before the Job is failed.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Deployments run apps <strong>forever</strong>. But some tasks should run <strong>once</strong> and finish: a backup, a data import, a report. For these you use a <strong>Job</strong>.</p><p>A <strong>CronJob</strong> runs a Job on a <strong>schedule</strong> (for example, every night). This is the Kubernetes version of Linux cron.</p><h2>2. Key concepts and terms</h2><ul><li>A Job runs a Pod until it exits <code>0</code> (success).</li><li><code>completions</code> and <code>parallelism</code> control how many and how fast.</li><li><code>backoffLimit</code> = retries before giving up.</li><li>CronJob uses a cron schedule string: <code>\"0 2 * * *\"</code> = 2 AM daily.</li><li><code>restartPolicy</code> for Jobs must be <code>Never</code> or <code>OnFailure</code> (not <code>Always</code>).</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: batch/v1\nkind: Job\nmetadata: { name: hello }\nspec:\n  backoffLimit: 3\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n        - name: hello\n          image: busybox\n          command: [\"sh\",\"-c\",\"echo Hello Job; sleep 3\"]\n---\napiVersion: batch/v1\nkind: CronJob\nmetadata: { name: every-min }\nspec:\n  schedule: \"*/1 * * * *\"\n  jobTemplate:\n    spec:\n      template:\n        spec:\n          restartPolicy: OnFailure\n          containers:\n            - name: tick\n              image: busybox\n              command: [\"sh\",\"-c\",\"date; echo tick\"]</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl create job hello --image=busybox -- echo \"hi\"     # quick job\nkubectl get jobs\nkubectl get pods --selector=job-name=hello\nkubectl logs job/hello\nkubectl create cronjob tick --image=busybox --schedule=\"*/1 * * * *\" -- date\nkubectl get cronjobs</code></pre><h2>5. Hands-on exercises</h2><ol><li>Create a Job that prints a message and finishes. Read its logs.</li><li>Create a CronJob that runs every minute. Watch new Pods appear each minute.</li><li>Delete the CronJob to stop it.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Job Pod keeps restarting.</li></ul><p>  <strong>Fix:</strong> <code>restartPolicy</code> must be <code>Never</code> or <code>OnFailure</code>, not <code>Always</code>.</p><ul><li><strong>Problem:</strong> CronJob makes too many old Pods.</li></ul><p>  <strong>Fix:</strong> set <code>successfulJobsHistoryLimit</code> and <code>failedJobsHistoryLimit</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using a Deployment for a one-time task (it will restart forever). Use a Job.</li><li><code>restartPolicy: Always</code> on a Job (not allowed).</li><li>Wrong cron schedule string.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> Jobs and CronJobs are a common task.</li><li>Know <code>restartPolicy</code>, <code>backoffLimit</code>, <code>completions</code>, and the schedule format.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>When do you use a Job instead of a Deployment?</li><li>What restartPolicy values are allowed for a Job?</li><li>What does a CronJob add over a Job?</li></ol><h2>10. References</h2><ul><li>Jobs: <a href=\"https://kubernetes.io/docs/concepts/workloads/controllers/job/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/workloads/controllers/job/</a> (checked: 2026-09-18)</li><li>CronJobs: <a href=\"https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Job = run once to success. CronJob = Job on a schedule. <code>restartPolicy</code> must be Never/OnFailure.</p><details><summary>Answers</summary>\n<ol><li>For a task that runs once and finishes (backup, import, report).</li><li><code>Never</code> or <code>OnFailure</code>.</li><li>A schedule, so the Job runs again and again over time.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Run Tasks with Jobs and CronJobs</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Run a one-time task with a Job, and a scheduled task with a CronJob.</p><h2>2. Real-world scenario</h2><p>Your team needs a nightly database backup and a one-time data import. These are not \"always-on\" apps. You use a CronJob for the nightly task and a Job for the one-time task.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a Job and read its logs.</li><li>Create a CronJob with a schedule.</li><li>Use the right <code>restartPolicy</code> and <code>backoffLimit</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Intermediate Project 3 completed.</li><li>Read: <code>study/kubernetes/intermediate/04-jobs-cronjobs.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a <strong>Job</strong> that prints a message and finishes (with <code>restartPolicy: Never</code>, <code>backoffLimit: 2</code>).</li><li>Show the Job completed (<code>kubectl get jobs</code> shows <code>1/1</code>) and read its logs.</li><li>Create a <strong>CronJob</strong> that runs every minute and prints the date.</li><li>Wait ~2 minutes and show it created Job Pods (<code>kubectl get pods</code> / <code>kubectl get jobs</code>).</li><li>Delete the CronJob to stop it.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Job runs and completes.</li><li>☐ Job logs shown.</li><li>☐ CronJob created and firing.</li><li>☐ CronJob deleted at the end.</li></ul><h2>7. Expected outcome</h2><p>You ran a one-time Job and a scheduled CronJob, and understand when to use each.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the Job YAML (batch/v1, <code>restartPolicy: Never</code>, <code>backoffLimit</code>).</li><li><code>kubectl get jobs</code> shows the Job as <code>COMPLETIONS 1/1</code>.</li><li><code>kubectl logs job/&lt;name&gt;</code> shows the message.</li><li>You paste the CronJob YAML with a schedule (e.g. <code>*/1 * * * *</code>).</li><li>You show at least one Job/Pod created by the CronJob (<code>kubectl get jobs</code> over time).</li><li>You explain in one line why a Deployment is wrong for a one-time task.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Job completed + logs.</li><li>☐ CronJob fired.</li><li>☐ Cleaned up.</li><li>☐ Evidence saved in <code>submissions/kubernetes/intermediate/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li><code>restartPolicy: Always</code> on a Job (not allowed).</li><li>Using a Deployment for a run-once task.</li><li>Wrong cron schedule string.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Quick job: `kubectl create job hello --image=busybox -- echo hi`. Quick cronjob: `kubectl create cronjob tick --image=busybox --schedule=\"*/1 * * * *\" -- date`.</details>\n<details><summary>Hint 2</summary>Job logs: `kubectl logs job/hello`. Cron Pods: `kubectl get pods --sort-by=.metadata.creationTimestamp`.</details>\n<details><summary>Hint 3</summary>Full YAML is in `study/kubernetes/intermediate/04-jobs-cronjobs.md`, section 3.</details>\n<h2>12. Final challenge</h2><p>Make a Job with <code>completions: 3</code> and <code>parallelism: 2</code>, so it runs 3 successful Pods, 2 at a time. Show the completions counting up. This is a real batch pattern.</p><h2>13. What to submit (evidence)</h2><p>Save both YAMLs, the Job completion + logs, and the CronJob firing in <code>submissions/kubernetes/intermediate/project-04/</code>. Then say: <strong>\"I submit Kubernetes Intermediate Project 4.\"</strong></p><hr><p><strong>Remember:</strong> Job = run once. CronJob = on a schedule. <code>restartPolicy</code> = Never or OnFailure.</p></section>","kubernetes/intermediate/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Persistent Storage (PV and PVC)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Volume</strong> — storage a Pod can use.</li><li><strong>PersistentVolume (PV)</strong> — a real piece of storage in the cluster.</li><li><strong>PersistentVolumeClaim (PVC)</strong> — a request for storage. The Pod uses the PVC.</li><li><strong>StorageClass</strong> — a way to create storage automatically (dynamic).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Pods are temporary. Their files vanish when they die. For data that must live (databases, uploads), you use <strong>persistent storage</strong>.</p><p>Two objects work together:</p><ul><li><strong>PV (PersistentVolume):</strong> the actual storage.</li><li><strong>PVC (PersistentVolumeClaim):</strong> the Pod's request (\"I need 1Gi\").</li></ul><p>The Pod mounts the <strong>PVC</strong>. Kubernetes binds the PVC to a PV. With a <strong>StorageClass</strong>, Kubernetes even creates the PV for you automatically (dynamic provisioning).</p><h2>2. Key concepts and terms</h2><ul><li>Access modes: <code>ReadWriteOnce</code> (one node), <code>ReadOnlyMany</code>, <code>ReadWriteMany</code>.</li><li>The Pod does not name a PV; it names a <strong>PVC</strong>.</li><li><code>emptyDir</code> = temporary (gone with the Pod). PVC = persistent.</li><li>On kind/minikube, a default StorageClass usually gives you dynamic PVs.</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: { name: data-pvc }\nspec:\n  accessModes: [\"ReadWriteOnce\"]\n  resources:\n    requests:\n      storage: 1Gi\n---\napiVersion: v1\nkind: Pod\nmetadata: { name: app }\nspec:\n  volumes:\n    - name: data\n      persistentVolumeClaim:\n        claimName: data-pvc\n  containers:\n    - name: c\n      image: busybox\n      command: [\"sh\",\"-c\",\"echo hi &gt; /data/file.txt; sleep 3600\"]\n      volumeMounts: [{ name: data, mountPath: /data }]</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl get pvc,pv\nkubectl get storageclass\nkubectl describe pvc data-pvc         # is it Bound?\n# prove data survives: write a file, delete the Pod, new Pod with same PVC, read the file</code></pre><h2>5. Hands-on exercises</h2><ol><li>Create a PVC (1Gi, ReadWriteOnce). Check it is <code>Bound</code>.</li><li>Run a Pod that mounts it and writes a file.</li><li>Delete the Pod. Run a new Pod with the same PVC. Show the file is still there.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> PVC stuck <code>Pending</code>.</li></ul><p>  <strong>Fix:</strong> no StorageClass or no PV to bind. Check <code>kubectl get storageclass</code> and <code>kubectl describe pvc</code>.</p><ul><li><strong>Problem:</strong> data gone.</li></ul><p>  <strong>Fix:</strong> you used <code>emptyDir</code>, not a PVC. Use a PVC for persistence.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using <code>emptyDir</code> for data that must live.</li><li>Wrong access mode for your need.</li><li>Expecting <code>ReadWriteOnce</code> to work across many nodes (it does not).</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> Storage is ~10% of CKA. Know PV, PVC, StorageClass, access modes.</li><li>The Pod mounts the <strong>PVC</strong> — a very common exam point.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is the difference between a PV and a PVC?</li><li>What does a Pod mount — a PV or a PVC?</li><li>What does a StorageClass do?</li></ol><h2>10. References</h2><ul><li>Persistent volumes: <a href=\"https://kubernetes.io/docs/concepts/storage/persistent-volumes/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/storage/persistent-volumes/</a> (checked: 2026-09-18)</li><li>Video: <strong>KodeKloud</strong> — \"PV and PVC\" — <a href=\"https://www.youtube.com/@KodeKloud\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@KodeKloud</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> PV = the storage, PVC = the request, StorageClass = auto-create. The Pod mounts the PVC.</p><details><summary>Answers</summary>\n<ol><li>PV is the actual storage; PVC is a request for storage that binds to a PV.</li><li>A PVC.</li><li>It creates PVs automatically (dynamic provisioning) when a PVC asks.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Keep Data with a PersistentVolumeClaim</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Create a PVC, mount it in a Pod, and prove data survives when the Pod is deleted.</p><h2>2. Real-world scenario</h2><p>Your app saves user uploads. If the Pod restarts, the uploads must NOT be lost. You use a PVC so the data lives outside the Pod.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a PVC and check it is <code>Bound</code>.</li><li>Mount a PVC in a Pod.</li><li>Prove persistence across Pod deletion.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Intermediate Project 4 completed.</li><li>Read: <code>study/kubernetes/intermediate/05-persistent-storage.md</code>.</li><li>Your cluster needs a default StorageClass (kind/minikube usually have one — check <code>kubectl get storageclass</code>).</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a PVC <code>data-pvc</code> (1Gi, ReadWriteOnce). Show it is <code>Bound</code>.</li><li>Run a Pod that mounts it at <code>/data</code> and writes <code>hello</code> into <code>/data/file.txt</code>.</li><li>Delete that Pod.</li><li>Run a NEW Pod with the SAME PVC and show <code>/data/file.txt</code> still says <code>hello</code>.</li><li>Show <code>kubectl get pvc,pv</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ PVC Bound.</li><li>☐ Pod writes to the PVC.</li><li>☐ Pod deleted.</li><li>☐ New Pod reads the same data (survived!).</li></ul><h2>7. Expected outcome</h2><p>Data written by one Pod is still there for a new Pod, because it lives in the PVC, not the Pod.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the PVC YAML and show <code>kubectl get pvc</code> as <code>Bound</code>.</li><li>A Pod mounts the PVC and writes <code>/data/file.txt</code> (show the write).</li><li>You delete that Pod.</li><li>A NEW Pod with the same <code>claimName</code> shows <code>/data/file.txt</code> still contains <code>hello</code> (<code>kubectl exec ... cat /data/file.txt</code>).</li><li><code>kubectl get pvc,pv</code> output shown.</li><li>You explain in one line what the Pod mounts (PVC, not PV).</li></ol><h2>9. Verification checklist</h2><ul><li>☐ PVC Bound.</li><li>☐ Data survived Pod deletion.</li><li>☐ Evidence saved in <code>submissions/kubernetes/intermediate/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Using <code>emptyDir</code> instead of a PVC.</li><li>PVC <code>Pending</code> because there is no StorageClass.</li><li>Mounting the PV directly instead of the PVC.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the PVC + Pod YAML in `study/kubernetes/intermediate/05-persistent-storage.md`, section 3.</details>\n<details><summary>Hint 2</summary>If PVC is Pending: `kubectl get storageclass`. On kind/minikube a default class should exist.</details>\n<details><summary>Hint 3</summary>Read after re-create: `kubectl exec <new-pod> -- cat /data/file.txt`.</details>\n<h2>12. Final challenge</h2><p>Use the PVC with a real <strong>postgres</strong> Deployment (mount at <code>/var/lib/postgresql/data</code>). Create a table, delete the Pod, and prove the table is still there after the new Pod starts. This is real stateful storage.</p><h2>13. What to submit (evidence)</h2><p>Save the PVC/Pod YAML, the write, the delete, and the survive proof in <code>submissions/kubernetes/intermediate/project-05/</code>. Then say: <strong>\"I submit Kubernetes Intermediate Project 5.\"</strong></p><hr><p><strong>Remember:</strong> PV = storage, PVC = request, Pod mounts the PVC. Data in a PVC survives Pod restarts.</p></section>","kubernetes/intermediate/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: StatefulSets</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Stateful</strong> — an app that remembers data (like a database). Opposite of stateless.</li><li><strong>StatefulSet</strong> — a controller for stateful apps. Gives each Pod a stable name and its own storage.</li><li><strong>Stable identity</strong> — Pod names stay the same: <code>db-0</code>, <code>db-1</code>, <code>db-2</code>.</li><li><strong>Headless Service</strong> — a Service with no cluster IP, used to give each Pod a DNS name.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A Deployment is great for <strong>stateless</strong> apps (any Pod is the same). But some apps are <strong>stateful</strong> (databases): each Pod needs a <strong>stable name</strong> and its <strong>own storage</strong>.</p><p>A <strong>StatefulSet</strong> gives:</p><ol><li><strong>Stable names:</strong> <code>db-0</code>, <code>db-1</code>, <code>db-2</code> (not random).</li><li><strong>Own storage:</strong> each Pod gets its own PVC (via <code>volumeClaimTemplates</code>).</li><li><strong>Ordered</strong> start and stop: <code>db-0</code> first, then <code>db-1</code>, etc.</li></ol><p>It uses a <strong>headless Service</strong> so each Pod gets its own DNS name.</p><h2>2. Key concepts and terms</h2><ul><li><code>volumeClaimTemplates</code> — makes one PVC per Pod automatically.</li><li>Pod DNS: <code>db-0.dbsvc.namespace.svc.cluster.local</code>.</li><li>Deleting a StatefulSet does not delete its PVCs by default (data is kept).</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: v1\nkind: Service\nmetadata: { name: dbsvc }\nspec:\n  clusterIP: None            # headless\n  selector: { app: db }\n  ports: [{ port: 5432 }]\n---\napiVersion: apps/v1\nkind: StatefulSet\nmetadata: { name: db }\nspec:\n  serviceName: dbsvc\n  replicas: 3\n  selector: { matchLabels: { app: db } }\n  template:\n    metadata: { labels: { app: db } }\n    spec:\n      containers:\n        - name: c\n          image: busybox\n          command: [\"sh\",\"-c\",\"hostname; sleep 3600\"]\n          volumeMounts: [{ name: data, mountPath: /data }]\n  volumeClaimTemplates:\n    - metadata: { name: data }\n      spec:\n        accessModes: [\"ReadWriteOnce\"]\n        resources: { requests: { storage: 1Gi } }</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl get statefulset,pods,pvc\nkubectl get pods -l app=db          # names: db-0, db-1, db-2\nkubectl exec db-0 -- hostname       # stable name</code></pre><h2>5. Hands-on exercises</h2><ol><li>Create a headless Service + a StatefulSet with 3 replicas.</li><li>See the stable Pod names <code>db-0/1/2</code> and one PVC per Pod.</li><li>Delete <code>db-1</code>; watch it come back with the same name and its own storage.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Pods stuck <code>Pending</code>.</li></ul><p>  <strong>Fix:</strong> PVCs cannot bind (no StorageClass). Check <code>kubectl get pvc</code>.</p><ul><li><strong>Problem:</strong> no stable DNS.</li></ul><p>  <strong>Fix:</strong> you need the headless Service (<code>clusterIP: None</code>) named in <code>serviceName</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Using a Deployment for a database that needs stable identity/storage.</li><li>Forgetting the headless Service.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> know when to use a StatefulSet vs a Deployment, and <code>volumeClaimTemplates</code>.</li><li>Stable names and per-Pod storage are the key ideas.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>When do you use a StatefulSet instead of a Deployment?</li><li>What does <code>volumeClaimTemplates</code> do?</li><li>What is a headless Service for?</li></ol><h2>10. References</h2><ul><li>StatefulSets: <a href=\"https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"StatefulSet\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> StatefulSet = stable names + own storage + order. For databases, not stateless web apps.</p><details><summary>Answers</summary>\n<ol><li>For stateful apps (like databases) that need stable names and their own storage.</li><li>Creates one PVC per Pod automatically.</li><li>To give each Pod its own stable DNS name.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Run a Stateful App with a StatefulSet</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Create a StatefulSet with stable Pod names and one PVC per Pod, fronted by a headless Service.</p><h2>2. Real-world scenario</h2><p>You must run a database cluster where each member has a fixed name and its own storage. A Deployment cannot do this. A StatefulSet can.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a headless Service.</li><li>Create a StatefulSet with <code>volumeClaimTemplates</code>.</li><li>See stable names and per-Pod storage.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Intermediate Project 5 completed.</li><li>Read: <code>study/kubernetes/intermediate/06-statefulsets.md</code>.</li><li>Cluster needs a default StorageClass.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a headless Service (<code>clusterIP: None</code>) for <code>app: db</code>.</li><li>Create a StatefulSet <code>db</code> with 3 replicas and a <code>volumeClaimTemplates</code> (1Gi each).</li><li>Show the Pod names are <code>db-0</code>, <code>db-1</code>, <code>db-2</code> (stable).</li><li>Show there is one PVC per Pod (<code>kubectl get pvc</code>).</li><li>Delete <code>db-1</code>. Show it returns with the SAME name and its own storage.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Headless Service created.</li><li>☐ StatefulSet with 3 stable Pods.</li><li>☐ One PVC per Pod.</li><li>☐ Deleted Pod returns with same name.</li></ul><h2>7. Expected outcome</h2><p>Three Pods with stable names, each with its own storage. Deleting one brings it back with the same identity.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the headless Service (<code>clusterIP: None</code>) and the StatefulSet YAML (with <code>serviceName</code> and <code>volumeClaimTemplates</code>).</li><li><code>kubectl get pods -l app=db</code> shows <code>db-0</code>, <code>db-1</code>, <code>db-2</code>.</li><li><code>kubectl get pvc</code> shows one PVC per Pod (e.g. <code>data-db-0</code>, <code>data-db-1</code>, <code>data-db-2</code>).</li><li>You delete <code>db-1</code> and show it returns as <code>db-1</code> (same name).</li><li>You explain in one line why a StatefulSet is used instead of a Deployment here.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Stable names.</li><li>☐ Per-Pod PVCs.</li><li>☐ Identity kept after delete.</li><li>☐ Evidence saved in <code>submissions/kubernetes/intermediate/project-06/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Forgetting the headless Service.</li><li>PVCs Pending (no StorageClass).</li><li>Expecting random names like a Deployment.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the full Service + StatefulSet example in `study/kubernetes/intermediate/06-statefulsets.md`, section 3.</details>\n<details><summary>Hint 2</summary>`kubectl get pods -l app=db` and `kubectl get pvc` show the stable identity and per-Pod storage.</details>\n<details><summary>Hint 3</summary>Delete test: `kubectl delete pod db-1` then `kubectl get pods -l app=db -w`.</details>\n<h2>12. Final challenge</h2><p>Write a file into <code>db-0</code>'s storage, delete <code>db-0</code>, and after it returns show the file is still there. This proves each Pod keeps its own data across restarts.</p><h2>13. What to submit (evidence)</h2><p>Save the YAMLs, the stable-name output, the per-Pod PVCs, and the delete/return proof in <code>submissions/kubernetes/intermediate/project-06/</code>. Then say: <strong>\"I submit Kubernetes Intermediate Project 6.\"</strong></p><hr><p><strong>Remember:</strong> StatefulSet = stable names + own storage + order. Databases love it; stateless web apps do not need it.</p></section>","kubernetes/intermediate/project-07":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Ingress (One Door for Many Services)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Ingress</strong> — a rule set that routes outside HTTP traffic to Services by host or path.</li><li><strong>Ingress controller</strong> — the actual proxy that does the routing (e.g. nginx-ingress).</li><li><strong>Host</strong> — a domain name, like <code>shop.example.com</code>.</li><li><strong>Path</strong> — a URL path, like <code>/api</code>.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>NodePort works but is ugly (random high ports). In production you want clean URLs and HTTPS. <strong>Ingress</strong> gives that.</p><p>Two parts:</p><ol><li><strong>Ingress controller</strong> — the proxy that runs in the cluster (you must install one, like nginx-ingress).</li><li><strong>Ingress resource</strong> — the rules: \"host <code>shop.local</code> path <code>/</code> → Service <code>web</code>; path <code>/api</code> → Service <code>api</code>\".</li></ol><p>This is the cluster version of the Docker reverse proxy you built earlier.</p><h2>2. Key concepts and terms</h2><ul><li>You must have an <strong>ingress controller</strong> installed first.</li><li>Rules match by <strong>host</strong> and/or <strong>path</strong> and send to a <strong>Service</strong>.</li><li>On kind/minikube you enable an ingress addon or install nginx-ingress.</li><li><code>minikube addons enable ingress</code> or install nginx-ingress via manifest/Helm.</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: shop\nspec:\n  rules:\n    - host: shop.local\n      http:\n        paths:\n          - path: /\n            pathType: Prefix\n            backend:\n              service:\n                name: web\n                port: { number: 80 }\n          - path: /api\n            pathType: Prefix\n            backend:\n              service:\n                name: api\n                port: { number: 80 }</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl get ingress\nkubectl describe ingress shop\n# test (map the host to the ingress IP in /etc/hosts, or use curl --resolve):\ncurl --resolve shop.local:80:&lt;ingress-ip&gt; http://shop.local/</code></pre><h2>5. Hands-on exercises</h2><ol><li>Install/enable an ingress controller (minikube addon, or nginx-ingress on kind).</li><li>Create two Services (<code>web</code>, <code>api</code>).</li><li>Create an Ingress that routes <code>/</code> → web and <code>/api</code> → api. Test both.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Ingress has no address / 404.</li></ul><p>  <strong>Fix:</strong> is the ingress controller installed and running? <code>kubectl get pods -n ingress-nginx</code>.</p><ul><li><strong>Problem:</strong> host does not resolve.</li></ul><p>  <strong>Fix:</strong> map the host to the ingress IP in <code>/etc/hosts</code>, or use <code>curl --resolve</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Creating an Ingress with no controller installed — nothing routes.</li><li>Wrong <code>pathType</code> or Service name/port.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD/CKA:</strong> Ingress is part of Services &amp; Networking.</li><li>Know the Ingress resource shape, <code>pathType</code>, and that a controller must exist.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What are the two parts of Ingress?</li><li>How does Ingress decide where to send a request?</li><li>What must exist before an Ingress resource works?</li></ol><h2>10. References</h2><ul><li>Ingress: <a href=\"https://kubernetes.io/docs/concepts/services-networking/ingress/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/services-networking/ingress/</a> (checked: 2026-09-18)</li><li>Ingress controllers: <a href=\"https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Ingress = rules; the controller = the proxy that runs them. Route by host/path to Services. Install a controller first.</p><details><summary>Answers</summary>\n<ol><li>The Ingress controller (proxy) and the Ingress resource (rules).</li><li>By host and/or path, sending to a Service.</li><li>An ingress controller.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Route Traffic with Ingress</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Install an ingress controller and route outside traffic to two Services by path.</p><h2>2. Real-world scenario</h2><p>You want clean URLs: <code>shop.local/</code> goes to the website, <code>shop.local/api</code> goes to the API. One door, clear routing. That is Ingress.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Install/enable an ingress controller.</li><li>Write an Ingress resource.</li><li>Route by path to different Services.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Intermediate Project 6 completed.</li><li>Read: <code>study/kubernetes/intermediate/07-ingress.md</code>.</li><li>You will install an ingress controller (minikube addon or nginx-ingress on kind).</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Install/enable an ingress controller. Confirm its Pods are running.</li><li>Create two Deployments + Services: <code>web</code> and <code>api</code> (any small images; make their responses different so you can tell them apart).</li><li>Create an Ingress: host <code>shop.local</code>, <code>/</code> → <code>web</code>, <code>/api</code> → <code>api</code>.</li><li>Test both paths (use <code>/etc/hosts</code> mapping or <code>curl --resolve</code>).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Ingress controller running.</li><li>☐ Two Services created.</li><li>☐ Ingress routes <code>/</code> and <code>/api</code>.</li><li>☐ Both paths return the right app.</li></ul><h2>7. Expected outcome</h2><p>One host serves two apps by path through Ingress. The apps stay private behind it.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show the ingress controller Pods running (e.g. <code>kubectl get pods -n ingress-nginx</code>).</li><li>You paste the Ingress YAML with two path rules (<code>/</code> → web, <code>/api</code> → api).</li><li><code>curl</code> to <code>/</code> returns the <strong>web</strong> app's response.</li><li><code>curl</code> to <code>/api</code> returns the <strong>api</strong> app's response.</li><li>You explain in one line how this is like the Docker reverse proxy you built earlier.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Controller running.</li><li>☐ Two paths route correctly.</li><li>☐ Evidence saved in <code>submissions/kubernetes/intermediate/project-07/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>No controller installed → Ingress does nothing.</li><li>Wrong Service name/port in the backend.</li><li>Host not resolving → use <code>curl --resolve</code> or <code>/etc/hosts</code>.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>minikube: `minikube addons enable ingress`. kind: install nginx-ingress from the official manifest for kind.</details>\n<details><summary>Hint 2</summary>Use the Ingress YAML in `study/kubernetes/intermediate/07-ingress.md`, section 3.</details>\n<details><summary>Hint 3</summary>Test without editing hosts: `curl --resolve shop.local:80:<ingress-ip> http://shop.local/api`.</details>\n<h2>12. Final challenge</h2><p>Add <strong>host-based</strong> routing too: create a second host <code>api.local</code> that goes straight to the <code>api</code> Service. Now you route by both host and path. This is very close to a real production setup.</p><h2>13. What to submit (evidence)</h2><p>Save the Ingress YAML, controller status, and both path tests in <code>submissions/kubernetes/intermediate/project-07/</code>. Then say: <strong>\"I submit Kubernetes Intermediate Project 7.\"</strong></p><hr><p><strong>Remember:</strong> Ingress routes by host/path to Services, run by a controller. It is the cluster version of a reverse proxy.</p></section>","kubernetes/intermediate/project-08":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: A Full Multi-Service App</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Multi-service app</strong> — an app made of several parts (frontend, backend, database).</li><li><strong>Wire together</strong> — connect the parts so they work as one.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Now you combine the whole Intermediate level into one real app:</p><ul><li>a <strong>frontend</strong> Deployment + Service,</li><li>a <strong>backend/API</strong> Deployment + Service (with probes, requests/limits),</li><li>a <strong>database</strong> StatefulSet + headless Service + PVC (persistent data),</li><li><strong>ConfigMap</strong> + <strong>Secret</strong> for settings,</li><li>an <strong>Ingress</strong> as the front door.</li></ul><p>This looks like a real production app, and it is exactly the kind of task CKAD tests.</p><h2>2. Key concepts and terms</h2><ul><li>Keep everything in one namespace.</li><li>Frontend talks to backend by Service name; backend talks to db by Service name.</li><li>Probes + resources on each Deployment.</li><li>Ingress routes outside traffic in.</li></ul><h2>3. Practical examples (structure)</h2><pre><code>namespace: shop\n├─ ConfigMap (app settings)\n├─ Secret (db password)\n├─ StatefulSet db + headless Service dbsvc + PVCs\n├─ Deployment api + Service api (probes, resources, uses Secret+Config)\n├─ Deployment web + Service web (probes, resources)\n└─ Ingress  (/ -&gt; web, /api -&gt; api)</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl apply -f app/            # apply the whole folder\nkubectl get all,ingress,pvc -n shop\nkubectl get endpoints -n shop\n# test through the ingress, and test api-&gt;db connectivity</code></pre><h2>5. Hands-on exercises</h2><ol><li>Build each part (you already know them all).</li><li>Wire them: web → api → db, all by Service name.</li><li>Test end to end through the Ingress.</li></ol><h2>6. Troubleshooting</h2><ul><li>Use the method: <code>kubectl get pods</code> (status) → <code>kubectl describe</code> → <code>kubectl logs</code> → check endpoints and labels.</li><li>No endpoints → label/selector mismatch.</li><li>api cannot reach db → wrong Service name or namespace.</li></ul><h2>7. Common mistakes and how to avoid them</h2><ul><li>Parts in different namespaces.</li><li>Missing probes or resources on a Deployment.</li><li>Forgetting the Ingress controller.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKAD:</strong> this ties together most of the exam: deployment, config, storage, networking, and observability.</li><li>Practice building it fast, all from YAML.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>How do the app parts find each other?</li><li>Which part needs persistent storage?</li><li>What routes outside traffic in?</li></ol><h2>10. References</h2><ul><li>Example app: <a href=\"https://kubernetes.io/docs/tutorials/stateless-application/guestbook/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tutorials/stateless-application/guestbook/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Kubernetes full app\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Wire parts by Service name, keep them in one namespace, add probes + resources, and route with Ingress.</p><details><summary>Answers</summary>\n<ol><li>By Service name (DNS) inside the cluster.</li><li>The database (StatefulSet + PVC).</li><li>The Ingress (with its controller).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build a Full Multi-Service App (K8s Intermediate Boss 🏆🏆)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>last project</strong> of Kubernetes Intermediate. Finish it to complete the level and unlock Kubernetes Advanced. It combines everything you learned.</p><h2>1. Objective</h2><p>Deploy a real multi-service app: frontend + API + database, with config, secrets, storage, probes, resources, and an Ingress.</p><h2>2. Real-world scenario</h2><p>Your team hands you a 3-part app (web, api, db). You must deploy it properly on Kubernetes: connected, healthy, configured, with persistent data, behind a clean URL.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Combine all Intermediate objects into one working app.</li><li>Wire parts by Service name.</li><li>Verify end to end.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Intermediate Projects 1–7 completed.</li><li>Read: <code>study/kubernetes/intermediate/08-multi-service-app.md</code>.</li><li>An ingress controller installed (from Project 7).</li></ul><h2>5. Step-by-step requirements</h2><p>In one namespace <code>shop</code>, deploy:</p><ol><li>A <strong>ConfigMap</strong> (app settings) and a <strong>Secret</strong> (db password).</li><li>A <strong>database</strong>: StatefulSet + headless Service + PVC (persistent), using the Secret for its password.</li><li>An <strong>API</strong>: Deployment + Service, with a <strong>liveness</strong> + <strong>readiness</strong> probe and <strong>requests/limits</strong>, that reads the ConfigMap and Secret.</li><li>A <strong>frontend</strong>: Deployment + Service, with probes and resources.</li><li>An <strong>Ingress</strong>: <code>/</code> → web, <code>/api</code> → api.</li><li>Verify: everything Running/Ready, endpoints present, and the app reachable through the Ingress. Prove the db data persists across a Pod restart.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ All parts in namespace <code>shop</code>.</li><li>☐ db is a StatefulSet with a PVC (data persists).</li><li>☐ api + web have probes and resources.</li><li>☐ Config + Secret used.</li><li>☐ Ingress routes <code>/</code> and <code>/api</code>.</li><li>☐ End-to-end test passes.</li></ul><h2>7. Expected outcome</h2><p>A complete, healthy, connected app runs on Kubernetes, reachable through one Ingress, with persistent database data.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>kubectl get all,ingress,pvc -n shop</code> shows every part running/ready.</li><li>The db is a <strong>StatefulSet</strong> with a PVC; you prove data survives a Pod restart.</li><li>The api Deployment shows <strong>probes</strong> and <strong>requests/limits</strong> in its YAML.</li><li>api and web use the <strong>ConfigMap</strong> and the api uses the <strong>Secret</strong> (show it in the YAML / <code>printenv</code>).</li><li><code>curl</code> through the Ingress reaches <strong>web</strong> on <code>/</code> and <strong>api</strong> on <code>/api</code>.</li><li>All Services have endpoints (labels/selectors match).</li><li>You paste all YAML and the test outputs.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ All parts running in one namespace.</li><li>☐ db data persists.</li><li>☐ Probes + resources present.</li><li>☐ Ingress routes correctly.</li><li>☐ Evidence saved in <code>submissions/kubernetes/intermediate/project-08/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Parts in different namespaces.</li><li>Missing probes/resources.</li><li>Label/selector mismatch → no endpoints.</li><li>Forgetting the ingress controller.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Reuse your work: db from Project 6, PVC idea from 5, probes from 1, resources from 2, Ingress from 7, Config/Secret from Beginner 5/6.</details>\n<details><summary>Hint 2</summary>Build it in parts and test each before adding the next. Check `kubectl get endpoints -n shop` often.</details>\n<details><summary>Hint 3</summary>Structure is in `study/kubernetes/intermediate/08-multi-service-app.md`, section 3.</details>\n<h2>12. Final challenge</h2><p>Do a <strong>zero-downtime rolling update</strong> of the api while curling <code>/api</code> in a loop through the Ingress. Show no failed requests during the update. This proves your probes and Deployment are set up right.</p><h2>13. What to submit (evidence)</h2><p>Save all YAML, <code>kubectl get all,ingress,pvc -n shop</code>, the persistence proof, and the end-to-end tests in <code>submissions/kubernetes/intermediate/project-08/</code>. Then say: <strong>\"I submit Kubernetes Intermediate Project 8.\"</strong
