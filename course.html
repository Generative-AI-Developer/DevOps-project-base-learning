>12. Final challenge</h2><p>Make the script also save a report line to <code>~/log-report.txt</code> with the date, the word, and the count, each time it runs. (Tip: <code>echo \"$(date) $WORD $COUNT\" &gt;&gt; ~/log-report.txt</code>.)</p><h2>13. What to submit (evidence)</h2><p>Save the script + your test runs in <code>submissions/linux/intermediate/project-02/</code>. Then say: <strong>\"I submit Linux Intermediate Project 2.\"</strong></p><hr><p><strong>Remember:</strong> Filter with <code>grep -i</code>, count with <code>-c</code>, and alert on problems. Logs are your first stop in troubleshooting.</p></section>","linux/intermediate/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Write Your Own systemd Service</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>systemd</strong> — the manager that starts and controls services on boot.</li><li><strong>Unit file</strong> — a small config file that describes a service. Ends in <code>.service</code>.</li><li><strong>Enable</strong> — make a service start automatically on boot.</li><li><strong>Start</strong> — run the service now.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A <strong>service</strong> is a program that runs in the background. You can make your <strong>own</strong> service so Linux keeps it running and starts it on boot.</p><p>You do this by writing a small <strong>unit file</strong>. Then systemd takes care of the rest: starting, stopping, restarting, and logging.</p><h2>2. Key concepts and terms</h2><ul><li>Unit files live in <code>/etc/systemd/system/NAME.service</code>.</li><li>Three main parts:</li><li><code>[Unit]</code> — description and order.</li><li><code>[Service]</code> — what to run (<code>ExecStart</code>).</li><li><code>[Install]</code> — when to start (<code>WantedBy</code>).</li><li>After you write or change a unit, run <code>sudo systemctl daemon-reload</code>.</li></ul><h2>3. Practical examples</h2><p>A service that runs a script forever:</p><pre><code>[Unit]\nDescription=My Hello Service\nAfter=network.target\n\n[Service]\nExecStart=/home/you/hello-loop.sh\nRestart=always\n\n[Install]\nWantedBy=multi-user.target</code></pre><h2>4. Commands and config examples</h2><pre><code># the script the service runs (hello-loop.sh)\n#!/bin/bash\nwhile true; do\n  echo \"Hello at $(date)\"\n  sleep 10\ndone</code></pre><pre><code>sudo nano /etc/systemd/system/hello.service   # write the unit (see example above)\nsudo systemctl daemon-reload                   # reload systemd config\nsudo systemctl start hello                      # start now\nsudo systemctl status hello                     # check it\nsudo systemctl enable hello                      # start on boot\njournalctl -u hello -f                           # watch its logs live\nsudo systemctl stop hello                        # stop it</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make <code>hello-loop.sh</code> (runnable) that prints the time every 10 seconds.</li><li>Write <code>hello.service</code> to run it.</li><li><code>daemon-reload</code>, <code>start</code>, and <code>status</code>. See it \"active (running)\".</li><li>Watch its logs with <code>journalctl -u hello -f</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> service fails right away.</li></ul><p>  <strong>Fix:</strong> check <code>systemctl status hello</code> and <code>journalctl -u hello</code>. Common causes: wrong path in <code>ExecStart</code>, or the script is not runnable (<code>chmod +x</code>).</p><ul><li><strong>Problem:</strong> you changed the unit but nothing changed.</li></ul><p>  <strong>Fix:</strong> run <code>sudo systemctl daemon-reload</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Wrong path in <code>ExecStart</code> — use the full path.</li><li>Script not runnable — <code>chmod +x</code>.</li><li>Forgetting <code>daemon-reload</code> after editing.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Kubernetes runs <code>kubelet</code> as a systemd service. In CKA you check and fix it: <code>systemctl status kubelet</code>, <code>journalctl -u kubelet</code>, then restart.</li><li>Knowing unit files helps you fix a broken node.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Where do custom unit files go?</li><li>What does <code>enable</code> do (vs <code>start</code>)?</li><li>What command reloads systemd after editing a unit?</li></ol><h2>10. References</h2><ul><li>systemd unit docs: <a href=\"https://www.freedesktop.org/software/systemd/man/systemd.service.html\" target=\"_blank\" rel=\"noopener\">https://www.freedesktop.org/software/systemd/man/systemd.service.html</a> (checked: 2026-09-18)</li><li>Video: <strong>Learn Linux TV</strong> — \"Create a systemd service\" — <a href=\"https://www.youtube.com/c/LearnLinuxTV\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/LearnLinuxTV</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Unit file → <code>daemon-reload</code> → <code>start</code> → <code>enable</code>. <code>status</code> and <code>journalctl</code> show problems.</p><details><summary>Answers</summary>\n<ol><li><code>/etc/systemd/system/</code>.</li><li><code>enable</code> makes it start on boot; <code>start</code> runs it now.</li><li><code>sudo systemctl daemon-reload</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Run Your Program as a Service</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Write your own systemd service. Make Linux run your script in the background and start it on boot.</p><h2>2. Real-world scenario</h2><p>You wrote a small program that must run all the time. If it stops, it should restart by itself. And it must start when the server boots. The right tool for this is a <strong>systemd service</strong>.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Write a <code>.service</code> unit file.</li><li><code>daemon-reload</code>, <code>start</code>, <code>status</code>, <code>enable</code>.</li><li>Auto-restart with <code>Restart=always</code>.</li><li>Read service logs with <code>journalctl</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Intermediate Project 2 completed.</li><li>Read: <code>study/linux/intermediate/03-systemd-services.md</code>.</li><li>⚠️ This uses <code>sudo</code>. You are editing system files. Go slow and read each step.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write <code>hello-loop.sh</code> (runnable): print the time every 10 seconds, forever.</li><li>Write <code>/etc/systemd/system/hello.service</code> to run it, with <code>Restart=always</code>.</li><li><code>daemon-reload</code>, then <code>start</code>, then <code>status</code> (must show \"active (running)\").</li><li>Watch logs: <code>journalctl -u hello</code> (show a few lines).</li><li><code>enable</code> it so it would start on boot.</li><li>Then <code>stop</code> and <code>disable</code> it to clean up (leave your system tidy).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Script runs a loop and prints the time.</li><li>☐ Unit file is correct (full path in <code>ExecStart</code>).</li><li>☐ Service shows \"active (running)\".</li><li>☐ Logs show the time messages.</li><li>☐ You enabled, then cleaned up (stop + disable).</li></ul><h2>7. Expected outcome</h2><p>Your service runs your script in the background, logs messages, and could start on boot. You can start, check, and stop it.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste <code>hello-loop.sh</code> and the <code>hello.service</code> unit file.</li><li><code>systemctl status hello</code> output shows <strong>active (running)</strong>.</li><li><code>journalctl -u hello</code> shows at least 2 time messages from your script.</li><li>The unit has <code>Restart=always</code>.</li><li>You show <code>systemctl enable hello</code> worked, and then you cleaned up with <code>stop</code> + <code>disable</code>.</li><li>You explain in one sentence why <code>daemon-reload</code> is needed.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Service was active and logging.</li><li>☐ Restart=always is present.</li><li>☐ Cleaned up after.</li><li>☐ Evidence saved in <code>submissions/linux/intermediate/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Wrong path in <code>ExecStart</code> — service fails. Use the full path.</li><li>Script not runnable — <code>chmod +x</code>.</li><li>Forgetting <code>daemon-reload</code> after editing the unit.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Copy the unit and script from the study doc, section 3–4. Fix the path in `ExecStart` to your real home path.</details>\n<details><summary>Hint 2</summary>Order: write files → `sudo systemctl daemon-reload` → `sudo systemctl start hello` → `systemctl status hello`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>\n<pre><code># hello-loop.sh\n#!/bin/bash\nwhile true; do echo \"Hello at $(date)\"; sleep 10; done</code></pre><p>Put it at <code>/home/you/hello-loop.sh</code>, <code>chmod +x</code> it, set that full path in the unit's <code>ExecStart</code>.</p></details>\n<h2>12. Final challenge</h2><p>Break it on purpose: put a wrong path in <code>ExecStart</code>. Reload and start. Read <code>systemctl status</code> and <code>journalctl</code> to see the error. Then fix it. This is real troubleshooting practice.</p><h2>13. What to submit (evidence)</h2><p>Save the script, the unit file, the <code>status</code> output, and log lines in <code>submissions/linux/intermediate/project-03/</code>. Then say: <strong>\"I submit Linux Intermediate Project 3.\"</strong></p><hr><p><strong>Remember:</strong> unit → <code>daemon-reload</code> → <code>start</code> → <code>enable</code>. This is exactly how <code>kubelet</code> runs in CKA.</p></section>","linux/intermediate/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Bash Automation (Functions + Cron)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Function</strong> — a named block of commands you can reuse. In simple words: a mini-script inside your script.</li><li><strong>Exit code</strong> — a number a command returns: <code>0</code> = success, not <code>0</code> = error.</li><li><strong>Log line</strong> — a message your script saves so you know what happened.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>In Beginner you wrote a small script. Now you write <strong>bigger, cleaner</strong> scripts.</p><p>Two big ideas:</p><ol><li><strong>Functions</strong> — group steps into named blocks. This keeps scripts tidy and reusable.</li><li><strong>Exit codes</strong> — check if a step worked before doing the next step.</li></ol><p>Then you run the script automatically with <strong>cron</strong>.</p><h2>2. Key concepts and terms</h2><ul><li><strong>Define a function:</strong></li></ul><pre><code>  greet() { echo \"Hello $1\"; }\n  greet \"Sara\"</code></pre><ul><li><strong>Check success:</strong> every command sets <code>$?</code>. <code>0</code> means success.</li></ul><pre><code>  if command; then echo \"ok\"; else echo \"failed\"; fi</code></pre><ul><li><strong>Logging:</strong> write messages with a time:</li></ul><pre><code>  log() { echo \"$(date '+%F %T') $1\" &gt;&gt; \"$HOME/run.log\"; }</code></pre><h2>3. Practical examples</h2><pre><code>#!/bin/bash\nlog() { echo \"$(date '+%F %T') $*\" &gt;&gt; \"$HOME/run.log\"; }\n\ncheck_disk() {\n  USE=$(df / | awk 'NR==2 {print $5}' | tr -d '%')\n  log \"Disk use is ${USE}%\"\n  if [ \"$USE\" -gt 80 ]; then\n    log \"WARNING: disk over 80%\"\n    return 1\n  fi\n  return 0\n}\n\ncheck_disk &amp;&amp; log \"Disk OK\" || log \"Disk needs attention\"</code></pre><h2>4. Commands and config examples</h2><pre><code># run a task and stop if it fails\nset -e                 # stop the whole script on any error\nmkdir -p ~/data\ncp important.txt ~/data/ || { echo \"copy failed\"; exit 1; }</code></pre><pre><code># schedule the script every hour\ncrontab -e\n# add:\n0 * * * * /home/you/health-check.sh</code></pre><h2>5. Hands-on exercises</h2><ol><li>Write a <code>log()</code> function that writes a timed message to a file.</li><li>Write a function that checks disk use and warns if over 80%.</li><li>Call the functions and read the log file.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> function \"not found\".</li></ul><p>  <strong>Fix:</strong> define the function <strong>before</strong> you call it.</p><ul><li><strong>Problem:</strong> number compare fails.</li></ul><p>  <strong>Fix:</strong> use <code>-gt</code>, <code>-lt</code> for numbers (not <code>&gt;</code>), and remove the <code>%</code> sign first.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>No logging — you cannot see what happened later. Always log.</li><li>Not checking exit codes — a failed step continues silently. Use <code>if</code> or <code>set -e</code>.</li><li>Huge scripts with no functions — hard to read. Use functions.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Clean, reusable bash saves time in exams and jobs.</li><li><code>awk</code>, <code>df</code>, and exit-code checks are common in real troubleshooting.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a function, in simple words?</li><li>What does exit code <code>0</code> mean?</li><li>How do you write a timed log line?</li></ol><h2>10. References</h2><ul><li>Bash guide (functions): <a href=\"https://tldp.org/LDP/Bash-Beginners-Guide/html/sect_11_01.html\" target=\"_blank\" rel=\"noopener\">https://tldp.org/LDP/Bash-Beginners-Guide/html/sect_11_01.html</a> (checked: 2026-09-18)</li><li>Video: <strong>freeCodeCamp.org</strong> — \"Bash scripting\" — <a href=\"https://www.youtube.com/c/Freecodecamp\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/Freecodecamp</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Functions keep scripts clean. Check exit codes. Always log what happened.</p><details><summary>Answers</summary>\n<ol><li>A named block of commands you can reuse.</li><li>Success (the command worked).</li><li><code>echo \"$(date '+%F %T') message\" &gt;&gt; file</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Automate a Server Health Check</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Write a clean bash script with functions that checks server health (disk and memory), logs the result, and can run on a schedule.</p><h2>2. Real-world scenario</h2><p>Servers fill up and slow down. Your team wants an automatic check every hour that writes a health report and warns when disk or memory is high. This saves you from surprise outages.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Write and use <strong>functions</strong>.</li><li>Check <strong>disk</strong> (<code>df</code>) and <strong>memory</strong> (<code>free</code>).</li><li>Use <strong>exit codes</strong> to decide pass/warn.</li><li><strong>Log</strong> timed messages.</li><li>Schedule with <strong>cron</strong>.</li></ul><h2>4. Prerequisites</h2><ul><li>Intermediate Project 3 completed.</li><li>Read: <code>study/linux/intermediate/04-bash-automation.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write <code>health-check.sh</code> with:</li></ol><ul><li>a <code>log()</code> function that writes timed lines to <code>~/health.log</code>,</li><li>a <code>check_disk()</code> function: warn if <code>/</code> use is over 80%,</li><li>a <code>check_mem()</code> function: warn if used memory is over 80%,</li><li>a final summary line: <code>Health OK</code> or <code>Health needs attention</code>.</li></ul><ol><li>Run it by hand. Show <code>~/health.log</code>.</li><li>Add a cron line to run it every hour. Show <code>crontab -l</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Script uses at least 2 functions.</li><li>☐ Disk check works (uses <code>df</code> + <code>awk</code>).</li><li>☐ Memory check works (uses <code>free</code>).</li><li>☐ Timed log lines are written to <code>~/health.log</code>.</li><li>☐ A cron line runs it hourly.</li></ul><h2>7. Expected outcome</h2><p><code>./health-check.sh</code> writes a timed health report and says OK or needs attention. Cron runs it every hour.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the full <code>health-check.sh</code>.</li><li>The script defines and uses at least <strong>2 functions</strong> (like <code>check_disk</code>, <code>check_mem</code>).</li><li><code>~/health.log</code> shows timed lines from a run (show <code>cat ~/health.log</code>).</li><li>The script prints a final summary (<code>Health OK</code> or <code>Health needs attention</code>).</li><li><code>crontab -l</code> shows an hourly line for the script.</li><li>You explain in one sentence why logging is useful.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Functions used.</li><li>☐ Disk and memory checked.</li><li>☐ Log file has timed lines.</li><li>☐ Cron line shown.</li><li>☐ Evidence saved in <code>submissions/linux/intermediate/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Comparing numbers with <code>&gt;</code> instead of <code>-gt</code>.</li><li>Leaving the <code>%</code> sign in the disk number (remove it with <code>tr -d '%'</code>).</li><li>Calling a function before defining it.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Get disk use: `df / | awk 'NR==2 {print $5}' | tr -d '%'`.</details>\n<details><summary>Hint 2</summary>Get memory use percent: `free | awk '/Mem:/ {printf \"%d\", $3/$2*100}'`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>Start from the `check_disk` example in `study/linux/intermediate/04-bash-automation.md`, section 3. Add a `check_mem` function the same way.</details>\n<h2>12. Final challenge</h2><p>Add a third check: warn if there are more than 200 processes (<code>ps -e --no-headers | wc -l</code>). Log the number.</p><h2>13. What to submit (evidence)</h2><p>Save the script, a run, <code>cat ~/health.log</code>, and <code>crontab -l</code> in <code>submissions/linux/intermediate/project-04/</code>. Then say: <strong>\"I submit Linux Intermediate Project 4.\"</strong></p><hr><p><strong>Remember:</strong> Functions + exit codes + logging = clean automation. This is how real monitoring starts.</p></section>","linux/intermediate/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Network Troubleshooting</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>IP address</strong> — the number address of a computer on a network.</li><li><strong>Port</strong> — a numbered door on a computer for one service (like 22 for SSH, 80 for web).</li><li><strong>DNS</strong> — the phone book that turns a name (google.com) into an IP address.</li><li><strong>Ping</strong> — a test that asks \"are you there?\".</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>When \"the internet is down\" or \"the app cannot connect\", you must find where it breaks. Networking has layers:</p><ol><li>Do I have an IP address? (<code>ip a</code>)</li><li>Can I reach another computer? (<code>ping</code>)</li><li>Can I turn names into IPs? (<code>dig</code> / <code>nslookup</code> — this is DNS)</li><li>Is the service's port open? (<code>ss</code>, <code>curl</code>)</li></ol><p>You check each step, in order, until you find the broken one.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>ip a</code></strong> — show your IP addresses.</li><li><strong><code>ip r</code></strong> — show the routing table (the way out).</li><li><strong><code>ping HOST</code></strong> — test if a host answers.</li><li><strong><code>dig NAME</code></strong> or <strong><code>nslookup NAME</code></strong> — test DNS.</li><li><strong><code>ss -tlnp</code></strong> — show which ports are open and listening.</li><li><strong><code>curl URL</code></strong> — try to talk to a web service.</li></ul><h2>3. Practical examples</h2><ul><li>My IP → <code>ip a</code></li><li>Can I reach Google? → <code>ping -c 3 8.8.8.8</code></li><li>Does DNS work? → <code>dig google.com +short</code></li><li>Is a web server up? → <code>curl -I http://localhost</code></li><li>What ports listen? → <code>sudo ss -tlnp</code></li></ul><h2>4. Commands and config examples</h2><pre><code>ip a                       # my IP addresses\nip r                       # my routes (default gateway)\nping -c 3 8.8.8.8          # reach an IP (skips DNS)\nping -c 3 google.com       # reach a name (uses DNS)\ndig google.com +short      # DNS lookup, short answer\nsudo ss -tlnp              # listening TCP ports + program\ncurl -I https://example.com  # get just the headers</code></pre><h2>5. Hands-on exercises</h2><ol><li>Show your IP with <code>ip a</code>. Find your main IP.</li><li>Ping <code>8.8.8.8</code> three times. Then ping <code>google.com</code>.</li><li>Do a DNS lookup of <code>github.com</code>.</li><li>List listening ports with <code>sudo ss -tlnp</code>.</li></ol><h2>6. Troubleshooting (the ladder)</h2><ul><li><code>ping 8.8.8.8</code> works but <code>ping google.com</code> fails → <strong>DNS problem</strong> (names do not resolve).</li><li>No IP from <code>ip a</code> → network interface is down or no DHCP.</li><li>Service unreachable but host pings → check the <strong>port</strong> with <code>ss</code> or <code>curl</code>.</li></ul><h2>7. Common mistakes and how to avoid them</h2><ul><li>Only testing names — also test raw IPs to separate DNS problems from network problems.</li><li>Forgetting the firewall — a closed port can be a firewall rule.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Kubernetes networking builds on this. In CKA/CKAD you debug Services and DNS inside the cluster with the same thinking: IP → route → DNS → port.</li><li>Learn <code>curl</code> well — you test Services with it a lot.</li></ul><h2>9. Practice questions and tasks</h2><ol><li><code>ping 8.8.8.8</code> works but <code>ping google.com</code> fails. What is broken?</li><li>Which command shows listening ports?</li><li>What does DNS do?</li></ol><h2>10. References</h2><ul><li>Linux networking basics: <a href=\"https://ubuntu.com/server/docs/network-introduction\" target=\"_blank\" rel=\"noopener\">https://ubuntu.com/server/docs/network-introduction</a> (checked: 2026-09-18)</li><li>Video: <strong>NetworkChuck</strong> — networking basics — <a href=\"https://www.youtube.com/@NetworkChuck\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@NetworkChuck</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Check in order: IP → route → DNS → port. Test raw IPs and names to find the broken step.</p><details><summary>Answers</summary>\n<ol><li>DNS (names do not resolve, but the network works).</li><li><code>ss -tlnp</code> (or <code>sudo ss -tlnp</code>).</li><li>Turns names into IP addresses.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Find the Broken Network Step</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Learn the network troubleshooting ladder: IP → route → DNS → port. Use the right tool at each step.</p><h2>2. Real-world scenario</h2><p>A user says: *\"The website will not open.\"* You must find where it breaks: no IP? no route? DNS? closed port? You check each step, in order, and report what you found.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Check your IP and route (<code>ip a</code>, <code>ip r</code>).</li><li>Test reach (<code>ping</code>).</li><li>Test DNS (<code>dig</code>/<code>nslookup</code>).</li><li>Test ports and web (<code>ss</code>, <code>curl</code>).</li></ul><h2>4. Prerequisites</h2><ul><li>Intermediate Project 4 completed.</li><li>Read: <code>study/linux/intermediate/05-network-troubleshooting.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Show your IP address and your default route.</li><li>Ping <code>8.8.8.8</code> (raw IP) three times.</li><li>Ping <code>google.com</code> (a name) three times.</li><li>Do a DNS lookup of <code>github.com</code> and show the IP.</li><li>List listening ports on your machine.</li><li>Use <code>curl -I</code> on a public website and show the response headers.</li><li>Write a short \"diagnosis\": is your network, DNS, and internet all working? How do you know?</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Show IP + route.</li><li>☐ Ping a raw IP and a name.</li><li>☐ DNS lookup returns an IP.</li><li>☐ List listening ports.</li><li>☐ <code>curl -I</code> a website.</li><li>☐ Write a 2–3 sentence diagnosis.</li></ul><h2>7. Expected outcome</h2><p>You can show that your network, DNS, and internet work — and you can explain how each test proves it.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>ip a</code> (IP) and <code>ip r</code> (route) output shown.</li><li><code>ping 8.8.8.8</code> and <code>ping google.com</code> outputs shown (3 packets each).</li><li>A DNS lookup (<code>dig ... +short</code> or <code>nslookup</code>) returns an IP for <code>github.com</code>.</li><li><code>sudo ss -tlnp</code> output shown (listening ports).</li><li><code>curl -I &lt;website&gt;</code> shows response headers (like <code>HTTP/...</code>).</li><li>Your diagnosis correctly connects each test to what it proves (IP → route → DNS → port).</li></ol><h2>9. Verification checklist</h2><ul><li>☐ All 4 layers tested.</li><li>☐ Diagnosis explains the results.</li><li>☐ Evidence saved in <code>submissions/linux/intermediate/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Testing only names — always test a raw IP too, to separate DNS from network.</li><li>Forgetting <code>sudo</code> for <code>ss -tlnp</code> (some info needs root).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Do the tests in order: `ip a` → `ip r` → `ping 8.8.8.8` → `ping google.com` → `dig github.com +short` → `ss -tlnp` → `curl -I`.</details>\n<details><summary>Hint 2</summary>For the diagnosis: if the raw IP ping works but the name ping fails, DNS is the problem. If both work, network + DNS are fine.</details>\n<details><summary>Hint 3</summary>See the \"ladder\" in `study/linux/intermediate/05-network-troubleshooting.md`, section 6.</details>\n<h2>12. Final challenge</h2><p>Start a tiny web server on your machine: <code>python3 -m http.server 8080</code> (in another terminal). Then use <code>ss -tlnp | grep 8080</code> and <code>curl -I http://localhost:8080</code> to prove the port is open and serving.</p><h2>13. What to submit (evidence)</h2><p>Save all command outputs + your diagnosis in <code>submissions/linux/intermediate/project-05/</code>. Then say: <strong>\"I submit Linux Intermediate Project 5.\"</strong></p><hr><p><strong>Remember:</strong> IP → route → DNS → port. Test each step in order. That is how pros find the broken part fast.</p></section>","linux/intermediate/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Text Power Tools — grep, sed, awk</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>grep</strong> — find lines that match a pattern.</li><li><strong>sed</strong> — change text (find and replace).</li><li><strong>awk</strong> — pull out columns and do small calculations.</li><li><strong>pipe <code>|</code></strong> — send the output of one command into the next.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Linux work is full of text: logs, config files, command output. Three tools make you fast:</p><ol><li><strong>grep</strong> — *find* lines.</li><li><strong>sed</strong> — *change* lines.</li><li><strong>awk</strong> — *pick columns* and count.</li></ol><p>You join them with a <strong>pipe</strong> <code>|</code>. In simple words: the pipe sends text from one tool to the next.</p><h2>2. Key concepts and terms</h2><ul><li><strong>grep:</strong> <code>grep \"word\" file</code> → lines with \"word\". <code>-i</code> ignore case, <code>-v</code> invert (lines WITHOUT), <code>-c</code> count, <code>-n</code> line numbers.</li><li><strong>sed:</strong> <code>sed 's/old/new/g' file</code> → replace \"old\" with \"new\" (g = every match on the line).</li><li><strong>awk:</strong> <code>awk '{print $1}'</code> → print column 1. <code>awk -F: '{print $1}'</code> → use <code>:</code> as the separator.</li></ul><h2>3. Practical examples</h2><ul><li>Find users → <code>grep \"bash\" /etc/passwd</code></li><li>Replace text → <code>sed 's/error/ERROR/g' app.log</code></li><li>Print first column → <code>awk '{print $1}' file.txt</code></li><li>Usernames from passwd → <code>awk -F: '{print $1}' /etc/passwd</code></li><li>Count lines with \"fail\" → <code>grep -c fail app.log</code></li></ul><h2>4. Commands and config examples</h2><pre><code># top 5 IPs in a web log (a classic one-liner)\nawk '{print $1}' access.log | sort | uniq -c | sort -nr | head -5\n\n# replace a word in a file and save to a new file\nsed 's/localhost/127.0.0.1/g' config.txt &gt; config-new.txt\n\n# show only usernames and their home folders\nawk -F: '{print $1, $6}' /etc/passwd</code></pre><h2>5. Hands-on exercises</h2><ol><li>From <code>/etc/passwd</code>, print only the usernames (column 1, separator <code>:</code>).</li><li>In any text file, replace one word using <code>sed</code> and save to a new file.</li><li>Make a small file of words and count how many lines contain a chosen word with <code>grep -c</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>sed</code> did not change the real file.</li></ul><p>  <strong>Fix:</strong> <code>sed</code> prints to the screen by default. Save with <code>&gt;</code> to a new file, or use <code>sed -i</code> to edit in place (careful!).</p><ul><li><strong>Problem:</strong> awk prints nothing.</li></ul><p>  <strong>Fix:</strong> wrong column number or wrong <code>-F</code> separator. Check the file's format.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Forgetting <code>g</code> in sed — only the first match per line changes.</li><li>Using <code>sed -i</code> without a backup — you can lose data. Test without <code>-i</code> first.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>These tools are gold in the exams. You filter logs and pull fields fast.</li><li>The pattern <code>sort | uniq -c | sort -nr</code> (count and rank) is very common.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Which tool replaces text?</li><li>How do you print column 1 using <code>:</code> as the separator?</li><li>What does the pipe <code>|</code> do?</li></ol><h2>10. References</h2><ul><li>grep/sed/awk overview: <a href=\"https://www.gnu.org/software/gawk/manual/\" target=\"_blank\" rel=\"noopener\">https://www.gnu.org/software/gawk/manual/</a> (checked: 2026-09-18)</li><li>Video: <strong>freeCodeCamp.org</strong> — \"sed and awk\" — <a href=\"https://www.youtube.com/c/Freecodecamp\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/Freecodecamp</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> grep finds, sed changes, awk picks columns, and <code>|</code> joins them. Together they are super fast.</p><details><summary>Answers</summary>\n<ol><li><code>sed</code>.</li><li><code>awk -F: '{print $1}'</code>.</li><li>Sends the output of one command as input to the next.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build a Log Analyzer (Level Boss 🏆)</h1><p><strong>Status:</strong> 🔒 Locked</p><p>This is the <strong>last project</strong> of Linux Intermediate. Finish it to complete the level and unlock Linux Advanced.</p><h2>1. Objective</h2><p>Use grep, sed, and awk together to analyze a log file. Make a small report: top items, error counts, and a cleaned output.</p><h2>2. Real-world scenario</h2><p>Your web server made a big access log. The manager asks: *\"Which IP visited most? How many errors? Give me a short report.\"* You must turn a huge messy log into clear answers.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Pull columns with <code>awk</code>.</li><li>Count and rank with <code>sort | uniq -c | sort -nr</code>.</li><li>Filter with <code>grep</code>.</li><li>Clean text with <code>sed</code>.</li><li>Put it all in one script that prints a report.</li></ul><h2>4. Prerequisites</h2><ul><li>Intermediate Project 5 completed.</li><li>Read: <code>study/linux/intermediate/06-text-processing.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Make a sample log file <code>access.log</code> (I give you sample lines in Hint 1), or use a real one.</li><li>Write <code>analyze.sh</code> that prints a report with:</li></ol><ul><li>the <strong>top 3 IP addresses</strong> (column 1), by count,</li><li>the <strong>number of lines</strong> that contain <code>ERROR</code> (any case),</li><li>a <strong>cleaned</strong> version: replace the word <code>GET</code> with <code>[GET]</code> (using sed), saved to <code>clean.log</code>.</li></ul><ol><li>Run it and show the report.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Top 3 IPs printed with counts.</li><li>☐ Error count printed.</li><li>☐ <code>clean.log</code> created with the sed change.</li><li>☐ The whole thing runs from one script.</li></ul><h2>7. Expected outcome</h2><p><code>./analyze.sh</code> prints a clear report and writes <code>clean.log</code>. You turned a messy log into useful facts.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the full <code>analyze.sh</code>.</li><li>The report shows the <strong>top 3 IPs</strong> with their counts (used <code>awk</code> + <code>sort | uniq -c | sort -nr | head -3</code>).</li><li>The report shows the <strong>error line count</strong> (used <code>grep -ic ERROR</code>).</li><li><code>clean.log</code> exists and has <code>[GET]</code> where the log had <code>GET</code> (used <code>sed</code>).</li><li>You show the sample/real <code>access.log</code> and the full report output.</li><li>The report is produced by <strong>one script run</strong>, not by typing commands one by one.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Top-3 IPs correct.</li><li>☐ Error count correct.</li><li>☐ <code>clean.log</code> has the sed change.</li><li>☐ One script does it all.</li><li>☐ Evidence saved in <code>submissions/linux/intermediate/project-06/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Wrong column in awk — the IP is usually column 1 (<code>$1</code>).</li><li>Forgetting <code>-i</code> in the error count grep.</li><li>Forgetting <code>g</code> in sed (only first <code>GET</code> per line changes).</li></ul><h2>11. Hints</h2><details><summary>Hint 1 (sample log lines)</summary>\n<pre><code>10.0.0.1 - - \"GET /index.html\" 200\n10.0.0.2 - - \"GET /login\" 200\n10.0.0.1 - - \"GET /app\" 500 ERROR\n10.0.0.1 - - \"POST /save\" 500 ERROR\n10.0.0.3 - - \"GET /home\" 200</code></pre><p>Save these lines into <code>access.log</code>.</p></details>\n<details><summary>Hint 2</summary>Top IPs: `awk '{print $1}' access.log | sort | uniq -c | sort -nr | head -3`. Errors: `grep -ic ERROR access.log`. Clean: `sed 's/GET/[GET]/g' access.log > clean.log`.</details>\n<details><summary>Hint 3 (almost the answer)</summary>\n<pre><code>#!/bin/bash\nLOG=\"access.log\"\necho \"== Top 3 IPs ==\"\nawk '{print $1}' \"$LOG\" | sort | uniq -c | sort -nr | head -3\necho \"== Error lines ==\"\ngrep -ic ERROR \"$LOG\"\nsed 's/GET/[GET]/g' \"$LOG\" &gt; clean.log\necho \"Cleaned log saved to clean.log\"</code></pre></details>\n<h2>12. Final challenge</h2><p>Add to the report: the total number of requests (all lines) and the number of <code>500</code> responses. (Tip: <code>grep -c \" 500\"</code>.)</p><h2>13. What to submit (evidence)</h2><p>Save <code>access.log</code>, <code>analyze.sh</code>, the report output, and <code>clean.log</code> in <code>submissions/linux/intermediate/project-06/</code>. Then say: <strong>\"I submit Linux Intermediate Project 6.\"</strong> When it passes, Linux Advanced unlocks! 🎉</p><hr><p><strong>Remember:</strong> grep + sed + awk + pipes turn a messy log into clear answers. This is a daily engineer skill.</p></section>","linux/advanced/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Safe, Robust Bash Scripts</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Robust</strong> — strong; does not break easily. In simple words: it handles errors well.</li><li><strong><code>set -euo pipefail</code></strong> — safety switches that stop a script on errors.</li><li><strong>Trap</strong> — run a cleanup step when the script exits.</li><li><strong>Array</strong> — a list of values in one variable.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A production script must be <strong>safe</strong>. If a step fails, the script should <strong>stop</strong>, not keep going and cause damage.</p><p>Bash has safety switches:</p><ul><li><code>set -e</code> — stop on any error.</li><li><code>set -u</code> — stop if you use a variable that is not set.</li><li><code>set -o pipefail</code> — a pipe fails if any part fails.</li></ul><p>Together: <code>set -euo pipefail</code>. Put it at the top of every serious script.</p><h2>2. Key concepts and terms</h2><ul><li><strong>Quoting:</strong> always use <code>\"$var\"</code> (with quotes) to avoid word-splitting bugs.</li><li><strong>Trap for cleanup:</strong> <code>trap 'rm -f \"$tmp\"' EXIT</code> — removes a temp file when the script ends.</li><li><strong>Functions with <code>local</code>:</strong> <code>myfunc() { local x=1; ... }</code> keeps variables inside the function.</li><li><strong>Arrays:</strong> <code>files=(a.txt b.txt)</code>, loop with <code>for f in \"${files[@]}\"; do ...; done</code>.</li><li><strong>Check inputs early:</strong> fail fast with a clear message.</li></ul><h2>3. Practical examples</h2><pre><code>#!/bin/bash\nset -euo pipefail\n\ntmp=\"$(mktemp)\"\ntrap 'rm -f \"$tmp\"' EXIT      # always clean up\n\nrequire() { command -v \"$1\" &gt;/dev/null || { echo \"Missing tool: $1\"; exit 1; }; }\nrequire tar\n\nfiles=(\"$HOME/a.txt\" \"$HOME/b.txt\")\nfor f in \"${files[@]}\"; do\n  echo \"Processing $f\"\ndone</code></pre><h2>4. Commands and config examples</h2><pre><code>set -euo pipefail            # safety switches\ntrap 'echo \"cleanup\"; rm -f /tmp/lock' EXIT\nIFS=$'\\n\\t'                  # safer word splitting\n\"${var:?must be set}\"        # error if var is empty</code></pre><h2>5. Hands-on exercises</h2><ol><li>Add <code>set -euo pipefail</code> to a script and make one command fail. See it stop.</li><li>Use a <code>trap ... EXIT</code> to delete a temp file at the end.</li><li>Make an array of 3 file names and loop over it safely with <code>\"${arr[@]}\"</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> script stops too early with <code>set -e</code>.</li></ul><p>  <strong>Fix:</strong> for a command that may fail on purpose, add <code>|| true</code> or handle it in an <code>if</code>.</p><ul><li><strong>Problem:</strong> <code>unbound variable</code> error.</li></ul><p>  <strong>Fix:</strong> <code>set -u</code> found a variable you did not set. Give it a default: <code>\"${VAR:-default}\"</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>No quotes around variables — breaks on spaces. Always quote.</li><li>No cleanup — temp files pile up. Use <code>trap</code>.</li><li>Ignoring errors — a failed step continues. Use <code>set -e</code> and checks.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Clean, safe scripting shows senior skill. It also prevents disasters in real jobs.</li><li><code>set -euo pipefail</code> and <code>trap</code> are common in professional scripts you will read.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What do the three switches in <code>set -euo pipefail</code> do?</li><li>What is a <code>trap ... EXIT</code> used for?</li><li>Why quote variables?</li></ol><h2>10. References</h2><ul><li>Bash strict mode: <a href=\"http://redsymbol.net/articles/unofficial-bash-strict-mode/\" target=\"_blank\" rel=\"noopener\">http://redsymbol.net/articles/unofficial-bash-strict-mode/</a> (checked: 2026-09-18)</li><li>ShellCheck (find bugs in scripts): <a href=\"https://www.shellcheck.net/\" target=\"_blank\" rel=\"noopener\">https://www.shellcheck.net/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> <code>set -euo pipefail</code>, quote everything, clean up with <code>trap</code>. Safe scripts protect production.</p><details><summary>Answers</summary>\n<ol><li><code>-e</code> stop on error, <code>-u</code> stop on unset variable, <code>-o pipefail</code> a pipe fails if any part fails.</li><li>To run a cleanup step (like deleting temp files) when the script exits.</li><li>To avoid bugs when a value has spaces or is empty.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Write a Production-Safe Script</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Rewrite a simple script to be production-safe: it stops on errors, checks its inputs, cleans up after itself, and uses functions and an array.</p><h2>2. Real-world scenario</h2><p>A messy script deleted the wrong files on a real server last month. Your team now requires <strong>safe</strong> scripts: fail fast, clean up, and never guess. You must write one to this standard.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Strict mode: <code>set -euo pipefail</code>.</li><li>Cleanup with <code>trap</code>.</li><li>Input checks and clear errors.</li><li>Functions with <code>local</code>.</li><li>Arrays and safe loops.</li></ul><h2>4. Prerequisites</h2><ul><li>Linux Intermediate completed.</li><li>Read: <code>study/linux/advanced/01-robust-bash.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><p>Write <code>safe-archive.sh</code> that:</p><ol><li>Starts with <code>set -euo pipefail</code>.</li><li>Takes one argument: a folder to archive. If missing or not a folder, prints a clear error and exits <code>1</code>.</li><li>Checks that <code>tar</code> exists (fail fast if not).</li><li>Makes a temp working file and removes it on exit with <code>trap</code>.</li><li>Uses an <strong>array</strong> of file types to report (for example: count <code>.txt</code>, <code>.log</code>, <code>.md</code> files in the folder), using a loop.</li><li>Creates a dated <code>.tar.gz</code> of the folder in <code>~/archives/</code>.</li><li>Prints a clear final summary.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Strict mode is on.</li><li>☐ Bad input is rejected with a clear message and exit 1.</li><li>☐ <code>trap</code> cleanup removes the temp file.</li><li>☐ An array + loop is used.</li><li>☐ A dated archive is created.</li></ul><h2>7. Expected outcome</h2><p><code>./safe-archive.sh ~/myapp</code> checks input, reports file counts, makes a dated archive, and cleans up. Bad input fails safely.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>The script's first real line is <code>set -euo pipefail</code>.</li><li>Running with no argument (or a bad path) prints a clear error and <code>echo $?</code> shows <code>1</code>.</li><li>The script uses <code>trap '... ' EXIT</code> to remove a temp file (show the line).</li><li>The script uses an <strong>array</strong> and a loop (show the lines).</li><li>A dated archive appears in <code>~/archives/</code> (show <code>ls -l ~/archives/</code>).</li><li>You paste the full script and a good run + a bad run.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Strict mode + trap + array all present.</li><li>☐ Bad input exits 1.</li><li>☐ Archive created.</li><li>☐ Evidence saved in <code>submissions/linux/advanced/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li><code>set -e</code> stops on a command you expected to fail — use <code>|| true</code> or an <code>if</code> for those.</li><li>Not quoting variables.</li><li>Forgetting the <code>trap</code> cleanup.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Check input: `[ $# -ge 1 ] && [ -d \"$1\" ] || { echo \"Usage: give a real folder\"; exit 1; }`.</details>\n<details><summary>Hint 2</summary>Array + loop: `types=(txt log md); for t in \"${types[@]}\"; do echo \"$t: $(find \"$1\" -name \"*.$t\" | wc -l)\"; done`.</details>\n<details><summary>Hint 3</summary>Temp + trap: `tmp=\"$(mktemp)\"; trap 'rm -f \"$tmp\"' EXIT`. Archive: `tar -czf ~/archives/arch-$(date +%F).tar.gz \"$1\"`.</details>\n<h2>12. Final challenge</h2><p>Run your script through the online tool <strong>ShellCheck</strong> (shellcheck.net) or <code>shellcheck safe-archive.sh</code>. Fix any warnings it finds. Paste the clean result.</p><h2>13. What to submit (evidence)</h2><p>Save the script, a good run, a bad run (+ exit code), and <code>ls -l ~/archives/</code> in <code>submissions/linux/advanced/project-01/</code>. Then say: <strong>\"I submit Linux Advanced Project 1.\"</strong></p><hr><p><strong>Remember:</strong> Fail fast, clean up, check inputs. Safe scripts are senior scripts.</p></section>","linux/advanced/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Advanced Networking (Routing + Firewall)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Route</strong> — the path packets take to leave your machine.</li><li><strong>Gateway</strong> — the door to other networks (usually your router).</li><li><strong>Firewall</strong> — a guard that allows or blocks network traffic by rules.</li><li><strong>iptables / nftables / ufw</strong> — tools to set firewall rules. <code>ufw</code> is the easy one.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Two big topics:</p><ol><li><strong>Routing</strong> — how your machine decides where to send packets. The <strong>default route</strong> (gateway) is the way out to the internet.</li><li><strong>Firewall</strong> — rules that allow or block traffic. You open only the ports you need (like 22 for SSH, 80/443 for web) and block the rest.</li></ol><p>Blocking the rest is called <strong>least exposure</strong>. Fewer open doors = safer server.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>ip r</code></strong> — show routes. The <code>default via X</code> line is your gateway.</li><li><strong><code>ufw</code></strong> (Uncomplicated Firewall) — easy front-end for the firewall:</li><li><code>sudo ufw allow 22/tcp</code> — allow SSH.</li><li><code>sudo ufw deny 23</code> — block a port.</li><li><code>sudo ufw enable</code> — turn the firewall on.</li><li><code>sudo ufw status numbered</code> — show rules.</li><li><strong>iptables/nftables</strong> — the lower-level tools. Kubernetes uses iptables/nftables under the hood.</li></ul><h2>3. Practical examples</h2><ul><li>See gateway → <code>ip r | grep default</code></li><li>Allow SSH only → <code>sudo ufw allow 22/tcp</code></li><li>Turn on firewall → <code>sudo ufw enable</code></li><li>List rules → <code>sudo ufw status verbose</code></li></ul><h2>4. Commands and config examples</h2><pre><code>ip r                          # routes; find \"default via ...\"\nip -br a                      # short view of interfaces + IPs\nsudo ufw default deny incoming    # block all incoming by default\nsudo ufw default allow outgoing   # allow your machine to reach out\nsudo ufw allow 22/tcp             # allow SSH in\nsudo ufw allow 80,443/tcp         # allow web in\nsudo ufw enable                   # turn it on\nsudo ufw status numbered          # see the rules</code></pre><blockquote><p>⚠️ <strong>Careful on a remote server:</strong> if you block port 22 by mistake, you lock yourself out. Always allow SSH first.</p></blockquote><h2>5. Hands-on exercises</h2><ol><li>Show your default gateway with <code>ip r</code>.</li><li>Check firewall status: <code>sudo ufw status</code>.</li><li>(Safe practice) Allow port 22 and port 80. List the rules. (You can leave ufw disabled if you are unsure.)</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> cannot reach the internet, but you have an IP.</li></ul><p>  <strong>Fix:</strong> check the default route (<code>ip r</code>). No default route = no way out.</p><ul><li><strong>Problem:</strong> a service is running but not reachable from outside.</li></ul><p>  <strong>Fix:</strong> the firewall may block the port. Allow it with <code>ufw allow</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Enabling ufw before allowing SSH — you get locked out of a remote box. Allow 22 first.</li><li>Opening too many ports — open only what you need.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKS</strong> cares about limiting exposure and host firewalls.</li><li>Kubernetes <code>NetworkPolicies</code> are like firewalls *inside* the cluster. Same idea: allow only what is needed.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is the default route?</li><li>Which command allows SSH through ufw?</li><li>Why allow SSH before enabling the firewall on a remote server?</li></ol><h2>10. References</h2><ul><li>ufw guide: <a href=\"https://help.ubuntu.com/community/UFW\" target=\"_blank\" rel=\"noopener\">https://help.ubuntu.com/community/UFW</a> (checked: 2026-09-18)</li><li>Video: <strong>NetworkChuck</strong> — \"Linux firewall (ufw)\" — <a href=\"https://www.youtube.com/@NetworkChuck\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@NetworkChuck</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Know your default route. Open only needed ports. Allow SSH first, then enable the firewall.</p><details><summary>Answers</summary>\n<ol><li>The path used when no other route matches — the way out to the internet (your gateway).</li><li><code>sudo ufw allow 22/tcp</code>.</li><li>So you do not lock yourself out of the remote machine.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Control Routing and Build a Firewall</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Read your machine's routes, then build a safe firewall that allows only the ports you need.</p><h2>2. Real-world scenario</h2><p>Security review: *\"This server has too many open doors. Close everything, then open only SSH and web.\"* Fewer open ports means a safer server. You must set this up without locking yourself out.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Read routes and the default gateway (<code>ip r</code>).</li><li>Build firewall rules with <code>ufw</code>.</li><li>The idea of least exposure (open only what is needed).</li></ul><h2>4. Prerequisites</h2><ul><li>Advanced Project 1 completed.</li><li>Read: <code>study/linux/advanced/02-advanced-networking.md</code>.</li><li>⚠️ If you do this on a <strong>remote</strong> server, allow SSH (22) BEFORE enabling the firewall.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Show your interfaces and IPs (<code>ip -br a</code>).</li><li>Show your default gateway (<code>ip r</code>).</li><li>Set ufw defaults: deny incoming, allow outgoing.</li><li>Allow SSH (22) and web (80, 443).</li><li>Enable ufw (safe on your own local machine).</li><li>Show the final rules with <code>sudo ufw status numbered</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Show IPs and default route.</li><li>☐ Set default deny-incoming / allow-outgoing.</li><li>☐ Allow 22, 80, 443.</li><li>☐ Enable and show the rules.</li><li>☐ Explain \"least exposure\" in one sentence.</li></ul><h2>7. Expected outcome</h2><p>Your firewall blocks all incoming by default and allows only SSH and web. You can show the routes and the rules.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>ip -br a</code> and <code>ip r</code> outputs shown (IPs + default route).</li><li>You set <code>ufw default deny incoming</code> and <code>ufw default allow outgoing</code>.</li><li>Rules allow <strong>22, 80, 443</strong> (show <code>ufw status numbered</code>).</li><li>The firewall is enabled (status shows \"active\"), OR you clearly explain you kept it disabled for safety and show the rules that *would* apply.</li><li>You explain \"least exposure\" correctly.</li><li>You show all commands.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Routes shown.</li><li>☐ Default deny incoming set.</li><li>☐ Only needed ports open.</li><li>☐ Evidence saved in <code>submissions/linux/advanced/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Enabling ufw before allowing SSH on a remote box → locked out.</li><li>Opening extra ports \"just in case\" → less safe.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Order: set defaults → allow 22 → allow 80,443 → enable → status.</details>\n<details><summary>Hint 2</summary>`sudo ufw default deny incoming`; `sudo ufw default allow outgoing`; `sudo ufw allow 22/tcp`; `sudo ufw allow 80,443/tcp`; `sudo ufw enable`; `sudo ufw status numbered`.</details>\n<details><summary>Hint 3</summary>Least exposure = open only the doors you truly need; block the rest.</details>\n<h2>12. Final challenge</h2><p>Add a rule that allows SSH <strong>only from one IP</strong> (for example your own): <code>sudo ufw allow from &lt;your-ip&gt; to any port 22</code>. Then remove the broad <code>allow 22</code> rule. This is tighter security.</p><h2>13. What to submit (evidence)</h2><p>Save route output, all ufw commands, and <code>ufw status numbered</code> in <code>submissions/linux/advanced/project-02/</code>. Then say: <strong>\"I submit Linux Advanced Project 2.\"</strong></p><hr><p><strong>Remember:</strong> Deny by default, allow only what you need, and never block your own SSH by accident.</p></section>","linux/advanced/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Performance Investigation</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>CPU</strong> — the \"brain\" that does the work.</li><li><strong>Memory (RAM)</strong> — fast short-term storage for running programs.</li><li><strong>Load average</strong> — how busy the machine is (3 numbers: 1, 5, 15 minutes).</li><li><strong>I/O</strong> — reading and writing to disk.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>\"The server is slow.\" Why? You must find the cause. There are four common suspects:</p><ol><li><strong>CPU</strong> — too much work.</li><li><strong>Memory</strong> — not enough RAM (then it uses slow swap).</li><li><strong>Disk I/O</strong> — slow reads/writes.</li><li><strong>A single bad process</strong> — one program eating everything.</li></ol><p>You use tools to look at each one.</p><h2>2. Key concepts and terms</h2><ul><li><strong><code>top</code> / <code>htop</code></strong> — live view; sort by CPU or memory.</li><li><strong><code>uptime</code></strong> — load average. If load is higher than your CPU count for a long time, the machine is overloaded.</li><li><strong><code>free -h</code></strong> — memory use. Watch \"available\" and \"swap\".</li><li><strong><code>vmstat 1</code></strong> — CPU, memory, and swap over time.</li><li><strong><code>iostat</code></strong> / <strong><code>iotop</code></strong> — disk activity.</li><li><strong><code>ps aux --sort=-%cpu</code></strong> — top CPU users.</li><li><strong><code>strace -p PID</code></strong> — see what a process is doing (system calls).</li></ul><h2>3. Practical examples</h2><ul><li>Load → <code>uptime</code></li><li>Top CPU users → <code>ps aux --sort=-%cpu | head</code></li><li>Top memory users → <code>ps aux --sort=-%mem | head</code></li><li>Memory + swap → <code>free -h</code></li><li>Live system → <code>vmstat 1 5</code> (5 samples, 1 second apart)</li></ul><h2>4. Commands and config examples</h2><pre><code>uptime                       # load average (1, 5, 15 min)\nnproc                        # how many CPUs you have\nfree -h                      # memory and swap\nvmstat 1 5                   # system stats, 5 times\nps aux --sort=-%cpu | head   # biggest CPU users\nps aux --sort=-%mem | head   # biggest memory users\niostat -xz 1 3               # disk I/O (needs the sysstat package)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Check <code>uptime</code> and <code>nproc</code>. Is load high compared to CPU count?</li><li>Find the top 5 CPU users and top 5 memory users.</li><li>Run <code>vmstat 1 5</code> and read the <code>us</code> (user CPU) and <code>wa</code> (I/O wait) columns.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>High load + high <code>wa</code></strong> → disk I/O is the bottleneck.</li><li><strong>Low free memory + high swap</strong> → not enough RAM; the machine is swapping (slow).</li><li><strong>One process at ~100% CPU</strong> → that process is the problem; investigate or restart it.</li></ul><h2>7. Common mistakes and how to avoid them</h2><ul><li>Looking at only one tool — check CPU, memory, and disk before deciding.</li><li>Restarting blindly — first find the cause, or it comes back.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Troubleshooting is huge in CKA. The same method (check CPU/mem/disk/process) helps you debug slow nodes.</li><li>Learn to read <code>top</code>, <code>free</code>, and load average fast.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is load average?</li><li>Which column in <code>vmstat</code> shows I/O wait?</li><li>How do you find the top memory-using process?</li></ol><h2>10. References</h2><ul><li>Brendan Gregg — Linux performance: <a href=\"https://www.brendangregg.com/linuxperf.html\" target=\"_blank\" rel=\"noopener\">https://www.brendangregg.com/linuxperf.html</a> (checked: 2026-09-18)</li><li>Video: <strong>Learn Linux TV</strong> — \"Linux performance\" — <a href=\"https://www.youtube.com/c/LearnLinuxTV\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/c/LearnLinuxTV</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Slow server? Check CPU, memory, disk I/O, and top processes — in that order.</p><details><summary>Answers</summary>\n<ol><li>How busy the machine is over 1, 5, and 15 minutes.</li><li>The <code>wa</code> column.</li><li><code>ps aux --sort=-%mem | head</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Investigate a Slow Server</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Learn to find the cause of a slow machine: CPU, memory, disk, or one bad process.</p><h2>2. Real-world scenario</h2><p>Users complain the server is slow. You must find the real cause and report it — not just guess. This is a top skill for CKA troubleshooting and real jobs.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Read load average vs CPU count.</li><li>Check memory and swap.</li><li>Read <code>vmstat</code> columns.</li><li>Find the top CPU and memory processes.</li><li>Make a load on purpose and see it in the tools.</li></ul><h2>4. Prerequisites</h2><ul><li>Advanced Project 2 completed.</li><li>Read: <code>study/linux/advanced/03-performance-investigation.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Record a baseline: <code>uptime</code>, <code>nproc</code>, <code>free -h</code>.</li><li>Create CPU load on purpose. In another terminal run:</li></ol><p>   <code>for i in $(seq 1 $(nproc)); do yes &gt; /dev/null &amp; done</code></p><p>   (This makes your CPUs busy. Remember the PIDs.)</p><ol><li>Now look at <code>uptime</code> (load rises), <code>top</code> (busy processes), and <code>ps aux --sort=-%cpu | head</code>.</li><li>Stop the load: <code>kill %1 %2 ...</code> or <code>pkill yes</code>.</li><li>Confirm load goes back down.</li><li>Write a short \"diagnosis\": what the tools showed, and how you knew it was CPU.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Baseline recorded.</li><li>☐ CPU load created and seen in <code>top</code>/load.</li><li>☐ Top CPU process identified as <code>yes</code>.</li><li>☐ Load stopped and returns to normal.</li><li>☐ Diagnosis written.</li></ul><h2>7. Expected outcome</h2><p>You created a CPU problem, found it with the tools, fixed it, and explained your reasoning.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>Baseline <code>uptime</code>, <code>nproc</code>, <code>free -h</code> shown.</li><li>After making load, <code>uptime</code> shows a clearly higher load average (near or above <code>nproc</code>).</li><li><code>ps aux --sort=-%cpu | head</code> (or <code>top</code>) shows <code>yes</code> as a top CPU user.</li><li>You stopped the load (<code>pkill yes</code>) and show load dropping back.</li><li>Your diagnosis correctly says the cause was CPU and explains how you knew.</li><li>All commands and outputs shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Load rose and fell.</li><li>☐ Bad process identified.</li><li>☐ Diagnosis is correct.</li><li>☐ Evidence saved in <code>submissions/linux/advanced/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Forgetting to stop the <code>yes</code> processes — they keep your CPU busy. Use <code>pkill yes</code>.</li><li>Reading only <code>top</code> — also check load average and memory.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`nproc` tells you how many CPUs. Load near that number means \"fully busy\".</details>\n<details><summary>Hint 2</summary>Start load: `for i in $(seq 1 $(nproc)); do yes > /dev/null & done`. Stop it: `pkill yes`.</details>\n<details><summary>Hint 3</summary>Diagnosis: \"Load rose to ~N (my CPU count). `top` showed `yes` at ~100% CPU each. Memory was fine. So the cause was CPU.\"</details>\n<h2>12. Final challenge</h2><p>Now make a <strong>memory</strong> problem instead: run a small script that keeps adding to an array, and watch <code>free -h</code> and swap grow. Then stop it. Explain how a memory problem looks different from a CPU problem.</p><h2>13. What to submit (evidence)</h2><p>Save baseline, loaded outputs, the fix, and your diagnosis in <code>submissions/linux/advanced/project-03/</code>. Then say: <strong>\"I submit Linux Advanced Project 3.\"</strong></p><hr><p><strong>Remember:</strong> Find the cause before you fix. CPU, memory, disk, or one bad process — check each.</p></section>","linux/advanced/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Security Hardening</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Hardening</strong> — making a server safer by closing weak points.</li><li><strong>SSH</strong> — the secure way to log in to a server over the network.</li><li><strong>Key-based login</strong> — logging in with a secret key file instead of a password.</li><li><strong>Least privilege</strong> — give each user the smallest access they need.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A default server has weak points. <strong>Hardening</strong> closes them. The most important areas:</p><ol><li><strong>SSH</strong> — turn off password login, use keys, do not allow root to log in directly.</li><li><strong>Users and sudo</strong> — give only needed access.</li><li><strong>Updates</strong> — keep software patched.</li><li><strong>Firewall</strong> — open only needed ports (you did this in Project 2).</li><li><strong>Fewer services</strong> — turn off what you do not use.</li></ol><h2>2. Key concepts and terms</h2><ul><li><strong>SSH keys:</strong> <code>ssh-keygen</code> makes a key pair. The public key goes on the server.</li><li><strong>SSH config</strong> is in <code>/etc/ssh/sshd_config</code>:</li><li><code>PermitRootLogin no</code> — root cannot log in directly.</li><li><code>PasswordAuthentication no</code> — only keys allowed (do this <strong>after</strong> keys work!).</li><li><strong>sudo:</strong> users in the <code>sudo</code> group can run admin commands. Check <code>/etc/sudoers</code> carefully.</li><li><strong>Updates:</strong> <code>sudo apt update &amp;&amp; sudo apt upgrade</code>.</li><li><strong>fail2ban:</strong> a tool that blocks IPs after too many failed logins.</li></ul><h2>3. Practical examples</h2><ul><li>Make a key → <code>ssh-keygen -t ed25519</code></li><li>Harden SSH → edit <code>/etc/ssh/sshd_config</code>, then <code>sudo systemctl restart ssh</code></li><li>See who has sudo → <code>getent group sudo</code></li><li>Keep updated → <code>sudo apt update &amp;&amp; sudo apt upgrade -y</code></li></ul><h2>4. Commands and config examples</h2><pre><code>ssh-keygen -t ed25519 -C \"you@example.com\"   # make an SSH key pair\n# copy your public key to a server:\nssh-copy-id user@server\n\n# in /etc/ssh/sshd_config (edit with sudo):\n# PermitRootLogin no\n# PasswordAuthentication no     # ONLY after key login works!\nsudo systemctl restart ssh\n\ngetent group sudo               # who can use sudo\nsudo apt update &amp;&amp; sudo apt upgrade -y</code></pre><blockquote><p>⚠️ <strong>Big warning:</strong> never turn off password login until key login works. Or you can lock yourself out.</p></blockquote><h2>5. Hands-on exercises</h2><ol><li>Make an SSH key with <code>ssh-keygen</code>. Look at the two files it created (private + <code>.pub</code>).</li><li>Read <code>/etc/ssh/sshd_config</code>. Find <code>PermitRootLogin</code>.</li><li>List who is in the <code>sudo</code> group.</li><li>Run system updates.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> locked out after disabling passwords.</li></ul><p>  <strong>Fix:</strong> you need console/physical access to fix <code>sshd_config</code>. Always test keys first.</p><ul><li><strong>Problem:</strong> SSH change did not apply.</li></ul><p>  <strong>Fix:</strong> restart the service: <code>sudo systemctl restart ssh</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Disabling password login before keys work — you get locked out.</li><li>Too many sudo users — give admin rights only to those who need them.</li><li>Forgetting updates — old software has known holes.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKS</strong> is all about hardening: SSH, least privilege, minimal services, and keeping things patched.</li><li>The same mindset applies to Kubernetes: least privilege (RBAC), small images, few open ports.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>Why use SSH keys instead of passwords?</li><li>What does <code>PermitRootLogin no</code> do?</li><li>What is least privilege?</li></ol><h2>10. References</h2><ul><li>SSH hardening (Ubuntu): <a href=\"https://ubuntu.com/server/docs/service-openssh\" target=\"_blank\" rel=\"noopener\">https://ubuntu.com/server/docs/service-openssh</a> (checked: 2026-09-18)</li><li>CIS Benchmarks (hardening guides): <a href=\"https://www.cisecurity.org/cis-benchmarks\" target=\"_blank\" rel=\"noopener\">https://www.cisecurity.org/cis-benchmarks</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Keys not passwords, no direct root, least privilege, stay updated, open only needed ports.</p><details><summary>Answers</summary>\n<ol><li>Keys are much harder to guess/steal than passwords.</li><li>It stops the root user from logging in directly over SSH.</li><li>Giving each user or program only the access it truly needs.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Harden a Server</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Make a Linux server safer: set up SSH keys, tighten the SSH config, check sudo access, and run updates. Then write a short hardening report.</p><h2>2. Real-world scenario</h2><p>A new server will go online next week. Security says: *\"Harden it first.\"* You must close weak points before attackers find them.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create and use SSH keys.</li><li>Safely change <code>sshd_config</code> (root login, password auth).</li><li>Check who has sudo (least privilege).</li><li>Keep the system updated.</li><li>Write a hardening checklist/report.</li></ul><h2>4. Prerequisites</h2><ul><li>Advanced Project 3 completed.</li><li>Read: <code>study/linux/advanced/04-security-hardening.md</code>.</li><li>⚠️ Practice on your <strong>own</strong> machine or a test VM. Do not lock yourself out. Test key login BEFORE turning off passwords.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Make an SSH key pair with <code>ssh-keygen -t ed25519</code>. Show the two files (<code>ls -l ~/.ssh</code>).</li><li>In a <strong>copy</strong> of the SSH config (<code>sudo cp /etc/ssh/sshd_config ~/sshd_config.demo</code>), set:</li></ol><ul><li><code>PermitRootLogin no</code></li><li><code>PasswordAuthentication no</code></li></ul><p>   Show the changed lines. (Editing the copy keeps you safe.)</p><ol><li>List who can use sudo: <code>getent group sudo</code>.</li><li>Run updates: <code>sudo apt update</code> (and <code>upgrade</code> if you want).</li><li>Write a <strong>hardening report</strong>: 5 things you checked, and their status (done / to-do).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ SSH key pair created.</li><li>☐ SSH config copy shows the two hardening lines.</li><li>☐ Sudo group members listed.</li><li>☐ Updates run.</li><li>☐ A 5-point hardening report written.</li></ul><h2>7. Expected outcome</h2><p>You have keys, a safer SSH config (in a demo copy), a view of sudo access, an updated system, and a clear report.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>ls -l ~/.ssh</code> shows a private key and a <code>.pub</code> key.</li><li>Your <code>~/sshd_config.demo</code> shows <code>PermitRootLogin no</code> and <code>PasswordAuthentication no</code> (show the lines with <code>grep</code>).</li><li><code>getent group sudo</code> output shown.</li><li><code>sudo apt update</code> output shown.</li><li>Your hardening report lists <strong>5 checks</strong> with a clear status for each.</li><li>You explain in one sentence why you must test key login before turning off passwords.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Keys created.</li><li>☐ Hardened config shown (in the demo copy).</li><li>☐ Sudo checked, updates run.</li><li>☐ Report has 5 points.</li><li>☐ Evidence saved in <code>submissions/linux/advanced/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Disabling password auth on the real live config before keys work → locked out. (That is why we use a demo copy here.)</li><li>Too many sudo users.</li><li>Skipping updates.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Make the key: `ssh-keygen -t ed25519 -C \"you@example.com\"` (press Enter for defaults).</details>\n<details><summary>Hint 2</summary>Edit the demo copy, then check: `grep -E \"PermitRootLogin|PasswordAuthentication\" ~/sshd_config.demo`.</details>\n<details><summary>Hint 3</summary>Report format: a small table with columns Check / Status. Example rows: SSH keys / done, Root login / disabled (demo), Firewall / done in P2, Updates / done, Sudo users / reviewed.</details>\n<h2>12. Final challenge</h2><p>Install and enable <strong>fail2ban</strong> (<code>sudo apt install fail2ban</code>), then show <code>sudo systemctl status fail2ban</code>. Explain in one line what it protects against.</p><h2>13. What to submit (evidence)</h2><p>Save key listing, hardened config lines, sudo list, update output, and your report in <code>submissions/linux/advanced/project-04/</code>. Then say: <strong>\"I submit Linux Advanced Project 4.\"</strong></p><hr><p><strong>Remember:</strong> Keys not passwords, no direct root, least privilege, stay updated. Test before you lock things down.</p></section>","linux/advanced/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Monitoring and Alerting</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Metric</strong> — a number that shows health, like CPU %, memory %, disk %.</li><li><strong>Threshold</strong> — a limit. If a metric passes it, you alert.</li><li><strong>Alert</strong> — a warning message when something is wrong.</li><li><strong>Uptime</strong> — how long a service has been running without stopping.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Monitoring means: <strong>watch the system all the time, and warn early</strong>. You collect <strong>metrics</strong>, compare them to <strong>thresholds</strong>, and send an <strong>alert</strong> when needed.</p><p>Real teams use tools like Prometheus and Grafana. But the idea is simple, and you can build a tiny version yourself with bash: collect numbers, check limits, log and alert.</p><h2>2. Key concepts and terms</h2><ul><li><strong>Collect:</strong> CPU, memory, disk, and service status.</li><li><strong>Compare:</strong> is the value over the threshold?</li><li><strong>Alert:</strong> print/log a clear message (real teams send email/Slack).</li><li><strong>Schedule:</strong> run the check often with cron or a loop.</li><li><strong>Service check:</strong> is a service active? <code>systemctl is-active NAME</code>.</li></ul><h2>3. Practical examples</h2><pre><code>CPU=$(top -bn1 | awk '/Cpu\\(s\\)/ {print 100 - $8}')   # used CPU %\nMEM=$(free | awk '/Mem:/ {printf \"%d\", $3/$2*100}')    # used memory %\nDISK=$(df / | awk 'NR==2 {print $5}' | tr -d '%')      # used disk %\necho \"CPU=$CPU% MEM=$MEM% DISK=$DISK%\"</code></pre><h2>4. Commands and config examples</h2><pre><code>systemctl is-active ssh        # \"active\" or \"inactive\"\nuptime -p                      # pretty uptime\nfree | awk '/Mem:/ {printf \"%d\\n\", $3/$2*100}'   # memory percent\ndf -h                          # disk use, human readable</code></pre><h2>5. Hands-on exercises</h2><ol><li>Get CPU %, memory %, and disk % as numbers.</li><li>Check if <code>ssh</code> is active with <code>systemctl is-active</code>.</li><li>Print an alert if disk % is over a limit you choose.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> metric is empty.</li></ul><p>  <strong>Fix:</strong> the parsing command is wrong for your system. Print the raw command output first, then fix the <code>awk</code>.</p><ul><li><strong>Problem:</strong> alert never fires.</li></ul><p>  <strong>Fix:</strong> your threshold is too high, or the compare uses <code>&gt;</code> instead of <code>-gt</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Comparing numbers with <code>&gt;</code> (string compare) instead of <code>-gt</code>.</li><li>No logging — you cannot see history. Always log with a timestamp.</li><li>Alerting on tiny spikes — use a sensible threshold.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li>Kubernetes has monitoring too (metrics-server, Prometheus). The idea is the same: collect metrics, set thresholds, alert.</li><li>For CKA, <code>kubectl top nodes/pods</code> shows metrics — same concept.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a threshold?</li><li>How do you check if a service is active?</li><li>Why log metrics with a timestamp?</li></ol><h2>10. References</h2><ul><li>Prometheus overview (concept): <a href=\"https://prometheus.io/docs/introduction/overview/\" target=\"_blank\" rel=\"noopener\">https://prometheus.io/docs/introduction/overview/</a> (checked: 2026-09-18)</li><li>Video: <strong>TechWorld with Nana</strong> — \"Monitoring with Prometheus\" — <a href=\"https://www.youtube.com/@TechWorldwithNana\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@TechWorldwithNana</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Monitoring = collect metrics, compare to thresholds, alert early, and log everything.</p><details><summary>Answers</summary>\n<ol><li>A limit; if a metric passes it, you alert.</li><li><code>systemctl is-active NAME</code>.</li><li>So you can see history and trends, not just this moment.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build a Monitoring and Alert Tool</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Write a monitoring script that collects CPU, memory, and disk metrics, checks a service, compares to thresholds, and alerts + logs.</p><h2>2. Real-world scenario</h2><p>Your team has no monitoring yet. Before buying a big tool, they want a simple check that runs every 5 minutes and warns when CPU, memory, or disk gets high, or when a key service stops.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Collect metrics as numbers.</li><li>Compare to thresholds.</li><li>Check a service is active.</li><li>Alert and log with timestamps.</li><li>Schedule with cron.</li></ul><h2>4. Prerequisites</h2><ul><li>Advanced Project 4 completed.</li><li>Read: <code>study/linux/advanced/05-monitoring.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Write <code>monitor.sh</code> that:</li></ol><ul><li>collects CPU %, memory %, and disk % (of <code>/</code>),</li><li>checks that a service (e.g. <code>ssh</code>) is active,</li><li>alerts (prints + logs) if any metric is over 80%, or the service is not active,</li><li>always logs a timestamped line to <code>~/monitor.log</code>.</li></ul><ol><li>Run it and show the log.</li><li>Set a <strong>low</strong> threshold on purpose (like 1%) to prove the alert fires. Show it.</li><li>Add a cron line to run it every 5 minutes.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Collects 3 metrics as numbers.</li><li>☐ Checks a service status.</li><li>☐ Alerts when over threshold.</li><li>☐ Logs a timestamped line every run.</li><li>☐ Cron line runs it every 5 minutes.</li></ul><h2>7. Expected outcome</h2><p><code>./monitor.sh</code> writes a timestamped health line and alerts when limits are passed. Cron runs it every 5 minutes.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the full <code>monitor.sh</code>.</li><li>It collects CPU %, memory %, disk % as real numbers (show a run).</li><li>It checks a service with <code>systemctl is-active</code> (show the line).</li><li>With a low threshold, the ALERT clearly fires (show that run).</li><li><code>~/monitor.log</code> has timestamped lines (show <code>cat ~/monitor.log</code>).</li><li><code>crontab -l</code> shows a <code>*/5 * * * *</code> line for the script.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ 3 metrics + service check.</li><li>☐ Alert proven to fire.</li><li>☐ Timestamped log.</li><li>☐ Cron every 5 min.</li><li>☐ Evidence saved in <code>submissions/linux/advanced/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Number compare with <code>&gt;</code> instead of <code>-gt</code>.</li><li>Empty metric because of wrong parsing — print raw output first, then fix.</li><li>No timestamp in the log.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the metric commands from `study/linux/advanced/05-monitoring.md`, section 3.</details>\n<details><summary>Hint 2</summary>Service check: `if [ \"$(systemctl is-active ssh)\" != \"active\" ]; then echo \"ALERT ssh down\"; fi`.</details>\n<details><summary>Hint 3</summary>Threshold check: `if [ \"$DISK\" -gt \"$LIMIT\" ]; then echo \"ALERT disk ${DISK}%\"; fi`. Se
