> When it passes, Kubernetes Advanced unlocks! 🎉</p><hr><p><strong>Remember:</strong> Wire by Service name, one namespace, probes + resources, persistent db, Ingress in front. This is CKAD in one project.</p></section>","kubernetes/advanced/project-01":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Cluster Architecture</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Control plane</strong> — the brain of the cluster (makes decisions).</li><li><strong>Worker node</strong> — a machine that runs your app Pods.</li><li><strong>etcd</strong> — the cluster's database. Stores all cluster state.</li><li><strong>kubelet</strong> — the agent on each node that runs Pods.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>A cluster has two kinds of machines:</p><ol><li><strong>Control plane</strong> — the brain.</li><li><strong>Worker nodes</strong> — run the apps.</li></ol><p><strong>Control plane parts:</strong></p><ul><li><strong>kube-apiserver</strong> — the front door. Everything talks to it.</li><li><strong>etcd</strong> — the database. Stores all state (the \"source of truth\").</li><li><strong>kube-scheduler</strong> — decides which node runs each new Pod.</li><li><strong>kube-controller-manager</strong> — keeps the desired state (restarts, replicas).</li></ul><p><strong>On every node:</strong></p><ul><li><strong>kubelet</strong> — runs and watches Pods.</li><li><strong>kube-proxy</strong> — handles Service networking.</li><li><strong>container runtime</strong> — actually runs containers (e.g. containerd).</li></ul><h2>2. Key concepts and terms</h2><ul><li>You (<code>kubectl</code>) → <strong>apiserver</strong> → <strong>etcd</strong> (save) → controllers/scheduler act → <strong>kubelet</strong> runs Pods.</li><li>If <strong>etcd</strong> is lost with no backup, the cluster state is lost. So back it up!</li><li>Control-plane parts often run as <strong>static Pods</strong> (managed by kubelet from files in <code>/etc/kubernetes/manifests</code>).</li></ul><h2>3. Practical examples</h2><pre><code>kubectl get nodes                        # control-plane + workers\nkubectl get pods -n kube-system          # apiserver, etcd, scheduler, controllers, coredns...\nkubectl get componentstatuses            # (older) health of control-plane parts</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl -n kube-system get pods -o wide\nls /etc/kubernetes/manifests/            # static pod files (on a kubeadm control plane)\nsudo systemctl status kubelet            # kubelet is a systemd service (from Linux track!)\njournalctl -u kubelet | tail             # kubelet logs</code></pre><h2>5. Hands-on exercises</h2><ol><li>List nodes and label which is the control plane.</li><li>List <code>kube-system</code> Pods. Find apiserver, etcd, scheduler, controller-manager, coredns.</li><li>On a kubeadm node, look at <code>/etc/kubernetes/manifests/</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>kubectl</code> does not respond.</li></ul><p>  <strong>Fix:</strong> the apiserver may be down. On the control-plane node, check the static Pod and <code>journalctl -u kubelet</code>.</p><ul><li><strong>Problem:</strong> Pods do not schedule.</li></ul><p>  <strong>Fix:</strong> the scheduler may be down, or nodes are <code>NotReady</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Not knowing which part does what — then you cannot fix problems.</li><li>Ignoring etcd backups.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA:</strong> \"Cluster Architecture, Installation and Configuration\" is ~25%.</li><li>Know each component's job, that control-plane parts are static Pods (kubeadm), and that kubelet is a systemd service.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does etcd store?</li><li>What does the scheduler do?</li><li>Where do static Pod files live on a kubeadm node?</li></ol><h2>10. References</h2><ul><li>Components: <a href=\"https://kubernetes.io/docs/concepts/overview/components/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/overview/components/</a> (checked: 2026-09-18)</li><li>Video: <strong>KodeKloud</strong> — \"Kubernetes architecture\" — <a href=\"https://www.youtube.com/@KodeKloud\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@KodeKloud</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> apiserver = front door, etcd = database, scheduler = placement, controllers = keep desired state, kubelet = runs Pods.</p><details><summary>Answers</summary>\n<ol><li>All cluster state (the source of truth).</li><li>Decides which node runs each new Pod.</li><li><code>/etc/kubernetes/manifests/</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Map Your Cluster's Components</h1><p><strong>Status:</strong> 🔒 Locked (unlocks when Kubernetes Advanced opens)</p><h2>1. Objective</h2><p>Find and explain every main part of your cluster: apiserver, etcd, scheduler, controller-manager, kubelet, and more.</p><h2>2. Real-world scenario</h2><p>Before you can fix a cluster, you must know how it is built. Your team asks: *\"Show me every control-plane part and explain its job.\"*</p><h2>3. Skills and concepts you will learn</h2><ul><li>Identify control-plane components.</li><li>Find static Pods and the kubelet.</li><li>Explain each part in simple words.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Intermediate completed.</li><li>Read: <code>study/kubernetes/advanced/01-cluster-architecture.md</code>.</li><li>Best on a kubeadm cluster or killercoda (to see static Pods and kubelet). kind/minikube work for most of it.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>List nodes; say which is the control plane.</li><li>List <code>kube-system</code> Pods; find apiserver, etcd, scheduler, controller-manager, coredns, kube-proxy.</li><li>(On kubeadm/killercoda) Show <code>/etc/kubernetes/manifests/</code> static Pod files.</li><li>(On a node) Show <code>systemctl status kubelet</code> and a few <code>journalctl -u kubelet</code> lines.</li><li>Write a short table: component → its job (in simple English).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Nodes listed, control plane identified.</li><li>☐ All main kube-system parts found.</li><li>☐ Static Pods shown (if available).</li><li>☐ kubelet status/logs shown (if available).</li><li>☐ Component → job table written.</li></ul><h2>7. Expected outcome</h2><p>You can name every main part of the cluster and say what it does.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>kubectl get nodes</code> shown, with the control-plane node identified.</li><li><code>kubectl get pods -n kube-system</code> shows apiserver, etcd, scheduler, controller-manager, and coredns.</li><li>You show either the static Pod files (<code>/etc/kubernetes/manifests/</code>) OR clearly explain where they live if your setup hides them (kind/minikube).</li><li>You provide a table mapping each component to its job in simple English.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ All main parts identified.</li><li>☐ Jobs explained simply.</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-01/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Mixing up scheduler (placement) and controller-manager (keeps desired state).</li><li>Not knowing etcd is the database.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>`kubectl get pods -n kube-system -o wide` lists the control-plane Pods.</details>\n<details><summary>Hint 2</summary>On kubeadm/killercoda: `ls /etc/kubernetes/manifests/` shows etcd, apiserver, scheduler, controller-manager as static Pods.</details>\n<details><summary>Hint 3</summary>kubelet is a systemd service — use the skills from the Linux track: `systemctl status kubelet`, `journalctl -u kubelet`.</details>\n<h2>12. Final challenge</h2><p>Draw (in text) the flow of <code>kubectl apply -f pod.yaml</code>: which component receives it, where the state is stored, which component schedules it, and which one runs it. Understanding this flow makes CKA troubleshooting much easier.</p><h2>13. What to submit (evidence)</h2><p>Save all outputs and your component table in <code>submissions/kubernetes/advanced/project-01/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 1.\"</strong></p><hr><p><strong>Remember:</strong> apiserver, etcd, scheduler, controllers, kubelet — know each job. This is the map you use to fix things.</p></section>","kubernetes/advanced/project-02":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: kubeadm (Build and Upgrade a Cluster)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>kubeadm</strong> — a tool that builds a Kubernetes cluster.</li><li><strong>Bootstrap</strong> — start the cluster for the first time.</li><li><strong>join</strong> — add a worker node to the cluster.</li><li><strong>CNI</strong> — the network plugin that lets Pods talk (e.g. Calico, Flannel).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p><code>kubeadm</code> builds a real cluster step by step:</p><ol><li><strong><code>kubeadm init</code></strong> on the control-plane node — starts the cluster.</li><li>Install a <strong>CNI</strong> (network plugin) so Pods can talk.</li><li><strong><code>kubeadm join</code></strong> on each worker — adds it to the cluster.</li></ol><p>You can also <strong>upgrade</strong> the cluster version with kubeadm, one node at a time, safely.</p><h2>2. Key concepts and terms</h2><ul><li><code>kubeadm init --pod-network-cidr=...</code> starts the control plane.</li><li>After init, copy the admin kubeconfig to use <code>kubectl</code>.</li><li>CNI must be installed or nodes stay <code>NotReady</code>.</li><li>Upgrade order: control plane first, then workers. Drain a node before upgrading it.</li></ul><h2>3. Practical examples</h2><pre><code># on the control-plane node\nsudo kubeadm init --pod-network-cidr=10.244.0.0/16\nmkdir -p $HOME/.kube &amp;&amp; sudo cp /etc/kubernetes/admin.conf $HOME/.kube/config\nsudo chown $(id -u):$(id -g) $HOME/.kube/config\nkubectl apply -f &lt;a CNI, e.g. Flannel or Calico manifest&gt;\n\n# on each worker node (use the token printed by init)\nsudo kubeadm join &lt;ip&gt;:6443 --token &lt;t&gt; --discovery-token-ca-cert-hash sha256:&lt;hash&gt;</code></pre><h2>4. Commands and config examples</h2><pre><code>kubeadm token create --print-join-command   # get a fresh join command\nkubectl get nodes                            # workers should become Ready after CNI\n# upgrade (idea):\nkubeadm upgrade plan\nkubectl drain &lt;node&gt; --ignore-daemonsets\n# ... apt install new kubeadm/kubelet, kubeadm upgrade apply/node ...\nkubectl uncordon &lt;node&gt;</code></pre><h2>5. Hands-on exercises (use VMs or killercoda)</h2><ol><li><code>kubeadm init</code> on a control plane. Set up kubectl.</li><li>Install a CNI. Watch the node become <code>Ready</code>.</li><li>Join one worker with <code>kubeadm join</code>.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> nodes stay <code>NotReady</code>.</li></ul><p>  <strong>Fix:</strong> no CNI installed. Install one.</p><ul><li><strong>Problem:</strong> join fails with a token error.</li></ul><p>  <strong>Fix:</strong> tokens expire. Make a new one: <code>kubeadm token create --print-join-command</code>.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Forgetting the CNI — nodes never become Ready.</li><li>Not draining a node before upgrading it.</li><li>Wrong pod-network-cidr for the chosen CNI.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA:</strong> installing and upgrading with kubeadm is a real exam task.</li><li>Know the init → CNI → join flow, and the drain/upgrade/uncordon order.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What are the 3 main steps to build a cluster with kubeadm?</li><li>Why do nodes stay NotReady after init?</li><li>What do you do to a node before upgrading it?</li></ol><h2>10. References</h2><ul><li>kubeadm: <a href=\"https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/</a> (checked: 2026-09-18)</li><li>Upgrade: <a href=\"https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> init → install CNI → join. Upgrade control plane first, drain nodes before upgrading them.</p><details><summary>Answers</summary>\n<ol><li><code>kubeadm init</code>, install a CNI, then <code>kubeadm join</code> the workers.</li><li>No network plugin (CNI) is installed yet.</li><li>Drain it (<code>kubectl drain</code>) so its Pods move away safely.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Build a Cluster with kubeadm</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Build a real Kubernetes cluster from scratch with kubeadm: control plane + a worker + a network plugin.</p><h2>2. Real-world scenario</h2><p>Your company needs its own cluster (not a cloud one). You build it with kubeadm, the standard tool the CKA exam uses.</p><h2>3. Skills and concepts you will learn</h2><ul><li><code>kubeadm init</code> for the control plane.</li><li>Install a CNI so Pods can talk.</li><li><code>kubeadm join</code> for a worker.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Advanced Project 1 completed.</li><li>Read: <code>study/kubernetes/advanced/02-kubeadm.md</code>.</li><li>⚠️ You need 2 Linux VMs (or use <strong>killercoda.com</strong> CKA playground, which gives you nodes ready to go). kind/minikube cannot do this project.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>On the control-plane node, run <code>kubeadm init</code> (with a pod-network-cidr).</li><li>Set up <code>kubectl</code> (copy the admin kubeconfig).</li><li>Install a CNI (Flannel or Calico). Wait for the control-plane node to become <code>Ready</code>.</li><li>On the worker node, run the <code>kubeadm join</code> command.</li><li>Show <code>kubectl get nodes</code> with the control plane and worker both <code>Ready</code>.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ <code>kubeadm init</code> succeeded.</li><li>☐ kubectl works.</li><li>☐ CNI installed; node Ready.</li><li>☐ Worker joined and Ready.</li></ul><h2>7. Expected outcome</h2><p>A working 2-node cluster you built yourself, both nodes <code>Ready</code>.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show <code>kubeadm init</code> output (or the key success lines).</li><li><code>kubectl get nodes</code> works (kubeconfig set up).</li><li>You show the CNI was installed (the node moves from <code>NotReady</code> to <code>Ready</code>).</li><li><code>kubectl get nodes</code> shows BOTH the control plane and a worker as <code>Ready</code>.</li><li>You explain in one line why nodes were <code>NotReady</code> before the CNI.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Control plane up.</li><li>☐ CNI installed.</li><li>☐ Worker joined.</li><li>☐ Both nodes Ready.</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-02/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>No CNI → nodes stay NotReady.</li><li>Expired join token → make a new one.</li><li>Wrong pod-network-cidr for the CNI.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the exact flow in `study/kubernetes/advanced/02-kubeadm.md`, section 3.</details>\n<details><summary>Hint 2</summary>Lost the join command? `kubeadm token create --print-join-command` on the control plane.</details>\n<details><summary>Hint 3</summary>No VMs? Use killercoda.com's CKA scenarios — they give you real nodes in the browser.</details>\n<h2>12. Final challenge</h2><p>Practice an <strong>upgrade</strong>: <code>kubeadm upgrade plan</code>, then drain a node, upgrade it, and uncordon it. (On killercoda there are guided upgrade labs.) Upgrades are a real CKA task.</p><h2>13. What to submit (evidence)</h2><p>Save the init output, CNI step, join step, and final <code>kubectl get nodes</code> in <code>submissions/kubernetes/advanced/project-02/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 2.\"</strong></p><hr><p><strong>Remember:</strong> init → CNI → join. No CNI means NotReady. This is a real CKA skill.</p></section>","kubernetes/advanced/project-03":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: etcd Backup and Restore</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>etcd</strong> — the cluster's database. Holds ALL cluster state.</li><li><strong>Snapshot</strong> — a saved copy of etcd at one moment.</li><li><strong>Restore</strong> — bring etcd back from a snapshot.</li><li><strong>etcdctl</strong> — the tool to talk to etcd.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p><strong>etcd</strong> stores everything about your cluster: every Pod, Service, Secret, config. If etcd is lost and you have no backup, the cluster state is <strong>gone</strong>.</p><p>So you make a <strong>snapshot</strong> (a backup file). If disaster happens, you <strong>restore</strong> from it. This is one of the most important CKA skills — and it is the same idea as the Linux backup project you did!</p><h2>2. Key concepts and terms</h2><ul><li><code>etcdctl snapshot save</code> makes a backup.</li><li><code>etcdctl snapshot restore</code> restores to a new data folder.</li><li>etcd needs certificates to talk to it (on a kubeadm control plane, they are in <code>/etc/kubernetes/pki/etcd/</code>).</li><li>Set <code>ETCDCTL_API=3</code>.</li></ul><h2>3. Practical examples</h2><pre><code># BACKUP (run on the control-plane node)\nsudo ETCDCTL_API=3 etcdctl snapshot save /opt/etcd-backup.db \\\n  --endpoints=https://127.0.0.1:2379 \\\n  --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\n  --cert=/etc/kubernetes/pki/etcd/server.crt \\\n  --key=/etc/kubernetes/pki/etcd/server.key\n\n# check the snapshot\nsudo ETCDCTL_API=3 etcdctl snapshot status /opt/etcd-backup.db --write-out=table</code></pre><h2>4. Commands and config examples</h2><pre><code># RESTORE (idea): restore to a new data dir, then point etcd at it\nsudo ETCDCTL_API=3 etcdctl snapshot restore /opt/etcd-backup.db \\\n  --data-dir=/var/lib/etcd-restore\n# then edit the etcd static pod manifest to use the new data dir, and let kubelet restart etcd</code></pre><h2>5. Hands-on exercises (kubeadm or killercoda)</h2><ol><li>Make an etcd snapshot. Check its status.</li><li>Create a test object (like a namespace) AFTER the backup.</li><li>Restore the snapshot and confirm the test object is gone (proves the restore worked).</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> <code>context deadline exceeded</code> / cert errors.</li></ul><p>  <strong>Fix:</strong> wrong endpoints or cert paths. Use the etcd cert files in <code>/etc/kubernetes/pki/etcd/</code>.</p><ul><li><strong>Problem:</strong> cluster does not come back after restore.</li></ul><p>  <strong>Fix:</strong> the etcd static Pod must point to the restored data dir. Check the manifest and kubelet logs.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Forgetting <code>ETCDCTL_API=3</code>.</li><li>Wrong cert paths.</li><li>Not testing the restore.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA:</strong> etcd backup and restore is a classic, high-value exam task. Practice it until it is automatic.</li><li>Know the cert flags and the snapshot save/restore commands.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does etcd store?</li><li>Which command makes a backup?</li><li>Why must you test a restore?</li></ol><h2>10. References</h2><ul><li>Back up etcd: <a href=\"https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/</a> (checked: 2026-09-18)</li><li>Video: <strong>KodeKloud</strong> — \"etcd backup and restore\" — <a href=\"https://www.youtube.com/@KodeKloud\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@KodeKloud</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> etcd = the cluster database. <code>snapshot save</code> to back up, <code>snapshot restore</code> to recover. Same idea as your Linux backups.</p><details><summary>Answers</summary>\n<ol><li>All cluster state (every object).</li><li><code>etcdctl snapshot save</code>.</li><li>A backup you cannot restore is useless — always test it.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Back Up and Restore etcd</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Make an etcd snapshot, then restore it — and prove the restore actually rolled the cluster back.</p><h2>2. Real-world scenario</h2><p>Someone deleted important objects by mistake. With an etcd backup, you can restore the cluster to before the mistake. This is a top CKA skill.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Make an etcd snapshot with the right certs.</li><li>Check the snapshot.</li><li>Restore and prove it worked.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Advanced Project 2 completed.</li><li>Read: <code>study/kubernetes/advanced/03-etcd-backup.md</code>.</li><li>⚠️ Needs a kubeadm control plane (or killercoda). kind/minikube hide etcd.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Make an etcd snapshot to a file (use the etcd certs).</li><li>Check the snapshot with <code>snapshot status</code>.</li><li>Create a marker object AFTER the backup (e.g. <code>kubectl create namespace after-backup</code>).</li><li>Restore the snapshot (to a new data dir) and make etcd use it.</li><li>Prove the restore worked: the <code>after-backup</code> namespace should be GONE (because it was created after the snapshot).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Snapshot saved.</li><li>☐ Snapshot status checked.</li><li>☐ Marker object created after backup.</li><li>☐ Restore done.</li><li>☐ Marker object gone after restore (proof).</li></ul><h2>7. Expected outcome</h2><p>You backed up etcd and restored it. The state rolled back to the snapshot moment.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You show the <code>etcdctl snapshot save</code> command (with cert flags) and the created file.</li><li><code>etcdctl snapshot status &lt;file&gt; --write-out=table</code> output shown.</li><li>You created a marker object after the backup (show it existed).</li><li>You restored the snapshot and made etcd use the restored data.</li><li>After restore, the marker object is <strong>gone</strong> (<code>kubectl get ns</code> no longer shows <code>after-backup</code>).</li><li>You explain in one line why the marker disappeared.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Snapshot + status.</li><li>☐ Restore performed.</li><li>☐ Rollback proven (marker gone).</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-03/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Forgetting <code>ETCDCTL_API=3</code> or wrong cert paths.</li><li>Not testing the restore.</li><li>Restore data dir not wired into the etcd static Pod.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the exact save command in `study/kubernetes/advanced/03-etcd-backup.md`, section 3.</details>\n<details><summary>Hint 2</summary>killercoda has a guided \"etcd backup/restore\" CKA scenario — great for safe practice.</details>\n<details><summary>Hint 3</summary>After restore, the etcd static Pod manifest must point to the restored `--data-dir`; kubelet restarts etcd from it.</details>\n<h2>12. Final challenge</h2><p>Time yourself: do a full backup + restore in under 15 minutes. In the real CKA exam, speed matters. Practice until it is smooth.</p><h2>13. What to submit (evidence)</h2><p>Save the save/status/restore commands and the proof the marker namespace is gone in <code>submissions/kubernetes/advanced/project-03/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 3.\"</strong></p><hr><p><strong>Remember:</strong> etcd snapshot save + restore = cluster time machine. A classic CKA task. Practice it until it is automatic.</p></section>","kubernetes/advanced/project-04":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Scheduling (Where Pods Go)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Scheduling</strong> — deciding which node runs a Pod.</li><li><strong>Taint</strong> — a \"keep off\" mark on a node.</li><li><strong>Toleration</strong> — a Pod's permission to ignore a taint.</li><li><strong>Affinity</strong> — rules that pull a Pod toward (or away from) certain nodes.</li><li><strong>nodeSelector</strong> — the simple way to pick nodes by label.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>By default the scheduler picks any node with room. But sometimes you want control:</p><ul><li><strong>nodeSelector:</strong> \"run only on nodes with this label\" (simple).</li><li><strong>Taints + tolerations:</strong> a node says \"keep off\" (taint); only Pods with a matching <strong>toleration</strong> may land there. Used for special nodes (e.g. GPU nodes, control plane).</li><li><strong>Affinity/anti-affinity:</strong> softer, richer rules (\"prefer this zone\", \"do not put two copies on the same node\").</li></ul><h2>2. Key concepts and terms</h2><ul><li>Label a node: <code>kubectl label node &lt;n&gt; disk=ssd</code>.</li><li>nodeSelector: <code>nodeSelector: { disk: ssd }</code> in the Pod spec.</li><li>Taint a node: <code>kubectl taint node &lt;n&gt; key=value:NoSchedule</code>.</li><li>Toleration: matches the taint so the Pod can run there.</li><li><code>nodeName</code> forces a Pod onto one node (rarely used).</li></ul><h2>3. Practical examples</h2><pre><code># nodeSelector\nspec:\n  nodeSelector:\n    disk: ssd\n  containers: [{ name: c, image: nginx:1.27 }]\n---\n# toleration (to run on a tainted node)\nspec:\n  tolerations:\n    - key: \"gpu\"\n      operator: \"Equal\"\n      value: \"true\"\n      effect: \"NoSchedule\"</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl label node &lt;node&gt; disk=ssd\nkubectl taint node &lt;node&gt; gpu=true:NoSchedule\nkubectl describe node &lt;node&gt; | grep -i taint\nkubectl get pod &lt;pod&gt; -o wide          # which node did it land on?\nkubectl taint node &lt;node&gt; gpu=true:NoSchedule-   # remove the taint (trailing -)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Label a node. Use <code>nodeSelector</code> to force a Pod onto it.</li><li>Taint a node <code>NoSchedule</code>. Show a normal Pod avoids it.</li><li>Add a matching toleration and show the Pod can now land there.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> Pod stuck <code>Pending</code>.</li></ul><p>  <strong>Fix:</strong> no node matches the nodeSelector/affinity, or all nodes are tainted. <code>kubectl describe pod</code> shows the reason.</p><ul><li><strong>Problem:</strong> Pod lands where you did not want.</li></ul><p>  <strong>Fix:</strong> you did not set a nodeSelector/affinity or taint.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Taint effect confusion: <code>NoSchedule</code> (block new), <code>PreferNoSchedule</code> (avoid), <code>NoExecute</code> (evict existing).</li><li>Forgetting the trailing <code>-</code> to remove a taint.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA:</strong> \"Workloads &amp; Scheduling\". Know nodeSelector, taints/tolerations, and node affinity.</li><li>The control-plane node is tainted by default (that is why your apps do not run there).</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is a taint, and what is a toleration?</li><li>How do you pin a Pod to nodes with a label?</li><li>What are the three taint effects?</li></ol><h2>10. References</h2><ul><li>Taints/tolerations: <a href=\"https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/</a> (checked: 2026-09-18)</li><li>Affinity: <a href=\"https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> nodeSelector = simple pick. Taint = \"keep off\"; toleration = \"I may enter\". Affinity = richer rules.</p><details><summary>Answers</summary>\n<ol><li>A taint marks a node \"keep off\"; a toleration lets a Pod ignore that taint.</li><li><code>nodeSelector</code> (or node affinity) with a matching node label.</li><li>NoSchedule, PreferNoSchedule, NoExecute.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Control Where Pods Run</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Use labels, nodeSelector, taints, and tolerations to control which node runs a Pod.</p><h2>2. Real-world scenario</h2><p>You have special nodes (say, with SSDs). Only certain Pods should use them. You use labels + nodeSelector to place Pods, and taints to protect special nodes.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Label nodes and use nodeSelector.</li><li>Taint a node and see Pods avoid it.</li><li>Add a toleration so a Pod can run on a tainted node.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Advanced Project 3 completed.</li><li>Read: <code>study/kubernetes/advanced/04-scheduling.md</code>.</li><li>A cluster with at least 2 nodes is best (kind can make multi-node clusters; or killercoda).</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Label one node (e.g. <code>disk=ssd</code>). Create a Pod with a matching <code>nodeSelector</code>; show it landed on that node.</li><li>Taint a node <code>NoSchedule</code>. Create a normal Pod; show it does NOT land on the tainted node.</li><li>Add a matching toleration to a Pod; show it CAN now land on the tainted node.</li><li>Remove the taint at the end.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ nodeSelector places a Pod correctly.</li><li>☐ Taint makes normal Pods avoid a node.</li><li>☐ Toleration lets a Pod land there.</li><li>☐ Taint removed.</li></ul><h2>7. Expected outcome</h2><p>You can steer Pods to the right nodes and protect special nodes with taints.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You label a node and show a <code>nodeSelector</code> Pod landed on it (<code>kubectl get pod -o wide</code>).</li><li>You taint a node <code>NoSchedule</code> and show a normal Pod avoids it.</li><li>You add a matching toleration and show a Pod now lands on the tainted node.</li><li>You remove the taint (with the trailing <code>-</code>).</li><li>You explain in one line the difference between a taint and a toleration.</li><li>All commands + <code>-o wide</code> outputs shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ nodeSelector works.</li><li>☐ Taint avoided by normal Pods.</li><li>☐ Toleration allows placement.</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-04/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Confusing taint effects (NoSchedule vs NoExecute).</li><li>Forgetting the trailing <code>-</code> to remove a taint.</li><li>Single-node cluster — hard to show placement (use multi-node).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Label + select: `kubectl label node <n> disk=ssd`, then `nodeSelector: { disk: ssd }`.</details>\n<details><summary>Hint 2</summary>Taint: `kubectl taint node <n> gpu=true:NoSchedule`. Toleration example is in the study doc, section 3.</details>\n<details><summary>Hint 3</summary>Multi-node kind: create a cluster with a config that has 2 workers.</details>\n<h2>12. Final challenge</h2><p>Use <strong>podAntiAffinity</strong> to make sure two replicas of a Deployment never run on the same node. Scale to 2 and show they land on different nodes. This is a real high-availability technique.</p><h2>13. What to submit (evidence)</h2><p>Save all commands + <code>-o wide</code> outputs in <code>submissions/kubernetes/advanced/project-04/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 4.\"</strong></p><hr><p><strong>Remember:</strong> nodeSelector picks nodes; taints keep Pods off; tolerations let them in; affinity gives richer rules.</p></section>","kubernetes/advanced/project-05":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: DaemonSets and Static Pods</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>DaemonSet</strong> — runs one copy of a Pod on every node (or some nodes).</li><li><strong>Static Pod</strong> — a Pod the kubelet runs directly from a file, not from the apiserver.</li><li><strong>Node agent</strong> — a program that must run on each node (like a log collector).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Two special ways to run Pods:</p><ol><li><strong>DaemonSet:</strong> \"run one copy on every node.\" Great for node agents: log collectors, monitoring, network plugins.</li><li><strong>Static Pod:</strong> the kubelet runs it from a <strong>file on the node</strong> (<code>/etc/kubernetes/manifests/</code>), even if the apiserver is down. The control-plane parts (apiserver, etcd...) are static Pods.</li></ol><h2>2. Key concepts and terms</h2><ul><li>DaemonSet automatically adds a Pod when a new node joins.</li><li>DaemonSet Pods often need tolerations to run on tainted nodes (like the control plane).</li><li>Static Pod: drop a Pod YAML in the manifests folder; kubelet runs it. Its name gets the node name added.</li><li>You cannot delete a static Pod with <code>kubectl</code> — remove the file instead.</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: apps/v1\nkind: DaemonSet\nmetadata: { name: node-logger }\nspec:\n  selector: { matchLabels: { app: logger } }\n  template:\n    metadata: { labels: { app: logger } }\n    spec:\n      containers:\n        - name: logger\n          image: busybox\n          command: [\"sh\",\"-c\",\"while true; do echo log from $(hostname); sleep 10; done\"]</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl get daemonset -A\nkubectl get pods -o wide -l app=logger      # one per node\n# static pod (on a node):\nsudo cp mypod.yaml /etc/kubernetes/manifests/   # kubelet starts it\nkubectl get pods -o wide                          # shows &lt;name&gt;-&lt;nodename&gt;\nsudo rm /etc/kubernetes/manifests/mypod.yaml      # remove to stop it</code></pre><h2>5. Hands-on exercises</h2><ol><li>Create a DaemonSet. Show one Pod runs on each node.</li><li>Add a node (or scale a kind cluster) and watch a new DaemonSet Pod appear.</li><li>(kubeadm/killercoda) Create a static Pod by dropping a file in the manifests folder.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> DaemonSet skips the control-plane node.</li></ul><p>  <strong>Fix:</strong> the control plane is tainted; add a toleration to the DaemonSet.</p><ul><li><strong>Problem:</strong> <code>kubectl delete</code> will not remove a Pod.</li></ul><p>  <strong>Fix:</strong> it may be a static Pod — remove its file from the manifests folder.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Expecting a DaemonSet on tainted nodes without a toleration.</li><li>Trying to delete a static Pod with kubectl.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA:</strong> know DaemonSets and static Pods (how to create/find/remove them).</li><li>Remember control-plane components ARE static Pods.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does a DaemonSet do?</li><li>Where do static Pod files live?</li><li>How do you remove a static Pod?</li></ol><h2>10. References</h2><ul><li>DaemonSet: <a href=\"https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/</a> (checked: 2026-09-18)</li><li>Static Pods: <a href=\"https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> DaemonSet = one Pod per node. Static Pod = kubelet runs it from a file. Control-plane parts are static Pods.</p><details><summary>Answers</summary>\n<ol><li>Runs one copy of a Pod on every (or selected) node.</li><li><code>/etc/kubernetes/manifests/</code> (kubelet's manifest path).</li><li>Remove its file from the manifests folder.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>DaemonSets and Static Pods</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Run a DaemonSet (one Pod per node) and create a static Pod (run by kubelet from a file).</p><h2>2. Real-world scenario</h2><p>Every node needs a log collector running on it. A DaemonSet does this automatically. And you learn static Pods, which is how the control plane itself runs.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a DaemonSet; see one Pod per node.</li><li>Create and remove a static Pod.</li><li>Understand how control-plane parts run.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Advanced Project 4 completed.</li><li>Read: <code>study/kubernetes/advanced/05-daemonsets-static-pods.md</code>.</li><li>Multi-node cluster (kind multi-node or killercoda) helps show \"one per node\".</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a DaemonSet (a simple logger). Show one Pod per node (<code>kubectl get pods -o wide -l app=logger</code>).</li><li>Explain (or show) how it would add a Pod when a new node joins.</li><li>(kubeadm/killercoda) Create a <strong>static Pod</strong> by placing a YAML file in <code>/etc/kubernetes/manifests/</code>. Show it appears with the node name added.</li><li>Remove the static Pod by deleting the file. Show it is gone.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ DaemonSet runs one Pod per node.</li><li>☐ Static Pod created from a file.</li><li>☐ Static Pod name includes the node name.</li><li>☐ Static Pod removed by deleting the file.</li></ul><h2>7. Expected outcome</h2><p>You can run node-wide agents with DaemonSets and manage static Pods like the kubelet does.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the DaemonSet YAML and show <code>kubectl get pods -o wide -l app=logger</code> with one Pod per node.</li><li>You explain in one line how a DaemonSet handles a new node.</li><li>You create a static Pod (drop a file in the manifests folder) and show it running with <code>&lt;name&gt;-&lt;node&gt;</code> naming — OR, if on kind/minikube where you cannot easily reach the manifests folder, you clearly explain the static Pod mechanism and show the existing control-plane static Pods.</li><li>You show removing a static Pod by deleting its file (or explain it for kind/minikube).</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ DaemonSet one-per-node.</li><li>☐ Static Pod created/removed (or clearly explained).</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-05/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Expecting a DaemonSet Pod on a tainted control-plane node without a toleration.</li><li>Trying to <code>kubectl delete</code> a static Pod (remove the file instead).</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>DaemonSet YAML is in `study/kubernetes/advanced/05-daemonsets-static-pods.md`, section 3.</details>\n<details><summary>Hint 2</summary>To also run on the control plane, add a toleration for its taint.</details>\n<details><summary>Hint 3</summary>Static Pod: `sudo cp mypod.yaml /etc/kubernetes/manifests/`; watch `kubectl get pods -o wide`. Remove: delete the file.</details>\n<h2>12. Final challenge</h2><p>Add a toleration to your DaemonSet so it ALSO runs on the control-plane node. Show a Pod now runs there too. Node agents (like log/monitoring) usually need this.</p><h2>13. What to submit (evidence)</h2><p>Save the DaemonSet YAML, the one-per-node output, and the static Pod steps in <code>submissions/kubernetes/advanced/project-05/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 5.\"</strong></p><hr><p><strong>Remember:</strong> DaemonSet = one Pod per node. Static Pod = kubelet runs it from a file. That is how the control plane runs.</p></section>","kubernetes/advanced/project-06":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Cluster Networking and NetworkPolicies</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>CNI</strong> — the network plugin that gives Pods their networking.</li><li><strong>CoreDNS</strong> — the cluster's DNS (turns Service names into IPs).</li><li><strong>NetworkPolicy</strong> — a firewall rule for Pods (who may talk to whom).</li><li><strong>Default allow</strong> — without policies, all Pods can talk to all Pods.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Two parts:</p><ol><li><strong>How Pods talk:</strong> the <strong>CNI</strong> gives every Pod an IP; <strong>CoreDNS</strong> lets Pods find Services by name. By default, <strong>all Pods can talk to all Pods</strong> — very open.</li><li><strong>How to limit talk:</strong> a <strong>NetworkPolicy</strong> is a firewall for Pods. It says \"these Pods may receive traffic only from those Pods\". This is the cluster version of the Docker network isolation you did.</li></ol><p>⚠️ NetworkPolicies only work if your CNI supports them (Calico yes; some setups no).</p><h2>2. Key concepts and terms</h2><ul><li>CoreDNS runs in <code>kube-system</code>. Service DNS: <code>name.namespace.svc.cluster.local</code>.</li><li>A NetworkPolicy selects Pods (<code>podSelector</code>) and sets <code>ingress</code>/<code>egress</code> rules.</li><li>Once a Pod is selected by any policy, it is <strong>default-deny</strong> for that direction, and only the listed traffic is allowed.</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: db-allow-api }\nspec:\n  podSelector:\n    matchLabels: { app: db }        # applies to db Pods\n  policyTypes: [\"Ingress\"]\n  ingress:\n    - from:\n        - podSelector:\n            matchLabels: { app: api }   # only api Pods may reach db</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl get pods -n kube-system -l k8s-app=kube-dns   # CoreDNS\nkubectl run test --image=busybox -it --rm -- nslookup web   # DNS test\nkubectl get networkpolicy\nkubectl describe networkpolicy db-allow-api</code></pre><h2>5. Hands-on exercises</h2><ol><li>Test cluster DNS: from a temp Pod, <code>nslookup</code> a Service.</li><li>Deploy <code>api</code> and <code>db</code>. Show <code>api</code> can reach <code>db</code> (open by default).</li><li>Add a NetworkPolicy so only <code>api</code> may reach <code>db</code>. Show a third Pod is now blocked.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> policy has no effect.</li></ul><p>  <strong>Fix:</strong> your CNI may not support NetworkPolicies. Use Calico (kind can install it).</p><ul><li><strong>Problem:</strong> everything is blocked.</li></ul><p>  <strong>Fix:</strong> a default-deny policy with no allow rules blocks all. Add the allow rules you need.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Testing policies on a CNI that ignores them.</li><li>Forgetting that selecting a Pod turns on default-deny for that direction.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA:</strong> Services &amp; Networking includes NetworkPolicies and DNS.</li><li><strong>CKS:</strong> NetworkPolicies are a big security topic (limit Pod-to-Pod traffic).</li></ul><h2>9. Practice questions and tasks</h2><ol><li>By default, can all Pods talk to all Pods?</li><li>What does a NetworkPolicy do?</li><li>What must the CNI support for policies to work?</li></ol><h2>10. References</h2><ul><li>NetworkPolicies: <a href=\"https://kubernetes.io/docs/concepts/services-networking/network-policies/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/services-networking/network-policies/</a> (checked: 2026-09-18)</li><li>DNS: <a href=\"https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> CNI = Pod networking, CoreDNS = names. Default is all-open. NetworkPolicy = a Pod firewall (needs a supporting CNI).</p><details><summary>Answers</summary>\n<ol><li>Yes, by default (until you add NetworkPolicies).</li><li>Limits which Pods may send/receive traffic (a Pod firewall).</li><li>The CNI must support NetworkPolicy (e.g. Calico).</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Lock Down Pod Traffic with NetworkPolicies</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Use a NetworkPolicy so only allowed Pods can reach your database Pod. Prove others are blocked.</p><h2>2. Real-world scenario</h2><p>Security says: *\"Only the API may talk to the database. Block everything else.\"* By default all Pods can talk to all Pods. You add a NetworkPolicy to lock it down.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Test cluster DNS (CoreDNS).</li><li>Write a NetworkPolicy.</li><li>Prove allowed traffic passes and other traffic is blocked.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Advanced Project 5 completed.</li><li>Read: <code>study/kubernetes/advanced/06-networking-policies.md</code>.</li><li>⚠️ Your CNI must support NetworkPolicies (Calico). kind can install Calico; killercoda scenarios have it.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Deploy <code>db</code> (label <code>app: db</code>), <code>api</code> (label <code>app: api</code>), and <code>other</code> (a third Pod, different label).</li><li>Show that, by default, both <code>api</code> and <code>other</code> can reach <code>db</code>.</li><li>Add a NetworkPolicy on <code>db</code> that allows ingress ONLY from <code>app: api</code>.</li><li>Prove <code>api</code> can still reach <code>db</code>, but <code>other</code> is now blocked.</li><li>Test cluster DNS from a temp Pod (<code>nslookup &lt;service&gt;</code>).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Default open traffic shown.</li><li>☐ NetworkPolicy applied to db.</li><li>☐ api still allowed.</li><li>☐ other now blocked.</li><li>☐ DNS test shown.</li></ul><h2>7. Expected outcome</h2><p>The database accepts traffic only from the API. Other Pods are blocked. You proved both cases.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>Before the policy: you show BOTH <code>api</code> and <code>other</code> reaching <code>db</code> (e.g. <code>wget</code>/<code>nc</code> to the db Service/Pod).</li><li>You paste the NetworkPolicy YAML (podSelector <code>app: db</code>, ingress from <code>app: api</code>).</li><li>After the policy: <code>api</code> still reaches <code>db</code> (allowed).</li><li>After the policy: <code>other</code> is <strong>blocked</strong> (connection fails/times out).</li><li><code>nslookup &lt;service&gt;</code> from a temp Pod works (DNS).</li><li>You explain in one line what \"default-deny\" means once a policy selects a Pod.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ Default-open shown first.</li><li>☐ Policy blocks the right Pod.</li><li>☐ Allowed Pod still works.</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-06/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>CNI does not support policies → the rule does nothing.</li><li>Forgetting that selecting a Pod turns on default-deny for that direction.</li><li>Wrong labels in the policy.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Use the NetworkPolicy YAML in `study/kubernetes/advanced/06-networking-policies.md`, section 3.</details>\n<details><summary>Hint 2</summary>Test reachability with a busybox Pod: `wget -qO- --timeout=3 http://db` (or `nc -zv db <port>`).</details>\n<details><summary>Hint 3</summary>kind with Calico, or killercoda's network policy scenario, gives you a CNI that enforces policies.</details>\n<h2>12. Final challenge</h2><p>Add a <strong>default-deny-all ingress</strong> policy for the whole namespace, then add specific allow policies. This \"deny by default, allow what you need\" model is the CKS best practice.</p><h2>13. What to submit (evidence)</h2><p>Save the before/after reachability tests, the policy YAML, and the DNS test in <code>submissions/kubernetes/advanced/project-06/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 6.\"</strong></p><hr><p><strong>Remember:</strong> Default is all-open. A NetworkPolicy is a Pod firewall (needs a supporting CNI). Deny by default, allow what you need.</p></section>","kubernetes/advanced/project-07":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: RBAC (Who Can Do What)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>RBAC</strong> — Role-Based Access Control. In simple words: rules about who is allowed to do what.</li><li><strong>Role</strong> — a set of allowed actions in one namespace.</li><li><strong>ClusterRole</strong> — a set of allowed actions across the whole cluster.</li><li><strong>RoleBinding</strong> — gives a Role to a user or ServiceAccount.</li><li><strong>ServiceAccount</strong> — an identity for a Pod/app (not a human).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Not everyone should be able to do everything. <strong>RBAC</strong> controls access.</p><p>Two steps:</p><ol><li>A <strong>Role</strong> (or <strong>ClusterRole</strong>) lists allowed actions: \"may <code>get</code> and <code>list</code> Pods\".</li><li>A <strong>RoleBinding</strong> (or <strong>ClusterRoleBinding</strong>) gives that Role to a <strong>subject</strong>: a user or a <strong>ServiceAccount</strong>.</li></ol><p>Rule of thumb: <strong>least privilege</strong> — give only what is needed.</p><h2>2. Key concepts and terms</h2><ul><li>Role = namespaced permissions. ClusterRole = cluster-wide (or reusable) permissions.</li><li>Verbs: <code>get</code>, <code>list</code>, <code>watch</code>, <code>create</code>, <code>update</code>, <code>delete</code>.</li><li>Resources: <code>pods</code>, <code>deployments</code>, <code>secrets</code>, etc.</li><li>A <strong>ServiceAccount</strong> is used by Pods to talk to the apiserver.</li><li>Test access with <code>kubectl auth can-i</code>.</li></ul><h2>3. Practical examples</h2><pre><code>apiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata: { namespace: dev, name: pod-reader }\nrules:\n  - apiGroups: [\"\"]\n    resources: [\"pods\"]\n    verbs: [\"get\",\"list\",\"watch\"]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata: { namespace: dev, name: read-pods }\nsubjects:\n  - kind: ServiceAccount\n    name: myapp\n    namespace: dev\nroleRef:\n  kind: Role\n  name: pod-reader\n  apiGroup: rbac.authorization.k8s.io</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl create serviceaccount myapp -n dev\nkubectl create role pod-reader --verb=get,list,watch --resource=pods -n dev\nkubectl create rolebinding read-pods --role=pod-reader --serviceaccount=dev:myapp -n dev\n# test:\nkubectl auth can-i list pods -n dev --as=system:serviceaccount:dev:myapp</code></pre><h2>5. Hands-on exercises</h2><ol><li>Make a ServiceAccount and a Role that can only read Pods.</li><li>Bind them with a RoleBinding.</li><li>Use <code>kubectl auth can-i</code> to prove the SA can list Pods but cannot delete them.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> \"Forbidden\" errors.</li></ul><p>  <strong>Fix:</strong> the Role does not allow that verb/resource, or the binding is missing/wrong namespace.</p><ul><li><strong>Problem:</strong> access is too wide.</li></ul><p>  <strong>Fix:</strong> you used a ClusterRoleBinding or a broad ClusterRole. Narrow it.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Giving cluster-admin to everything (too much power).</li><li>Binding in the wrong namespace.</li><li>Forgetting the ServiceAccount subject format: <code>system:serviceaccount:&lt;ns&gt;:&lt;name&gt;</code>.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA:</strong> creating Roles/RoleBindings and testing with <code>kubectl auth can-i</code> is common.</li><li><strong>CKS:</strong> least privilege and limiting who can read Secrets are key.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is the difference between a Role and a ClusterRole?</li><li>What does a RoleBinding do?</li><li>How do you test if an identity can do an action?</li></ol><h2>10. References</h2><ul><li>RBAC: <a href=\"https://kubernetes.io/docs/reference/access-authn-authz/rbac/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/reference/access-authn-authz/rbac/</a> (checked: 2026-09-18)</li><li>Video: <strong>KodeKloud</strong> — \"Kubernetes RBAC\" — <a href=\"https://www.youtube.com/@KodeKloud\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/@KodeKloud</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Role = allowed actions; Binding = gives it to someone. Least privilege. Test with <code>kubectl auth can-i</code>.</p><details><summary>Answers</summary>\n<ol><li>Role is namespaced; ClusterRole is cluster-wide (or reusable across namespaces).</li><li>Gives a Role's permissions to a user or ServiceAccount.</li><li><code>kubectl auth can-i &lt;verb&gt; &lt;resource&gt; --as=&lt;subject&gt;</code>.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Control Access with RBAC</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Create a ServiceAccount with limited permissions using a Role and RoleBinding, and prove the limits.</p><h2>2. Real-world scenario</h2><p>A new app should only READ Pods — it must never delete anything. You give it a ServiceAccount with a read-only Role, following least privilege.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Create a ServiceAccount.</li><li>Create a Role (read-only) and a RoleBinding.</li><li>Test access with <code>kubectl auth can-i</code>.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Advanced Project 6 completed.</li><li>Read: <code>study/kubernetes/advanced/07-rbac.md</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Create a namespace <code>dev</code> and a ServiceAccount <code>myapp</code> in it.</li><li>Create a Role <code>pod-reader</code> (verbs: get, list, watch on pods).</li><li>Bind the Role to the ServiceAccount with a RoleBinding.</li><li>Prove: the SA CAN list pods (<code>can-i list pods</code> → yes) but CANNOT delete pods (<code>can-i delete pods</code> → no).</li><li>Bonus: run a Pod using that ServiceAccount and confirm it works.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ ServiceAccount created.</li><li>☐ Read-only Role + RoleBinding created.</li><li>☐ <code>can-i list pods</code> → yes.</li><li>☐ <code>can-i delete pods</code> → no.</li></ul><h2>7. Expected outcome</h2><p>Your ServiceAccount can read Pods but not delete them. You proved least privilege.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>You paste the Role and RoleBinding YAML (or the <code>kubectl create</code> commands).</li><li><code>kubectl auth can-i list pods -n dev --as=system:serviceaccount:dev:myapp</code> returns <strong>yes</strong>.</li><li><code>kubectl auth can-i delete pods -n dev --as=system:serviceaccount:dev:myapp</code> returns <strong>no</strong>.</li><li>You explain in one line what \"least privilege\" means.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ SA + Role + Binding created.</li><li>☐ can-i proves the limits.</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-07/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Binding in the wrong namespace.</li><li>Wrong subject format (<code>system:serviceaccount:&lt;ns&gt;:&lt;name&gt;</code>).</li><li>Giving too many verbs.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Fast create: `kubectl create serviceaccount myapp -n dev`, `kubectl create role pod-reader --verb=get,list,watch --resource=pods -n dev`, `kubectl create rolebinding read-pods --role=pod-reader --serviceaccount=dev:myapp -n dev`.</details>\n<details><summary>Hint 2</summary>Test: `kubectl auth can-i <verb> pods -n dev --as=system:serviceaccount:dev:myapp`.</details>\n<details><summary>Hint 3</summary>Least privilege = give only the access truly needed, nothing more.</details>\n<h2>12. Final challenge</h2><p>Create a ClusterRole + ClusterRoleBinding that lets the SA read Pods in ALL namespaces (read-only). Show <code>can-i list pods -A</code> becomes yes, but delete is still no. Understand the Role vs ClusterRole difference by doing it.</p><h2>13. What to submit (evidence)</h2><p>Save the YAML/commands and the <code>can-i</code> results in <code>submissions/kubernetes/advanced/project-07/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 7.\"</strong></p><hr><p><strong>Remember:</strong> Role = allowed actions; Binding = gives it to a subject. Least privilege. Prove it with <code>kubectl auth can-i</code>.</p></section>","kubernetes/advanced/project-08":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Autoscaling (HPA)</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>HPA</strong> — Horizontal Pod Autoscaler. Adds or removes Pod copies based on load.</li><li><strong>Horizontal scaling</strong> — more copies (Pods). Vertical scaling — bigger Pods.</li><li><strong>metrics-server</strong> — provides CPU/memory numbers the HPA needs.</li><li><strong>Target</strong> — the value the HPA tries to keep (e.g. 50% CPU).</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>When traffic goes up, you want more Pods. When it goes down, you want fewer (to save money). The <strong>HPA</strong> does this automatically.</p><p>It watches a metric (usually CPU %) and keeps it near a <strong>target</strong>. If CPU is too high, it adds Pods. If low, it removes Pods (down to a minimum).</p><p>The HPA needs the <strong>metrics-server</strong> to read CPU/memory.</p><h2>2. Key concepts and terms</h2><ul><li>HPA needs the target Deployment to have CPU <strong>requests</strong> set (so % makes sense).</li><li><code>minReplicas</code> and <code>maxReplicas</code> set the range.</li><li><code>kubectl top</code> must work (metrics-server installed).</li></ul><h2>3. Practical examples</h2><pre><code># make sure metrics-server is installed, then:\nkubectl autoscale deploy web --cpu-percent=50 --min=2 --max=10\nkubectl get hpa\nkubectl top pods</code></pre><p>Or as YAML:</p><pre><code>apiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata: { name: web }\nspec:\n  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }\n  minReplicas: 2\n  maxReplicas: 10\n  metrics:\n    - type: Resource\n      resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } }</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl top nodes ; kubectl top pods      # needs metrics-server\nkubectl get hpa -w                          # watch it scale\n# make load to trigger scaling:\nkubectl run load --image=busybox -it --rm -- sh -c \"while true; do wget -q -O- http://web; done\"</code></pre><h2>5. Hands-on exercises</h2><ol><li>Install metrics-server (if needed). Confirm <code>kubectl top pods</code> works.</li><li>Add CPU requests to a Deployment. Create an HPA (50% CPU, min 2, max 10).</li><li>Make load and watch the HPA add Pods. Stop the load and watch it scale down.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> HPA shows <code>&lt;unknown&gt;</code> for CPU.</li></ul><p>  <strong>Fix:</strong> metrics-server is missing/not ready, or the Deployment has no CPU requests.</p><ul><li><strong>Problem:</strong> it never scales.</li></ul><p>  <strong>Fix:</strong> load is too low, or requests are set too high (so % stays low).</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>No CPU requests → HPA cannot compute a percentage.</li><li>No metrics-server → no metrics.</li><li>Setting max too low → cannot handle spikes.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA/CKAD:</strong> know <code>kubectl autoscale</code>, the HPA object, and that requests + metrics-server are required.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does an HPA do?</li><li>What two things must exist for CPU-based HPA to work?</li><li>What is the difference between horizontal and vertical scaling?</li></ol><h2>10. References</h2><ul><li>HPA: <a href=\"https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/</a> (checked: 2026-09-18)</li><li>metrics-server: <a href=\"https://github.com/kubernetes-sigs/metrics-server\" target=\"_blank\" rel=\"noopener\">https://github.com/kubernetes-sigs/metrics-server</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> HPA adds/removes Pods to keep a metric near a target. It needs CPU requests + metrics-server.</p><details><summary>Answers</summary>\n<ol><li>Automatically adds or removes Pod copies based on load.</li><li>CPU requests on the Deployment, and a working metrics-server.</li><li>Horizontal = more copies; vertical = bigger single Pods.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Autoscale an App with HPA</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Set up a Horizontal Pod Autoscaler and watch it add Pods under load, then remove them when load drops.</p><h2>2. Real-world scenario</h2><p>Traffic is spiky. At busy times you need more Pods; at quiet times, fewer (to save money). An HPA does this automatically.</p><h2>3. Skills and concepts you will learn</h2><ul><li>Install/confirm metrics-server.</li><li>Add CPU requests.</li><li>Create an HPA and trigger scaling.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Advanced Project 7 completed.</li><li>Read: <code>study/kubernetes/advanced/08-autoscaling.md</code>.</li><li>metrics-server must work (<code>kubectl top pods</code>). On minikube: <code>minikube addons enable metrics-server</code>.</li></ul><h2>5. Step-by-step requirements</h2><ol><li>Confirm <code>kubectl top pods</code> works (install metrics-server if needed).</li><li>Create a Deployment <code>web</code> with a CPU <strong>request</strong> (e.g. <code>100m</code>).</li><li>Create an HPA: 50% CPU, min 2, max 10.</li><li>Generate load (a busy loop hitting the Service).</li><li>Watch the HPA add Pods (<code>kubectl get hpa -w</code>, <code>kubectl get pods</code>).</li><li>Stop the load; watch it scale back down (this can take a few minutes).</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ metrics-server works.</li><li>☐ Deployment has CPU requests.</li><li>☐ HPA created.</li><li>☐ Scaled UP under load.</li><li>☐ Scaled DOWN after load.</li></ul><h2>7. Expected outcome</h2><p>The app grows more Pods under load and shrinks when idle, automatically.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li><code>kubectl top pods</code> returns real numbers (metrics-server works).</li><li>The Deployment has a CPU <code>request</code> (show the YAML).</li><li>You paste the HPA (or the <code>kubectl autoscale</code> command) with min/max and target.</li><li>Under load, <code>kubectl get hpa</code> shows CPU above target and the replica count <strong>increasing</strong> (show it).</li><li>After stopping load, the replica count <strong>decreases</strong> back toward min (show it, noting it may take minutes).</li><li>You explain in one line why CPU requests are needed for a CPU HPA.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ metrics working.</li><li>☐ Scale up shown.</li><li>☐ Scale down shown.</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-08/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>No CPU requests → HPA shows <code>&lt;unknown&gt;</code>.</li><li>No metrics-server.</li><li>Not enough load to trigger scaling.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Create HPA fast: `kubectl autoscale deploy web --cpu-percent=50 --min=2 --max=10`.</details>\n<details><summary>Hint 2</summary>Load: `kubectl run load --image=busybox -it --rm -- sh -c \"while true; do wget -q -O- http://web; done\"` (run a couple of these).</details>\n<details><summary>Hint 3</summary>Watch: `kubectl get hpa -w` and `kubectl get pods -w` in another terminal.</details>\n<h2>12. Final challenge</h2><p>Scale on <strong>memory</strong> instead of CPU, or use a custom target. Explain when memory-based scaling makes more sense than CPU-based.</p><h2>13. What to submit (evidence)</h2><p>Save the Deployment + HPA, the scale-up and scale-down evidence in <code>submissions/kubernetes/advanced/project-08/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 8.\"</strong></p><hr><p><strong>Remember:</strong> HPA keeps a metric near a target by adding/removing Pods. Needs CPU requests + metrics-server.</p></section>","kubernetes/advanced/project-09":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Cluster Troubleshooting</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>NotReady</strong> — a node that is not healthy.</li><li><strong>kubelet</strong> — the node agent; if it is down, the node breaks.</li><li><strong>Events</strong> — messages that explain what happened (<code>kubectl describe</code>).</li><li><strong>CrashLoopBackOff</strong> — a Pod that keeps crashing and restarting.</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Troubleshooting is the biggest part of CKA (~30%). The secret is a <strong>method</strong>, not luck. Work from the outside in:</p><ol><li><strong>Objects:</strong> <code>kubectl get pods/nodes</code> — what is broken?</li><li><strong>Details:</strong> <code>kubectl describe</code> — read the Events.</li><li><strong>Logs:</strong> <code>kubectl logs</code> (app) and <code>journalctl -u kubelet</code> (node).</li><li><strong>Node health:</strong> is the kubelet running? is the node Ready?</li><li><strong>Control plane:</strong> are the static Pods healthy?</li></ol><h2>2. Key concepts and terms</h2><p>Common problems and where to look:</p><ul><li><strong>Pod Pending</strong> → <code>describe pod</code> (no node/resources/PVC).</li><li><strong>CrashLoopBackOff</strong> → <code>kubectl logs</code> (app crashes).</li><li><strong>ImagePullBackOff</strong> → wrong image/registry.</li><li><strong>Node NotReady</strong> → <code>journalctl -u kubelet</code> on the node; is kubelet running? is the CNI ok?</li><li><strong>Service not working</strong> → check endpoints (labels), then DNS, then NetworkPolicy.</li></ul><h2>3. Practical examples</h2><pre><code>kubectl get nodes\nkubectl describe node &lt;node&gt; | tail -30       # conditions + events\nssh &lt;node&gt;; sudo systemctl status kubelet ; journalctl -u kubelet | tail\nkubectl get pods -A -o wide | grep -v Running  # anything not Running\nkubectl describe pod &lt;pod&gt;                      # Events at the bottom\nkubectl logs &lt;pod&gt; --previous                   # logs of the crashed instance</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl get events -A --sort-by=.lastTimestamp | tail\nkubectl -n kube-system get pods                 # control-plane health\nsudo crictl ps                                   # containers on a node (runtime)</code></pre><h2>5. Hands-on exercises</h2><ol><li>Break a Deployment with a bad image; find and fix it via <code>describe</code>/<code>logs</code>.</li><li>Stop the kubelet on a node (<code>systemctl stop kubelet</code>); see the node go <code>NotReady</code>; start it again.</li><li>Break a Service by changing a label; fix it by matching labels again.</li></ol><h2>6. Troubleshooting (method summary)</h2><ul><li>Start wide (<code>get</code>), then narrow (<code>describe</code>, <code>logs</code>).</li><li>Node problems → kubelet + <code>journalctl</code>.</li><li>Control-plane problems → static Pods + <code>journalctl -u kubelet</code>.</li><li>Networking → endpoints → DNS → NetworkPolicy.</li></ul><h2>7. Common mistakes and how to avoid them</h2><ul><li>Guessing instead of reading Events and logs.</li><li>Forgetting the node side (kubelet, runtime).</li><li>Not using <code>--previous</code> for crashed Pods.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA:</strong> Troubleshooting is ~30%. This method wins points fast.</li><li>Practice: broken kubelet, wrong static Pod, failing Pods, broken Services.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What does CrashLoopBackOff mean, and where do you look?</li><li>A node is NotReady — what do you check on the node?</li><li>A Service has no endpoints — what is wrong?</li></ol><h2>10. References</h2><ul><li>Debug clusters: <a href=\"https://kubernetes.io/docs/tasks/debug/debug-cluster/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/debug/debug-cluster/</a> (checked: 2026-09-18)</li><li>Debug Pods: <a href=\"https://kubernetes.io/docs/tasks/debug/debug-application/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/debug/debug-application/</a> (checked: 2026-09-18)</li></ul><hr><p><strong>Remember:</strong> Method beats luck. get → describe → logs → node (kubelet) → control plane. Read the Events.</p><details><summary>Answers</summary>\n<ol><li>The Pod keeps crashing; look at <code>kubectl logs &lt;pod&gt;</code> (and <code>--previous</code>).</li><li>Is the kubelet running? Check <code>systemctl status kubelet</code> and <code>journalctl -u kubelet</code>; also the CNI.</li><li>The Service selector does not match any Pod labels.</li></ol></details>\n</section><section class=\"project\"><div class=\"tag\">🛠️ Project</div><h1>Fix a Broken Cluster</h1><p><strong>Status:</strong> 🔒 Locked</p><h2>1. Objective</h2><p>Practice a clear troubleshooting method on several broken things: a crashing Pod, a NotReady node, and a broken Service.</p><h2>2. Real-world scenario</h2><p>Things break in production. Your value as an admin is finding the cause fast and fixing it — with a method, not guesses. Troubleshooting is ~30% of the CKA exam.</p><h2>3. Skills and concepts you will learn</h2><ul><li>The get → describe → logs method.</li><li>Fix a NotReady node (kubelet).</li><li>Fix a Service with wrong labels.</li></ul><h2>4. Prerequisites</h2><ul><li>Kubernetes Advanced Project 8 completed.</li><li>Read: <code>study/kubernetes/advanced/09-troubleshooting.md</code>.</li><li>A node you can SSH into (kubeadm/killercoda) for the kubelet task.</li></ul><h2>5. Step-by-step requirements</h2><ol><li><strong>Broken Pod:</strong> deploy an app with a wrong image or a crashing command. Use <code>describe</code>/<code>logs</code> to find the cause, then fix it. Show it becomes Running.</li><li><strong>NotReady node</strong> (kubeadm/killercoda): stop the kubelet on a node (<code>sudo systemctl stop kubelet</code>). Show the node goes <code>NotReady</code>. Diagnose with <code>journalctl -u kubelet</code>. Start the kubelet; show the node becomes <code>Ready</code> again.</li><li><strong>Broken Service:</strong> create a Deployment + Service, then change the Service selector so it matches nothing (no endpoints). Diagnose (empty endpoints), then fix the selector. Show endpoints return.</li><li>Write a short \"what I checked and how I fixed it\" note for each case.</li></ol><h2>6. Tasks / challenges</h2><ul><li>☐ Crashing Pod found and fixed.</li><li>☐ NotReady node diagnosed and recovered.</li><li>☐ Broken Service fixed (endpoints return).</li><li>☐ Notes written for each.</li></ul><h2>7. Expected outcome</h2><p>You fixed three different failures using a clear method, and can explain each fix.</p><h2>8. Acceptance criteria (how I grade it)</h2><p>Passes only if ALL are true:</p><ol><li>For the broken Pod: you show the failure in <code>kubectl describe</code>/<code>logs</code>, the cause, the fix, and the Pod becoming Running.</li><li>For the node (if you have SSH): you show it going <code>NotReady</code> after stopping kubelet, a relevant <code>journalctl -u kubelet</code> line, and recovery to <code>Ready</code>. (If you only have kind/minikube, clearly explain the method instead and do the other two fully.)</li><li>For the Service: you show empty endpoints when the selector is wrong, then endpoints returning after you fix the labels.</li><li>You provide a short \"checked → fixed\" note for each case.</li><li>All commands shown.</li></ol><h2>9. Verification checklist</h2><ul><li>☐ 3 problems diagnosed with the method.</li><li>☐ Notes written.</li><li>☐ Evidence saved in <code>submissions/kubernetes/advanced/project-09/</code>.</li></ul><h2>10. Common mistakes</h2><ul><li>Guessing instead of reading Events/logs.</li><li>Forgetting the node side (kubelet).</li><li>Not checking endpoints for Service problems.</li></ul><h2>11. Hints</h2><details><summary>Hint 1</summary>Pod: `kubectl describe pod <p>` (Events) and `kubectl logs <p> --previous`.</details>\n<details><summary>Hint 2</summary>Node: on the node, `sudo systemctl status kubelet` and `journalctl -u kubelet | tail`. Start it: `sudo systemctl start kubelet`.</details>\n<details><summary>Hint 3</summary>Service: `kubectl get endpoints <svc>` — empty means the selector does not match Pod labels.</details>\n<h2>12. Final challenge</h2><p>Break a <strong>control-plane</strong> static Pod on purpose (e.g. put a typo in the apiserver manifest on a throwaway killercoda cluster), watch the effect, read <code>journalctl -u kubelet</code>, then fix the file. This is advanced CKA practice — do it only on a practice cluster you can rebuild.</p><h2>13. What to submit (evidence)</h2><p>Save the diagnosis + fix for each case and your notes in <code>submissions/kubernetes/advanced/project-09/</code>. Then say: <strong>\"I submit Kubernetes Advanced Project 9.\"</strong></p><hr><p><strong>Remember:</strong> get → describe → logs → node (kubelet) → control plane. A method beats luck. This is 30% of CKA.</p></section>","kubernetes/advanced/project-10":"<section class=\"lesson\"><div class=\"tag\">📖 Study lesson</div><h1>Study: Disaster Recovery and High Availability</h1><blockquote><p><strong>Words to know</strong></p><ul><li><strong>Disaster recovery (DR)</strong> — getting the cluster back after a big failure.</li><li><strong>High availability (HA)</strong> — a setup that keeps working even if one part fails.</li><li><strong>Drain</strong> — safely move Pods off a node before maintenance.</li><li><strong>Cordon</strong> — mark a node \"no new Pods\".</li></ul></blockquote><h2>1. Easy explanation (simple → deeper)</h2><p>Things fail. A good admin plans for it.</p><ul><li><strong>HA:</strong> run more than one of important parts (multiple control-plane nodes, multiple replicas), so one failure does not stop everything.</li><li><strong>DR:</strong> have backups (etcd!) and a plan to restore.</li><li><strong>Maintenance:</strong> to work on a node safely, <strong>cordon</strong> it (no new Pods) and <strong>drain</strong> it (move Pods away), then do the work, then <strong>uncordon</strong>.</li></ul><h2>2. Key concepts and terms</h2><ul><li><code>kubectl cordon &lt;node&gt;</code> — stop new Pods landing there.</li><li><code>kubectl drain &lt;node&gt; --ignore-daemonsets</code> — move Pods off (respects PodDisruptionBudgets).</li><li><code>kubectl uncordon &lt;node&gt;</code> — allow Pods again.</li><li><strong>PodDisruptionBudget (PDB):</strong> keeps a minimum number of Pods up during voluntary disruptions.</li><li><strong>HA control plane:</strong> 3 control-plane nodes + a load balancer; etcd is replicated.</li></ul><h2>3. Practical examples</h2><pre><code>kubectl cordon node2\nkubectl drain node2 --ignore-daemonsets --delete-emptydir-data\n# ... do maintenance on node2 ...\nkubectl uncordon node2</code></pre><p>A PodDisruptionBudget:</p><pre><code>apiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata: { name: web-pdb }\nspec:\n  minAvailable: 2\n  selector: { matchLabels: { app: web } }</code></pre><h2>4. Commands and config examples</h2><pre><code>kubectl get nodes\nkubectl drain &lt;node&gt; --ignore-daemonsets\nkubectl get pods -o wide          # see Pods move to other nodes\nkubectl uncordon &lt;node&gt;\nkubectl get pdb</code></pre><h2>5. Hands-on exercises</h2><ol><li>Cordon and drain a worker node; watch Pods move to other nodes.</li><li>Uncordon it; watch it accept Pods again.</li><li>Add a PodDisruptionBudget and see it protect a minimum number of Pods during a drain.</li></ol><h2>6. Troubleshooting</h2><ul><li><strong>Problem:</strong> drain hangs.</li></ul><p>  <strong>Fix:</strong> a PDB blocks it (would drop below minAvailable), or Pods have no controller. Use flags carefully; scale up first if needed.</p><ul><li><strong>Problem:</strong> app went down during node work.</li></ul><p>  <strong>Fix:</strong> you had only 1 replica, or no PDB. Run more replicas and use a PDB.</p><h2>7. Common mistakes and how to avoid them</h2><ul><li>Working on a node without draining it first.</li><li>Only 1 replica of an important app.</li><li>No etcd backup before risky changes.</li></ul><h2>8. Certification notes (what the exam wants)</h2><ul><li><strong>CKA:</strong> cordon/drain/uncordon and node maintenance are common tasks.</li><li>Combine with etcd backup/restore (Project 3) for full DR.</li></ul><h2>9. Practice questions and tasks</h2><ol><li>What is the difference between cordon and drain?</li><li>What does a PodDisruptionBudget do?</li><li>What two things give you high availability?</li></ol><h2>10. References</h2><ul><li>Safely drain a node: <a href=\"https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/</a> (checked: 2026-09-18)</li><li>HA topology: <a href=\"https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/\" target=\"_blank\" rel=\"noopener\">https://kubernetes.io/docs/set
